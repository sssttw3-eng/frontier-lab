<h1>参加の申込み</h1>
<p class="lead">フロンティアラボへの参加申込みです。カード情報は、この次の決済画面（Stripe）で入力します。</p>
<form data-fl-apply data-fl-next="confirm.html">
<div class="fld"><label for="nickname">ニックネーム</label><div class="hint">Discordで表示されます。あとから変えられます</div><input id="nickname" name="nickname" type="text" autocomplete="nickname"></div>
<div class="fld"><label for="email">メールアドレス</label><div class="hint">契約のお知らせが届きます</div><input id="email" name="email" type="email" autocomplete="email"></div>
<div class="fld"><label for="email2">メールアドレス（確認のためもう一度）</label><input id="email2" name="email2" type="email" autocomplete="email"></div>
<div class="fld"><label for="source">フロンティアラボを知ったきっかけ（任意）</label><select id="source" name="source">
<option value="">選択してください</option>
<option value="yt_desc">YouTubeの動画の概要欄</option>
<option value="yt_channel">YouTubeのチャンネルページ</option>
<option value="yt_live">YouTubeのライブ</option>
<option value="newsletter">メルマガ</option>
<option value="x">X</option>
<option value="threads">Threads</option>
<option value="instagram">Instagram</option>
<option value="friend">知人から</option>
<option value="other">その他</option>
</select></div>
<p data-fl-error></p>
<button class="btn" type="submit" data-event="apply_submit">内容の確認へ進む</button>
</form>
<p class="note">入力した内容を、契約の管理・お知らせ・流入元の集計のためだけに使います。カード情報は次の決済画面（Stripe）で入力し、このサイトには残りません。</p>

<!-- fl-analytics: mode=test page=apply id= -->
<script>
(function(){
  var PAGE_ID = 'apply';
  var KEY = 'fl_analytics_events';
  function load(){ try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e) { return []; } }
  function save(list){ try { localStorage.setItem(KEY, JSON.stringify(list.slice(-200))); } catch(e) {} }
  function baseParams(extra){
    var p = {page_id: PAGE_ID, page_path: location.pathname, page_location: location.href, page_title: document.title};
    if (extra) for (var k in extra) p[k] = extra[k];
    return p;
  }
  window.flTrack = function(eventName, params){
    var entry = {event: eventName, params: baseParams(params || {}), ts: new Date().toISOString()};
    var list = load(); list.push(entry); save(list);
    try { console.log('[FL Analytics:test]', eventName, entry.params); } catch(e) {}
    return entry;
  };
  window.flAnalytics = {
    getEvents: function(){ return load(); },
    clear: function(){ try { localStorage.removeItem(KEY); } catch(e) {} }
  };
  // page_view
  window.flTrack('page_view', {});
  // click: data-event を持つ要素（委譲で動的要素にも対応）
  document.addEventListener('click', function(e){
    var el = e.target && e.target.closest ? e.target.closest('[data-event]') : null;
    if (!el) return;
    var name = el.getAttribute('data-event');
    if (!name) return;
    var params = {};
    for (var i = 0; i < el.attributes.length; i++) {
      var a = el.attributes[i];
      if (a.name.indexOf('data-event-') === 0) params[a.name.slice(11).replace(/-/g, '_')] = a.value;
    }
    if (el.getAttribute('href')) params.link_url = el.getAttribute('href');
    var txt = (el.textContent || '').trim().slice(0, 80);
    if (txt) params.link_text = txt;
    window.flTrack(name, params);
  }, true);
})();
</script>
