GAAP営業利益は1億7200万ドルで調整後営業利益は10億ドルです。調整後1株利益は1.02ドルです。買収関連費用と株式報酬がGAAPと調整後の差を作る構造が数字へ出ました。", "source": "https://www.sec.gov/Archives/edgar/data/1327567/000132756726000019/ex991q426earningsrelease.htm"}, {"label": "調整後フリーキャッシュフロー（2026年5-7月期）", "value": "13億ドル", "note": "前年同期9億5400万ドルから増え通期の調整後フリーキャッシュフローマージンは38.4%です。GAAP損失の局面でも現金創出を維持する点はサブスクリプションの前受構造が支えています。", "source": "https://www.sec.gov/Archives/edgar/data/1327567/000132756726000019/ex991q426earningsrelease.htm"}], "strengths": ["次世代セキュリティARRが91億ドルへ63%増えRPO212億ドルと合わせて契約基盤が厚くなりました。製品を基盤へ集約した顧客では追加製品の販売が新規獲得より速く進みARRの積み上がりが売上成長に先行する構造を作ります。", "通期売上は114億8000万ドルで24%増え、第4四半期の売上成長率は34%と通期の伸びを上回りました。基盤化の大型契約が四半期の売上を押し上げる形で、既存顧客への追加販売と新規獲得の両方が売上成長を作る構造が数字に出ています。", "通期の調整後フリーキャッシュフローマージン38.4%を保ち第4四半期に13億ドルの調整後フリーキャッシュフローを生みました。買収を進めながら現金を残す力は次の買収と製品統合を続ける原資になります。"], "weakness": "弱点は成長率の鈍化とGAAP利益の薄さが重なる買収依存の収益構造です。次世代セキュリティARRの伸びは今期63%から2027会計年度案内22%から23%へ下がり通期売上案内も141億ドルから142億ドルで23%から24%増にとどまります。買収の寄与が剥がれて自律成長が案内を下回れば株式報酬と買収関連費用が常態化しGAAP純損失2億8200万ドルから黒字への転換が崩れます。", "next": "次は会社見通しの売上33億ドルから33億1000万ドルと次世代セキュリティARR95億4000万ドルから95億6000万ドルを基準に2026年11月18日発表予定の2026年8-10月期決算で見通しへの到達を確認します。", "focus": "会社見通しの売上33億ドルから33億1000万ドルと次世代セキュリティARR95億4000万ドルから95億6000万ドルへの到達", "sources": [{"title": "Palo Alto Networks Reports Fiscal Fourth Quarter and Fiscal Year 2026 Financial Results（2026年9月1日、SEC提出の決算リリース）", "url": "https://www.sec.gov/Archives/edgar/data/1327567/000132756726000019/ex991q426earningsrelease.htm"}]}, "paypal": {"date": "2月上旬", "deck": null, "focus": "通期非GAAP EPS見通し5.60ドルの達成と、取引マージンと純売上成長の回復", "logo": "../assets/logos/paypal.svg", "name": "PayPal", "next": "次に見る数字は2026年通期の非GAAP EPS見通し5.60ドルと第4四半期の非GAAP EPS見通し1.43ドルです。2026年10-12月期決算で取引マージンが四半期39億5000万ドルの水準から伸びるか、純売上の成長率が総取扱高の伸びへ近づくか、GAAP営業利益率16.3%が戻るかを確認します。", "numbers": [{"label": "純売上（2026年7-9月期）", "value": "85億8400万ドル（前年同期比2%増、為替中立ベース1%増）", "note": "総取扱高の6%増に対して売上の伸びは2%にとどまりました。取扱高1ドルから抜く売上の割合が下がり、量の成長を単価へ変換できていない点が四半期の転換点です。", "source": "https://www.sec.gov/Archives/edgar/data/1633917/000163391726000086/pypl3q-26earningsrelease.htm"}, {"label": "総取扱高（2026年7-9月期）", "value": "4871億3800万ドル（前年同期比6%増、為替中立ベース7%増）", "note": "決済件数は68億件と7%増え、口座当たり年間決済件数は60.8件と6%増えました。新規口座が増えない局面でも既存顧客の利用深化で取扱高を伸ばせる構造を示します。", "source": "https://www.sec.gov/Archives/edgar/data/1633917/000163391726000086/pypl3q-26earningsrelease.htm"}, {"label": "取引マージン（2026年7-9月期）", "value": "39億5000万ドル（前年同期比2%増）", "note": "顧客残高への利息を除く取引マージンは36億6100万ドルと3%増え、全体の伸びを上回りました。金利収入に頼らず決済そのものから採算を取る比率が上がる方向です。", "source": "https://www.sec.gov/Archives/edgar/data/1633917/000163391726000086/pypl3q-26earningsrelease.htm"}, {"label": "営業利益（2026年7-9月期）", "value": "GAAP営業利益14億200万ドル（前年同期比8%減）、GAAP営業利益率16.3%", "note": "売上と取引マージンが増える一方でGAAP営業利益は減りました。非GAAP営業利益は16億1300万ドルと3%増えており、GAAPとの差が費用項目の大きさを示します。", "source": "https://www.sec.gov/Archives/edgar/data/1633917/000163391726000086/pypl3q-26earningsrelease.htm"}, {"label": "会社見通し（2026年通期の非GAAP EPS）", "value": "5.60ドル", "note": "従来見通し5.38ドルから引き上げました。第4四半期の非GAAP EPS見通しは1.43ドルで、通期の達成は第4四半期にこの水準を出す前提です。GAAP EPS見通し5.07ドルは据え置きました。", "source": "https://www.sec.gov/Archives/edgar/data/1633917/000163391726000086/pypl3q-26earningsrelease.htm"}], "sources": [{"title": "PayPal 2026年第3四半期決算発表（SEC Form 8-K Exhibit 99.1、2026年10月27日）", "url": "https://www.sec.gov/Archives/edgar/data/1633917/000163391726000086/pypl3q-26earningsrelease.htm"}], "status": "見込み", "strengths": ["有効口座数4億4000万件と口座当たり年間決済件数60.8件の利用基盤を持ちます。新規口座の伸びが0.6%にとどまる局面でも既存顧客の利用深化で総取扱高を6%伸ばせます。消費者と加盟店の双方が同じネットワークを使うため、片側の利用増が反対側の価値も押し上げます。", "取引マージンは顧客残高への利息を除くベースで3%増の36億6100万ドルまで伸びました。金利収入に頼らず決済手数料から採算を取る構造で利益の質を支えます。", "調整後フリーキャッシュフローは20億4700万ドルを生み、第3四半期に15億ドルの自社株買いを実行しました。利益成長が鈍い局面でも現金創出が1株利益を下支えします。"], "summary": "僕はPayPalを、消費者と加盟店の双方を抱える決済ネットワークで、決済額に応じた取引手数料で稼ぐ会社として見ています。ブランドチェックアウトと個人間送金Venmoが主力です。2026年7-9月期に有効口座数の伸びが0.6%にとどまる一方で口座当たり年間決済件数は60.8件と6%増え、成長の軸が新規口座から既存顧客の利用深化へ移りました。", "weakness": "弱点は取扱高の伸びを売上と利益へ変換できない収益構造です。総取扱高が6%増える一方で純売上は2%増にとどまり、GAAP営業利益は8%減の14億200万ドルまで減り、営業利益率は16.3%へ下がりました。有効口座数の伸びも0.6%まで鈍っています。低単価の処理の比率がさらに上がり、口座当たり決済件数の伸びが止まれば、取扱高が増えても取引マージン39億5000万ドルの伸びが止まり、通期EPS見通し5.60ドルの土台が崩れます。"}, "qualcomm": {"date": "2月上旬", "deck": null, "focus": "2027年度第1四半期見通し104億〜112億ドルの達成と、データセンター売上の初計上", "logo": "../assets/logos/qualcomm.svg", "name": "Qualcomm", "next": "次に見る数字は2027年度第1四半期の売上見通し104億ドルから112億ドルと非GAAP EPS見通し2.15ドルから2.35ドルです。2027年2月上旬の決算でデータセンター向けカスタムチップ売上が初めて計上されるか、携帯電話向け売上の落ち込み幅が51億3700万ドルの水準から縮むかを確認します。", "numbers": [{"label": "売上（2026年度第4四半期、2026年7-9月期）", "value": "GAAP 103億2200万ドル（前年同期比8%減）、非GAAP 104億4200万ドル（同7%減）", "note": "非GAAP EPSは2.17ドルと前年同期比28%減りました。売上の落ち込み以上に利益が減り、携帯電話向けの減収が高利益率の売上を直撃する構造を示します。通期のGAAP売上は431億2000万ドルです。", "source": "https://s204.q4cdn.com/645488518/files/content_files/FY2026-4th-Quarter-Earnings-Release.pdf"}, {"label": "携帯電話向け売上（同四半期）", "value": "51億3700万ドル（前年同期比26%減）", "note": "半導体部門QCTの売上90億1500万ドルの57%を占めます。過半を占める市場の需要変動が全社業績を決める構造は変わっていません。メモリ市場の需給ひっ迫でスマートフォン向けチップ需要が減った点を会社は説明しました。", "source": "https://s204.q4cdn.com/645488518/files/content_files/FY2026-4th-Quarter-Earnings-Release.pdf"}, {"label": "自動車向け売上（同四半期）", "value": "19億9000万ドル（前年同期比89%増）", "note": "通期では60億400万ドルと前年比52%増えました。携帯電話向け売上の4割近い規模まで育ち、携帯電話の減収を相殺する第二の柱になり始めています。", "source": "https://s204.q4cdn.com/645488518/files/content_files/FY2026-4th-Quarter-Earnings-Release.pdf"}, {"label": "ライセンス部門QTL売上（同四半期）", "value": "13億400万ドル（前年同期比7%減）", "note": "税引前利益率は70%で、半導体部門QCTの24%を大きく上回ります。製造を持たないライセンス収益は半導体の市況が悪い四半期でも全社利益を下支えします。AppleとHuaweiとTranssionとの長期ライセンス契約を更新した点を会社は発表しました。", "source": "https://s204.q4cdn.com/645488518/files/content_files/FY2026-4th-Quarter-Earnings-Release.pdf"}, {"label": "会社見通し（2027年度第1四半期の売上）", "value": "104億ドルから112億ドル", "note": "非GAAP EPS見通しは2.15ドルから2.35ドルです。経営陣は2027年度のデータセンター売上目標50億ドルを据え置き、非携帯分野の売上が前年比60%超伸びる見通しを示しました。", "source": "https://s204.q4cdn.com/645488518/files/content_files/FY2026-4th-Quarter-Earnings-Release.pdf"}], "sources": [{"title": "Qualcomm 2026年度第4四半期・通期決算発表（投資家向け資料、2026年11月4日）", "url": "https://s204.q4cdn.com/645488518/files/content_files/FY2026-4th-Quarter-Earnings-Release.pdf"}], "status": "見込み", "strengths": ["自動車向け売上は19億9000万ドルと前年同期比89%増え、通期でも60億400万ドルと52%増えました。Snapdragonを車載へ横展開し、携帯電話向けが26%減る四半期でも成長する部門を持つ構造を作っています。", "ライセンス部門QTLは売上13億400万ドルで税引前利益率70%を保ちます。特許ライセンスは製造コストを持たず、半導体部門の利益率が24%へ下がる局面でも利益の土台になります。AppleとHuaweiとTranssionとの長期契約更新が収益の継続性を裏付けます。"], "summary": "僕はQualcommを、スマートフォン向け半導体Snapdragonの販売と通信特許のライセンス料で稼ぐ会社として見ています。半導体部門QCTが売上を作り、ライセンス部門QTLが高い利益率で利益を支える二層構造です。2026年7-9月期に携帯電話向け売上が26%減る一方で自動車向け売上は89%増の19億9000万ドルに達し、携帯電話依存を薄める転換が数字に出ました。", "weakness": "弱点は携帯電話向けへの依存です。携帯電話向け売上51億3700万ドルは半導体部門QCTの57%を占め、同四半期に26%減りました。QCTの税引前利益率は29%から24%へ下がり、ウエハとメモリの投入コスト上昇を価格へ転嫁できる時期は2027年度後半と会社は説明しています。携帯電話向けの落ち込みが続けば自動車向け19億9000万ドルの伸びでは埋め切れず、データセンター売上が立つ前に減収と利益率低下が重なります。"}, "rigetti": {"date": "3月3日", "deck": null, "focus": "通期売上見通し2000万ドルへの到達と、C-DACシステムの売上計上", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPoAAABXCAQAAACHZ5CGAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAACYktHRAD/h4/MvwAAAAd0SU1FB+oIFBUsAlnSclQAAAcHSURBVHja7Z15bFRFHMc/bUUqSKFIyyW0EaEEVKKIRBo0qBwBgRK0IRHREDXhCAkeoAKJIhFRTBBIaAwkkJQgRMIVS0AliAVKJUVtLKcQCEhpaUspUHpt/aMRoW/fMZ33trtvf9/9a2dmfzM7n/fmejO/B94phUbLz1hE3miGdc3HSg1FnwS6QBcJdJFAFwl0UYTqPqkCTxTHUPpxvyF8D+cd2+jKcDobQkvZFs5/3G6ePtq3yCdw1uQ/j3doIZEN1Ae18Jv2PL2+Ne/0Sz5FPpPVxGhZ6EIuad7Ve+v16SUc9yXyQazURA5rPUQOv7Qe9FU0+BL6POI0LQxkooflC7CytaDnsdynjfvIMLBgpWUcbR3oPzCW275Efj9J2jZ6ela6ej5hgbdTtnrOGsIqKGQTe2Xdw1Mb1w0130AJh1jLKa/n6ZfoIxP2VtFGNnp9ZYqisDkSCXSRQBeFnZwO5DoxOMjif3OV8/Nd39oxzjJ1Lpct43uQQhJtNf9hMb9axifyBN1JcGSrkmIKqNIoTTrxd30LcIpCRQuJvNpsPnTEUKI+PKV7YXRiHbU2D0+aPkfu+V3LN0Z2YTGFjnK0/+RYtHJT2U+dor0afmSCqc145fJtu+cyAPha0UIxLzazYLMx0h55F447zt4N6LHMp9Il4FbQh2hdVgdNpqPxLbC1RBN6IyV0VIFu36dn0T+E3U0HtvGFw8ZWR1M5wGMavx9GPi+4VJZJ2haSSHdzINeHySEdYWy1aDrdUwYbDI2qqjqzg0GulKarCza6uQn9+ZAOK5d7/LChSf3JdmXW8iA7aO/HKVtSCMvyOLNDks9XrqFK4X0/Qg/lPH6x9pNoJxrKyy5ae48HZHFGZ2IYmrNtU1weeEbgTr/w2Q07OsjeUaPqOc0twyJOd4V8xjlIU8MZw/P+viZzipFsV8j9DJVBlnxUdCvo る構造がそのまま出ました。", "source": "https://www.sec.gov/Archives/edgar/data/1838359/000110465926125152/rgti-ex99d1.htm"}, {"label": "売上（2026年1〜9月）", "value": "1094万9000ドル（前年同期比110%増）", "note": "前年同期は522万ドルでした。累計の伸びは第1四半期と第2四半期に計上したシステム販売が作りました。経常的な売上基盤ではなく検収売上が成長の正体です。", "source": "https://www.sec.gov/Archives/edgar/data/1838359/000110465926125152/rgti-ex99d1.htm"}, {"label": "営業損失（2026年第3四半期）", "value": "3318万6000ドル", "note": "売上141万1000ドルの23倍を超える費用を先行して投じる段階です。GAAP純損失はワラント負債の評価益を受けて313万7000ドルまで縮みました。非GAAP純損失は2046万8000ドルで、事業の損失の実態に近い水準です。", "source": "https://www.sec.gov/Archives/edgar/data/1838359/000110465926125152/rgti-ex99d1.htm"}, {"label": "現金と売却可能投資（2026年9月30日時点）", "value": "4億9710万ドル", "note": "借入はありません。四半期の営業損失3318万6000ドルを大きく上回る資金を持ち、検収がずれても開発を止めずに済む期間を確保しています。", "source": "https://www.sec.gov/Archives/edgar/data/1838359/000110465926125152/rgti-ex99d1.htm"}, {"label": "会社見通し（2026年通期売上）", "value": "2000万ドル", "note": "9か月累計1094万9000ドルとの差は905万1000ドルです。第4四半期だけで第3四半期の6倍を超える売上が必要になります。前提はC-DACシステムの顧客検収と売上計上です。", "source": "https://www.sec.gov/Archives/edgar/data/1838359/000110465926125152/rgti-ex99d1.htm"}], "sources": [{"title": "Rigetti Computing Reports Third Quarter 2026 Financial Results（2026年11月10日、SEC Form 8-K Exhibit 99.1）", "url": "https://www.sec.gov/Archives/edgar/data/1838359/000110465926125152/rgti-ex99d1.htm"}], "status": "見込み", "strengths": ["Cepheus-1-108Qは2量子ビットゲート忠実度の中央値99.5%を達成しました。12個の9量子ビットチップレットをつなぐ方式で100量子ビット超でも性能を保てる点を実証し、規模を広げる方式そのものが競争力になります。", "現金と売却可能投資は4億9710万ドルで借入がありません。売上が検収次第で振れる段階でも研究開発を削らずに済み、300量子ビット超のシステム開発を続けられます。", "米商務省と最大1億ドルのCHIPS賞の確定契約を結びました。読み出し電子回路と新型低温装置と高接続チップ製造の3計画へ外部資金が入り、自社資金の消耗を抑えながら開発を進められます。"], "summary": "僕はRigettiを、超伝導方式の量子コンピューターを自社工場Fab-1で製造し、国立研究所や量子計算センターへ据置型システムで売る会社として見ています。クラウド提供QCSも行い、売上はシステムの検収で立つ構造です。2026年7-9月期の売上は141万1000ドルへ減り、通期2000万ドルの会社見通しは第4四半期のC-DAC検収に懸かる形になりました。", "weakness": "弱点は売上の計上が単一の検収へ集中する構造です。通期見通し2000万ドルに対し9か月累計は1094万9000ドルで、残り905万1000ドルはインドのC-DAC向け108量子ビットシステムの第4四半期検収に懸かります。第3四半期の営業損失は3318万6000ドルまで広がりました。検収が2027年へずれれば通期売上は見通しを大きく割り、損失を埋める売上の計上が翌年へ移ります。"}, "robinhood": {"date": "2月9日", "deck": null, "focus": "調整後費用見通しの達成と、イベント契約売上の継続と暗号資産売上の回復", "logo": "../assets/logos/robinhood.svg", "name": "Robinhood", "next": "次に見る数字は2026年通期の調整後営業費用と株式報酬の会社見通し26億7500万ドルから27億5000万ドルです。2027年2月9日の第4四半期決算でイベント契約売上が1億7300万ドルの水準を保つか、暗号資産売上が1億2000万ドルから戻るか、純預入が10月の勢いを四半期で再現するかを確認します。", "numbers": [{"label": "売上（2026年7-9月期）", "value": "14億2000万ドル（前年同期比12%増）", "note": "過去最高の売上でも純利益は14%減の4億7600万ドルまで減り、希薄化後EPSは0.51ドルでした。増収と減益が同時に出て、費用と評価損が成長の質を決める段階に入りました。", "source": "https://www.sec.gov/Archives/edgar/data/1783879/000178387926000164/q32026robinhoodexhibit991.htm"}, {"label": "取引売上（2026年7-9月期）", "value": "8億6700万ドル（前年同期比19%増）", "note": "全売上の61%を占めます。内訳ではイベント契約1億7300万ドルが6倍超へ伸びて暗号資産1億2000万ドルを上回り、オプション3億9900万ドルが31%増、株式1億2100万ドルが41%増でした。暗号資産は55%減り、収益の主役交代が進みます。", "source": "https://www.sec.gov/Archives/edgar/data/1783879/000178387926000164/q32026robinhoodexhibit991.htm"}, {"label": "純預入と基盤資産（2026年7-9月期）", "value": "純預入157億ドル、基盤資産3960億ドル（前年同期比19%増）", "note": "純預入は年換算17%の成長ペースです。取引が冷えた四半期でも顧客資産が入る構造を示します。10月の純預入は月半ばで130億ドルを超えました。うち60億ドルはDell家によるTrump Accountsへの拠出で、一時的な金額を含みます。", "source": "https://www.sec.gov/Archives/edgar/data/1783879/000178387926000164/q32026robinhoodexhibit991.htm"}, {"label": "Gold会員（2026年9月30日時点）", "value": "520万人（前年同期比34%増）", "note": "過去最高です。新規顧客の加入率は4割に達し、全体の加入率は18%です。定期課金の顧客基盤が取引収益の変動を均す土台になります。その他売上は61%増の1億4200万ドルまで伸びました。", "source": "https://www.sec.gov/Archives/edgar/data/1783879/000178387926000164/q32026robinhoodexhibit991.htm"}, {"label": "会社見通し（2026年通期の調整後営業費用と株式報酬）", "value": "26億7500万ドルから27億5000万ドル", "note": "従来見通しから上限を2500万ドル下げました。売上見通しを出さない会社であり、費用側の規律が通期利益の水準を決めます。", "source": "https://www.sec.gov/Archives/edgar/data/1783879/000178387926000164/q32026robinhoodexhibit991.htm"}], "sources": [{"title": "Robinhood Reports Third Quarter 2026 Results（2026年10月27日、SEC提出の決算リリース）", "url": "https://www.sec.gov/Archives/edgar/data/1783879/000178387926000164/q32026robinhoodexhibit991.htm"}], "status": "見込み", "strengths": ["イベント契約とオプションと株式が伸び、暗号資産の55%減を取引売上全体の19%増で相殺しました。単一市場の取引量に寄らず、年換算1億ドル超の事業を14本持つ分散が構造的な強みです。", "純預入157億ドルと基盤資産3960億ドルが資産の取り込みを示します。基盤資産が増えるほど金利収益とGold課金の対象が広がり、取引が弱い四半期の売上を下支えします。", "Gold会員は520万人と34%増え、新規顧客の加入率は4割に達しました。月額課金の顧客が積み上がる構造で取引収益の変動を均します。"], "summary": "僕はRobinhoodを、株式とオプションと暗号資産の取引収益を核に、定期課金Goldと予測市場のイベント契約へ収益源を広げる会社として見ています。取引手数料と金利収益と定期課金で稼ぐ構造です。2026年7-9月期にイベント契約売上が1億7300万ドルで暗号資産の1億2000万ドルを上回り、取引売上の主役が入れ替わりました。年換算1億ドル超の事業は14本に達します。", "weakness": "弱点は売上の61%を取引収益が占める構造です。取引売上8億6700万ドルは市場の取引量で決まり、暗号資産売上は1年で55%減の1億2000万ドルまで落ちました。営業費用は16%増の7億3900万ドルまで膨らみ、ベンチャーファンドの評価損6700万ドルも利益を押し下げました。株式と暗号資産の取引が同時に冷え、イベント契約の取引量164億件が減れば、固定化した費用を取引売上の落ち込みが直撃し、増収でも減益の構図が進みます。"}, "rocket-lab": {"date": "2月下旬", "deck": null, "focus": "第4四半期売上見通し2億7000万〜2億9000万ドルの達成と、Neutron初打ち上げ時期の更新", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPoAAABdCAYAAACM9XtrAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAAGYktHRAD/AP8A/6C9p5MAABLaSURBVHja7Z17lFtVvce/v33ymElOkjknmRba4qNUWuUhCHpVQEQet0vg8q6AXgSVvjstBVkqIEUUK4h2pg9mUJCLrF4oKm/KS7nrtoAKClwsQksRefTBNJkmOTOZZHL27/6RTCet7UwymXd/n7Wy1kzO2Tvn/Pbvu/dvP84+BGEwUFEz3ARg3n56/1kQtjHjHQBPMbsPtLW3vypuMXyQmGDwsIPhhUT4udgZAPC00uqq1o6dL4kphh5DTDB4ZLqyfwp4/f8A4XSxNSYz8bcC/ppsJpd9VrxDhD7WxP5KsMb/VzDOAuDd37s0AE4O+PwHZHLZR8U7ROhjio5sdlPA438KhLMABMUiOCbo93V05HLPiSmkjz7miIVCU1nT4yB8RKwBFxqfi3ekXhBTDE0oJQwRO9LpNxTczwGQASnAYEU/FTOI0Mckre3t27TXOBHgZySc5C/YodDnxCtE6GOStra2ZNxJT2fgnv1e7FqdJR4hffQxX9HGzLoTmHlsDYoqHQLTuQC+2tepDH4l4aSPFFcQoQujlGgwcjuIv9HHacm4k6oTa0noLozWVoTo12WcFqmvrzfFWiJ0YZTiMiXKOc/IZGrFWiJ0QRBE6IIgiNAFQRChC4IIXRAEEbogCCJ0QRBE6IIgiNAFQRgwPGKCwWHTlCl+r9drE5Ht1bqGmWuIWYF5h+vzbT9ow4aEWEkQoY8QNk+eHAn4fBYT2ey6NhPZAGwQWcxsA7BVz98WALv4CUBrAIAu5sVEABEon8d7U6d+wMDLBKyD1o9M2rTpZbG2MFjsF0+vvXj00d6DslnbzWZtNgyLARta20xkgchWWlsgshmwwWyhW8wF4Q7VI6SbCWhhojsmvf56fCzY3QpaRyhyX+nrPC/0uG2O0ypyFKEDAN6dNKmWg0GLDcPy5vMWK2Wx1lZRsJZithiwimK1mMgiZgvA+FE0HtFOwIrOrq4fH/zWW0kRujAqhc6AsW3KFF 上1億9748万7000ドルが全体の74%を占め、成長の中心は打ち上げではなく製造側にあります。", "source": "https://www.sec.gov/Archives/edgar/data/1819994/000181999426000073/rklb-11092026ex991.htm"}, {"label": "受注残（2026年9月30日時点）", "value": "35億7000万ドル（第2四半期末比52%増）", "note": "打ち上げ契約の総数は117件まで積み上がりました。売上の先行指標が厚くなり、今後の四半期の売上は新規開拓よりも受注残の消化で決まる段階へ移ります。", "source": "https://www.sec.gov/Archives/edgar/data/1819994/000181999426000073/rklb-11092026ex991.htm"}, {"label": "Neutron契約（2026年第3四半期）", "value": "5億1500万ドル超、16ミッション、基本価格7000万ドル", "note": "初打ち上げ前に16ミッションを確保し、基本価格を引き上げても契約が取れました。打ち上げ能力の供給が限られる市場での需要の強さを示す一方で、売上計上は初打ち上げの成功が前提です。", "source": "https://www.sec.gov/Archives/edgar/data/1819994/000181999426000073/rklb-11092026ex991.htm"}, {"label": "純損失（2026年第3四半期）", "value": "7967万7000ドル（前年同期1825万7000ドル）", "note": "損失は前年同期の4倍超へ広がりました。営業損失は7918万9000ドルです。売上73%増でも費用の伸びが上回り、規模の拡大がまだ利益へ変わっていません。GAAP営業キャッシュフローは720万ドルの黒字で、現金の動きと会計上の損失に開きがあります。", "source": "https://www.sec.gov/Archives/edgar/data/1819994/000181999426000073/rklb-11092026ex991.htm"}, {"label": "会社見通し（2026年第4四半期）", "value": "売上2億7000万ドルから2億9000万ドル、GAAP粗利率34%から36%", "note": "第3四半期のGAAP粗利率33.6%から改善を見込む内容です。受注残の売上が利益率を伴って立つかが成長の質を決めます。調整後EBITDAの損失見通しは1400万ドルから2000万ドルです。", "source": "https://www.sec.gov/Archives/edgar/data/1819994/000181999426000073/rklb-11092026ex991.htm"}], "sources": [{"title": "Rocket Lab Announces Third Quarter 2026 Financial Results（2026年11月9日、SEC Form 8-K Exhibit 99.1）", "url": "https://www.sec.gov/Archives/edgar/data/1819994/000181999426000073/rklb-11092026ex991.htm"}, {"title": "Rocket Lab Form 10-Q（2026年9月30日期、2026年11月9日提出）", "url": "https://www.sec.gov/Archives/edgar/data/1819994/000181999426000074/rklb-20260930.htm"}], "status": "見込み", "strengths": ["受注残は1四半期で52%増えて35億7000万ドルに達し、打ち上げ契約の総数は117件まで積み上がりました。売上の先行指標が厚く、四半期ごとの新規受注に業績が左右されにくい構造を作っています。", "製品売上は1億9748万7000ドルと前年同期1億404万2000ドルから大きく伸びました。第3四半期にRocket Lab製の宇宙機12機が軌道へ入り、Globalstar向け8機とNASAの火星科学探査の双子機を含みます。打ち上げだけでなく衛星と部品の製造が成長を作り、打ち上げ延期の影響を受けにくい売上構成へ移っています。", "Neutronは初打ち上げ前に16ミッション5億1500万ドル超の契約を確保し、基本価格を7000万ドルへ引き上げました。打ち上げ能力の供給が限られる市場で価格を決める力を持ちます。"], "summary": "僕はRocket Labを、小型ロケットElectronの打ち上げと衛星製造Space Systemsを一社で担い、政府機関と民間コンステレーション事業者から受注する会社として見ています。2026年第3四半期の売上は2億6783万4000ドルと前年同期比73%増え、受注残は35億7000万ドルまで積み上がりました。中型ロケットNeutronの初打ち上げは2027年以降へ移っています。", "weakness": "弱点は受注残の売上化がNeutronの初打ち上げ成功に懸かる構造です。受注残35億7000万ドルの中でNeutron向けだけでも5億1500万ドル超の契約が初打ち上げ前に積み上がっています。2026年10月に複合材タンクのドームで空隙が見つかり、初打ち上げは2027年以降へ移りました。純損失は7967万7000ドルと前年同期1825万7000ドルから広がっています。遅延がさらに延びれば契約の売上計上が後ろへずれ、損失を抱えたまま開発費を出し続ける形になります。"}, "rockwell": {"date": "2月4日", "deck": null, "focus": "通期オーガニック成長6〜9%見通しに対する第1四半期の進捗と、経常収益の伸び", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAABGdBTUEAALGPC/xhBQAAACBjSFJNAAB6JgAAgIQAAPoAAACA6AAAdTAAAOpgAAA6mAAAF3CculE8AAAABmJLR0QA/wD/AP+gvaeTAAAACXBIWXMAAB2HAAAdhwGP5fFlAAAAB3RJTUUH4wcBFy8z4j2UdwAABdNJREFUWMO1l2tsHNUVx3/nzmwemDRA9xHSNKKAeChqEq8DThpjr10apAQpEhIkQkRCoY2r9kOVT1ELbQKqRBKRSC0qiASCmoo0EMIHQIIERLy2eSW28yjBbYKaRLy8uyYPW4bYO3NPP9iznrV3vQbRI43mPs69///9nzP33hEq2PnfzZuLsY84oitwiInRiDggRhFHQUoOe7Vq0+mVleYGcCfqzDTPW2CHOChG4r4DYkFKvU2BiKcif6rSU1sAjkXrbvKQ/kW9bV+Ww5ByHT1r5teaiD2AYaY4ihgYfithBYKycfgEY1dVbfqkqz26dMZ04z4B/Ar4WqxZkew9lJ40gZ7V82vV4YAUwMeABmSC1Tu6Z0j5dWzrf/o7E/VNqDwHXBeackBUlydzra0VCXy6cn6tRMwBMTqzNGhYDQbE6G+u/kv37pOx1JWXRbeNrLrUwvoQuasm0/JBWQKfLq+pVUdHwEeBCBQItRmj/8KVVdGnPuo+MiuVEqu7BH5SIecuqZi7FmUOfTiOwJk7k4sx8uY42UvEH8Nfv5G+DX1v3OR4Orh9glWXJGGNXXZbT9vhAoHTS2sXi2vfLMg+Lu6FUFwUR385+58n9nfF6utVZBdwwySBS5KQ7sWLr3PQI2I0Gk6som99WIGT6tpVuf3uKYlX/QHkYSDyHcADyxkjt7sMsdEaiYoBUUGs5sSh3/ig7vC3jiNvTxVd/0X7jBskLh8AyQkmPgf4I+XpwLVl/GJWdYt0/3RJRg3xQqyNffDmw4f/XmrES9zr3HjtV3Pw/bUKvx+ngOjqmkzri0H1xMy6q/NTnc9HiJSyi8bPm5h6guYF9QTrm7JLu499fvLLd84ls+mNovrHcJ/CmWSmdV+4bf6l9gvAyxOodZWxnojNC9YTbF4gX+zRmah/uCOR2tyRqL8/3G7FLZrYqD4jYMciCDw9USIYDYFbT/qsL91FHiq/FdUNovLC8WtScwoE1A6EvPJWdXdY+qCczKbfBz4uS8AG8udNuzcYWdCfu+JcGd+Pz/+A3qDiYOtDfa+FD5z8FPfponNSZGc5Aq71BHHY5w+Zx4zqHlfzzwCFJKzJpmePHXQk2nizit08imB2BKVjsxrn+dau6oo1/I1cug1gMDK4e+rQl 年同期比16%増）", "note": "関税還付関連の純影響0.11ドルを含みます。純利益は3億4600万ドルでした。通期の調整後EPSは13.42ドルと27%増え、一時的要因を除いても増益の主因は販売量と企業営業利益の拡大です。", "source": "https://www.sec.gov/Archives/edgar/data/1024478/000102447826000045/fy2026ex99.htm"}, {"label": "フリーキャッシュフロー（2026会計年度）", "value": "17億100万ドル（前年比25%増）", "note": "関税還付と関連利息1億800万ドルの入金を含みます。第4四半期だけで6億200万ドルでした。一時的入金を除いても現金創出が利益の伸びに伴い、投資と還元の原資を生む力を示します。", "source": "https://www.sec.gov/Archives/edgar/data/1024478/000102447826000045/fy2026ex99.htm"}, {"label": "会社見通し（2027会計年度）", "value": "報告売上成長率4.5%から7.5%、オーガニック成長率6%から9%、調整後EPS 14.50ドルから15.50ドル", "note": "オーガニック成長率の見通しには前年の還付プログラムの反動で1ポイントの押し上げが含まれます。需要前提は押し上げを除く水準で読む必要があります。年間経常収益はオーガニックで5%増え、ソフトウエアの経常収益は高い1桁台で増えました。", "source": "https://www.sec.gov/Archives/edgar/data/1024478/000102447826000045/fy2026ex99.htm"}], "sources": [{"title": "Rockwell Automation Reports Fourth Quarter and Full Year 2026 Results（2026年11月5日、SEC Exhibit 99）", "url": "https://www.sec.gov/Archives/edgar/data/1024478/000102447826000045/fy2026ex99.htm"}], "status": "見込み", "strengths": ["ソフトウエアと制御の売上は15%増の7億5400万ドルとなり、部門利益率は34.0%まで上がりました。設置した機器へ制御ソフトウエアを売る構造で、機器の販売が次のソフトウエア売上を作ります。", "年間経常収益ARRはオーガニックで5%増え、ソフトウエアのARRは高い1桁台で増えました。一度売って終わらず毎年入る売上が四半期の受注変動を均します。", "通期フリーキャッシュフローは17億100万ドルと25%増え、調整後EPSは27%増の13.42ドルでした。現金創出と利益成長が同時に進んでいます。"], "summary": "僕はRockwell Automationを、工場向け機器と制御ソフトウエアと保守サービスを設置基盤へ繰り返し売る会社として見ています。年間経常収益ARRが課金の土台です。2026会計年度第4四半期にソフトウエアと制御の売上が15%増の7億5400万ドルとなり、部門利益率は34.0%へ上がりました。機器を入れた工場が次のソフトウエア売上を生む構造が数字に出ています。", "weakness": "弱点は売上の半分近くを占める機器販売が顧客の設備投資循環に連動する構造です。第4四半期のインテリジェントデバイス売上は11億4400万ドルで全体の49%を占め、伸びは5%にとどまりました。ライフサイクルサービスは事業売却で報告売上が9%減の5億1900万ドルとなり、部門利益も8500万ドルへ減りました。製造業の設備投資が冷えれば機器の新規販売が止まり、ソフトウエアとサービスの土台である設置基盤の拡大も止まって、オーガニック成長率見通し6%から9%が崩れます。"}, "samsung": {"date": "1月27日", "deck": null, "logo": "../assets/logos/samsung.svg", "name": "Samsung", "status": "見込み", "summary": "僕はSamsungを、メモリとファウンドリで稼ぎ、Galaxyのスマートフォンとディスプレイと家電で販売網を持つ総合半導体メーカーとして見ています。顧客はAIサーバーを建てるクラウド事業者から個人まで広く、利益は半導体市況で決まります。2026年第3四半期は半導体部門が営業利益106兆5000億ウォンと全体の99.1%を稼ぎ、利益構造が半導体1部門へ寄り切りました。", "numbers": [{"label": "売上（2026年第3四半期）", "value": "195兆3000億ウォン（前年同期比127%増、前四半期比14%増）", "note": "4四半期連続で過去最高を更新しました。伸びの中心は売上147兆1000億ウォンの半導体部門で、全体の75%を半導体が占める構成へ変わりました。", "source": "https://images.samsung.com/is/content/samsung/assets/global/ir/docs/2026_3Q_conference_eng.pdf"}, {"label": "営業利益（2026年第3四半期）", "value": "107兆4000億ウォン（前年同期比783%増、営業利益率55.0%）", "note": "四半期の営業利益が100兆ウォンを超えた初のグローバルテック企業になりました。売上195兆3000億ウォンに対する利益率55.0%は価格上昇を利益へ直結させるメモリ事業の構造を示します。", "source": "https://images.samsung.com/is/content/samsung/assets/global/ir/docs/2026_3Q_conference_eng.pdf"}, {"label": "半導体（DS）部門の営業利益（2026年第3四半期）", "value": "106兆5000億ウォン（グループ全体の99.1%）", "note": "メモリ売上は140兆7000億ウォンに達し、HBM4の販売拡大とサーバー向けSSD需要が伸びを作りました。グループの利益は実質的に半導体部門の利益と同義になりました。", "source": "https://images.samsung.com/is/content/samsung/assets/global/ir/docs/2026_3Q_conference_eng.pdf"}, {"label": "ネットキャッシュ（2026年第3四半期末）", "value": "197兆6000億ウォン", "note": "第3四半期末のネットキャッシュは197兆6000億ウォンまで積み上がりました。設備投資と株主還元を借入に頼らず進める原資であり、市況悪化時に投資を止めないための緩衝材です。", "source": "https://images.samsung.com/is/content/samsung/assets/global/ir/docs/2026_3Q_conference_eng.pdf"}, {"label": "第3四半期配当", "value": "1株4601ウォン（総額30兆ウォン）", "note": "2026年の株主還元総額は90兆ウォンから110兆ウォンの枠を会社が示しています。第3四半期配当30兆ウォンはその一部で、残りの実行計画は1月下旬の取締役会で確定します。", "source": "https://images.samsung.com/is/content/samsung/assets/global/ir/docs/2026_3Q_conference_eng.pdf"}], "strengths": ["メモリ売上が140兆7000億ウォンまで拡大し、HBM4の販売を大きく伸ばしました。AIサーバー向けで先行する製品構成で価格上昇局面の利益を取り切る力を持ちます。", "ネットキャッシュ197兆6000億ウォンを抱え、通期84兆4000億ウォンの設備投資と90兆ウォンから110兆ウォンの株主還元枠を同時に進める財務余力を持ちます。", "ファウンドリは先端ノード需要で稼働率と収益性が改善しました。メモリ以外の半導体でも受注を広げ、半導体部門の中で収益源を分散し始めています。"], "weakness": "弱点は利益の半導体部門への集中です。半導体部門が営業利益の99.1%を稼ぐ一方で、スマートフォンと家電を含むDX部門は営業損失8000億ウォンを計上し、ディスプレイとHarmanの利益を合わせても半導体の変動を吸収できません。メモリ価格が反転して半導体部門の利益が半減すれば、グループ営業利益も同規模で削られます。", "next": "次は2026年の株主還元総額90兆ウォンから110兆ウォンに対する最終金額と残りの実行計画を、1月下旬の取締役会と第4四半期決算で確認します。あわせて半導体部門の営業利益が106兆5000億ウォンの水準を保つか、HBM4の供給 llion.html"}, {"label": "QS7001とQVault TPMの評価顧客数（2026年9月30日時点）", "value": "42先（2026年6月30日時点は30先）", "note": "評価先は四半期で12先増えました。ただし会社自身が本格的な売上寄与を2027年以降と置く段階で、評価先の増加と量産売上の間には認証と顧客検証の工程が残ります。", "source": "https://www.globenewswire.com/news-release/2026/10/15/3381651/0/en/sealsq-corp-announces-9m-2026-preliminary-revenue-of-16-3-million-up-65-year-on-year-reaffirms-fy-2026-revenue-guidance-of-27-million-to-36-million.html"}, {"label": "会社見通し（2026年通期売上）", "value": "2700万ドルから3600万ドル（会社見通し）", "note": "2025年通期の監査済み売上1800万ドルに対する見通しです。9か月売上1630万ドルから逆算すると、第4四半期だけで1100万ドルから2000万ドルの売上が必要になります。", "source": "https://www.globenewswire.com/news-release/2026/10/15/3381651/0/en/sealsq-corp-announces-9m-2026-preliminary-revenue-of-16-3-million-up-65-year-on-year-reaffirms-fy-2026-revenue-guidance-of-27-million-to-36-million.html"}], "strengths": ["VaultIC408がNIST FIPS 140-3 Level 3の認証を取得し、政府と重要インフラ向けプログラムへ売る資格を製品で証明しました。認証が参入条件になる市場で、競合と差が付く根拠を持ちます。", "PKIのサブスクリプションと証明書管理の継続売上が伸び、半導体の出荷変動に左右されにくい収益を持ちます。VaultICの需要と合わせて現在の売上1630万ドルの土台を作ります。", "現金等4億6300万ドルを保ち、QS7001のCommon Criteria EAL5+認証とQVault TPMのTCG認証を自力で進める資金があります。認証取得までの期間を資金で買える点が小型半導体企業として異例です。"], "weakness": "弱点は耐量子製品の売上化が認証と顧客検証の完了に依存する点です。QS7001とQVault TPMは評価先42先の段階で、本格寄与は2027年以降と会社が置きます。第4四半期に必要な売上1100万ドルから2000万ドルは9か月累計1630万ドルの67%から123%に当たります。認証や顧客検証が遅れて第4四半期の出荷が滑れば、通期見通し2700万ドルから3600万ドルの下限も割り込みます。", "next": "次は会社見通しの通期売上2700万ドルから3600万ドルに対する第4四半期売上1100万ドルから2000万ドルの着地を、2026年通期決算で確認します。あわせて2027年1月のQS7001 V2評価レポート提出と、QVault TPM183の2027年2月のTCG認証取得が予定通り進むかを見ます。", "focus": "通期売上ガイダンス2700万〜3600万ドルの達成と、QS7001・QVault TPMの認証進捗と収益化の始まり", "sources": [{"title": "SEALSQ Announces 9M 2026 Preliminary Revenue of 16.3 Million（2026年10月15日、GlobeNewswire配信の公式発表）", "url": "https://www.globenewswire.com/news-release/2026/10/15/3381651/0/en/sealsq-corp-announces-9m-2026-preliminary-revenue-of-16-3-million-up-65-year-on-year-reaffirms-fy-2026-revenue-guidance-of-27-million-to-36-million.html"}, {"title": "SEALSQ Reports H1 2026 Financial and Operat aQAAAABJRU5ErkJggg==", "name": "Serve Robotics", "status": "見込み", "summary": "僕はServe Roboticsを、歩道配送ロボットを自社で運用し、Uber Eatsを含む配送プラットフォームの配送を請け負い、病院向け屋内ロボットへ広げる会社として見ています。売上はフリートサービスが中心で経常収益が69%を占めます。2026年7-9月期は稼働ロボットが917台まで増えた一方で、売上283万5000ドルに対して粗損失755万5000ドルを計上しました。", "numbers": [{"label": "売上（2026年7-9月期）", "value": "283万5000ドル（前年同期比313%増、前四半期比12.4%減）", "note": "内訳はフリートサービス258万2000ドルとソフトウェアサービス25万3000ドルです。前年同期の68万7000ドルからは4倍超に増えました。前四半期の323万8000ドルからは減り、伸び方に波があります。", "source": "https://www.sec.gov/Archives/edgar/data/1832483/000183248326000048/serv-20260930_ex991earning.htm"}, {"label": "粗損失（2026年7-9月期）", "value": "755万5000ドル（粗利率マイナス266%）", "note": "売上283万5000ドルに対して売上原価が3.7倍かかります。ロボットを走らせるほど原価が先に膨らむ段階で、フリートマージンの前四半期比改善を会社が強調する理由がここにあります。", "source": "https://www.sec.gov/Archives/edgar/data/1832483/000183248326000048/serv-20260930_ex991earning.htm"}, {"label": "純損失（2026年7-9月期）", "value": "5923万ドル", "note": "1-9月累計の純損失は1億7236万1000ドルに達しました。四半期の純損失5923万ドルは同期間の売上の21倍で、事業の固定費規模が売上規模と釣り合っていません。", "source": "https://www.sec.gov/Archives/edgar/data/1832483/000183248326000048/serv-20260930_ex991earning.htm"}, {"label": "稼働指標（2026年7-9月期）", "value": "1日あたり稼働ロボット917台、供給時間1万1214時間", "note": "稼働ロボットは前年同期の312台から3倍近く増え、供給時間は3781時間から1万1214時間へ増えました。供給能力の拡大速度に売上283万5000ドルの収益化が追いつくかが論点です。", "source": "https://www.sec.gov/Archives/edgar/data/1832483/000183248326000048/serv-20260930_ex991earning.htm"}, {"label": "手元資金（2026年9月30日時点）", "value": "1億9800万ドル", "note": "現金と市場性証券の合計です。四半期の純損失5923万ドルで割ると3四半期強の資金量で、損失が縮まらなければ追加調達の時期が視界に入ります。", "source": "https://www.sec.gov/Archives/edgar/data/1832483/000183248326000048/serv-20260930_ex991earning.htm"}], "strengths": ["新規の配送プラットフォーム提携先経由の1日あたり配達数が四半期内で3倍へ増え、提携店舗数は2.5倍へ広がりました。単一プラットフォーム依存から配送経路を分散し、稼働917台の受け皿を作ります。", "売上の69%を経常収益が占め、ブランディング収益は前四半期比で80%近く増えました。配送手数料以外の収益を同じフリートから取る構成で1台あたり収益を上げる経路を作ります。", "病院向けでは12件の複数年契約延長を取り、2026年に入って4病院を新規に加えました。歩道配送と屋内配送の2つの市場で同じ自律走行技術を使う展開が始まっています。"], "weakness": "弱点は粗損失の段階で台数を増やす収益構造です。第3四半期は売上283万5000ドルに対して粗損失755万5000ドルと純損失5923万ドルを計上し、手元資金1億9800万ドルは今の損失ペースで3四半期強分しかありません。通期見通し1200万ドルに必要な第4四半期売上294万3000ドルを外すか、粗損失が縮まらなければ、資金が尽きる前に希薄化を伴う調達が必要になります。", "next": "次は会社見通しの2026年通期売上1200万ドルに対する第4四半期売上294万3000ドルの着地と、粗損失が755万5000ドルから縮むかを、2026年10-12月期決算で確認します。あわせて非GAAP営業費用の通期見通し1億5000万ドルに対する実績と、1日あたり稼働ロボット917台からの伸びを見ます。", "focus": "通期見通し1200万ドルに対するQ4売上294万3000ドルの着地と、粗損失の縮小、配備台数の伸び", "sources": [{"title": "Serve Robotics Announces Third Quarter 2026 Results（2026年11月5日、SEC Form 8-K Exhibit 99.1）", "url": "https://www.sec.gov/Archives/edgar/data/1832483/000183248326000048/serv-20260930_ex991earning.htm"}]}, "shopify": {"date": "2月中旬", "deck": null, "logo": "../assets/logos/shopify.svg", "name": "Shopify", "status": "見込み", "summary": "僕はShopifyを、販売基盤を月額課金で売り、Shopify Paymentsの決済手数料でGMVから収益を取る会社として見ています。加盟店は個人事業者から大手ブランドまで広がり、売上は定期課金と決済連動の2層です。2026年7-9月期はGMVが1191億4500万ドルと前年同期比29.5%増え、売上37億4200万ドルの78%を決済連動の加盟店ソリューションが占める構成が一段と進みました。", "numbers": [{"label": "売上（2026年7-9月期）", "value": "37億4200万ドル（前年同期比32%増）", "note": "為替一定ベースでも32%増です。営業利益は5億6800万ドルと前年同期の3億4300万ドルから増え、売上規模を拡大しながら営業黒字の幅も広げました。", "source": "https://www.sec.gov/Archives/edgar/data/1594805/000159480526000067/exhibit991pressreleaseq320.htm"}, {"label": "GMV（2026年7-9月期）", "value": "1191億4500万ドル（前年同期比29.5%増）", "note": "前年同期は920億1300万ドルでした。GMVの伸びが加盟店ソリューション売上の土台であり、Shopifyが取る決済収益の母数が四半期で269億ドル増えた計算になります。", "source": "https://www.sec.gov/Archives/edgar/data/1594805/000159480526000067/exhibit991pressreleaseq320.htm"}, {"label": "加盟店ソリューション売上（2026年7-9月期）", "value": "29億600万ドル（前年同期比35%増、売上全体の78%）", "note": "定期課金ソリューション売上8億3600万ドルの20%増を上回る速度で決済連動売上が伸びました。収益の重心が月額課金から取扱高連動へ移る転換が数字に出ています。", "source": "https://www.sec.gov/Archives/edgar/data/1594805/000159480526000067/exhibit991pressreleaseq320.htm"}, {"label": "粗利益（2026年7-9月期）", "value": "17億8100万ドル（前年同期比28%増、粗利率47.6%）", "note": "粗利率は前年同期の48.9%から1.3ポイント下がりました。売上の32%増に対して粗利益の伸びが28%にとどまり、決済比率の上昇が利益率を薄める構造を示します。", "source": "https://www.sec.gov/Archives/edgar/data/1594805/000159480526000067/exhibit991pressreleaseq320.htm"}, {"label": "フリーキャッシュフロー（2026年7-9月期）", "value": "8億1600万ドル（マージン22%）", "note": "前年同期の5億700万ドルとマージン18%から増えました。粗利率が下がる局面でも現金創出力を高めた点が利益率の低下と同時に見るべき数字です。", "source": "https://www.sec.gov/Archives/edgar/data/1594805/000159480526000067/exhibit991pressreleaseq320.htm"}], "strengths": ["加盟店ソリューション売上が35%増の29億600万ドルまで伸び、GMV1191億4500万ドルを売上へ変える決済浸透が進みました。月次経常収益2億3000万ドルの定期課金の上に決済収益を積む2層構造が成長を作ります。", "営業利益5億6800万ドルとフリーキャッシュフローマージン22%を、売上32%増と同時に達成しました。175か国超の加盟店基盤を持ちながら費用規律を保ち、規模と収益性を両立させています。"], "weakness": "弱点は決済連動売上が増えるほど粗利率が下がる収益構造です。加盟店ソリューションの粗利率は38.5%で、定期課金の79.1%を大きく下回ります。粗利率は47.6%と前年同期から1.3ポイント低下し、第4四半期も会社は粗利益成長を20%台後半と売上成長30%台前半より低く置きました。GMVの伸びが鈍れば、低粗利率の売上が残って営業利益率から先に削られます。", "next": "次は会社見通しの第4四半期売上成長30%台前半と粗利益成長20%台後半、営業費用の売上比29%から30%、株式報酬1億5500万ドル、フリーキャッシュフローマージンの前年同期並みという水準を、2026年10-12月期決算で確認します。あわせてGMVの伸びが29.5%を保つかを見ます。", "focus": "Q4会社見通し（売上成長30%台前半・粗利益成長20%台後半・株式報酬1億5500万ドル）の達成とGMV、FCFマージン", "sources": [{"title": "Shopify 2026年第3四半期決算発表（SEC Form 8-K Exhibit 99.1、2026年11月3日）", "url": "https://www.sec.gov/Archives/edgar/data/1594805/000159480526000067/exhibit991pressreleaseq320.htm"}]}, "sk-hynix": {"date": "1月下旬", "deck": null, "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPoAAACFCAYAAABymOUpAAAABGdBTUEAALGPC/xhBQAAACBjSFJNAAB6JgAAgIQAAPoAAACA6AAAdTAAAOpgAAA6mAAAF3CculE8AAAABmJLR0QA/wD/AP+gvaeTAAAAB3RJTUUH6ggDBigLl8x9+wAAIjpJREFUeNrtnXl8XGX1/9/nTpJmbWmhZJImobRJClQr2pKkCBoFRVD8SWVRyiIuIMqi8EUQaXtLK7KjCGopaAFFBcUNUBS1KtAmbQWBLlmgaWaSTCilpW1mssy95/fHtNDSmclMMpOtz+f1yh+Ze597n3ue83mec57lHDAwMBjzkLH6YWpPzQ6S9RBomSJbEOotdVblHPNqnZyNY5rewBB9DCB0Y/mHXVdWRvnk7cAziv4+j6w/ir1+t1EDA0P0UYouu/wDIOv66w9AnkDch3OPbn7KjPQGhuijDLvtqV4hsyOJIu2CPCyEf5Rjv9ZqVMPAEH1U+OhYQSq6gcwki/aB/tL1yM0FC5o2GhUxMEQf8eZ7xRagbKB9BfCkIEty7cZ6oyoGoxnWGO/H/IPsBD+laF2XXfHb7iXTKoy6GBiij0TzHfwpetQ8x/Gs77Irlu2ypx9u1MbAEH1koS2Fz8oELrbwbAourrhSH8Vj1MfAEH1kfJw/9U/Viap8P7ih4tldN5bPNCpkYIg+7HD9aXx4jeXKC0G78ma1Z2YZVTIwRB8+L92f5hdkKjq/i95zjSoZGKIPEyS9RH9V0fNzmXJkvt20wqiSwUhGxlj+u 兆7756億ウォン（前四半期比58%減、純利益率38%）", "note": "営業利益が前四半期比38%増えた四半期に純利益は58%減りました。営業外の変動が最終利益を大きく動かすため、営業利益率80%と純利益率38%の差自体が利益の質を見る数字です。", "source": "https://news.skhynix.com/en/q3-2026-business-results/"}, {"label": "現金とネットキャッシュ（2026年第3四半期末）", "value": "現金等114兆5000億ウォン、ネットキャッシュ98兆7000億ウォン", "note": "現金は前四半期末から26兆5000億ウォン増え、借入は15兆8000億ウォンまで減りました。来年の投資拡大を会社が示す局面で、投資と還元を同時に進める原資が手元にあります。", "source": "https://news.skhynix.com/en/q3-2026-business-results/"}, {"label": "株主還元（2026年度、会社計画）", "value": "現金配当30兆ウォン以上、自社株買いと消却60兆ウォン以上（会社計画）", "note": "第3四半期は配当1株2万ウォン（うち特別配当1万ウォン）を決めました。キオクシア投資の利益を特別配当で返す方針を会社が明示し、投資成果の還元ルールを示した点が新しい動きです。", "source": "https://news.skhynix.com/en/q3-2026-business-results/"}], "strengths": ["HBM4の出荷が本格化し、サーバー向けDDR5の販売増と321層TLCの企業向けSSD拡大が同時に進みました。AIメモリの主力製品3分野で高付加価値構成を作り、営業利益率80%を支えます。", "主要顧客14社と長期供給契約を結び、2027年から2028年の生産能力の50%超に買い手を付けました。合意した価格帯の中で市況を反映する仕組みを入れ、数量の見通しと価格の柔軟さを両立させています。"], "weakness": "弱点は営業利益率80%がメモリ価格の上昇局面に乗る構造です。今回の最高益は主要製品の価格上昇を背景に生まれ、長期供給契約も合意した価格帯の中で市況を反映するため価格下落を止めません。DRAMとHBMの価格が反転すれば、売上と利益率が同時に下がり、営業利益83兆3338億ウォンの水準は維持できません。", "next": "次は会社が示した第4四半期のHBM4の出荷と売上がHBM3Eを上回るかと、321層プロセスが国内NAND生産能力の半分超へ上がるかを、2026年10-12月期決算で確認します。あわせて2027年の投資規模の提示と、配当30兆ウォン以上と自社株買い60兆ウォン以上で組む還元計画の実行額を見ます。", "focus": "HBM4が出荷・売上でHBM3Eを上回るかと、2027年の投資計画の規模、還元計画の実行額", "sources": [{"title": "SK hynix 2026年第3四半期決算発表（ニュースルーム、2026年10月28日）", "url": "https://news.skhynix.com/en/q3-2026-business-results/"}]}, "sofi": {"date": "1月29日", "deck": "deck-s.html", "logo": "../assets/logo-s.svg", "name": "SoFi", "status": "見込み", "summary": "僕はSoFiを、借りる、貯める、使う、投資するを1つのアプリにまとめ、銀行免許で集めた預金を貸出原資に使い、手数料型収益を積み上げるデジタル金融の会社として見ています。2026年7-9月期は会員が1710万人と前年同期比35%増え、手数料型収益が調整後純売上の42%に達しました。金利収益中心の構成から移行が数字で確認できた四半期です。", "numbers": [{"label": "純売上（2026年7-9月期、GAAP）", "value": "13億8510万ドル（前年同期比44%増）", "note": "調整後純売上は13億7112万ドルです。純利益は2億4099万ドルと前年同期の1億3939万ドルから73%増え、12四半期連続の黒字を保ちながら売上を44%伸ばしました。", "source": "https://www.sec.gov/Archives/edgar/data/1818874/000181887426000065/a2026q3earningsrelease.htm"}, {"label": "会員数とプロダクト数（2026年9月30日時点）", "value": "会員1710万人（前年同期比35%増）、プロダクト2670万件（同44%増）", "note": "四半期で会員120万人とプロダクト220万件を純増させ、1人あたりプロダクト数は1.56件へ上がりました。新規プロダクトの51%を既存会員が開いた点が獲得費をかけずに売上を積む構造を示します。", "source": "https://www.sec.gov/Archives/edgar/data/1818874/000181887426000065/a2026q3earningsrelease.htm"}, {"label": "手数料型収益（2026年7-9月期）", "value": "5億7060万ドル（調整後純売上の42%）", "note": "前四半期から21%増えました。組成手数料とローンプラットフォームとインターチェンジと証券手数料が柱です。金利に連動する純金利収益と収益源を分ける構成が進み、収益の質が変わりつつあります。", "source": "https://www.sec.gov/Archives/edgar/data/1818874/000181887426000065/a2026q3earningsrelease.htm"}, {"label": "貸出実行額（2026年7-9月期）", "value": "169億ドル（うち第三者向けローンプラットフォーム38億ドル）", "note": "実行額は過去最高です。うち38億ドルを自社バランスシートに載せず第三者向けに組成し、手数料だけ取る形が全体の22%まで広がりました。", "source": "https://www.sec.gov/Archives/edgar/data/1818874/000181887426000065/a2026q3earningsrelease.htm"}, {"label": "預金残高（2026年9月30日時点）", "value": "513億2500万ドル", "note": "四半期で58億ドル増えました。預金の平均金利はウェアハウス枠より145ベーシスポイント低く、年換算7億4500万ドルの金利費用削減を会社が示します。調達コストの低下が貸出事業の利益率を支えます。", "source": "https://www.sec.gov/Archives/edgar/data/1818874/000181887426000065/a2026q3earningsrelease.htm"}], "strengths": ["手数料型収益が5億7060万ドルと調整後純売上の42%まで上がりました。貸出の金利収益だけに頼る構成から移り、金利が下がる局面でも売上の土台を残す形に変わっています。", "会員1710万人とプロダクト2670万件が同時に過去最高で、新規プロダクトの51%を既存会員の追加利用が占めました。1人あたり1.56件という利用の深さが次の売上を会員獲得費なしで作る構造です。", "預金513億2500万ドルが調達の中心になり、ウェアハウス枠より145ベーシスポイント低い金利で貸出原資を賄います。銀行免許を持つことが調達コストの差として数字に出ています。"], "weakness": "弱点は技術基盤部門の顧客集中です。部門売上は8737万ドルと前年同期比24%減り、口座数は1億4044万口座と11%減り、貢献利益率は28%から16%へ下がりました。大型顧客1社の移行完了だけで部門売上が4分の1縮む集中が数字に残ります。次の大型顧客の移行や解約が決まれば、部門売上と口座数が再び2桁減り、手数料型収益の成長率も押し下げられます。", "next": "次は会社見通しの2026年通期調整後純売上50億4000万ドルと調整後EBITDA16億6000万ドルと純利益8億4000万ドルに対する第4四半期の着地を、2027年1月29日の決算で確認します。あわせて手数料型収益の比率42%の維持と、技術基盤部門の口座数1億4044万口座からの回復、預金513億2500万ドルからの伸びを見ます。", "focus": "手数料型収益の比率42%の維持と技術基盤部門の口座数の回復、通期見通し50億4000万ドルへの進捗と預金の伸び", "sources": [{"title": "SoFi 2026年7-9月期決算リリース（SEC Form 8-K Exhibit 99.1、2026年10月27日）", "url": "https://www.sec.gov/Archives/edgar/data/1818874/000181887426000065/a2026q3earningsrelease.htm"}]}, "softbank-g": {"date": "2月中旬", "deck": null, "focus": "OpenAI公正価値996億ドルの変動と財務費用の増減、親会社の所有者に帰属する持分比率23.6%の推移", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAMAAAAoLQ9TAAAABlBMVEX///+3u76+O9ITAAAAFUlEQVQYlWNgoApgRAJECgyQoQQAACdQAEkD2jHLAAAAAElFTkSuQmCC", "name": "ソフトバンクG", "next": "次に見る数字は2026年9月末のOpenAI公正価値996億ドルと親会社の所有者に帰属する持分比率23.6%を基準に、12月末時点で公正価値に変動が出るかと持分比率が23.6%を維持できるかです。4-12月期の財務費用が7906億6200万円から増える速度とIntel株式への利益集中61.6%の変化を2月中旬の第3四半期決算で確認します。", "numbers": [{"label": "売上（2026年4-9月期）", "value": "4兆2350億3700万円（前年同期比13.3%増）", "note": "ソフトバンク事業とAIコンピューティング事業が増収を担いました。事業会社の増収だけでは投資損益の振れを吸収できず、連結損益を決める主因は投資側に残ります。", "source": "https://group.softbank/media/Project/sbg/sbg/pdf/ir/financials/financial_reports/financial-report_q2fy2026_01_ja.pdf"}, {"label": "投資利益（2026年4-9月期）", "value": "1兆7257億9600万円（前年同期比56.0%減）", "note": "Intel株式の投資利益1兆628億1500万円が全体の61.6%を占めます。利益の源泉が少数銘柄へ寄り、分散した投資収益の姿から離れました。", "source": "https://group.softbank/media/Project/sbg/sbg/pdf/ir/financials/financial_reports/financial-report_q2fy2026_01_ja.pdf"}, {"label": "OpenAIの公正価値（2026年9月末）", "value": "累計投資額546億ドル、公正価値996億ドル、累計投資利益450億ドル", "note": "評価額は前期末から変動しませんでした。含み益450億ドルが投資資産の中核を占め、評価の据え置きが続く間は損益への寄与も止まります。", "source": "https://group.softbank/media/Project/sbg/sbg/pdf/ir/financials/financial_reports/financial-report_q2fy2026_01_ja.pdf"}, {"label": "財務費用（2026年4-9月期）", "value": "7906億6200万円（前年同期比132.5%増）", "note": "OpenAI追加出資に伴うブリッジ借入と社債残高の増加が支払利息を押し上げました。投資を実行する速度に連動して費用が先に膨らむ構造が鮮明になりました。", "source": "https://group.softbank/media/Project/sbg/sbg/pdf/ir/financials/financial_reports/financial-report_q2fy2026_01_ja.pdf"}, {"label": "発電関連設備の損失（2026年4-9月期）", "value": "5972億4800万円", "note": "返金不能の前渡金損失4570億3000万円と契約変更損失1402億1800万円で構成します。米国AIデータセンター投資で調達計画の変更が直ちに損失へ変わる重さを示しました。", "source": "https://group.softbank/media/Project/sbg/sbg/pdf/ir/financials/financial_reports/financial-report_q2fy2026_01_ja.pdf"}], "sources": [{"title": " 6426000059/sykex991earningsq32026.htm"}, {"label": "整形外科の売上（2026年第3四半期）", "value": "28億5600万ドル（前年同期比5.7%増）", "note": "膝は6億3500万ドルで1.1%増、股関節は4億5300万ドルで1.0%減りました。一方でOrtho Techは7億5400万ドルで15.8%増え、インプラント本体と手術支援技術の間で伸びが割れています。", "source": "https://www.sec.gov/Archives/edgar/data/310764/000031076426000059/sykex991earningsq32026.htm"}, {"label": "調整後EPSとGAAP純利益（2026年第3四半期）", "value": "調整後EPS 3.52ドル（前年同期比10.3%増）、GAAP純利益7億5300万ドル（同12.3%減）", "note": "調整後営業利益率は26.2%へ上がりました。のれん等の減損2億9300万ドルがGAAP利益を押し下げ、本業の採算と報告利益の差が広がりました。", "source": "https://www.sec.gov/Archives/edgar/data/310764/000031076426000059/sykex991earningsq32026.htm"}, {"label": "会社見通し（2026年通期）", "value": "オーガニック売上成長率6.5%から7.0%、調整後EPS 14.80ドルから14.90ドル", "note": "会社は見通しを更新しました。第4四半期で整形外科を戻せるかが通期の下限を守る条件になります。", "source": "https://www.sec.gov/Archives/edgar/data/310764/000031076426000059/sykex991earningsq32026.htm"}], "sources": [{"title": "Stryker Reports Third Quarter 2026 Operating Results（2026年10月29日、SEC Exhibit 99.1）", "url": "https://www.sec.gov/Archives/edgar/data/310764/000031076426000059/sykex991earningsq32026.htm"}], "status": "見込み", "strengths": ["内視鏡が13.9%増の10億2100万ドル、血管事業が8.0%増の5億6600万ドルまで伸び、MedSurgと神経技術全体で36億6400万ドルを売りました。病院の手術現場に入る製品群が広く、単一製品の不振を別製品で補える構造を持ちます。", "Ortho Techが15.8%増の7億5400万ドルへ伸びました。膝と股関節のインプラント本体が停滞する局面でも手術支援技術が伸び、整形外科の中で収益源を切り替えられます。", "調整後営業利益率26.2%を保ち、調整後純利益は14億ドルで10.1%増えました。売上65億2000万ドルの規模で採算を落とさず、減損を除く本業の稼ぐ力が残ります。"], "summary": "僕はStrykerを、病院へ内視鏡と手術器具と膝・股関節インプラントを売り、手術件数に連動して稼ぐ医療機器会社として見ています。米国売上が全体の75.9%を占め、MedSurgと整形外科の二本柱で医療機器大手の地位を保ちます。2026年第3四半期は整形外科の停滞を受けて通期見通しを更新した点が転換点です。", "weakness": "弱点は売上が病院の手術件数に直結する構造です。膝と股関節の合計売上10億8800万ドルは整形外科売上の38.1%を占めます。膝は1.1%増と股関節は1.0%減で止まりました。手術件数が戻らず膝と股関節が横ばいを続ければ、MedSurgの成長だけでは通期成長率6.5%の下限を守れず、固定費を抱えたまま利益率も下がります。"}, "symbotic": {"date": "11月23日", "deck": null, "focus": "会社見通しの売上7億6000万ドルから7億8000万ドルと調整後EBITDA 1億ドルから1億500万ドルへの到達、現金の減少が止まるか", "logo": "data:image/jpeg;base64,/9j/4gIcSUNDX1BST0ZJTEUAAQEAAAIMbGNtcwIQAABtbnRyUkdCIFhZWiAH3AABABkAAwApADl t": "次に見る数字は会社見通しの売上7億6000万ドルから7億8000万ドルと調整後EBITDA 1億ドルから1億500万ドルへの到達です。現金と現金同等物が17億ドルから減り続けるかと継続収益の売上比率6.9%が上がるかを、11月23日の第4四半期決算で確認します。", "numbers": [{"label": "売上（2026年4-6月期、会計第3四半期）", "value": "7億2083万8000ドル（前年同期比22%増）", "note": "システム売上6億7095万2000ドルが全体の93.1%を占めます。成長は導入案件の進捗に集中し、稼働後の継続収益はまだ柱になっていません。", "source": "https://www.sec.gov/Archives/edgar/data/1837240/000183724026000042/q3268-k_ex991.htm"}, {"label": "継続収益（2026年4-6月期）", "value": "ソフトウェア保守1276万5000ドル、運用サービス3712万1000ドル、合計4988万6000ドル", "note": "合計は売上の6.9%にとどまります。導入済み拠点が増えるほど積み上がる収益の比率が上がるかで、四半期ごとの売上の波の大きさが変わります。", "source": "https://www.sec.gov/Archives/edgar/data/1837240/000183724026000042/q3268-k_ex991.htm"}, {"label": "純利益と調整後EBITDA（2026年4-6月期）", "value": "純利益5500万ドル、調整後EBITDA 9523万7000ドル", "note": "前年同期は純損失2117万4000ドルと調整後EBITDA 4539万3000ドルでした。黒字転換とEBITDA倍増が同時に起き、導入規模の拡大が採算へ届き始めています。", "source": "https://www.sec.gov/Archives/edgar/data/1837240/000183724026000042/q3268-k_ex991.htm"}, {"label": "粗利益（2026年4-6月期）", "value": "1億6091万ドル、GAAP粗利率22.3%、調整後粗利率25.0%", "note": "前年同期のGAAP粗利率18.9%と調整後粗利率21.5%から上がりました。現場費用の吸収が進んだことを示し、売上成長を利益へ変える条件が整いつつあります。", "source": "https://www.sec.gov/Archives/edgar/data/1837240/000183724026000042/q3268-k_ex991.htm"}, {"label": "会社見通し（2026年7-9月期、会計第4四半期）", "value": "売上7億6000万ドルから7億8000万ドル、調整後EBITDA 1億ドルから1億500万ドル", "note": "第3四半期実績から売上とEBITDAの両方を一段上げる案内です。導入の後ろ倒しが出れば未達がそのまま成長鈍化の証拠になります。", "source": "https://www.sec.gov/Archives/edgar/data/1837240/000183724026000042/q3268-k_ex991.htm"}], "sources": [{"title": "Symbotic Reports Third Quarter Fiscal 2026 Results（2026年8月5日、SEC Form 8-K Exhibit 99.1）", "url": "https://www.sec.gov/Archives/edgar/data/1837240/000183724026000042/q3268-k_ex991.htm"}], "status": "確定", "strengths": ["展開中システムが77まで増えました。導入中の案件数が次の四半期のシステム売上の土台になり、完了した拠点からはソフトウェア保守と運用サービスの継続収益が積み上がる構造です。", "調整後EBITDAが前年同期の4539万3000ドルから9523万7000ドルへ倍増し、GAAP粗利率も18.9%から22.3%へ上がりました。導入件数を増やしながら現場費用の比率を下げ、規模の拡大を採算改善へつなげています。", "Walmartから先進システムとロボティクス事業を買収し、Walmart向けの商業契約と合弁Exolを持ちます。最大顧客との関係を単発の納入で終わらせず、展開範囲を広げる契約の形に変えています。"], "summary": "僕はSymboticを、Walmart等の大手小売りへ倉庫自動化システムを導入費で売り、稼働後のソフトウェア保守と運用サービスで継続収益を得る会社として見ています。2026年4-6月期は純利益5500万ドルで黒字へ移り、調整後EBITDAが9523万7000ドルへ倍増した点が転換点です。導入の速度が収益を決めます。", "weakness": "弱点は収益がシステム導入の一時売上に集中する構造です。システム売上が全体の93.1%を占め、継続収益は4988万6000ドルで6.9%にとどまります。現金と現金同等物は第2四半期末の20億ドルから17億ドルへ1四半期で減りました。大口顧客の導入が遅れれば売上計上が後ろへずれ、現場費用と株式報酬5051万9000ドルが先に出て現金の減少が続きます。"}, "tempus-ai": {"date": "2月下旬", "deck": null, "focus": "通期売上ガイダンス16億ドルから16億500万ドルの達成とData and Applicationsの伸び、Personalis買収の完了", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAMAAABg3Am1AAAAXVBMVEUAAAD///8bGxvPz89gYGD09PSenp5FRUX6+vpwcHBQUFAgICDf39+vr68wMDArKytra2sMDAzIyMioqKgWFhZOTk5WVlbV1dXb29tmZmbq6uomJiYJCQk9PT1bW1sHFZgjAAAAh0lEQVRIie3RyxKCMAyF4SQkRuWiLQUvVN//MaGdoRvEYeFG7bc+/+oAZH+mZCYwPQfqO056B4Z5WASdiEJ5kaAlK8m1gZPIbREcEaegwqCmApNqChDPXxvcrbX18Dpwqg78Q4NmDloich6MKq3+Ec3B7v0sBznIwWcCu482B+Z5iHRrkP2eEZDHCBZ+RD/GAAAAAElFTkSuQmCC", "name": "Tempus AI", "next": "次に見る数字は会社見通しの通期売上16億ドルから16億500万ドルと調整後EBITDA 6500万ドルへの到達です。Personalis買収が2026年11月30日の同社株主総会を経て完了するかとMRD検査数量の伸びが続くかを、2月下旬の通期決算で確認します。", "numbers": [{"label": "売上（2026年第3四半期）", "value": "4億1150万ドル（前年同期比23%増）", "note": "四半期として過去最高を更新し、会社は通期売上見通しを16億ドルから16億500万ドルへ上げました。検査数量の伸びが売上全体を引っ張る構図が続いています。", "source": "https://www.tempus.com/news/pr/tempus-reports-third-quarter-2026-results/"}, {"label": "Diagnostics売上（2026年第3四半期）", "value": "3億350万ドル（前年同期比20%増）", "note": "がん検査数量は32%増え、遺伝性検査の売上成長は3%にとどまりました。部門内でも成長源ががん検査へ寄り、データ蓄積の入口もがん領域へ集中しています。", "source": "https://www.tempus.com/news/pr/tempus-reports-third-quarter-2026-results/"}, {"label": "Data and Applications売上（2026年第3四半期）", "value": "1億810万ドル（前年同期比33%増）", "note": "売上全体の26.3%を占め、Insightsは29%増えました。診断で集めたデータを製薬会社へ売る二段目の収益が一段目の検査より速く伸びています。", "source": "https://www.tempus.com/news/pr/tempus-reports-third-quarter-2026-results/"}, {"label": "粗利益と調整後EBITDA（2026年第3四半期）", "value": "粗利益2億6670万ドル（前年同期比27%増）、調整後EBITDA 2560万ドル", "note": "調整後EBITDAは前年同期の150万ドルから大きく増えました。データ売上の伸びが粗利益の伸びを売上以上に押し上げ、採算の改善が始まっています。", "source": "https://www.tempus.com/news/pr/tempus-reports-third-quarter-2026-results/"}, {"label": "Bristol Myers Squibbとの契約（2026年10月発表）", "value": "5年間で最大1億3750万ドル", "note": "がんデータとモデルのライセンス契約です。年初来のデータライセンス受注は累計5億5000万ドルを超え、受注の蓄積が今後のData and Applications売上の先行指標になります。", "source": "https://www.tempus.com/news/pr/tempus-reports-third-quarter-2026-results/"}], "sources": [{"title": "Tempus Reports Third Quarter 2026 Results（2026年11月2日、公式発表）", "url": "https://www.tempus.com/news/pr/tempus-reports-third-quarter-2026-results/"}], "status": "見込み", "strengths": ["がん検査数量が32%増え、MRD検査数量は前年同期比300%増えました。検査数量の伸びがそのままライセンスできるデータの蓄積量を増やし、診断とデータの両事業を同時に太くします。", "Data and Applications売上が33%増の1億810万ドルへ伸び、Insightsも29%増えました。Bristol Myers Squibbとの5年最大1億3750万ドルの契約に加え、アルツハイマー領域のデータライセンス5500万ドルも決まり、売り先ががん以外へ広がっています。", "調整後EBITDAが前年同期150万ドルから2560万ドルへ増え、現金と有価証券を8億5440万ドル持ちます。赤字を縮めながら買収と研究開発へ資金を回せる余力を保ちます。"], "summary": "僕はTempus AIを、医療機関へがん検査を売って臨床とゲノムのデータを蓄積し、製薬会社へデータとモデルをライセンスして二度稼ぐ会社として見ています。2026年第3四半期はがん検査数量が32%増え、Data and Applications売上が33%増の1億810万ドルへ伸び、通期売上見通しを引き上げた点が転換点です。", "weakness": "弱点は純損失が有価証券の評価益で圧縮される構造です。第3四半期の純損失1490万ドルには有価証券の未実現益4280万ドルが含まれ、株式報酬等の費用5080万ドルも残ります。未実現益4280万ドルを除けば損失は5770万ドルへ広がる計算です。保有証券の価格が下がり評価益が損失へ転じれば、検査数量が伸びる局面でも純損失が急に膨らみます。"}, "teradyne": {"date": "1月27日", "deck": null, "focus": "第4四半期の会社見通し売上12億5000万ドルから13億5000万ドルの達成とメモリテスト売上の持続", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAMAAABg3Am1AAAAb1BMVEUgQ4chQof///8gQokfQoYhQon//v8gQYYgQYggQ4X///0eRIWRocNYcqUhQYpYcafH0OGRocU9WpYtT49XcaLIz+FJZ5tXcarg5vKdrMksT5Pz8vj+//pmfK3V3OxJZp52ibRmfqrk5vODlbusts+2tkR6AAADJ0lEQVRIie1Ua3rbOAwEBIAERIqyHGeTNm7ibn3/M+5Aaezsdg/QH+Un2qKIATB4Ef1Zv8USdXJn4o8l7EJkpiHixNWJgthEiTQBRtSMVW4aTHERQ6kSxLWaKxuH7OLYwRbDVG/yrOYAOSvjByI4Kw2XDxEfjYd+chI+AsWqlWHG6rsyf//T9MDhkN1dcg5nKDWuOwuGtDt9OFFJB2jajbTXJCTQDH8jMiLJd987CPzlr+W2jvqwrMuaz3oUPuJveVKOJJPhI6kI6aHM08/VaZ3nqeDtPHXRnjfz/PzlKxC+I2AhARDZ92Yr5PMppav1lC/nMr0cSUVbJeEwPcyJw "https://investors.teradyne.com/sec-filings/all-sec-filings/content/0001193125-26-434981/0001193125-26-434981.pdf"}, {"label": "会社見通し（2026年第4四半期）", "value": "売上12億5000万ドルから13億5000万ドル、非GAAP EPS 1.95ドルから2.25ドル", "note": "売上見通しの中間値13億ドルは第3四半期実績と同水準で、非GAAP EPS見通しの上限2.25ドルも第3四半期実績2.29ドルを下回ります。急伸後の踊り場を見込む案内です。", "source": "https://investors.teradyne.com/sec-filings/all-sec-filings/content/0001193125-26-434981/0001193125-26-434981.pdf"}], "sources": [{"title": "Teradyne Reports Third Quarter 2026 Results（2026年10月27日、SEC Exhibit 99.1）", "url": "https://investors.teradyne.com/sec-filings/all-sec-filings/content/0001193125-26-434981/0001193125-26-434981.pdf"}], "status": "見込み", "strengths": ["メモリテストとIntegrated Systems Testが過去最高の売上になり、ウエハーからデータセンターまでを覆うテスト製品群でAI投資の複数工程から受注を取っています。1工程の需要変動を別工程で補える幅を持ちます。", "半導体テスト売上が10億7200万ドルまで伸び、粗利益率59.1%を保ちました。量産ラインへ入った装置は世代交代時にも選ばれやすく、設置実績そのものが次の受注の入口になります。", "ロボティクスが第3四半期として過去最高の9600万ドルを売り、黒字へ転じました。協働ロボットとモバイルロボットが半導体市況に左右されない収益源として育ち始めています。"], "summary": "僕はTeradyneを、半導体メーカーへテスト装置を売り、量産ラインへの設置実績で次の世代の受注につなげる会社として見ています。協働ロボット事業も持ち、売上の82.1%を半導体テストが占めます。2026年第3四半期は売上が前年同期比70%増え、メモリテストと統合システムテストが過去最高へ伸び、利益も大きく増えた点が転換点です。", "weakness": "弱点は売上の82.1%を半導体テストが占める集中構造です。製品テストとロボティクスを合わせても2億3400万ドルにとどまります。半導体メーカーがAI向け設備投資を遅らせ、メモリテストの受注が落ちれば、残る2事業では売上の穴を埋められず、粗利益率59.1%も出荷量の減少と同時に下がります。"}, "tesla": {"date": "1月27日", "deck": "deck-t.html", "focus": "自動車売上205億6000万ドルと営業利益率2.6%からの回復、FSD有料利用174万人の伸びと蓄電池出荷13.7GWh", "logo": "../assets/new-tesla-logo.svg", "name": "Tesla", "next": "次に見る数字は2026年7-9月期の自動車売上205億6000万ドルと営業利益率2.6%を基準に、第4四半期に自動車売上が増へ戻るかと営業利益率が2.6%から上向くかです。FSD有料利用174万人と蓄電池出荷13.7GWhを超えるかを1月27日の第4四半期決算で確認します。", "numbers": [{"label": "売上（2026年7-9月期）", "value": "280億4600万ドル（前年同期比0.2%減）", "note": "自動車売上は205億6000万ドルで3%減りました。全体の73.3%を占める自動車が減れば残る事業が伸びても売上全体は止まります。", "source": "https://ir.tesla.com/_flysystem/s3/sec/000162828026066738/tsla-20261021-gen.pdf"}, {"label": "納車台数（2026年7-9月期）", "value": "486,532台（前年同期比2%減）", "note": "生産台数は464,391台で4%増え、在庫は11日分まで圧縮されました。受注残は4年ぶりの高水準と会社は説明し、台数の弱さが在庫の積み上がりにはつながっていません。", "source": "https://ir.tesla.com/_flysystem/s3/sec/000162828026066738/tsla-20261021-gen.pdf"}, {"label": "営業利益（2026年7-9月期）", "value": "7億1800万ドル（前年同期比56%減、営業利益率2.6%）", "note": "営業費用が47億7600万ドルへ39%増え、利益を圧迫しました。売上280億4600万ドルに対して営業利益が7億ドル台まで細り、費用増を吸収する余地が小さくなっています。", "source": "https://ir.tesla.com/_flysystem/s3/sec/000162828026066738/tsla-20261021-gen.pdf"}, {"label": "FSD有料利用とサービス売上（2026年7-9月期）", "value": "FSDアクティブ利用174万人（前年同期比67%増）、サービス売上46億500万ドル（同33%増）", "note": "累計納車1020万台の保有台数が母数になり、納車後の課金とサービスが伸びています。自動車本体が減る局面でも収益を続ける受け皿が数字で育っています。", "source": "https://ir.tesla.com/_flysystem/s3/sec/000162828026066738/tsla-20261021-gen.pdf"}, {"label": "蓄電池出荷とフリーキャッシュフロー（2026年7-9月期）", "value": "蓄電池出荷13.7GWh（前年同期比9.6%増）、フリーキャッシュフロー15億3100万ドル", "note": "営業キャッシュフロー62億6300万ドルから設備投資47億3200万ドルを引いた水準です。現金と短期投資は454億4700万ドルまで積み上がり、大型投資を続けながら資金の厚みを保ちます。", "source": "https://ir.tesla.com/_flysystem/s3/sec/000162828026066738/tsla-20261021-gen.pdf"}], "sources": [{"title": "Tesla 2026年7-9月期アップデート（SEC Form 8-K Exhibit 99.1、2026年10月21日）", "url": "https://ir.tesla.com/_flysystem/s3/sec/000162828026066738/tsla-20261021-gen.pdf"}], "status": "見込み", "strengths": ["サービス売上が33%増の46億500万ドルへ伸びました。累計納車1020万台の保有台数が修理と部品とサービスの需要を生み、台数が伸びない局面でも稼ぐ部門として機能します。", "FSDアクティブ利用が174万人へ67%増えました。一括払いと月額課金の両方で取る利用者が増えるほど、納車済み車両から得る継続収益の比率が上がる構造です。", "蓄電池出荷が13.7GWhへ増え、受注率と受注残は過去最高と会社は説明しました。データセンター向け電力需要を取り込む事業が自動車以外の成長源になっています。"], "summary": "僕はTeslaを、Model 3とModel Yを個人へ売り、納車後もFSDの月額課金とサービスと蓄電池で稼ぎ続ける会社として見ています。自動車売上は全体の73.3%を占めます。2026年7-9月期はFSD有料利用が174万人へ67%増えた一方で営業利益率が2.6%へ落ち、収益源の広がりと利益の細りが同時に出た点が転換点です。", "weakness": "弱点は自動車の台数と単価が営業利益を決める構造です。自動車売上205億6000万ドルが全体の73.3%を占める一方で営業費用は47億7600万ドルへ39%増え、営業利益率は2.6%まで下がりました。納車が再び減り値下げで単価が下がれば、サービスと蓄電池の粗利では費用増を吸収できず、営業利益が赤字へ転じます。"}, "trimble": {"date": "2月上旬", "deck": null, "focus": "第4四半期見通し（売上10億3100万ドルから10億6100万ドル）の達成とARRオーガニック成長率10%の維持、Field Systems利益率の回復", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIA rl": "https://news.trimble.com/2026-11-04-Trimble-Announces-Third-Quarter-2026-Results-and-Updates-Full-Year-Guidance"}], "status": "見込み", "strengths": ["AECO部門は売上3億9500万ドルと営業利益1億3220万ドルを出し、営業利益率が前年同期の31.8%から33.5%へ上がりました。建設の設計から施工までをつなぐConnect & Scale戦略の下で定期課金が部門内に積み上がり、解約されにくい収益を作ります。", "サブスクリプションとサービス売上6億4250万ドルが全体の66.5%を占め、ARRは25億6000万ドルまで伸びました。機器販売が鈍る四半期でも継続収益が売上と利益率27.2%の土台を保ちます。"], "summary": "僕はTrimbleを、測位技術とソフトウエアで建設と測量と輸送の現場をつなぎ、機器販売と定期課金で稼ぐ会社として見ています。主力は建設向けAECOとField Systemsで、サブスクリプションとサービスが売上の66.5%を占めます。第3四半期はAECO売上が前年同期比10.2%増えた一方でField Systems営業利益が減り、部門間の差が広がりました。", "weakness": "弱点は買収で膨らんだ事業のGAAP利益が実態から離れる構造です。第1から第3四半期累計でのれん減損5億6200万ドルを計上し、GAAP純損失は3億1370万ドルまで膨らみました。第3四半期もField Systems営業利益が前年同期1億3670万ドルから1億2870万ドルへ減り、営業利益率が33.4%から29.5%へ下がりました。AECO以外の部門で需要鈍化と減損が重なれば、非GAAP利益が残ってもGAAP損失と自社株買いの資金負担が同時に残ります。"}, "tsmc": {"date": "1月14日", "deck": null, "focus": "会社見通しの売上523億ドルから543億ドルと粗利率65%から67%の達成、2nmの売上比率と2027年の設備投資計画", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPoAAAA/CAMAAAD+FyUIAAAABGdBTUEAALGPC/xhBQAAACBjSFJNAAB6JgAAgIQAAPoAAACA6AAAdTAAAOpgAAA6mAAAF3CculE8AAAC7lBMVEUAAADmABLmABLmABLmABLmABHmABLmABHmABLmABLlABLnABLmAA3mABLmABPnABLlABHnABLmABLmABHmABLmABPjAA7lABHmABLnABHlABTmABPmABLmABHlABPmABLlABPVAADmABDmABTnABDnABTmABrmABPmABLmABLmABPbAADlABLmABLmABLnABDhAA/lABLpAA/nABL/AAD/AADmABHnABHmABLmABLmABLnABLnABLmABPnABLjABz/AADnABLmABPmABL/AADkABLnABHmABLmABToABfrABTkABDlABHlABTkABTnABLmABLmABLmABLmABLmABLmABLmABPmABLnABTpABblABLmABLmABDnABLmABLmABLmABL/AADmABLmABLmABHmABLmABLlABPmABHmABLmABLmABLlABHqABXtABLoABHmABLmABLmABLjABHnABLmABPmABPjABXmABLmABLmABHmABLnABLmABLmABLmABHlABPmABLmABHnABLjABPnABLlABDmABPmABLnABPmABLmABLmABLnABPuABHmABLrABTlABLmABLnABHpAA/nABHmABLmABHmABLmABPnABPnABLmABLjABXmABHmABLlABLlABHfABDmABLlABLmABLmABLmABLmABLqABXmABLlABHmABHkABLmABLmABHnABLmABLmABLmABLmABLlABHmABLkABPmABPmABLmABHoABHmABLnABHmABPmABPmABLmABTlABLmABHlABPoABfnABPnABHmABLmABLnABPlABPmABLoABPoABPmABLnABPnABHkABDnAAzmABLmABLmABPiABTnABLmABHmABHmABLmABLoAA/mA 画が600億ドルから640億ドルの2026年計画を超える水準で示されるかを確認します。", "numbers": [{"label": "売上（2026年7-9月期）", "value": "467億2000万ドル（前年同期比41.2%増、新台湾ドルで1兆4942億4000万ドル）", "note": "売上は会社見通しの上限を超えました。純利益は新台湾ドル7630億6000万ドルで前年同期比68.7%増え、売上の伸び41.2%を上回りました。利益の伸びが売上の伸びを超える形で効きました。", "source": "https://investor.tsmc.com/english/encrypt/files/encrypt_file/qr/phase4_reports/2026-10/cb1c588cc3b2009f97afa57a6d7c146ae1e27808/3Q26%20EarningsRelease_WoG.pdf"}, {"label": "粗利率と営業利益率（2026年7-9月期）", "value": "粗利率66.4%、営業利益率58.7%、純利益率51.1%", "note": "粗利率は前四半期から1.3ポイント下がりました。2nm量産初期の費用が乗り始めても粗利率が66%台に残り、先端工程の価格決定力が費用増を吸収しています。", "source": "https://investor.tsmc.com/english/encrypt/files/encrypt_file/reports/2026-10/f83780000ddc0c3b48e57a87eab6814c4ab35058/3Q26%20ManagementReport.pdf"}, {"label": "工程別構成（2026年7-9月期）", "value": "2nmがウェハ売上の8%、3nmが33%、5nmが28%、7nm以下先端工程が79%", "note": "2nmは前四半期の3%から8%へ上がりました。売上の79%が7nm以下の先端工程に寄り、成熟工程の価格競争から距離を置く構成が強まります。", "source": "https://investor.tsmc.com/english/encrypt/files/encrypt_file/reports/2026-10/f83780000ddc0c3b48e57a87eab6814c4ab35058/3Q26%20ManagementReport.pdf"}, {"label": "用途別構成（2026年7-9月期）", "value": "HPCが売上の68%", "note": "AIアクセラレータ向けHPCが前四半期から22%増え、スマートフォン中心だった需要構造がデータセンター中心へ入れ替わりました。顧客の設備投資計画が同社の売上を直接決める度合いが上がります。", "source": "https://investor.tsmc.com/english/encrypt/files/encrypt_file/reports/2026-10/f83780000ddc0c3b48e57a87eab6814c4ab35058/3Q26%20ManagementReport.pdf"}, {"label": "会社見通し（2026年10-12月期）", "value": "売上523億ドルから543億ドル、粗利率65%から67%", "note": "営業利益率見通しは56.5%から58.5%です。2026年通期の売上成長見通しは米ドルで44%へ上がり、設備投資計画は600億ドルから640億ドルを維持しました。第3四半期の設備投資は138億4000万ドルです。", "source": "https://investor.tsmc.com/chinese/encrypt/files/encrypt_file/reports/2026-10/526b65af7305df2dde6b9ece6812b1fdf1e49f9b/3Q26%20EarningsRelease.pdf"}], "sources": [{"title": "TSMC 2026年7-9月期決算リリース（2026年10月15日）", "url": "https://investor.tsmc.com/english/encrypt/files/encrypt_file/qr/phase4_reports/2026-10/cb1c588cc3b2009f97afa57a6d7c146ae1e27808/3Q26%20EarningsRelease_WoG.pdf"}, {"title": "TSMC 2026年第3四半期マネジメントレポート（2026年10月15日）", "url": "https://investor.tsmc.com/english/encrypt/files/encrypt_file/reports/2026-10/f83780000ddc0c3b48e57a87eab6814c4ab35058/3Q26%20ManagementReport.pdf"}, {"title": "TSMC 2026年7-9月期決算リリース全文・第4四半期見通し（2026年10月15日）", "url": "https://investor.tsmc.com/chinese/encrypt/files/encrypt_file/reports/2026-10/526b65af7305df2dde6b9ece6812b1fdf1e49f9b/3Q26%20EarningsRelease.pdf"}, {"title": "TSMC 2026年第3四半期決算説明会トランスクリプト（2026年10月15日）", "url": "https://investor.tsmc.com/chinese/encrypt/files/encrypt_file/reports/2026-10/eba4fac72873bf546b669bd2b5d973df5c93215d/TSMC%203Q26%20Transcript.pdf"}], "status": "確定", "strengths": ["先端工程の構成が構造的な強さを作ります。7nm以下がウェハ売上の79%を占め、2nmは8%まで立ち上がりました。顧客は代替の供給先を持たず、工程移行のたびに同社への依存が深まります。", "粗利率66.4%と営業利益率58.7%を量産初期費用の中で保ちました。売上467億2000万ドルが会社見通しの上限を超え、需要超過が値下げ圧力を受けにくい立場を示します。"], "summary": "僕はTSMCを、顧客の設計した半導体をウェハ単位で受託製造し、先端工程の供給を握るファウンドリとして見ています。NVIDIAとAMDとAppleのAIチップが同社の3nmと2nmと先端パッケージを通ります。2026年7-9月期は2nmがウェハ売上の8%へ入り、HPCが売上の68%を占めるまで重心がAIへ寄りました。", "weakness": "弱点は売上の集中と巨額の先行投資が固定費化する構造です。HPCが売上の68%を占め、需要は少数のAI顧客の設備投資計画に連動します。2026年の設備投資計画600億ドルから640億ドルと2nm増産と海外工場の減価償却が先に積み上がるため、AI需要が鈍れば稼働率が下がり、粗利率66.4%は費用負担を吸収できずに大きく下がります。海外工場の利益率希薄化も同じ方向に効きます。"}, "uber": {"date": "2月3日", "deck": null, "focus": "第4四半期見通しの総予約額632億5000万ドルから652億5000万ドルへの到達と配車売上の戻り、自動運転車両台数と2027年見通し", "logo": "../assets/logos/uber.svg", "name": "Uber", "next": "会社見通しは2026年10-12月期の総予約額が632億5000万ドルから652億5000万ドル、調整後EBITDAが31億3000万ドルから32億3000万ドルです。次は2027年2月の第4四半期決算で、見通しの達成と、配車売上が総予約額の伸びへ戻るかと、完全自動運転車両700台の年末計画の実績と2027年見通しの水準を確認します。", "numbers": [{"label": "総予約額（2026年7-9月期）", "value": "598億1900万ドル（前年同期比20%増）", "note": "配車が295億1200万ドルで18%増え、配送が285億3900万ドルで22%増え、貨物が17億6800万ドルで35%増えました。3部門が同時に2桁成長し、単一事業の波に売上の土台が寄らなくなりました。", "source": "https://s23.q4cdn.com/407969754/files/doc_earnings/2026/q3/earnings-result/Uber-Q3-26-Earnings-Press-Release.pdf"}, {"label": "売上（2026年7-9月期）", "value": "147億6600万ドル（前年同期比10%増）", "note": "事業モデル変更が売上成長を8ポイント押し下げました。配車売上は75億2000万ドルで2%減り、配送売上は54億8800万ドルで23%増えました。予約額の伸びと売上の伸びを分けて読む必要があります。", "source": "https://s23.q4cdn.com/407969754/files/doc_earnings/2026/q3/earnings-result/Uber-Q3-26-Earnings-Press-Release.pdf"}, {"label": "調整後EBITDA（2026年7-9月期）", "value": "29億6300万ドル（前年同期比31%増）", "note": "総予約額に対する比率は5.0%まで上がり、前年同期の4.5%から改善しました。非GAAP営業利益は23億400万ドルで38%増え、予約額の成長が利益の成長へ変換される比率が上がります。", "source": "https://s23.q4cdn.com/407969754/files/doc_earnings/2026/q3/earnings-result/Uber-Q3-26-Earnings-Press-Release.pdf"}, {"label": "フリーキャッシュフロー（2026年7-9月期）", "value": "25億3500万ドル", "note": "営業キャッシュフローは26億3900万ドルでした。GAAP純利益5億1200万ドルには保有株式の評価損4億7600万ドルが含まれ、現金創出と会計利益の差が大きく開きます。", "source": "https://s23.q4cdn.com/407969754/files/doc_earnings/2026/q3/earnings-result/Uber-Q3-26-Earnings-Press-Release.pdf"}, {"label": "会社見通し（2026年10-12月期の総予約額）", "value": "632億5000万ドルから652億5000万ドル（為替一定ベースで前年同期比18%から22%増）", "note": "非GAAP EPS見通しは0.95ドルから0.99ドル、調整後EBITDA見通しは31億3000万ドルから32億3000万ドルです。完全自動運転車両は2026年末に700台、2027年に2000台超へ増やす計画を会社は示しました。", "source": "https://s23.q4cdn.com/407969754/files/doc_earnings/2026/q3/earnings-result/Uber-Q3-26-Earnings-Press-Release.pdf"}], "sources": [{"title": "Uber 2026年第3四半期決算発表（2026年11月4日）", "url": "https://s23.q4cdn.com/407969754/files/doc_earnings/2026/q3/earnings-result/Uber-Q3-26-Earnings-Press-Release.pdf"}], "status": "見込み", "strengths": ["月次利用者2億1500万人と利用回数40億6100万回が作る流動性が強さの核です。配車295億1200万ドルと配送285億3900万ドルの総予約額が近い規模で並び、片方の需要が鈍る局面でも供給側のドライバーと配達員をもう片方へ回せます。", "利益変換の効率が上がりました。調整後EBITDAマージンは総予約額比5.0%まで上がり、配車部門営業利益23億6200万ドルと配送部門営業利益10億5700万ドルが本社費用10億8200万ドルを上回る構造ができました。"], "summary": "僕はUberを、配車と料理配送と貨物の需要と供給を束ね、総予約額から手数料を取る基盤として見ています。月次利用者は2億1500万人に達し、利用回数は四半期で40億6100万回を数えます。2026年7-9月期は総予約額が前年同期比20%増えた一方で配車売上が2%減り、予約額と売上の伸びが分かれる転換点になりました。", "weakness": "弱点は配車事業の収益計上が事業モデル変更に左右される構造です。配車の総予約額が18%増えた四半期に配車売上は2%減の75億2000万ドルまで下がり、変更が全体の売上成長を8ポイント削りました。利益も配車部門営業利益23億6200万ドルへの集中度が高く、貨物部門は売上17億5800万ドルで営業損失3300万ドルを続けます。変更対象の市場が広がり配車の手数料計上がさらに細れば、総予約額が伸びる局面でも売上と利益率が同時に下がります。"}, "ubtech": {"date": "3月30日", "deck" YII=", "logobg": "#12212e", "name": "UBTECH", "next": "次は2027年3月の2026年通期決算で、上半期実績の販売921台と売上12億6913万人民元を基準に、通期の全サイズヒューマノイド販売台数と売上構成比46.5%の推移と、期間損失3億3882万7000人民元を上半期基準でどこまで縮めるかと、粗利率44.7%の維持を確認します。", "numbers": [{"label": "売上（2026年上半期）", "value": "12億6913万人民元（前年同期比104.2%増）", "note": "増収額6億4767万人民元のうち全サイズヒューマノイドの増収5億5209万3000人民元が85.2%を占めます。成長の源泉が1製品群へ集中した点が数字の意味です。", "source": "https://www.hkexnews.hk/listedco/listconews/sehk/2026/0828/2026082801691.pdf"}, {"label": "全サイズヒューマノイド売上と台数（2026年上半期）", "value": "売上5億9029万9000人民元（前年同期比1445.0%増）、販売921台", "note": "売上構成比は前年同期の6.1%から46.5%へ上がりました。産業向けを含むその他分野向けが5億6905万2000人民元を占め、工場への納入が販売の中心になりました。", "source": "https://www.hkexnews.hk/listedco/listconews/sehk/2026/0828/2026082801691.pdf"}, {"label": "粗利益（2026年上半期）", "value": "5億6687万8000人民元、粗利率44.7%（前年同期比9.7ポイント上昇）", "note": "粗利率は前年同期の35.0%から上がりました。ヒューマノイドの台数拡大が単価低下を招く前に、量産効果が原価率の改善として先に表れています。", "source": "https://www.hkexnews.hk/listedco/listconews/sehk/2026/0828/2026082801691.pdf"}, {"label": "期間損失と信用減損（2026年上半期）", "value": "期間損失3億3882万7000人民元（前年同期比23.0%縮小）、信用減損損失9107万人民元", "note": "売上は104.2%増えたのに損失の縮小は23.0%にとどまります。信用減損損失は前年同期130万3000人民元から9107万人民元へ膨らみ、納入先からの回収リスクが販売拡大と同時に育ちました。", "source": "https://www.hkexnews.hk/listedco/listconews/sehk/2026/0828/2026082801691.pdf"}], "sources": [{"title": "UBTECH Interim Results Announcement for the Six Months Ended June 30 2026（2026年8月28日、HKEXnews開示）", "url": "https://www.hkexnews.hk/listedco/listconews/sehk/2026/0828/2026082801691.pdf"}], "status": "見込み", "strengths": ["Walker S系列とCruzr Y1が工場の搬送と仕分けと組立の現場へ入り、販売台数が前年同期45台から921台へ増えました。実証段階を抜けた納入実績が次の受注交渉で示せる導入事例を作ります。", "産業向けヒューマノイド売上が5億6905万2000人民元まで伸び、粗利率44.7%と利益率改善が重なりました。教育向け部門売上が49.1%減る中でも全体売上を2倍へ押し上げ、製品構成の入れ替えを利益率を落とさずに進めました。"], "summary": "僕はUBTECHを、産業用ヒューマノイドWalker S系列を工場へ納入し、本体販売とサービスで稼ぐ会社として見ています。教育と物流向けロボットが従来の柱でした。2026年上半期は全サイズヒューマノイド売上が全体の46.5%へ跳ね、販売台数921台と合わせて事業の重心が教育から産業用ヒューマノイドへ入れ替わりました。", "weakness": "弱点は売上の46.5%を1製品群に頼り、回収リスクを抱えたまま赤字が残る構造です。上半期の営業損失は2億7909万3000人民元で、信用減損損失9107 "貢献利益率60%が審査モデルの価格を裏付けます。組成額41億1780万ドルの伸びに手数料売上の拡大が重なり、手数料売上3億6400万ドルと貢献利益2億1800万ドルの過去最高を同時に作りました。", "担保付商品が収益の柱へ育ちました。担保付組成は5億8642万2000ドルで前年同期比194%増え、貢献利益率が17%とプラスへ転じました。無担保個人ローン単独への依存が下がり、信用悪化局面で組成を残せる分野が増えます。"], "summary": "僕はUpstartを、AI審査で借り手の信用を判定し、銀行と信用組合へ貸出を組成して組成額に応じた手数料を取る市場として見ています。2026年7-9月期は組成額が41億1780万ドルで前年同期比44%増え、組成件数57万4089件と手数料売上と貢献利益が過去最高に達しました。同じ四半期に会社は通期売上見通しを13億5000万ドルへ、調整後EBITDA見通しを2億6000万ドルへ引き下げ、組成の拡大と見通しの引き下げが同時に起きました。", "weakness": "弱点は売上が組成額へ直結する構造です。売上3億7100万ドルのほぼ全てを組成に連動する手数料が決め、調整後EBITDAの売上比は前年同期の26%から24%へ下がりました。担保付商品の貢献利益率は17%へ転じましたが第2四半期はマイナス35%で、新規分野の採算は振れ幅が大きい状態です。信用環境が悪化して組成額が鈍れば、手数料売上と貢献利益が同時に落ち、調整後EBITDAの下振れが通期見通し2億6000万ドルの未達へ直結します。"}, "uranium-energy": {"date": "12月9日", "deck": null, "focus": "Christensen Ranch等の生産拡大と2027年度のウラン販売量の増加", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAMAAAD04JH5AAAA0lBMVEX///8UTAAXTgAXUwCNp4AXVQAfZgAcYQAibgAdbgAUWQDr8enJ28FHiSpKeDnX49BBbicLRwAicwATRgDQ28uqvKImWgtLcTrm7OI6eiS4z6vM2sWhoaJ+fn/19fUaXQAoWwCHh4jk5eXBwcKVlZbR0dEAQgCwsLGYr4yzxara2tp1dXaKsnQATQCjuJhcf0xbgkdri12/zrdnZ2hdXV6buY5LhDN0nmBTiD6VuIVdk0ZWkj5mlFACZAA5gRdpkVZ6nmoyax17lXAxYh8ANgAlURcKoac3AAAGFElEQVR4nO2Xa3faOBCGbcwlwRRwaggBWY4lOQI7EC4hzaVtSLL7///SjmRzleUm5/Tb6mlDY0aaeTWaGahlGQwGg8FgMBgMBoPBYDAYDAaD4ZDBKKODFZObm3xh6rRKGLlH+wad0eh0heo+X7x+uHoArn64im34LTM9diwLP30r4bl1oHp4+/yirHjp6BLwo16vNxqN8Kcq4OmXtIVXsNn9ca6n/rAV4LZun39fqJx/KxUAYcKCDNz+krZQZGDw80xP/XGU7WjdvhREF7wMNAI6uYBmVRXwMzc9w+bOY11P41Wez13rwl+cP2sFtBuCsDFWqgQ/ZKbmK2gbPTZKeBXu3duLc12Ozm/V82WMpICwFs4Uk/s7FKZwugFtk7dmCRtXxNeGBzY6Aa12KILUwqViGvxuClM4fYKH4bxdAqh3ny4OLuXs6oS1TsCk24QYTedNFdA5E6awNhXJcTtlgPfW1T7642Y9PEHXBHj2lgsYqcmpC1OtNu1pNh+l63UX/2rd0h1XxR33a3CHNaftK7ZhQ5pqlcknHA3zBDTqz8PPhwcB1X5NMJ2rAtZNaXIccTsDv4B9a7mbet4Qjy3FUamATSiDTBdqn66nmYDrkcjUZQH7zvHnoaRZX+uGfjGDTRbEflcFVDMB9huYBgvbswHvkO/j3dqlrGUQMNdVm07AIsuyXTAIF1KA43XB5N/ZFcA+Zi+g95YJaGj7XUPnFaID9ljZ6C6m0uTN4cG/lAIOse3+7gpwLqAZFhykXMBcCqhU1Ek8mEsBFW8hBXj2KV5/1x7QzY68r68LaMsottNTBHTaWW68jRRw3T/F6e5mB+59ZAKaG9 43774926031416/ex_1020503.htm"}, {"label": "生産コスト（2026年度）", "value": "総現金コスト1ポンドあたり34.24ドル、総原価39.94ドル", "note": "第4四半期の総原価は36.54ドルまで下がり、第3四半期から33%下がりました。Christensen Ranchの総原価は35.63ドルです。生産量の拡大が単位原価を下げる効果が数字に出始めました。", "source": "https://www.sec.gov/Archives/edgar/data/1334933/000143774926031416/ex_1020503.htm"}, {"label": "流動資産と在庫（2026年7月31日時点）", "value": "流動資産7億5300万ドル（現金4億9500万ドル、借入なし）、在庫125万6000ポンド", "note": "在庫の市場評価は1億900万ドルです。流動資産がLudeman建設とSweetwater開発と精製転換事業の先行費用を借入なしで支えます。", "source": "https://www.sec.gov/Archives/edgar/data/1334933/000143774926031416/ex_1020503.htm"}], "sources": [{"title": "Uranium Energy Corp Reports Fiscal 2026 Results（2026年9月29日、SEC Form 8-K Exhibit 99.1）", "url": "https://www.sec.gov/Archives/edgar/data/1334933/000143774926031416/ex_1020503.htm"}], "status": "見込み", "strengths": ["生産拡大と原価低下が同時に進みました。第4四半期生産8万2744ポンドは第3四半期比157%増で、総原価は1ポンドあたり36.54ドルまで下がりました。Christensen Ranch生産6万5392ポンドにBurke Hollow生産1万7352ポンドが加わり、単一鉱山への依存が下がります。", "無ヘッジ販売で実現価格93.13ドルを取り、流動資産7億5300万ドルを借入なしで持ちます。在庫125万6000ポンドを抱える形は市況上昇局面で販売価格と在庫評価を同時に押し上げます。"], "summary": "僕はUranium Energyを、ワイオミング州とテキサス州で原位置回収法の鉱山を動かし、U3O8を無ヘッジで電力会社と政府需要へ売る米国のウラン生産者として見ています。米国最大のウラン資源基盤を会社は掲げます。2026年度は生産拠点が1鉱山から2鉱山へ増え、生産量が22万9294ポンドまで伸びる転換点になりました。", "weakness": "弱点は無ヘッジ戦略と在庫依存が市況下落へそのまま連動する構造です。2026年度販売40万ポンドは生産22万9294ポンドを上回り、在庫125万6000ポンドを取り崩す売り方に支えられます。実現価格93.13ドルに対し総原価39.94ドルと採算には余裕があります。ウラン価格が下がれば実現価格と在庫評価1億900万ドルが同時に下がり、LudemanとSweetwaterとUR&Cへの先行支出が残る中で売上だけが細ります。"}, "usa-rare-earth": {"date": "4月5日", "deck": null, "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAMAAAD04JH5AAAAflBMVEUKFij///8AECQAAB0GEyYAABgAABoACSDs7e4ABh8ADSKMkZm2ub7S1NcWITL6+vvz9PXg4eN5f4jY2tykqK6GjJSqrrQqNENvdX5QV2Oan6ZGTVnGyc0iLDsADybAw8c2P00AABFhaHJZYGo9RlMAAAsOHTEBGC0AAAAaJzq5OXymAAAId0lEQVR4nO1ZiXKkOBIFQRUCiUtIQgeHLNF46/9/cBOqXPa4yzPunhk7doMXHVEEGL3M1MtDdBQdOHDgwIEDBw4cOHDgwIEDBw4c+J9Hhr6XH+k++07+zOLWFd9owJOMY47Sb+PPdRzHOCTfxV/0JRgQD8k3hSDNTbxDJN+SCujE6qsBtVm/wQI0EhzfUPPnL+dPkyF+RbumX62DRL3hj/kpWb のが収益化の成否を決める最初の検証になります。", "source": "https://www.sec.gov/Archives/edgar/data/1970622/000197062226000066/exhibit991-earningsrelease.htm"}, {"label": "US SIIE向け特別目的事業体の資本（2026年8月発表）", "value": "15億5000万ドル", "note": "米国戦争省の出資7億5000万ドル、大手銀行の融資枠5億ドル、米国政府の5年間で3億ドル以上の先行購入契約で構成します。米国政府の裏付けがPhase 1の買い手と資金を固め、販売先探しのリスクを取り除いています。", "source": "https://www.sec.gov/Archives/edgar/data/1970622/000197062226000066/exhibit991-earningsrelease.htm"}], "sources": [{"title": "USA Rare Earth Reports Third Quarter 2026 Financial Results（2026年11月9日、SEC Form 8-K Exhibit 99.1）", "url": "https://www.sec.gov/Archives/edgar/data/1970622/000197062226000066/exhibit991-earningsrelease.htm"}], "strengths": ["Serra VerdeはNdFeB磁石に必要なネオジム、プラセオジム、ジスプロシウム、テルビウムの4元素すべてをアジア以外で大規模に生産する唯一の鉱山で、Stage 1で年産4000トンへ広げ、Stage 2で2027年末までに年産6400トンを目指します。重希土類まで自社で持つ点が代替の利かない強さです。", "Phase 1の全量をUS SIIEが15年間のテイクオアペイ契約で買い、下限価格1キログラムあたり43ドルに対して市場価格97ドルでは上昇分を分け合います。売れ残りと価格急落の両方を契約で抑え、量を増やすほど売上が立つ構造を作りました。", "Stillwater工場は年産600トンの体制で2026年9月にNdFeB磁石の初回販売を高性能材料メーカーへ記録し、サウスカロライナ州Blacksburgでは12億ドルを投じて年産6400トンの金属と磁石の工場を着工しました。鉱山と磁石の両端で実際に販売と投資が動いています。"], "summary": "僕はUSA Rare Earthを、ブラジルSerra Verde鉱山の混合希土類炭酸塩からオクラホマ州Stillwater工場のNdFeB磁石までを一社で売る会社として見ています。Phase 1の全量をUS SIIEが15年のテイクオアペイで買う構造で、2026年第3四半期に磁石の初回販売を記録し売上300万2000ドルを立てました。", "weakness": "弱点は収益化前の費用構造です。第3四半期は売上300万2000ドルに対して売上原価2288万4000ドル、営業損失1億4144万3000ドル、営業活動の現金使用1億4368万7000ドルでした。現金11億6359万9000ドルは第3四半期の現金使用ペースで8.1四半期分しかなく、Blacksburg工場の投資12億ドルも同じ現金を取り合います。第4四半期の販売量が325トンへ届かず磁石の顧客も増えなければ、現金を食いながら量産へ届かない状態が続き、資金調達か投資の先送りを迫られます。"}, "vertiv": {"date": "2月10日", "deck": null, "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPoAAAA+CAQAAAConM4UAAAABGdBTUEAALGPC/xhBQAAACBjSFJNAAB6JgAAgIQAAPoAAACA6AAAdTAAAOpgAAA6mAAAF3CculE8AAAAAmJLR0QA/4ePzL8AAAAHdElNRQfqBRsPNC3BWiUVAAAMGElEQVR42u1cf3AU1R3/vL0kJoFC+GH4YeBud4+gBC1oGqWjlQSIEZCfooCI2mnrHx1/1hmnHTvt6Ngylk5Bps7oFEOIQJH4gx8KIb8QpSqKKJIK4fY2MQkShASqISS529c/Lty9vezevT1zx+HsN//sy719b/f7ee/7+y1gk002/fiJxHrjTantk8hkuOlYYRgdjFScRx LWPQAAACV0RVh0ZGF0ZTptb2RpZnkAMjAyNi0wNS0yN1QxNTo1Mjo0NSswMDowMDuPboEAAAAASUVORK5CYII=", "name": "Vertiv", "status": "見込み", "focus": "第4四半期見通しの売上43億1300万〜45億1300万ドルと調整後営業利益率25.3%〜26.3%への到達、通期売上の中間値146億5000万ドルの達成", "next": "次に見る数字は2026年10-12月期の売上と調整後営業利益率です。会社見通しは売上43億1300万から45億1300万ドル、調整後営業利益率25.3%から26.3%、調整後1株利益2.22から2.28ドルです。通期売上の中間値146億5000万ドルの達成と、2027年見通しで受注の強さが数字として示されるかを確認します。", "numbers": [{"label": "売上（2026年7-9月期）", "value": "43億1300万ドル（前年同期比61%増）", "note": "既存事業の伸びが55%、買収の寄与が6ポイントです。データセンター投資の拡大を値上げではなく数量で取り込み、通期見通しを引き上げる根拠になりました。", "source": "https://www.sec.gov/Archives/edgar/data/1674101/000162828026067707/q32026exhibit991vrt10282026.htm"}, {"label": "調整後営業利益（2026年7-9月期）", "value": "10億8700万ドル（前年同期比83%増）、調整後営業利益率25.2%", "note": "利益率は前年同期から290ベーシスポイント上がりました。GAAP営業利益も9億8400万ドルで90%増え、売上の伸びを利益率の上昇へ変えています。量を追うと率が落ちる局面を今期は避けました。", "source": "https://www.sec.gov/Archives/edgar/data/1674101/000162828026067707/q32026exhibit991vrt10282026.htm"}, {"label": "地域別売上の伸び（2026年7-9月期）", "value": "米州75%増、アジア太平洋50%増、欧州中東アフリカ23%増（いずれも前年同期比）", "note": "既存事業の伸びは米州66%、アジア太平洋48%、欧州中東アフリカ19%です。最速の米州に引っ張られながら全地域で二桁成長し、単一地域の投資計画に売上がぶら下がる形を避けています。", "source": "https://www.sec.gov/Archives/edgar/data/1674101/000162828026067707/q32026exhibit991vrt10282026.htm"}, {"label": "調整後フリーキャッシュフロー（2026年7-9月期）", "value": "6億5200万ドル（前年同期比50%増）", "note": "営業キャッシュフローは7億9400万ドルで64%増えました。流動性は62億ドルでネットキャッシュを保ち、売上比4.0%の設備投資を借入に頼らず賄う形が続いています。", "source": "https://www.sec.gov/Archives/edgar/data/1674101/000162828026067707/q32026exhibit991vrt10282026.htm"}, {"label": "通期売上見通しの引き上げ（2026年10月28日発表）", "value": "146億5000万ドル（中間値、従来見通しから6億5000万ドル引き上げ）", "note": "会社は売上と利益とフリーキャッシュフローの全項目で通期見通しを引き上げました。第4四半期の売上見通しの中間値44億1300万ドルを届かせる前提で組んだ数字で、受注の強さを経営側が計画へ織り込んだ証拠です。", "source": "https://www.sec.gov/Archives/edgar/data/1674101/000162828026067707/q32026exhibit991vrt10282026.htm"}], "sources": [{"title": "Vertiv Reports Strong Third Quarter 2026 Results（2026年10月28日、SEC Form 8-K Exhibit 99.1）", "url": "https://www.sec.gov/Archives/edgar/data/1674101/000162828026067707/q32026exhibit991vrt10282026.htm"}], "strengths": ["既存事業の受注が前年同期比で100%を超えました。通期見通しを売上6億5000万ドル分引き上げた判断と並べると、需要の見通しは四半期単位ではなく複数四半期先まで届いています", "売上が61%増えた四半期に調整後営業利益率を25.2%まで290ベーシスポイント高めました。新製品の開発期間を年単位から月単位へ縮め、統合基盤を量産する体制を経営陣が強みとして挙げ、模倣しにくい実行速度で規模と率を同時に伸ばしています", "流動性62億ドルとネットキャッシュを保ち、調整後フリーキャッシュフロー6億5200万ドルを四半期で生みます。需要に合わせて能力を増やす投資を自社の現金で賄えるため、成長局面で財務が先に細る心配が小さい構造です"], "summary": "僕はVertivを、データセンター向けに電源と冷却とIT基盤を機器と継続サービスで売る会社として見ています。世界130か国超で事業を行い、2026年7-9月期に売上43億1300万ドルと前年同期比61%増を記録し、調整後営業利益率25.2%まで高めて規模の拡大と利益率の上昇を両立させました。既存事業の受注が前年同期比で100%を超えた点も今期の特徴です。", "weakness": "弱点は米州のデータセンター投資へ売上の伸びが集中する構造です。第3四半期は米州売上が前年同期比75%増え、既存事業でも66%増とアジア太平洋の48%増と欧州中東アフリカの19%増を大きく上回りました。第4四半期見通しは既存事業の伸び49%から51%と調整後営業利益率25.3%から26.3%を前提に置きます。米州のデータセンター投資が鈍れば、先行して増やした能力と売上比4.0%の設備投資が固定費へ変わり、利益率25%台を保てなくなります。"}, "xpeng": {"date": "11月16日", "deck": null, "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAMAAABEpIrGAAAAXVBMVEX///8KChr29veEhIz7+/tUVGDCwsY4OEUeHizMzM97e4RlZW9aWmVQUFslJTQ+Pkvj4+UQECClpauLi5OTk5qamqAtLTutrbIyMj/U1Nfn5+hgYGpvb3mzs7ienqXugUb1AAAAnElEQVQ4je1RWxKDIBAzrg98IIqotdre/5giUKyOM1zAfG2ygX1F0QMHRX18p8eKlAkIYENyTScDA8jGKYBxOuenUYvp76+XJhDZkc7yXcl95ZbtHHy2dOaGsvfxouiMhKXV7sXGXfFfUsKpPTkvLk19yrWqeQMh0PC6Wkt5mUoGDL4E+RInR6jJ0JjBRYVWHTyWou/9uaU79wONDRFvB8pb8dFCAAAAAElFTkSuQmCC", "name": "XPeng", "status": "確定", "focus": "第3四半期ガイダンスの納車11万5000〜12万1000台と売上217億〜234億元への到達、車両粗利率12.1%の維持とサービス等売上の伸び", "next": "次に見る数字は2026年7-9月期の納車台数と売上です。会社ガイダンスは納車11万5000台から12万1000台、売上217億から234億元です。車両粗利率12.1%を保てるか、粗利率75.1%のサービス等売上が伸び続けるか、純損失13億4000万元から縮小するかを確認します。", "numbers": [{"label": "売上（2026年4-6月期）", "value": "197億4000万元（前年同期比8.0%増、前四半期比51.5%増）", "note": "車両販売は170億5000万元で前年同期比1.0%増にとどまり、売上の伸びを引っ張った要素は車両以外にあります。台数が戻った四半期でも車両の金額は伸びず、収益の中心が移る途中の数字です。", "source": "https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0824/2026082401045.pdf"}, {"label": "サービス等の売上と粗利率（2026年4-6月期）", "value": "売上27億元（前年同期比93.9%増）、粗利率75.1%", "note": "粗利率は前年同期の53.6%から上がりました。粗利40億8000万元の半分近くを売上の13.7%にあたるサービス等が生み、自動車メーカー向け技術開発サービスのマイルストーン達成が金額を押し上げました。", "source": "https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0824/2026082401045.pdf"}, {"label": "粗利率（2026年4-6月期）", "value": "全体20.7%、車両12.1%", "note": "全体は前年同期の17.3%から3.4ポイント上がり、車両は14.3%から2.2ポイント下がりました。全体の改善は車両の改善ではなく構成の変化で生まれ、製品世代の移行が車両の率を押し下げています。", "source": "https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0824/2026082401045.pdf"}, {"label": "純損失（2026年4-6月期）", "value": "13億4000万元（前年同期4億8000万元）", "note": "粗利40億8000万元に対して研究開発費29億1000万元と販売管理費25億元の合計が54億1000万元に達し、営業損失11億4000万元を生む構造です。売上が増えても費用の合計が粗利を上回る限り損失は残ります。", "source": "https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0824/2026082401045.pdf"}, {"label": "手元資金（2026年6月30日時点）", "value": "404億8000万元", "note": "3月末の420億9000万元から減りました。販売店740店と充電ステーション3780か所を自社で抱える体制は接点を押さえる一方、損失が続く期間の固定費として資金を消費します。", "source": "https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0824/2026082401045.pdf"}], "sources": [{"title": "XPeng 2026年第2四半期業績発表（2026年8月24日、香港取引所開示）", "url": "https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0824/2026082401045.pdf"}], "strengths": ["自動車メーカー向け技術開発サービスを含むサービス等の売上が93.9%増えて27億元に達し、粗利率は75.1%まで上がりました。自社の自動運転技術を他社の車両へ売る形は台数に依存しない粗利の柱になり始めています", "自社充電網は3780か所まで広がり、うち超急速充電が2720か所です。販売店740店を257都市に置き、販売から充電まで利用の接点を自社で押さえる体制は価格以外の理由で選ばれる根拠を作ります", "納車は前四半期の6万2682台から64.8%増えて10万3295台へ戻り、経営陣はGXとMONA L03の連続した成功に言及しました。新車を当てて台数を戻す力を持ち、車両粗利率が下がる局面でも全体の粗利率20.7%を保ちました"], "summary": "僕はXPengを、中国で電気自動車を売り、自動車メーカーへの技術開発サービスと自社充電網で稼ぐ会社として見ています。2026年4-6月期は納車10万3295台で売上197億4000万元を立て、全体の粗利率が20.7%へ上がる一方で車両粗利率は12.1%へ下がり、収益の中心が車両からサービスへ移る転換点にあります。", "weakness": "弱点は車両の粗利だけでは費用を賄えない構造です。粗利40億8000万元に対して研究開発費29億1000万元と販売管理費25億元がかかり、車両粗利率は製品世代の移行で14.3%から12.1%へ下がりました。納車台数の前年同期比は0.1%増にとどまります。技術開発サービスのマイルストーン収入が一巡し、車両粗利率が12.1%を割り台数も横ばいなら、損失は13億4000万元からさらに広がり手元資金404億8000万元の減少が速まります。"}, "yaskawa": {"date": "1月上旬", "deck": null, "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAMAAABg3Am1AAAAYFBMVEUAVrn///9eldN6p9oHW7tXj9EwdcYkbsMSYr46fckfa8JFhMykw+YOX73p8PmDrd09f8rb5/Xx9vvM3fFkmdRJhs1xodgzeMeVueLC1++0zeq70uzW5PStyemOtOAYZsBg4+DvAAAA9ElEQVRIie2PC5KEMAhEu8lHjcbvGHVnVu9/yyVxTzHlq7JIQyMAPDw8fBdBKkAEXmqgliSXlQ1NCmjEQpwWNzV5jBLvBvZo2WHWL/Ykh0gDsrb61KiGCTtHZFno2BxEw1L7QQwbTUcPkzOGttU/vglHzneDncmET9/Q5TEVRnUKMC8tq0jRxjAvKp0aCo4LIn+ho+1AupqLrhc42Jz8TFP/Vmve77gbLp4QZi6rviPQCf1aMjjJttNY5P9OXjefmKSjmTRrQjmWfMmb3qt50Nm3XEtDbVoko8eYdd33F6Lq9jwlV/T2hMpsGJKuovHh4eG7+APOcAngJ2imTwAAAABJRU5ErkJggg==", "name": "安川電機", "status": "見込み", "focus": "下期営業利益354億4200万円の達成ペースとロボット営業利益率5.0%からの回復、モーションコントロールの伸びの持続", "next": "次に見る数字は2026年9-11月期のロボット営業利益率と通期予想への進捗です。会社予想は通期売上収益6000億円、営業利益575億円で、下期に必要な営業利益は354億4200万円です。ロボット利益率5.0%からの回復と、モーションコントロールの売上収益の伸びが続くかを確認します。", "numbers": [{"label": "売上収益（2026年3-8月期）", "value": "2855億9800万円（前年同期比9.8%増）", "note": "親会社の所有者に帰属する中間利益は189億8800万円で4.1%増えました。増収を主導した事業はモーションコントロールで、需要の中心が半導体とデータセンター向けへ寄った半年の数字です。", "source": "https://www2.jpx.co.jp/disc/65060/140120261009548685.pdf"}, {"label": "営業利益（2026年3-8月期）", "value": "220億5800万円（前年同期比5.5%減）", "note": "売上収益が9.8%増えた期間に営業利益は減りました。基幹システム移行が生産と出荷を抑え、欧州の事業構造改革費用も重なり、需要の強さを利益へ変え切れなかった点を示します。", "source": "https://www2.jpx.co.jp/disc/65060/140120261009548685.pdf"}, {"label": "モーションコントロール（2026年3-8月期）", "value": "売上収益1372億8600万円（前年同期比21.7%増）、営業利益159億7300万円（前年同期比32.8%増）", "note": "営業利益率は11.6%で、金額は連結営業利益220億5800万円の72%に相当します。ACサーボは全地域で増収となり、データセンターと半導体向けの需要を米州と中国と韓国・台湾で取り込みました。利益の重心がこの事業へ移った事実を示す数字です。", "source": "https://www2.jpx.co.jp/disc/65060/140120261009548685.pdf"}, {"label": "ロボット（2026年3-8月期）", "value": "売上収益1184億400万円（前年同期比0.7%減）、営業利益59億7400万円（前年同期比43.3%減）", "note": "営業利益率は5.0%で、前年同期の8.8%から下がりました。売上規模はモーションコントロールに近い一方で営業利益は2.7分の1にとどまり、同じ会社の中で収益力の差が広がりました。", "source": "https://www2.jpx.co.jp/disc/65060/140120261009548685.pdf"}, {"label": "通期予想の修正（2026年10月9日発表）", "value": "売上収益6000億円、営業利益575億円（会社予想）", "note": "売上収益は従来予想5800億円から引き上げ、営業利益は600億円から引き下げました。下期に必要な営業利益は354億4200万円で通期の61.6%にあたります。計画の達成は下期の生産回復とロボットの利益率回復に懸かる形です。", "source": "https://www2.jpx.co.jp/disc/65060/140120261009548685.pdf"}], "sources": [{"title": "安川電機 2027年2月期第2四半期（中間期）決算短信〔IFRS〕（連結）（2026年10月9日、JPX TDnet開示）", "url": "https://www2.jpx.co.jp/disc/65060/140120261009548685.pdf"}, {"title": "安川電機 2027年2月期第2四半期決算説明会Q&A要旨（2026年10月13日、公式サイト）", "url": "https://www.yaskawa-global.com/wp-content/uploads/2026/10/262Q_QA_EN-1.pdf"}], "strengths": ["モーションコントロールの売上収益が21.7%増えて1372億8600万円、営業利益が32.8%増えて159億7300万円に達しました。ACサーボとインバータの両方でデータセンターと半導体向け需要を取り込み、利益率11.6%を保ちながら連結営業利益の72%を生む構造を作っています", "システムエンジニアリングは売上収益207億7800万円で11.2%増え、営業利益は34億8000万円で79.5%増えました。港湾クレーン関連の販売拡大と案件の採算改善が進み、モーションコントロール以外の事業でも利益を積み増す形を示しました", "営業活動によるキャッシュ・フローは456億2800万円で、前年同期の158億400万円から増えました。フリー・キャッシュ・フローは159億8500万円の収入となり、営業利益が5.5%減った半年でも現金を生む力が強まった点が財務の支えです"], "summary": "僕は安川電機を、ACサーボとインバータのモーションコントロールと産業用ロボットを工場の設備投資へ売る会社として見ています。2026年3-8月期は売上収益2855億9800万円で前年同期比9.8%増となり、モーションコントロールの営業利益159億7300万円がロボット59億7400万円の2.7倍へ広がり、利益の重心が移りました。", "weakness": "弱点は利益がモーションコントロールの設備投資循環へ集中する構造です。同事業の営業利益159億7300万円は連結営業利益の72%を占め、需要を支える要素は半導体とデータセンター向け投資です。ロボットの営業利益率は5.0%まで下がり、自動車向けは欧州で慎重な投資姿勢が続き中国では前年同期の大口案件の反動が出ています。半導体とデータセンター向け投資が鈍れば高収益の柱が細り、ロボットでは補えず、下期に営業利益の61.6%を稼ぐ通期計画が崩れます。"}};

  var logo = d.logo ? '<span class="clogo"' + (d.logobg ? ' style="background:' + d.logobg + '"' : '') + '><img src="' + d.logo + '" alt="" onerror="this.parentNode.innerHTML=\'<span class=mono>' + esc(d.name[0]) + '</span>\'"></span>' : '<span class="clogo"><span class="mono">' + esc(d.name[0]) + '</span></span>';
  var chipCls = d.status === '確定' ? 'ok' : 'est';
  var deck = d.deck ? '<h2 class="sec">関連資料</h2><p class="body">この会社の企業資料は、決算のたびに更新しています。</p><p style="margin-top:12px"><a class="btn" href="' + d.deck + '">' + esc(d.name) + 'の資料を開く</a></p>' : '';
  var head = '<div class="cohead">' + logo + '<div><h1>' + esc(d.name) + ' の決算</h1><span class="dchip ' + chipCls + '">発表：' + esc(d.date) + '（' + esc(d.status) + '）</span></div></div>';
  var tail = '<p style="margin-top:34px"><a href="top.html#calendar">← 決算カレンダーへ戻る</a></p>';
  if (d.summary || d.numbers || d.strengths || d.weakness || d.next || d.sources) {
    var h = head;
    if (d.summary) h += '<h2 class="sec">事業の概要</h2><p class="body">' + esc(d.summary) + '</p>';
    if (d.numbers && d.numbers.length) {
      h += '<h2 class="sec">主要数字</h2><div class="numgrid">';
      d.numbers.forEach(function(n){
        h += '<div class="numcard"><div class="nl">' + esc(n.label) + '</div><div class="nv">' + esc(n.value) + '</div><div class="nn">' + esc(n.note) + '</div>' + (n.source ? '<div class="ns"><a href="' + esc(n.source) + '" target="_blank" rel="noopener">出典</a></div>' : '') + '</div>';
      });
      h += '</div>';
    }
    if (d.strengths && d.strengths.length) {
      h += '<h2 class="sec">強み</h2><ul class="slist">';
      d.strengths.forEach(function(s){ h += '<li>' + esc(s) + '</li>'; });
      h += '</ul>';
    }
    if (d.weakness) h += '<h2 class="sec">弱点</h2><div class="weakbox">' + esc(d.weakness) + '</div>';
    var nxt = d.next || d.focus;
    if (nxt) h += '<h2 class="sec">次に見る数字</h2><p class="body">' + esc(nxt) + '</p>';
    if (d.sources && d.sources.length) {
      h += '<h2 class="sec">出典一覧</h2><ul class="srclist">';
      d.sources.forEach(function(s){ h += '<li><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.title) + '</a></li>'; });
      h += '</ul>';
    }
    h += deck + tail;
    app.innerHTML = h;
  } else {
    app.innerHTML =
    head +
    '<h2 class="sec">見る数字</h2><p class="body">' + esc(d.focus) + '</p>' +
    '<h2 class="sec">決算の数字</h2><div class="empty">決算の発表後に、売上・利益・会社見通しなどの主要な数字をここへ出します。</div>' +
    '<h2 class="sec">答え合わせ</h2><div class="empty">前回の決算で宣言した「見る数字」と結果を、ここに並べます。</div>' +
    deck +
    tail;
  }
}
</script>
</body></html>
