source": "https://www.sec.gov/Archives/edgar/data/1368622/000110465926106304/avav-20260909xex99d1.htm", "value": "4億8050万ドル"}, {"label": "部門別売上（2027年度第1四半期）", "note": "Autonomous Systemsが売上全体の72%を占めます。粗利益は1億2460万ドルで粗利率は26%まで上がりました。前年同期の粗利率は21%でした。", "source": "https://www.sec.gov/Archives/edgar/data/1368622/000110465926106304/avav-20260909xex99d1.htm", "value": "Autonomous Systems 3億4600万ドル、Space Cyber and Directed Energy 1億3450万ドル"}, {"label": "受注と資金手当て済み受注残（2026年8月1日時点）", "note": "ブック・トゥ・ビルは1.4です。受注残は2026年4月30日時点の12億ドルから増え、前年同期比で37%増えました。", "source": "https://www.sec.gov/Archives/edgar/data/1368622/000110465926106304/avav-20260909xex99d1.htm", "value": "受注約7億ドル、資金手当て済み受注残15億ドル"}, {"label": "純損失と調整後EBITDA（2027年度第1四半期）", "note": "純損失は前年同期6740万ドルから大きく縮みました。非GAAPの1株利益は0.59ドルです。損失には無形資産償却等の非現金費用4340万ドルが含まれます。", "source": "https://www.sec.gov/Archives/edgar/data/1368622/000110465926106304/avav-20260909xex99d1.htm", "value": "純損失510万ドル、調整後EBITDA 5340万ドル"}, {"label": "会社見通し（2027年度通期）", "note": "会社は第1四半期決算で通期見通しを据え置きました。GAAP純利益の見通しは1000万ドルから2700万ドルです。", "source": "https://www.sec.gov/Archives/edgar/data/1368622/000110465926106304/avav-20260909xex99d1.htm", "value": "売上21億2500万ドルから22億2500万ドル、調整後EBITDA 3億500万ドルから3億2500万ドル"}], "sources": [{"title": "AeroVironment Announces Fiscal 2027 First Quarter Results（2026年9月9日、SEC Form 8-K Exhibit 99.1）", "url": "https://www.sec.gov/Archives/edgar/data/1368622/000110465926106304/avav-20260909xex99d1.htm"}], "status": "確定", "strengths": ["資金手当て済み受注残が15億ドルまで積み上がり、前年同期比37%増で売上の先行指標が厚くなりました", "Autonomous Systems売上が3億4600万ドルへ伸び、無人機と徘徊型兵器の出荷が成長を作りました", "純損失が前年同期6740万ドルから510万ドルへ縮み、買収直後の費用負担が軽くなりました"], "summary": "AeroVironmentは小型無人機Switchblade等の徘徊型兵器と宇宙・サイバー・指向性エネルギー事業を持つ米防衛企業です。BlueHalo買収後に規模が拡大し、2027年度第1四半期売上は4億8050万ドルへ増えました。僕は資金手当て済み受注残15億ドルの中身を見ます。", "weakness": "GAAP基準では依然として赤字です。第1四半期の営業損失は1090万ドルで、BlueHalo買収に伴う無形資産償却等の非現金費用4340万ドルが利益を押し下げ続けています。調整後EBITDAも5340万ドルと前年同期5660万ドルを下回りました。"}, "alphabet": {"date": "2月3日", "deck": null, "focus": "Google Cloudの伸びが続くかと、2027年の設備投資の規模", "logo": "../assets/logos/alphabet.svg", "name": "Alphabet", "next": "次はGoogle Cloudの伸びが続くかと、TPUシステム販売の寄与の大きさ、2027年の設備投資の規模を見ます。", "numbers": [{"label": "売上（2026年7-9月期）", "note": "13四半期連続の2桁増収です。年換算で5,000億ドル規模の売上になりました。", "source": "https://www.sec.gov/Archives/edgar/data/1652044/000165204426000080/googexhibit991q32026.htm", "value": "1,275億7,700万ドル（前年同期比25%増）"}, {"label": "Google Cloud売上（2026年7-9月期）", "note": "営業利益は111億2,100万ドルで営業利益率36.2%まで上がりました。TPUシステムの販売も売上に寄与したと会社は説明しています。", "source": "https://www.sec.gov/Archives/edgar/data/1652044/000165204426000080/googexhibit991q32026.htm", "value": "307億900万ドル（前年同期比103%増）"}, {"label": "Google Cloud受注残（2026年9月末）", "note": "うち55%強を今後24ヶ月で売上に変える見込みと会社は示しています。契約の積み上がりがCloudの伸びを裏付けます。", "source": "https://www.sec.gov/Archives/edgar/data/1652044/000165204426000080/googexhibit991q32026.htm", "value": "5,610億ドル"}, {"label": "設備投資とフリーキャッシュフロー（2026年7-9月期）", "note": "営業キャッシュフロー422億9,000万ドルを設備投資が上回りました。通期の設備投資見通しは1,950億〜2,050億ドルで据え置いています。", "source": "https://www.sec.gov/Archives/edgar/data/1652044/000165204426000080/googexhibit991q32026.htm", "value": "設備投資513億6,000万ドル、フリーキャッシュフローはマイナス90億7,000万ドル"}], "sources": [{"title": "Alphabet 2026年7-9月期決算リリース（SEC Form 8-K Exhibit 99.1、2026年10月28日）", "url": "https://www.sec.gov/Archives/edgar/data/1652044/000165204426000080/googexhibit991q32026.htm"}], "status": "見込み", "strengths": ["Google Cloudが103%増の307億900万ドルで、営業利益率も36.2%まで上がりました。規模の拡大と利益率の改善が同時に進んでいます。", "検索売上が633億5,000万ドルと12%増え、検索クエリの伸び率は5年ぶりの高さと会社は示しています。本業の広告がCloud投資の原資を生んでいます。"], "summary": "僕はAlphabetを、検索と YouTube の広告を土台に、Google Cloudと自社チップのTPUでAI基盤を売る会社として見ています。2026年7-9月期はCloud売上が前年同期の2倍になり、受注残は5,610億ドルまで膨らみました。一方で設備投資が営業キャッシュフローを上回り、現金収支はマイナスです。", "weakness": "弱点は現金収支です。フリーキャッシュフローはマイナス90億7,000万ドルで2四半期連続のマイナスになりました。純利益も262億ドルと25%減りました。株式投資の評価損87億ドルが主因で、本業の営業利益405億8,000万ドル（30%増）とは分けて見る必要があります。"}, "amazon": {"date": "2月4日", "deck": null, "focus": "会社見通しの売上2,400億〜2,470億ドルと営業利益、AWSの伸び", "logo": "data: dnightの飛行へ進みました", "AndurilのOmen向けにエンジンとバッテリーを納入し、パワートレインで初の売上を作りました", "流動性が約14億ドルあり、Boeingからの事業取得が完了すれば年間2億ドル超の売上を持つInsituが加わります"], "summary": "Archer Aviationは電動垂直離着陸機Midnightでエアタクシーを目指し、防衛向け事業も広げる会社です。2026年第3四半期に売上510万ドルを計上し、AndurilのOmen向けエンジンの初納入が売上を作りました。僕は売上よりも費用と現金の減り方を見ます。純損失は2億7460万ドルまで広がりました。", "weakness": "費用の拡大に対して売上が小さい点です。第3四半期の売上は510万ドルで、GAAP営業費用は2億9430万ドルに達しました。純損失は前年同期1億2990万ドルから2億7460万ドルへ広がり、第4四半期の調整後EBITDA損失見通しも1億8500万ドルから2億500万ドルと拡大します。型式認証の完了とBoeingからの事業取得の完了がどちらも残ります。"}, "arista": {"date": "2月11日", "deck": null, "focus": "第4四半期の売上ガイダンス39億〜40億ドルと、2027年の売上成長38〜40%見通しの裏付け", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAACjElEQVRYhe3VTahVVRgG4OfapVshGjipIzVoIsYtCBdFaoFIDYMgqKGD0tWPKEGKqCTK1UQxqaBV0MBBEOFAImdG6HiF/VizGogcHVgKUfbnvQ32ubd1/u45+yg46L6wB+vd3/q+b7/fWu9mAQu4xRgbaVeIi7Afr+I6puR0aJRUi0ZqgE3YjsVYioNCfGqURPUVCHE5vm8VLvETHpbTb3XS1VMgRHi3R3F4AHtq5avdAM+2nn7YKsRVdRIOP4IQl6qkX16wJ1RqrCu4s3hUTv8Mk7aOAgc6il9V3YKIPwr+Ebw+bNLbhooKcS3e067YZjmd1sw/a4QZrC/erdEIn2rmXwalHqxAiBP4oCP2S3xUrA/j22J9F5IQB454mBFsx4PF+ndslNPMHJPTXypvuF7ErceGQcnnH0GIK/Exxgt2p5w+74pt5gsaYRkeK9i1GuGYZu7rDf0VqOw2YaJgv8Lb87S8C+eL9TIcbflHT4z3fcOLeLKDO4uX50l4Da/hs4J7QaVit2r6+UCI9+IH3D1Pg72wA2/hEzxf8OcxKadfOzd0j6D6undGKP4djsgJtqK8gvdjqtemXmfgGTxXs/g0Yus2kNMlbOuIeUWIj3dubB9BiEtwDvcV7EkcG9DAFTmd6sg1hi+02/Q5rJprVPchnOoofgUvyenigAa6kdOMECO+xp0tdlLlK/tmw/7zgUqe97WrskVOp2sXn0Vl09PabXq1RjiumS8zewZCvF233Z7Rbrej4jC+KdYT+LDlM3MF38BDRdCf2CSn6Rsun9Pf2Kjdpp9occaEuEI1pzuKgDfltPeGi5cI8Si2FMxVTI6r/vPXWg/8iIM3tXiF3Xga9xTcvj6xC/gf4V+FyprKnnJOwgAAAABJRU5ErkJggg==", "name": "Arista", "next": "第4四半期売上が見通し39億〜40億ドルに届くかと、2027年売上約185億ドルの見通しを支える受注と粗利率の推移を見ます。", "numbers": [{"label": "売上（2026年第3四半期）", "note": "前年同期比58.5%増、前四半期比20.5%増で、上場以来で最も高い前年同期比の伸びです。会社見通しの約33億ドルを10.8%上回りました。", "source": "https://investors.arista.com/Communications/Press-Releases-and-Events/Press-Release-Detail/2026/Arista-Networks-Inc--Reports-Third-Quarter-2026-Financial-Results/default.aspx", "value": "36億5760 ー省を含む25件を超える新規契約を取りました", "通期売上見通しを1億5000万ドルから1億6500万ドルへ引き上げ、現金と投資3億9897万5000ドルを持ちます"], "summary": "BigBear.aiは米政府と防衛向けにAIソフトウェアを売る会社です。2026年第3四半期の売上は4358万1000ドルで前年同期から31%増えました。僕は受注残3億3000万ドルのうち資金手当て済みの比率を見ます。売上の伸びと巨額の減損が同じ四半期に出ました。", "weakness": "のれん減損の繰り返しと受注残の資金手当てです。第3四半期に7673万7000ドルののれん減損を出し、9か月累計の純損失は1億7436万6000ドルまで広がりました。受注残3億3000万ドルのうち資金手当て済みは約23%にとどまり、残りは予算の成立とタスクオーダーの発注を待つ状態です。調整後EBITDAも908万ドルの損失が続きます。"}, "blackrock": {"date": "1月中旬", "deck": null, "focus": "運用資産残高と資金流入の持続、iSharesなどETFの伸び", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAMAAAAoLQ9TAAAAaVBMVEUAAAD///8FBQUCAgIDAwMBAQF3d3fw8PAJCQn5+fltbW1nZ2d6enqWlpYcHBzh4eG4uLixsbHNzc1ERETb29u/v7/FxcXo6OhPT08iIiI5OTlZWVlLS0stLS0TExOsrKzS0tI7OzugoKAD5e8vAAAAmklEQVQYlU2P2xKDIBBDE8AiXlHbaqVW7f9/ZEFgpnnJTGY3ZxeAKIMEIAt4CVSm11rfbV2iuIKGZnw8Z3JQIRG4UXeQqiUXqBS8vK2GN295QsD9T7y3te5pRe4wDLIfSKTA7sNozLGGJFNw9jzCJYmignPyrRnrL46YtKLQjZzD6lX6bdtdk1UsbSJWD9P1nMRWO+eWs4v//wBt2QbpD1wsfQAAAABJRU5ErkJggg==", "name": "BlackRock", "next": "次は運用資産残高と純流入の持続、iSharesを含むETFへの流入額、調整後営業利益率47.8%の維持を見ます。", "numbers": [{"label": "売上（2026年7-9月期）", "note": "基本報酬の自力成長と運用資産の平均残高拡大と成功報酬とテクノロジー収入の増加が重なりました。GAAP営業利益は23億2800万ドルで19%増えました。", "source": "https://s24.q4cdn.com/856567660/files/doc_financials/2026/Q3/BLK-3Q26-Earnings-Release.pdf", "value": "77億5200万ドル（前年同期比19%増）"}, {"label": "運用資産残高（2026年9月末）", "note": "平均運用資産残高は15兆4601億ドルで19%増えました。過去12か月の純流入は8690億ドルで、年率換算の基本報酬成長は10%です。", "source": "https://s24.q4cdn.com/856567660/files/doc_financials/2026/Q3/BLK-3Q26-Earnings-Release.pdf", "value": "15兆4883億ドル（前年同期比15%増）"}, {"label": "純流入（2026年7-9月期）", "note": "長期商品への流入が1748億ドル、キャッシュ運用への流入が307億ドルです。顧客別ではETFへの流入が1345億ドルと最大で、年率換算の基本報酬成長は11%に達しました。", "source": "https://s24.q4cdn.com/856567660/files/doc_financials/2026/Q3/BLK-3Q26-Earnings-Release.pdf", "value": "2055億ドル"}, {"label": "テクノロジー収入（2026年7-9月期）", "note": "Aladdinと複合商品の需要が伸びを支えました。成功報酬は6億3000万ドルです。基本報酬と証券貸付収入の合計は60億3600万ドルでした。", "source": "https://s24.q4cdn.com/856567660/files/d ", "url": "https://www.sec.gov/Archives/edgar/data/1065059/000162828026070229/ex991-10q2026_11x04.htm"}], "status": "見込み", "strengths": ["条件付きを含む濃縮の受注残が54億ドルまで積み上がり、Piketon増設の需要側の裏付けが厚くなりました", "遠心分離機の製造を終えて出荷を始め、重要サプライチェーンの契約も年末目標より約2か月早く固めました", "現金22億3610万ドルを持ち、PiketonとOak Ridgeの増設投資を進める資金を持ちます"], "summary": "Centrusは低濃縮ウランを電力会社へ売り、米エネルギー省向けに高濃縮のHALEUを濃縮する会社です。2026年第3四半期の売上は5550万ドルで前年同期から26%減りました。僕は受注残70億ドルのうち条件付きの54億ドルが実売上へ変わる条件を見ます。", "weakness": "受注残の条件依存と当期売上の減少です。受注残70億ドルの大半を占める54億ドルは運転マイルストーンの達成を条件とする条件付きコミットメントで、実売上へ変わるにはPiketonの生産能力の建設が要ります。第3四半期の売上は26%減り、粗損失は1060万ドルまで広がりました。技術ソリューション受注残の中心を占めるHALEU運転契約について、エネルギー省は追加オプションを行使しない意向を示し、2027年度の政府予算案にも運転資金が入っていません。"}, "circle": {"date": "2月下旬", "deck": null, "focus": "USDC流通量の伸びと、金利低下局面での準備金収入とRLDCマージンの維持", "logo": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5OjcBCgoKDQwNGg8PGjclHyU3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3N//AABEIAIAAgAMBEQACEQEDEQH/xAAbAAADAQADAQAAAAAAAAAAAAAABQYEAQIDB//EADkQAAIBAgIGBwcEAgIDAAAAAAECAwAEBREGEiExQVEiYXGBkbHREyMyQlLB4RRyofBi8UNTFTNj/8QAGgEAAgMBAQAAAAAAAAAAAAAAAAQCAwUBBv/EAC0RAAICAgECBgEDBAMAAAAAAAABAgMEERIhMQUiMkFRYRMjcaEzQrHhkcHw/9oADAMBAAIRAxEAPwD7jQAUAFABQBju8RtrTZI+b/Qu0/ipxrlLsLXZVVPqfX4FE+OzvmII1jHM9I1aqUu5m2eJWP0LX8mJ726k+O4l7myHgK7xj8Cksm6XeTPIuzfEzHtNcKnJvuwV2X4WYdhqDBSa7M0R3t1H8E8nec/OoMujk3R7SZtgxqZCBMiyDmNhqI3X4lYvWt/wNbXELe52I2T/AENsP5rmzSpyqrfS+vwa66MBQAUAFABQAUAdJZEiQvIwVFGZJ4V1Jt6RGUlFcpPSJ7EMZkmzjtc44/r+ZvSmoUJdZGLk+ISn5a+i/n/Qqq0zgFRYHpHG8hyjRn/aCarb0SjCUvStmhcOvG3W79+yoOSL1iXv+1g2HXi7Tbvl1bahtA8S9f2s8XR4zlIjKeTAiosplGUfUtHFQZw5qADSxxZ4skuM3T6uI9aFLXc0cfPlDy2dV/I8ikWVA8ZDKdxFWGxGUZrlF9DvQSCgAoA6SyJFG0kjBUUZknhXUm3pEZSUU5S7IlMSxB76TIZrCp6K8+s0/XUoL7PPZWVK+X0YxU2KGmysp7xsol6I3u2wCqpzUe4xRj2XPyofWmC20ORlzmccW3eFKytkzXp8Pqh6urGSqFGSgADcBVY8kktI5oOhQBwyhhkwBHIig40mtMTYtaWcMWv/AOuQ/Cq/MeyhmXmUUQjy7P6E1VmSc1FnShwa2kt4GMuwucwnKpwWkbmDTKqDcvf2GNTHgoAKAJnH 利費用8億4600万ドル"}, {"label": "稼働電力と契約済み電力（2026年9月30日時点）", "note": "稼働電力は年初から倍増しました。会社は2026年末に1.85GW超の稼働を見込み、通期売上見通しを130億から133億ドルへ引き上げました。", "source": "https://www.sec.gov/Archives/edgar/data/1769628/000176962826000461/coreweave3q26earningspress.htm", "value": "稼働1.7GW超、契約済み4.6GW超"}], "sources": [{"title": "CoreWeave Reports Strong Third Quarter 2026 Results（2026年11月10日、SEC提出の決算リリース）", "url": "https://www.sec.gov/Archives/edgar/data/1769628/000176962826000461/coreweave3q26earningspress.htm"}], "status": "見込み", "strengths": ["受注残1325億ドルが複数年の売上基盤になります。基盤モデル提供企業の上位10社のうち9社が顧客です", "調整後EBITDAマージン62%を保ちながら売上を前年同期比168%伸ばしました", "顧客前払いと預り金で今後3か月に約90億ドルの入金を見込み、契約裏付けの資金調達と組み合わせます"], "summary": "CoreWeaveはAI向けGPUクラウドを専業で提供し、基盤モデル開発企業とハイパースケーラーへ計算資源を貸し出します。僕は受注残1325億ドルと稼働電力1.7GW超の差に注目します。契約済み電力4.6GW超のうち稼働分は4割弱にとどまり、売上への転換速度が事業の成否を決めます。", "weakness": "金利負担が利益を上回ります。2026年7-9月期の純金利費用8億4600万ドルに対して営業利益は2億700万ドルで、純損失は7億900万ドルまで広がりました。2026年10-12月期の金利費用見通し10億5000万から11億5000万ドルも重く、通期設備投資370億から390億ドルを借入で支える期間が続きます。"}, "corning": {"date": "1月27日", "deck": null, "focus": "Q4見通しのコア売上高52億〜53億ドルとコアEPS0.96〜1.00ドル、光通信の伸びを見る", "logo": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMT03Ojo6Iys/RD89QzQ5Li0BCgoKDQwNGg8PGislHyU3Nzc3Nzc3KzcrNzc3Nys3NzcrKzcrKysrKysrNzc3NysrKysrKzcrNysrKysrKysrK//AABEIABAAEAMBIgACEQEDEQH/xAAWAAEBAQAAAAAAAAAAAAAAAAAEBgL/xAAhEAACAAYCAwEAAAAAAAAAAAABAgADBBESEzFxIUNRBf/EABQBAQAAAAAAAAAAAAAAAAAAAAX/xAAXEQADAQAAAAAAAAAAAAAAAAACESEA/9oADAMBAAIRAxEAPwBq1FOKaUNMm+tfWPnUS/685KitdpaqFUYjEAcRqbWnUqq3nEDqA3FuYdAFcEZub//Z", "name": "Corning", "next": "第4四半期のコア売上が見通し52億〜53億ドルに届くかと、光通信以外の部門、とりわけ太陽光部門の利益転換が進むかを見ます。", "numbers": [{"label": "コア売上（2026年第3四半期）", "note": "前年同期比19%増でSpringboard計画の開始以来で最も高い伸びです。GAAP売上は48億5500万ドルでした。年率換算の売上は203億ドルと、2026年末に200億ドルとする従来目標を前倒しで超えました。", "source": "https://s203.q4cdn.com/212458750/files/content_files/Corning-Incorporated-Third-Quarter-2026-Earnings-Release-with-Financials-2026-10-27.pdf", "value": "50億8100万ドル"}, {"label": "光通信部門の売上（2026年第3四半期）", "note": "前年同期比44%増です。コア売上の前年同期からの増加8億900万ドルのうち7億2700万ドルを光通信が担いました。部門の純利益は5億3200万ドルと前年同期比80%増です。", "source": "https://s203.q4cdn.com/212458750/files/content_files/Corning-Incorporated-Third-Quarter-2026-Earnings-Release-with-Financials-2026-10-27.pdf", "value": "23億7900万ドル"}, {"label": "企業向けネットワーク売上（2026年第3四半期）", "note": "生成AI向け製品の売上は前年同期の2倍超に伸びました。金額の内訳は開示されていません。", "source": "https://s203.q4cdn.com/212458750/files/content_files/Corning-Incorporated-Third-Quarter-2026-Earnings-Release-with-Financials-2026-10-27.pdf", "value": "前年同期比84%増"}, {"label": "コアEPS（2026年第3四半期）", "note": "前年同期比36%増です。コア純利益は7億9500万ドル、コア営業利益率は22.7%と前年同期の19.6%から上がりました。", "source": "https://s203.q4cdn.com/212458750/files/content_files/Corning-Incorporated-Third-Quarter-2026-Earnings-Release-with-Financials-2026-10-27.pdf", "value": "0.91ドル"}, {"label": "会社見通し（2026年第4四半期コア売上）", "note": "コアEPSは0.96〜1.00ドルの見通しです。前年同期比では売上約19%増、EPS約36%増に相当します。", "source": "https://s203.q4cdn.com/212458750/files/content_files/Corning-Incorporated-Third-Quarter-2026-Earnings-Release-with-Financials-2026-10-27.pdf", "value": "52億〜53億ドル"}], "sources": [{"title": "Corning 2026年第3四半期決算発表（2026年10月27日）", "url": "https://s203.q4cdn.com/212458750/files/content_files/Corning-Incorporated-Third-Quarter-2026-Earnings-Release-with-Financials-2026-10-27.pdf"}], "status": "見込み", "strengths": ["光通信部門の純利益が前年同期比80%増の5億3200万ドルと、売上の伸びを上回る速度で利益が増えました。企業向けネットワークの売上は84%増です。", "コア営業利益率は22.7%まで上がり、売上年率換算203億ドルと自社計画の目標を前倒しで達成しました。"], "summary": "Corningは光ファイバーと特殊ガラスの会社です。2026年第3四半期は光通信部門の売上が前年同期比44%増の23億7900万ドルまで伸び、コア売上全体の増加分の約9割を担いました。生成AI向け製品の売上は前年同期の2倍超で、僕は同社をAIデータセンターの光接続を担う素材側の銘柄として見ています。", "weakness": "伸びの出どころが光通信に集中しています。コア売上の増加8億900万ドルのうち7億2700万ドルが光通信部門で、他部門の伸びは限られました。GAAP売上48億5500万ドルとコア売上50億8100万ドルの差も大きく、会社調整後の数字に依存する度合いが高い状態です。"}, "crowdstrike": {"date": "12月1日", "deck": null, "focus": "純新規ARRガイダンス3.43億〜3.47億ドルの達成と、通期見通しの再上方修正があるか", "logo": "data:image/png;base64,iVBORw0 ww.sec.gov/Archives/edgar/data/1408710/000140871026000041/fn-20260925.htm", "value": "7億7713万ドル"}, {"label": "GAAP純利益（2027年度第1四半期）", "note": "希薄化EPSは2.86ドルです。非GAAP純利益は1億5740万ドル（EPS 4.34ドル）でした。売上51%増に対してGAAP純利益の伸びは8%にとどまります。", "source": "https://www.sec.gov/Archives/edgar/data/1408710/000140871026000034/fn-20261102xex991q127.htm", "value": "1億350万ドル"}, {"label": "GAAP粗利率（2027年度第1四半期）", "note": "粗利益は1億7380万ドルです。前年同期の11.9%からほぼ横ばいで、受託製造の薄い利益率が続いています。", "source": "https://www.sec.gov/Archives/edgar/data/1408710/000140871026000034/fn-20261102xex991q127.htm", "value": "11.8%"}, {"label": "会社見通し（2027年度第2四半期売上）", "note": "非GAAP EPSは4.77〜4.92ドル、GAAP EPSは3.81〜3.96ドルの見通しです。", "source": "https://www.sec.gov/Archives/edgar/data/1408710/000140871026000034/fn-20261102xex991q127.htm", "value": "16億〜16億5000万ドル"}], "sources": [{"title": "Fabrinet 2027年度第1四半期決算リリース（Form 8-K Exhibit 99.1、2026年11月2日）", "url": "https://www.sec.gov/Archives/edgar/data/1408710/000140871026000034/fn-20261102xex991q127.htm"}, {"title": "Fabrinet Form 10-Q（2027年度第1四半期、2026年11月3日提出）", "url": "https://www.sec.gov/Archives/edgar/data/1408710/000140871026000041/fn-20260925.htm"}], "status": "見込み", "strengths": ["データセンター、通信インフラ、自動車・産業の3部門すべてが前年同期比で増収となり、データセンター向けは77.6%増の7億7713万ドルに達しました。", "設備投資は四半期で1億5870万ドルと前年同期の4527万ドルから3.5倍に増やし、生産能力の増強を先に進めています。"], "summary": "Fabrinetはタイを拠点に光部品と精密機器の受託製造を行う会社です。2027年度第1四半期の売上は前年同期比51%増の14億7450万ドルと過去最高になり、データセンター向けが売上の52.7%を占めました。僕は増収の持続力と、受託製造ゆえの薄い利益率がどこまで改善するかを見ています。", "weakness": "利益率の薄さが構造的な課題です。GAAP粗利率は11.8%と前年同期の11.9%から改善せず、売上51%増に対してGAAP純利益は8%増の1億350万ドルにとどまりました。現金と短期投資も四半期で約1億1930万ドル減って約7億5575万ドルになっています。"}, "fanuc": {"date": "1月下旬", "deck": null, "focus": "FA部門の受注（7〜9月は過去最高）の持続と、上方修正した通期計画への進捗", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAYAAADDPmHLAAApv0lEQVR42u2dd5iU1fXHP/e+7zt9dmcLS1EBkWIBY28/uyaYxNiNDXuIBXtFjQULKhas0WCLJhpbYo01xkRDYokaDRoLVkRg68zs9Jn33t8fdxZYtzCzhV10z/MMyOPMvHfu+d7Tz7mi8Q00Q/S9JTm0BUMAGKIhAAzR95Xs7+oPEwIEFP9YQVq3/7vD54p/9OSzQwAYQG sc/58010/140120261106567992.pdf", "value": "576億1800万円"}, {"label": "光ソリューション（2026年4-9月期）", "note": "売上は内部取引を含み前年同期から43.9%増えました。営業利益は前年同期の7億円から大きく増え、全部門で最大の利益源になりました。", "source": "https://www2.jpx.co.jp/disc/58010/140120261106567992.pdf", "value": "売上1309億1200万円、営業利益236億円"}, {"label": "情報コンポーネント（2026年4-9月期）", "note": "売上は内部取引を含み23.2%増え、営業利益は142.1%増えました。", "source": "https://www2.jpx.co.jp/disc/58010/140120261106567992.pdf", "value": "売上1189億2600万円、営業利益151億6800万円"}, {"label": "通期予想の上方修正（2026年11月9日発表）", "note": "経常利益の予想は1550億円、純利益の予想は1180億円です。上期の営業利益576億1800万円に対して下期に783億8200万円を積む計画です。", "source": "https://www2.jpx.co.jp/disc/58010/140120261106567992.pdf", "value": "売上1兆5700億円、営業利益1360億円"}], "sources": [{"title": "古河電気工業 2027年3月期第2四半期決算短信（2026年11月9日、JPX TDnet開示）", "url": "https://www2.jpx.co.jp/disc/58010/140120261106567992.pdf"}], "status": "見込み", "strengths": ["光ソリューションの営業利益が7億円から236億円へ増え、情報コンポーネントも151億6800万円まで伸びました", "売上と営業利益が上期として過去最高となり、通期予想を売上1兆5700億円と営業利益1360億円へ引き上げました", "営業キャッシュフロー286億9200万円を確保し、自己資本比率は39.7%まで上がりました"], "summary": "古河電気工業は光ファイバーと光部品と電線と自動車用電装品を作ります。僕は光関連2部門の利益が全体をどこまで押し上げたかを見ます。2026年4-9月期の売上は7376億9100万円で前年同期から20.8%増え、営業利益は576億1800万円で201.1%増えました。光ソリューションの営業利益は前年同期の7億円から236億円へ増え、会社は売上と利益の両方が上期として過去最高と説明します。", "weakness": "純利益の中身です。上期の純利益587億8100万円には政策保有株式の売却による投資有価証券売却益227億7700万円を含みます。営業利益の中心も光関連2部門に寄り、金属ソリューションは売上2375億3100万円に対して営業利益30億5200万円にとどまります。光部品の需要が一服すると利益の階段が止まります。"}, "galaxy-digital": {"date": "3月下旬", "deck": null, "focus": "データセンター部門の調整後EBITDAとCoreWeave向け賃料収入の拡大", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAACpklEQVRoge3ZO4hUVxjA8d8cF42LKEGMwfiIGi00wvpA7UQbjUpAfISAYNJaiWBrYxOwELtACgliEUih2KjYChauig/iC5KYqIXiZgk+4mPX4htfk9nduTOzc2bAP5zq3AP/757vnHvOd0saZxw+x1IswwLMwMf4CIN4ioe4jSs4hwv4E8+b4FCYEqbje/yKP8qSgzW2J7iFI/gWn7ZSfjb24je8KCA9VHuGi9iDz0ZTfCJ2lsUHmiBe2V6WA9mB7mbLL8JR8baaLV4tvQ5jXjPEE77G9RaIV7YLWDOSYGmEvi34AVPFFLeSMWKX2o2TQz00VAAJX4npfCTeSA5KmCTW3OkiAzfhPOaOglRRlojFvbrWAT24iTuYM0pSRejBP+KFfjHSw5NwTKTMX9 とステーブルコインと米国債で49億ドル、株主資本30億ドル"}], "sources": [{"title": "Galaxy Announces Third Quarter 2026 Financial Results（2026年10月27日、SEC提出の決算リリース）", "url": "https://www.sec.gov/Archives/edgar/data/1859392/000185939226000108/glxy-20260930xpressrelease.htm"}], "status": "見込み", "strengths": ["Helios第1期133MWの賃料が通期で入り、データセンター部門の調整後EBITDAが6900万ドルまで育ちました", "運用とステーキングの資産合計が104億ドルへ46%増え、平均融資残高も増えました", "手元流動性49億ドルと株主資本30億ドルを確保し、Helios第2期260MWの建設資金として35億ドルの債券発行を終えました"], "summary": "Galaxy Digitalは暗号資産の取引と資産運用と融資を手がけ、テキサスのHelios拠点をCoreWeaveへ貸すデータセンター事業を第2の柱に育てます。僕は調整後EBITDA4億5500万ドルの出所を見ます。うち3億9500万ドルが財務と自社保有分の評価を含む部門で、本業のデジタル資産部門は900万ドルのマイナスです。", "weakness": "利益の8割超が評価に連動する部門から出た点です。調整後EBITDA4億5500万ドルのうち財務と自社保有分が3億9500万ドルを占め、前四半期は同部門の粗利益が4200万ドルのマイナスでした。本業のデジタル資産部門は取引量が増えても調整後EBITDAが2四半期連続のマイナスで、価格変動で利益が反転する構造が残ります。"}, "globalfoundries": {"date": "2月10日", "deck": null, "focus": "第4四半期の売上ガイダンス20億ドルと粗利率31.5%の達成、シリコンフォトニクスの需要", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAMAAAD04JH5AAAAh1BMVEX/////YBL/UgD/6+L/8Of/cTf/6OL/VwD/WwD/vKn/0Lr/4dT/bij/mHL/+vf/g0j/p4T/5tr/vJz/q4r/tZb/nHP/x7H/8+3/djT/wa3/ZxT/aR3/oX3/jGP/ilr/18j/lmn/kmL/fT3/wqX/fET/r4j/qoH/glX/0MD/dkL/i1T/uJ7/spl4oF09AAADMUlEQVR4nO2a23aqMBBAo2CTgkWQm4pVvLWe6v9/30GrcskAxjOE8zD7pa41XZlNTEImkTGCIAiCIAiCIIjncZ74F5Bb6B9Se+t3300nBpjTnvvLTWpePkfbiczWzVJ7h2kQvZre8kcDzrkYAgKGu0qyEB9dBd6HQoZ/ZAJhdIg21ivZ41PWvhhckAXs7fAWuwnwgYzIBKLdPFraqXp6x9rnbVYFPHcg7rEWgdN0fv4wV+qPv89TSALeohBrETA2O+MQTlXzr2ei2FJZIBDFYIsAsw67L181/zQp5S8LBOVYmwCLbXAONREOKy0VBYJKqlYBdSKppYKAJSoxfAG7mqIo4EkxdAEvaRBwVlIQW8BJ5fy5QCQHsQWO1QFYFHC23QvMgA54CFiAHbJABDX0EPgG7HAFYijFQ8AcATFcATuB8t8FgCGILVBd5koCzhKK4goAozwXiCed94ABzcFcYAbFUAWgaZYLGOAAQRWYwkPgJvAGRtv2hEocmgXA/vkVMCwIWzE/C+Ex+IQAEvAypFFAftlqFuj9K3h9EMY2hPJutGYlfkJgvhjLJEvlhehlAXAhUl8HTFwB7JeRDoFT3wLrvgWMfcOWTIdAzUTUKMDAd75OgV19XaBHIB7XlmZ6BLLitGcBqDjSK8C++haIw2prmgWY81MZiLoFssk4AI7pdAqw46LYYg8CzPQLZ0V9CGSl+lJw0adAtiYFM36tsbRtyWTsqfu52i/MNgGkTSmIExu/NZ6GbXkzGgoTEvgPBBzwoMGKtQkw4KSlcR0Qf1CmWk7DWTEs8I2bn1X 善が利益率を作りました", "TSMCと20億ドルの複数年製造契約を結び、Malta工場でCoWoS向けシリコンインターポーザの米国内供給を担います", "米日イニシアチブでMalta敷地の新ファブ2棟の技術提供と運営を担い、最大210億ドルの資金枠を持つ計画に参加しました"], "summary": "GlobalFoundriesは顧客の半導体を受託製造するファウンドリです。2026年第3四半期の売上は18億9900万ドルで前年同期から13%増えました。僕は通信インフラとデータセンター向けの伸びがスマートモバイルの減少を上回る構図を見ます。", "weakness": "スマートモバイルの減少と政府株式発行の費用です。IFRSでは2億7000万ドルの純損失となり、米政府への株式発行に伴う4億4100万ドルの非現金費用が利益を消しました。会社は追加発行に伴う費用の時期と金額を見通しに入れておらず、今後の四半期もIFRS利益がぶれます。営業キャッシュフローは前年同期5億9500万ドルから3億4100万ドルへ減りました。"}, "harmonic-drive": {"date": "2月10日", "deck": null, "focus": "上方修正した通期予想（売上高780億円・営業利益102億円）への進捗と、受注の勢いが続くか", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAM0lEQVQ4jWNgGGjAyLjg+H9sEv8TLBlRFOJQx0SpCwbeAKL8iQ6Qw2fgvUB5GIymg0EAADPFEOT9DwTfAAAAAElFTkSuQmCC", "name": "ハーモニック・ドライブ", "next": "次に見る数字は2026年10-12月期の受注高と中国向け売上です。受注の伸びが2四半期続くかと、通期営業利益予想102億円へ下期に必要な59億9500万円の進捗を確認します。", "numbers": [{"label": "売上（2026年4-9月期）", "note": "前年同期から29.8%増えました。純利益は29億8600万円で前年同期から841.8%増えました。", "source": "https://www2.jpx.co.jp/disc/63240/140120261106567186.pdf", "value": "361億2400万円"}, {"label": "営業利益（2026年4-9月期）", "note": "前年同期の4億6500万円から9.0倍へ増え、営業利益率は1.7%から11.6%へ上がりました。", "source": "https://www2.jpx.co.jp/disc/63240/140120261106567186.pdf", "value": "42億500万円"}, {"label": "受注高（2026年4-9月期）", "note": "前年同期から70.7%増えました。売上361億2400万円を大きく上回り、下期の売上の土台になります。", "source": "https://www2.jpx.co.jp/disc/63240/140120261106567186.pdf", "value": "503億8600万円"}, {"label": "製品別売上（2026年4-9月期）", "note": "減速装置は26.2%増えて売上の76.5%を占めます。メカトロニクス製品は43.0%増えました。半導体製造装置向けと産業用ロボット向けが伸びました。", "source": "https://www2.jpx.co.jp/disc/63240/140120261106567186.pdf", "value": "減速装置276億3600万円、メカトロニクス製品84億8700万円"}, {"label": "通期予想の上方修正（2026年11月11日発表）", "note": "従来予想の売上745億円と営業利益85億円から引き上げました。年間配当の予想も20円から28円へ増やしました。", "source": "https://www2.jpx.co.jp/disc/63240/140120261106567176.pdf", "value": "売上780億円、営業利益102億円"}], "sources": [{"title": "ハーモニック・ドライブ・システムズ 2027年3月期第2四半期（中間期）決算短信〔日本基準〕（連結）（2026年11月11日、JPX TDnet開示）", "url": "https://www2.jpx.co.jp/disc/63240/140120261106567186.pdf"}, {"title": "ハーモニック・ドライブ・システムズ 通期業績予想の修正並びに配当予想の修正に関するお知らせ（2026年11月11日、JPX TDnet開示）", "url": "https://www2.jpx.co.jp/disc/63240/140120261106567176.pdf"}], "status": "見込み", "strengths": ["受注が70.7%増えて503億8600万円に達し、売上の1.4倍の受注を上期に確保しました", "半導体製造装置向けと産業用ロボット向けの両方で売上が伸び、営業利益率が11.6%まで戻りました", "北米が売上71億3900万円と利益5億300万円で黒字へ移り、日本の利益47億2100万円と合わせて地域の分散が進みました"], "summary": "ハーモニック・ドライブ・システムズは波動歯車装置の減速機で世界首位級のシェアを持ち、産業用ロボットと半導体製造装置へ組み込まれます。僕は受注の伸びと利益率の戻りを見ます。2026年4-9月期の売上は361億2400万円で前年同期から29.8%増え、営業利益は42億500万円で前年同期の4億6500万円から9.0倍へ増えました。受注は503億8600万円で70.7%増えました。", "weakness": "中国向けの弱さと下期への偏りです。中国は売上22億4500万円で1.4%減り、利益は2億2000万円で25.0%減りました。上期の営業利益42億500万円は上方修正後の通期予想102億円に対して41.2%の進捗で、下期に59億9500万円を積む必要があります。受注の伸びが半導体とロボットの設備投資に寄る分、顧客の投資計画の変更が受注へ直結します。"}, "honeywell": {"date": "1月下旬", "deck": null, "focus": "分社化後初の2027年通期ガイダンスと、航空宇宙部門のアフターマーケット需要", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPoAAAAtCAMAAACwCYaYAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAALcUExURQAAAN4eNN4fNN4eNN8eM+McOd8eNL8AQN4dNd4fNN4eM94eNd4eNN4eNN4eNN4eNd8dM9gnO9sbN98dMt4eM94eNN8cM9UrK94hMd8eNN0eM90dNN4eNN4eNN4eNN8eNd0bNv8AAN4cNN8eNd8fNN0eM94fNN4eNN8fNd8dNeMcOd8gNd8fNN4eNN4eNN4eNN4hNt0eNN4eNdskN94fNd4eNN8dNN0cN98dNN4fNN4eNd4fNNkaM94eNN0eNN0fNN0eM98gMN0fNNskJOEeLd0eM94fNN4eNN4fNNweNN4dNd4eNN4eNN4eNN4eNP8AAN0fNd4eNN4eNN0dNdwfNd4eNN0fM+AfM94eNN0eNN4eNd4dM94eNN4eNNUVK94eNN0dM94eNNwaNeIdMd0eNN4eNOAfNt4eNN8eNN4eNN0dM94eNN8eNd0dNd4eNN8gQN0dNt0dNN4eNd4fNN4eNN4eNN4eNOAfNN4eM94eNN4eNN0fM90eM90eNd4eM94dNN4eNNwjLt4eNN8eNN4eNN4dM94eNOQbNt0fNN8eM94eNN0cM94eNMwzM94fNN4eM+AfNtseNd8eNd8eNd4cMt0eNN8gNd4eNN8eNN0eNd8gM98eNN8fNN8cNd4eNN0eM90fNN0dM94eNN4eNN4fM+AfNN8eM90dNN4dNN0dNd0eNd4fNN0eM94eNNsYMd0iM90iM+YaM+AfM90fNP8AVd8dNN4dNN4dM94eNOEeNd4eNd8dNd4dNd4eNd4fM+gXLt8cNd0eNNweMt4eNN4eNd4fNN8eNN4dNd8gMt4eM94eNN8dNN4eNN4eNN4fM94eNd8eM98dNd4fM90eNN0eMt8gOOAfM9wcMtwfMt4dNNwdNN4dNN4eNN8eNd4hN94eNOMcOd4dNN8dM94eNN4dNN4eNeEeN94eNN8gNN4fM94eNN4eNd4fNOAfMt4dNN4eM94eNN ll.com/us/en/news/press-releases/2026/10/honeywell-technologies-reports-third-quarter-results-raises-full-year-2026-outlook", "value": "部門利益10億6200万ドル、調整後EPS 2.27ドル"}, {"label": "キャッシュフロー（2026年第3四半期）", "note": "継続事業の営業キャッシュフローは前年同期23億600万ドルから74%減りました。フリーキャッシュフローは15%増えました。", "source": "https://www.honeywell.com/us/en/news/press-releases/2026/10/honeywell-technologies-reports-third-quarter-results-raises-full-year-2026-outlook", "value": "営業キャッシュフロー6億700万ドル、フリーキャッシュフロー6億8800万ドル"}, {"label": "会社見通し（2026年通期）", "note": "オーガニック成長率の見通しを4%から5%へ引き上げました。部門利益率は約20.5%と、従来見通しの上限へ届く見込みです。第4四半期のオーガニック成長率は5%から6%を見込みます。", "source": "https://www.honeywell.com/us/en/news/press-releases/2026/10/honeywell-technologies-reports-third-quarter-results-raises-full-year-2026-outlook", "value": "売上200億ドルから201億ドル、調整後EPS 8.40ドルから8.45ドル"}], "sources": [{"title": "Honeywell Technologies Reports Third Quarter Results, Raises Full-Year 2026 Outlook（2026年10月22日）", "url": "https://www.honeywell.com/us/en/news/press-releases/2026/10/honeywell-technologies-reports-third-quarter-results-raises-full-year-2026-outlook"}, {"title": "Honeywell Technologies 2026年第3四半期決算資料（SEC Exhibit 99）", "url": "https://www.sec.gov/Archives/edgar/data/773840/000077384026000141/exhibit99-q32026earningsre.htm"}], "status": "見込み", "strengths": ["部門利益率が21.3%まで上がり、分離に伴う残存コストの削減と価格施策が利益を作りました", "3部門すべてがオーガニックで増収となり、受注残が約190億ドルまで増えました", "通期の調整後EPS見通しを8.40ドルから8.45ドルへ引き上げました"], "summary": "Honeywellは2026年に航空宇宙事業を分離し、残った自動化事業がHoneywell Technologiesとして独立しました。2026年第3四半期の売上は49億9400万ドルで、継続事業ベースの前年同期から報告で1%増、オーガニックで7%増えました。僕は分離後の利益率の改善を見ます。部門利益率は21.3%まで上がりました。", "weakness": "報告売上の伸びと営業キャッシュフローです。売上は報告ベースで1%増にとどまり、産業自動化は事業売却で23%減りました。継続事業の営業キャッシュフローは6億700万ドルと前年同期から74%減りました。独立会社としての管理コストも残り、部門利益の改善が現金へ変わるかを確認する必要があります。"}, "hyundai": {"date": "1月28日", "deck": null, "focus": "生産正常化と新車で販売が回復するか。営業利益率と米関税の影響、2027年見通しを見る", "logo": "../assets/logos/hyundai.svg", "name": "Hyundai", "next": "次に見る数字は2026年10-12月期の卸売台数と営業利益率です。韓国生産の正常化で台数が戻るかと、修正後の通期営業利益率5.5%から6.5%への到達を確認します。", "numbers": [{"label": "売上（2026年7-9月期）", "note": "前年同期から3.4%減りました。純利益は1兆9320億ウォンで24.2%減りました。", "source": "https://www.hyundai.com/worldwide/en/newsroom/detail/0000001298", "value": "45兆1100億ウォン"}, {"label": "営業利益（2026年7-9月期）", "note": "前年同期から5.5%増え、営業利益率は5.9%で0.5ポイント上がりました。", "source": "https://www.hyundai.com/worldwide/en/newsroom/detail/0000001298", "value": "2兆6770億ウォン"}, {"label": "卸売台数（2026年7-9月期）", "note": "前年同期から11.3%減りました。韓国は13万1468台で27.2%減り、ストライキが生産と販売を抑えました。韓国以外は78万9242台です。", "source": "https://www.hyundai.com/worldwide/en/newsroom/detail/0000001298", "value": "92万710台"}, {"label": "ハイブリッド車販売（2026年7-9月期）", "note": "前年同期から3.8%増え、販売構成比は18.2%へ2.7ポイント上がりました。電動車全体は24万5540台で構成比26.7%です。", "source": "https://www.hyundai.com/worldwide/en/newsroom/detail/0000001298", "value": "16万7414台"}, {"label": "通期ガイダンス修正（2026年10月29日発表）", "note": "従来の卸売目標415万8300台と営業利益率6.3%から7.3%を引き下げました。自動車部門の投資計画も17兆8000億ウォンから16兆ウォンへ減らしました。", "source": "https://www.hyundai.com/worldwide/en/company/ir/notices/view-0000000382-en-10-1-", "value": "卸売目標400万台、営業利益率5.5%から6.5%"}], "sources": [{"title": "Hyundai Motor 2026年第3四半期業績発表（2026年10月29日、公式ニュースルーム）", "url": "https://www.hyundai.com/worldwide/en/newsroom/detail/0000001298"}, {"title": "Hyundai Motor IR開示（2026年10月29日、通期ガイダンス修正）", "url": "https://www.hyundai.com/worldwide/en/company/ir/notices/view-0000000382-en-10-1-"}], "status": "見込み", "strengths": ["卸売台数が11.3%減る四半期でも営業利益を5.5%増やし、利益率を5.9%へ上げました", "ハイブリッド車の販売が3.8%増えて構成比18.2%まで上がり、電気自動車の落ち込みを補います", "米国でのシェア6%台を6四半期連続で保ち、四半期配当2500ウォンを維持しました"], "summary": "Hyundai Motorは韓国最大の自動車メーカーで、内燃機関車とハイブリッド車と電気自動車を世界で販売します。僕は販売台数の落ち込みと利益率の釣り合いを見ます。2026年7-9月期の売上は45兆1100億ウォンで前年同期から3.4%減り、卸売台数は92万710台で11.3%減りました。営業利益は2兆6770億ウォンで5.5%増え、利益率は5.9%です。", "weakness": "韓国生産の乱れと通期目標の引き下げです。韓国の卸売台数はストライキで27.2%減り、純利益は24.2%減の1兆9320億ウォンとなりました。会社は通期の卸売目標を415万8300台から400万台へ、営業利益率の案内を6.3%から7.3%から5.5%から6.5%へ下げ、米国の関税負担と生産正常化の遅れが数字に残ります。"}, "ibm": {"date": "1月27日", "deck": null, "focus": "2027年の見通しを会社がどう示 動性5440万ドルで2027年のNRE回収まで届くかを見ます。", "weakness": "自動車顧客が量産開始時期を2027年へずらした影響が直撃しました。第3四半期売上は1210万ドルへ減り、粗利益はマイナス124万1000ドルへ転落しました。流動性は5440万ドルまで減り、四半期の純損失1959万5000ドルに対して余裕は限られます。通期売上目標の引き下げ幅も大きく、Percizの売上比率は約6%から7%の目標にとどまります。"}, "intel": {"date": "1月28日", "deck": null, "focus": "Q4見通しの売上高150億〜160億ドルへの着地と、18Aとファウンドリの進捗、2027年見通しを見る", "logo": "../assets/logos/intel.svg", "name": "Intel", "next": "次は第4四半期売上が見通し150億〜160億ドルに届くかと、ファウンドリ営業損失の縮小幅、Intel 18Aと14Aの顧客獲得の開示、2027年見通しの水準を見ます。", "numbers": [{"label": "売上（2026年7-9月期）", "note": "会社見通しを売上と粗利率とEPSの全項目で上回りました。営業利益は25億2200万ドルで、前年同期の6億8300万ドルから増えています。", "source": "https://www.sec.gov/Archives/edgar/data/50863/000005086326000188/q326earningsrelease.htm", "value": "165億1300万ドル（前年同期比21%増）"}, {"label": "データセンター・AI売上（2026年7-9月期）", "note": "部門営業利益は30億3900万ドルです。CFOのDavid Zinsner氏はデータセンター売上の伸びが15年ぶりの高さと説明しました。Xeonの供給拡大が次の四半期の売上を左右します。", "source": "https://www.sec.gov/Archives/edgar/data/50863/000005086326000188/q326earningsrelease.htm", "value": "73億1800万ドル（前年同期比78%増）"}, {"label": "クライアント・フィジカルAI売上（2026年7-9月期）", "note": "部門営業利益は22億8500万ドルです。メモリ不足とPC市場の減速で前年同期を下回り、会社はPCの減速が2027年前半まで続く見方を示しました。", "source": "https://www.sec.gov/Archives/edgar/data/50863/000005086326000188/q326earningsrelease.htm", "value": "80億9700万ドル（前年同期比5%減）"}, {"label": "ファウンドリ売上と営業損失（2026年7-9月期）", "note": "売上にはグループ内取引を含み、相殺前の金額です。前年同期の営業損失23億2100万ドルからは縮みました。Intel 14Aの設計キット0.9版を10月に公開した点も会社は示しました。", "source": "https://www.sec.gov/Archives/edgar/data/50863/000005086326000188/q326earningsrelease.htm", "value": "売上66億9700万ドル（前年同期比58%増）、営業損失18億5300万ドル"}, {"label": "会社見通し（2026年10-12月期の売上）", "note": "非GAAPのEPS見通しは0.25ドル、非GAAP粗利率見通しは38.0%です。第3四半期の非GAAP粗利率44.1%と非GAAP EPS 0.52ドルから大きく下がる前提を会社自身が置きました。", "source": "https://www.sec.gov/Archives/edgar/data/50863/000005086326000188/q326earningsrelease.htm", "value": "150億〜160億ドル"}], "sources": [{"title": "Intel 2026年第3四半期決算発表（SEC Form 8-K Exhibit 99.1、2026年10月29日）", "url": "https://www.sec.gov/Archives/edgar/data/50863/000005086326000188/q326earningsrelease.htm"}], "status": "見込み", "strengths": ["データセンター・AI部門の営業利益が30億3900万ドルに達し、製品事業全体の営業利益53億2400万ドルを支えました。", "非GAAP粗利率は44.1%まで上がり、前年同期の40.0%から4.1ポイント改善しました。営業キャッシュフローは51億ドルを生みました。"], "summary": "IntelはPC向けCPUとサーバー向けCPUを売り、半導体製造を外部顧客へ開くファウンドリ事業を育てる会社です。2026年7-9月期はサーバー向けが伸びを決め、データセンター・AI売上は前年同期比78%増の73億1800万ドルまで拡大しました。一方でファウンドリ部門は18億5300万ドルの営業損失を出し、僕は製品事業の利益で製造事業の損失をどこまで埋められるかを見ています。", "weakness": "弱点はファウンドリ部門の損失と第4四半期見通しの落差です。ファウンドリは四半期で18億5300万ドルの営業損失を出し、第4四半期の非GAAP粗利率見通しは38.0%と第3四半期の44.1%から6.1ポイント下がります。クライアント売上の減速が2027年前半まで続く見方を会社が出した点も重なります。"}, "intuitive-machines": {"date": "3月下旬", "deck": null, "focus": "通期売上ガイダンス9.2億〜9.5億ドルの着地と、受注残19億ドルの収益化ペース", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAMAAAD04JH5AAAAYFBMVEUBWaMAWaP///8AV6IAVKAAUp/6/P0AUJ4ATZ3z9/qzzeO/1efj7fUAXKXW5PDL3eyJsdNDgLeoxt+fwNx8qc84fbfs8/iSuNcUY6gfba4AR5pfl8Uud7RJiL1pnMdTj8GITyi7AAAErUlEQVR4nO2af5OjIAyGVQSVX6Kiwhb1+3/Lg7a7t+1qb6AHNzdj/NcZXx+SkASyPPu3z7+3k8BJ4CRwEjgJnAROAieB/5BAXla1s6qqYAmSE8gAUGPnbDRaKwYASEogB4BthDtr8Sy30UnI3/ElP72AabPMxc0QaiZO5kWVIBmBSq095sU3Q9RJqMN9wUtvXhqMih/WipGFeoKflXptdwQU07BY54hPANRi2vu+XQh+UTA+AfAx73/fGl9ZGZ/ACwEF34L8wI9ALZpDAUXfBeVFTx94IaDpWUBW9CVwvARFQZcQN/D0gRffL1Bv/CPBk8BKCMHt0TrQLWBT8NOrtNZs4wcL0Qy6jErg9j4cyYEA1HbQm4GfXrf7V4cCCnTxjgN/y6tudz+4mlTeW4LvmuUvBQyjb23wlwmQDcYnABeOjhRwWUUnkEEjcDvtC5hE7ZsMvQlkNhmYC9kX0AwJCOQZhAbvC0B9/CjIXDboDgQUfR6fQPZSQO2bC8MJcDwLMT8W6UW7aD8GoQRI0crF9mZmkQ9ZYeovys8LAgkQvn7UsCxhXV4eQhJhDZMQoLKuSyeAyUcB3FTRCVzDkM5rN47dOjxVB9TUsQncE9HU4r5/yokT5XSsIxOA+jgVt0JOXUwCrtywBUlztBnhixMQkQDImMqPK6Ji7tbIBNgmxECPvl+IUVInIBqBUtne6EVzIsxNQDQCpZpfNGe2JjQzj+oDfxKwdoSYKiIB+FpAc9nooGFMAvqVANRuollZzN3wDwKIwLzzrIl8fWAl7WFziiiahOesyNMA0924Pym7Kih4xzyLQj8Cbij7ojcsptl3duxvoDKHqRD1SxW/Ks5YJ8iuhKk3XtVQGIEst4z13rwOkS7yjOj2ADVucq8zamZd+fP0VwzN3PK9gmSSnkkwjIBrzw9CIGReHKD4MAzpolL4wLEAbgKmxUEEDpaA264sAQF3aiGsSYGfPJH47YOhBNyo7pputXgUgHoQcmLgrznPGWPKbM8Jmc6l95w0iIBdgnkeCH8+veEy+nmBe0BZGzztjcnaS8j5oa+BXKltvx4gWwoCpdpmQvcF2GIsPgGoBD0YU+Ix6Oj 体で提供します。僕は売上構成の入れ替わりを追います。AIクラウド売上が2億ドルへ増える一方でマイニング売上は2800万ドルまで減り、全体の88%をAIクラウドが占めました。", "weakness": "目標時期の後ずれと巨額の設備投資です。年換算売上40億ドル超の稼働目標は2026年末から2027年1月へ移り、顧客要望の設計変更と供給側の都合で2月末まで延びる可能性を会社が示しました。2027会計年度の残り設備投資は約150億ドル規模で、純損失2億6300万ドルを抱えたまま建設を進めます。"}, "john-deere": {"date": "11月25日", "deck": null, "focus": "2027年度見通しで農業サイクルの底打ちを裏付けるか。大型農機の需要と精密農業の伸びを見る", "logo": "../assets/logos/john-deere.svg", "name": "John Deere", "next": "次に見る数字は2026年11月25日の第4四半期決算で、通期純利益が見通し47億5000万ドルから50億ドルへ届くかと、2027年度の生産と精密農業の見通しです。大型農機の小売販売が底を打つかも確認します。", "numbers": [{"label": "売上と収益（2026会計年度第3四半期、8月2日終了）", "note": "前年同期から5%増えました。機械の売上は109億9900万ドルで6%増えました。純利益は13億7900万ドルで1株あたり5.10ドル、前年同期から7%増えました。", "source": "https://www.sec.gov/Archives/edgar/data/315189/000110465926098904/de-20260820xex99d1.htm", "value": "126億800万ドル"}, {"label": "生産と精密農業の売上（2026会計年度第3四半期）", "note": "前年同期から6%減りました。出荷台数の減少が理由です。営業利益は5億2700万ドルでした。小型農業と芝生向けの売上は33億8300万ドルで12%増えました。", "source": "https://www.sec.gov/Archives/edgar/data/315189/000110465926098904/de-20260820xex99d1.htm", "value": "39億9800万ドル"}, {"label": "建設と林業の売上（2026会計年度第3四半期）", "note": "前年同期から18%増えました。営業利益率は7.7%から12.1%へ上がりました。インフラとデータセンターとエネルギー向けの需要と出荷増が売上を作りました。金融サービスの収益は13億7100万ドルで3%減りました。", "source": "https://www.sec.gov/Archives/edgar/data/315189/000110465926098904/de-20260820xex99d1.htm", "value": "36億1800万ドル"}, {"label": "会社見通し（2026会計年度通期純利益）", "note": "従来見通しの下限を引き上げました。第3四半期の結果には関税還付約1億1000万ドルが含まれます。経営陣は2026年を農業機械の下降局面の底と説明しました。9か月累計の純利益は38億800万ドルで前年同期から4%減りました。", "source": "https://www.sec.gov/Archives/edgar/data/315189/000110465926098904/de-20260820xex99d1.htm", "value": "47億5000万ドルから50億ドル"}], "sources": [{"title": "Deere Reports Third Quarter Net Income of $1.379 Billion（2026年8月20日、SEC Exhibit 99.1）", "url": "https://www.sec.gov/Archives/edgar/data/315189/000110465926098904/de-20260820xex99d1.htm"}], "status": "確定", "strengths": ["建設と林業の売上が18%増え、営業利益率が12.1%まで上がりました", "小型農業と芝生向けの売上が12%増え、農業部門の中でも伸びる領域を示しました", "通期純利益見通しの下限を47億5000万ドルへ引き上げました"], "summary": "Deereは農業機械と建設機械を作り、金融サービスも担う会社です。2026会計年度第3四半期の売上と収益は126億800万ドルで前年同期から5%増えました。僕は部門で動きが分かれた点を見ます。建設と林業が18%増えた一方で、主力の生産と精密農業は6%減りました。", "weakness": "主力部門が減収の点です。生産と精密農業の売上は39億9800万ドルで6%減り、出荷台数の減少が続きました。第3四半期の利益には関税還付約1億1000万ドルが含まれ、還付を除いた利益の伸びは小さくなります。9か月累計の純利益も38億800万ドルと前年同期から4%減りました。"}, "kawasaki-hi": {"date": "2月上旬", "deck": null, "focus": "航空宇宙の下期の利益と防衛関連の売上、通期の事業利益予想1,850億円への進捗", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAMAAAD04JH5AAAAb1BMVEX////mABL3sLXmAA3oIyz+9vfkAADmAAjqQkr93+H/+/z3qrD4ub795ObuXmf5vsL+8fPoHSjsUFj6yc38z9P96uzwcXj82NvrLj33pKvzkpjsQ1DoABzqJTbzgIjtV2Hyh43rO0XuZ27yeIH0mZ4KUUmNAAACV0lEQVR4nO2Y3babIBBGVXRQoyIa4080apL3f8aa9qzTroYA50hWe/Hte4Y9OMKA5wEAAAAAAAAAAAAAAAAA/wvpIdAjIkOEUhgi/MEhfRoeUahFVolBIArOUh/jN+NzNhExLRSbBDyvjg1BPoNNKgFfC7cQ8IKQ6aN8QBfVJ3Ag0FTcZn4m6+exTgTK2WoF6FS+SaCNbQT4JBRjXQikd2khwPxFsQBOBMRqtQBFqxrsQECcreaPFRXoRCDrbH4BClUF4ECguZEhwgNG6/FFgH0CTdaRxfpzf34ZZYdAmmeFb5E+Z+vSvMzhuwJpXveFtEifUXgSzzvwLoG0abPh2vkW0/Nt+ux1+l8XiPJj1i/XamJkrH3Gidal1k5vIbDWeZK0bS2yw7CcimqdpM+5KXdGRLw7BbmpnTEK+GPXddMUjttqfmCcfSOsbv2x0Xz6L6zAsWyavD3WIuiHy2k+d3I0LsEY34LEmLydwN9F+Cj/yxyHm4RuGBFbb1miOn52CvykbIOl6EZtIW41yLuLyA3f4dsbUZqL+3Uy7MOcZNG3WoU9W/HmMJyZPgCjsborz2EHAo/h7aHSFsMvhf51Lew+jtNkCA0xGJfFOw6jTwWxmjaT7ThWtyOumtLKuDeRVFzLnAl4wnwz4aHawI2AdzX3BbQqmzJHAnebxmRW/Y6OBAabxpAPiuPBjUA0WwhsB5silhuBfrS7HN7fJBBMltfzSnU93/tAkTbLaPlAwbnqgWLnE02ZzdL6iUYhsPuRqhSmCPpHKgAAAAAAAAAAAAAAAADgX/EDp1woln47Y9gAAAAASUVORK5CYII=", "name": "川崎重工", "next": "次に見る数字は通期の事業利益と営業キャッシュフローです。事業利益予想1850億円への到達と、上期に支出超過となった営業キャッシュフローが通期でプラスへ戻るかを確認します。", "numbers": [{"label": "受注高（2026年4-9月期）", "note": "売上収益1兆844億1900万円と並ぶ規模の受注を上期に確保しました。下期以降の売上の土台になります。", "source": "https://www.khi.co.jp/ir/pdf/sta_261110-1j.pdf", "value": "1兆412億円"}, {"label": "売上収益（2026年4-9月期）", "note": "前年同期から8.8%増えました。親会社株主に帰属する中間純利益は309億2200万円で40.0%増えました。", "source": "https://www.khi.co.jp/ir/pdf/sta_261110-1j.pdf", "value": "1兆844億1900万円"}, {"label": "事業利益（2026年4-9月期）", "note": "前年同期から106.8%増えました。 ource": "https://www.sec.gov/Archives/edgar/data/1321655/000132165526000045/a2026q3ex991pressrelease.htm", "value": "10億8,500万ドル（営業利益率47%）"}, {"label": "会社見通し（2026年10-12月期の売上）", "note": "通期見通しも85億3,000万〜85億3,400万ドルへ引き上げました。次期も高い成長率を会社自身が前提にしています。", "source": "https://www.sec.gov/Archives/edgar/data/1321655/000132165526000045/a2026q3ex991pressrelease.htm", "value": "26億4,900万〜26億5,300万ドル"}], "sources": [{"title": "Palantir 2026年7-9月期決算リリース（SEC Form 8-K Exhibit 99.1、2026年11月2日）", "url": "https://www.sec.gov/Archives/edgar/data/1321655/000132165526000045/a2026q3ex991pressrelease.htm"}], "status": "見込み", "strengths": ["米国商業売上が前年同期比148%増の9億8,400万ドルとなり、米国政府売上を初めて上回りました。売上の柱が政府から民間へ広がっています。", "GAAP営業利益率47%、調整後では62%です。売上96%増と高い利益率が同時に成立しています。"], "summary": "僕はPalantirを、政府機関と大企業の業務データをつなぎ、現場の意思決定に使う基盤を売る会社として見ています。主力はGothamとFoundryで、その上にAI基盤のAIPを重ね、米国政府と米国民間を中心に売上を伸ばしています。2026年7-9月期は四半期売上が初めて20億ドルを超え、米国商業売上が初めて米国政府売上を上回りました。", "weakness": "弱点は米国への集中です。米国売上が全体の84%を占め、米国外の売上は3億7,600万ドルにとどまります。米国商業の新規契約額の伸びが鈍れば、全体の成長率を支える柱が細ります。"}, "palo-alto": {"date": "11月18日", "deck": null, "focus": "会社見通しの売上33億ドルの達成と、次世代セキュリティの年間経常収益95億ドル台への到達", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAMAAABEpIrGAAABUFBMVEX////6WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC22yOx8AAAAb3RSTlMAAA2XD5UlBs/SC73iFQTR1cDkE8zNud8ataH0CsZWSX0FAlEf6WVa6mtAuA4DxFNBZjP32BLHV24u/dsMw1tv+Na3WTopyT3sXD7+cvXw8V10KCNkOC0hcCvzJDfvCCeuKvntGDAs5yAxvB4dvzxdnPHuAAAAAW9yTlQBz6J3mgAAAWFJREFUOMvVknlTwjAQxRMP8KxaD6pV8aj3bUUtXngWRUBRVA4FBAXP/f7/uWkTKOAH0J3pzK/vvU0yyRLyH4qWq6GxiVOzq6JWAu4WaG2zqB06OusDUhcAdEtIPQhyb21A6gNW/Z 確定", "strengths": ["次世代セキュリティARRが91億ドルへ63%増え、RPO212億ドルと合わせて契約基盤が厚くなりました", "基盤化した顧客が四半期で約220件増えて過去最高となり、Prisma AIRSのARRが提供開始から4四半期で1億ドルを超えました", "通期の調整後フリーキャッシュフローマージン38.4%を保ち、買収を進めながら現金を残しました"], "summary": "Palo Alto Networksはネットワーク防御とセキュリティ運用とアイデンティティを束ねる基盤化を進めます。僕は次世代セキュリティARRの伸びの中身を見ます。2026年5-7月期にARRは91億ドルへ63%増えました。買収したCyberArk等の寄与を含み、2027会計年度の成長案内は22から23%へ下がります。直近決算は2026会計年度第4四半期で、2027会計年度第1四半期の発表は2026年11月18日予定です。", "weakness": "成長率の鈍化とGAAP損失です。次世代セキュリティARRの伸びは今期63%から2027会計年度案内22から23%へ下がり、通期売上案内も141億から142億ドルで23から24%増にとどまります。今期は調整後純利益8億5300万ドルに対してGAAP純損失2億8200万ドルで、買収関連費用と株式報酬が利益を押し下げました。"}, "paypal": {"date": "2月上旬", "deck": null, "focus": "ブランドチェックアウトの取扱高成長と取引マージン、2027年ガイダンス", "logo": "../assets/logos/paypal.svg", "name": "PayPal", "next": "次はブランドチェックアウトの取扱高成長と取引マージンの伸び、純売上の成長率が戻るか、2027年ガイダンスの水準を見ます。", "numbers": [{"label": "純売上（2026年7-9月期）", "note": "取引売上は77億1100万ドルです。総取扱高6%増に対して売上は2%増にとどまり、取扱高1ドル当たりの売上率が下がりました。", "source": "https://www.sec.gov/Archives/edgar/data/1633917/000163391726000086/pypl3q-26earningsrelease.htm", "value": "85億8400万ドル（前年同期比2%増、為替中立ベース1%増）"}, {"label": "総取扱高（2026年7-9月期）", "note": "決済件数は68億件で7%増えました。有効口座数は4億4000万件で0.6%増にとどまります。口座当たりの年間決済件数は60.8件で6%増えました。", "source": "https://www.sec.gov/Archives/edgar/data/1633917/000163391726000086/pypl3q-26earningsrelease.htm", "value": "4871億3800万ドル（前年同期比6%増、為替中立ベース7%増）"}, {"label": "取引マージン（2026年7-9月期）", "note": "顧客残高への利息を除く取引マージンは36億6100万ドルで3%増えました。顧客残高への利息自体は2億8900万ドルと前年同期の3億2100万ドルから減りました。", "source": "https://www.sec.gov/Archives/edgar/data/1633917/000163391726000086/pypl3q-26earningsrelease.htm", "value": "39億5000万ドル（前年同期比2%増）"}, {"label": "営業利益とEPS（2026年7-9月期）", "note": "非GAAP純利益は12億4500万ドルと3%減りました。EPSの増加は第3四半期に28百万株を15億ドルで買い戻した株式数の減少が支えます。GAAP純利益は10億7300万ドルで14%減りました。", "source": "https://www.sec.gov/Archives/edgar/data/1633917/000163391726000086/pypl3q-26earningsrelease.htm", "value": "GAAP営業利益14億200万ドル（前年同期比8%減）、非GAAP EPS 1.45ドル（同8%増）"}, {"label": "会社見通し（2026年通期の非GAAP EPS）", "note": "従来見通しの約5.38ドルから引き上げました。通期の取引マージン見通しも引き上げ、GAAP EPS見通しは約5.07ドルで据え置きました。第4四半期の非GAAP EPS見通しは約1.43ドルです。", "source": "https://www.sec.gov/Archives/edgar/data/1633917/000163391726000086/pypl3q-26earningsrelease.htm", "value": "約5.60ドル"}], "sources": [{"title": "PayPal 2026年第3四半期決算発表（SEC Form 8-K Exhibit 99.1、2026年10月27日）", "url": "https://www.sec.gov/Archives/edgar/data/1633917/000163391726000086/pypl3q-26earningsrelease.htm"}], "status": "見込み", "strengths": ["取引マージンは39億5000万ドルと2%増え、利息を除くベースでは3%増えました。Venmoの加盟店取扱高が43%増えた点も会社は示しました。", "調整後フリーキャッシュフローは20億4700万ドルを生み、通期の非GAAP EPS見通しを約5.60ドルへ引き上げました。"], "summary": "PayPalは個人間送金Venmoと加盟店向け決済とブランドチェックアウトを束ねる決済会社です。2026年7-9月期は総取扱高が前年同期比6%増の4871億ドルまで伸びる一方、純売上の伸びは2%にとどまりました。僕は取扱高と売上の伸びの開きと、取引マージンの伸びを見ています。", "weakness": "弱点は売上の伸びの鈍さです。総取扱高が6%増える一方で純売上は2%増にとどまり、GAAP営業利益は8%減の14億200万ドル、GAAP営業利益率は16.3%まで下がりました。フリーキャッシュフローも17%減の14億3100万ドルです。有効口座数の伸びは0.6%まで鈍りました。"}, "qualcomm": {"date": "2月上旬", "deck": null, "focus": "データセンター向けカスタムチップ売上の初計上と、携帯電話向け売上の落ち込み幅", "logo": "../assets/logos/qualcomm.svg", "name": "Qualcomm", "next": "次はデータセンター向けカスタムチップ売上が初めて計上されるかと、携帯電話向け売上の落ち込み幅、2027年度第1四半期売上が見通し104億〜112億ドルに届くかを見ます。", "numbers": [{"label": "売上（2026年度第4四半期、2026年7-9月期）", "note": "非GAAP EPSは2.17ドルで前年同期比28%減りました。通期のGAAP売上は431億2000万ドルです。GAAP EPS 12.70ドルには評価性引当金の戻入による57億ドルの税務上の利益が含まれます。", "source": "https://s204.q4cdn.com/645488518/files/content_files/FY2026-4th-Quarter-Earnings-Release.pdf", "value": "GAAP 103億2200万ドル（前年同期比8%減）、非GAAP 104億4200万ドル（同7%減）"}, {"label": "携帯電話向け売上（同四半期）", "note": "半導体部門QCTの売上90億1500万ドルの57%を占めます。メモリ市場の需給ひっ迫でスマートフォン向けチップ需要が減った点を会社は説明しました。", "source": "https://s204.q4cdn.com/645488518/files/content_files/FY2026-4th-Quarter-Earnings-Release.pdf", "value": "51億3700万ドル（前年同期比26%減）"}, {"label": "自動車向け売上（同四半期）", "note": "四半期で初めて20億ドルに届く水準です。通期では60億400万ドルと前年比52%増え、年換算の売上ペースは約80億ドルまで上がりました。", "source": "https://s204.q4cdn.com/645488518/files/content_files/FY2026-4th-Quarter-Earnings-Release.pdf", "value": "19億9000万ドル（前年同期比89%増）"}, {"label": "ライセンス部門QTL売上（同四半期）", "note": "税引前利益率は70%で、半導体部門QCTの24%を大きく上回ります。AppleとHuaweiとTranssionとの長期ライセンス契約を更新した点を会社は発表しました。", "source": "https://s204.q4cdn.com/645488518/files/content_files/FY2026-4th-Quarter-Earnings-Release.pdf", "value": "13億400万ドル（前年同期比7%減）"}, {"label": "会社見通し（2027年度第1四半期の売上）", "note": "非GAAP EPS見通しは2.15〜2.35ドルです。経営陣は2027年度のデータセンター売上目標50億ドルを据え置き、非携帯分野の売上が前年比60%超伸びる見通しを示しました。", "source": "https://s204.q4cdn.com/645488518/files/content_files/FY2026-4th-Quarter-Earnings-Release.pdf", "value": "104億〜112億ドル"}], "sources": [{"title": "Qualcomm 2026年度第4四半期・通期決算発表（投資家向け資料、2026年11月4日）", "url": "https://s204.q4cdn.com/645488518/files/content_files/FY2026-4th-Quarter-Earnings-Release.pdf"}], "status": "見込み", "strengths": ["自動車向け売上が四半期で19億9000万ドルまで拡大し、自動車とIoTの合計売上は前年同期比36%増えました。", "ライセンス部門は売上13億400万ドルで税引前利益率70%を保ち、半導体部門の利益率低下を下支えしました。"], "summary": "Qualcommはスマートフォン向け半導体Snapdragonと通信特許のライセンスで稼ぎ、自動車とIoTとデータセンターへ広げる会社です。2026年度第4四半期（2026年7-9月期）は携帯電話向け売上が前年同期比26%減る一方、自動車向け売上は89%増の19億9000万ドルと初めて20億ドルに届く四半期になりました。僕は携帯電話向けの落ち込みを非携帯分野で埋め切れるかを見ています。", "weakness": "弱点は携帯電話向けへの依存と原価上昇です。携帯電話向け売上は前年同期比26%減の51億3700万ドルで、QCTの税引前利益率は29%から24%へ下がりました。ウエハ製造からメモリまで投入コストが上がり、価格転嫁の効果が粗利率へ出る時期は2027年度後半と会社は説明しました。"}, "rigetti": {"date": "3月3日", "deck": null, "focus": "通期売上見通し約2,000万ドルへの到達と、C-DACシステムの売上計上", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPoAAABXCAQAAACHZ5CGAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAACYktHRAD/h4/MvwAAAAd0SU1FB+oIFBUsAlnSclQAAAcHSURBVHja7Z15bFRFHMc/bUUqSKFIyyW0EaEEVKKIRBo0qBwBgRK0IRHREDXhCAkeoAKJIhFRTBBIaAwkkJQgRMIVS0AliAVKJUVtLKcQCEhpaUspUHpt/aMRoW/fMZ33trtvf9/9a2dmfzM7n/fmejO/B94phUbLz1hE3miGdc3HSg1FnwS6QBcJdJFAFwl0UYTqPqkCTxTHUPpxvyF8D+cd2+jKcDobQkvZFs5/3G6ePtq3yCdw1uQ/j3doIZEN1Ae18Jv2PL2+Ne/0Sz5FPpPVxGhZ6EIuad7Ve+v16SUc9yXyQazURA5rPUQOv7Qe9FU0+BL6POI0LQxkooflC7CytaDnsdynjfvIMLBgpWUcbR3oPzCW275Efj9J2jZ6ela6ej5hgbdTtnrOGsIqKGQTe2Xdw1Mb1w0130AJh1jLKa/n6ZfoIxP2VtFGNnp9ZYqisDkSCXSRQBeFnZwO5DoxOMjif3OV8/Nd39oxzjJ1Lpct43uQQhJtNf9hMb9axifyBN ckwell Automationは工場自動化の機器とソフトウエアとサービスを作る会社です。2026会計年度第4四半期の売上は23億3200万ドルで前年同期から1%増にとどまりました。僕は見かけの伸びの前提を見ます。顧客への関税還付プログラムが売上成長を約4ポイント下げ、実質のコア売上は7%増でした。", "weakness": "第4四半期の報告売上の伸びが1%にとどまる点です。顧客への関税還付引当8500万ドルが成長率を約4ポイント下げました。還付関連の純影響でEPSが0.11ドル押し上げられた分は一時的な金額です。ライフサイクルサービスは事業売却の影響で売上が9%減り、部門利益も1億ドルから8500万ドルへ減りました。"}, "samsung": {"date": "1月27日", "deck": null, "focus": "半導体部門の営業利益とHBMの供給進捗、1月下旬の取締役会で示す株主還元計画の中身", "logo": "../assets/logos/samsung.svg", "name": "Samsung", "next": "1月下旬の取締役会で示される株主還元計画の中身と、半導体部門の営業利益、HBMの供給進捗を見ます。", "numbers": [{"label": "売上（2026年第3四半期）", "note": "前年同期比127%増、前四半期比14%増です。4四半期連続で過去最高を更新しました。", "source": "https://images.samsung.com/is/content/samsung/assets/global/ir/docs/2026_3Q_conference_eng.pdf", "value": "195兆2532億ウォン"}, {"label": "営業利益（2026年第3四半期）", "note": "前年同期比783%増で、四半期の営業利益が100兆ウォンを超えたのは世界のテクノロジー企業で初めてです。営業利益率は55.0%、純利益は75兆1300億ウォンでした。", "source": "https://images.samsung.com/is/content/samsung/assets/global/ir/docs/2026_3Q_conference_eng.pdf", "value": "107兆4405億ウォン"}, {"label": "半導体（DS）部門の営業利益（2026年第3四半期）", "note": "グループ全体の営業利益の99.1%を半導体部門が稼ぎました。メモリ売上は140兆7000億ウォンと前年同期比427%増で、HBM4の売上は前四半期比で3倍超に伸びています。", "source": "https://images.samsung.com/is/content/samsung/assets/global/ir/docs/2026_3Q_conference_eng.pdf", "value": "106兆5000億ウォン"}, {"label": "設備投資計画（2026年通期）", "note": "うち半導体部門が76兆8000億ウォンです。第3四半期末のネットキャッシュは197兆6000億ウォンまで積み上がりました。", "source": "https://news.samsung.com/global/samsung-electronics-announces-third-quarter-2026-results", "value": "84兆4000億ウォン"}, {"label": "第3四半期配当", "note": "2026年の株主還元は総額90兆〜110兆ウォンの枠を示しました。ただし会社は残りの実行計画の確定を1月下旬の取締役会へ先送りしました。", "source": "https://news.samsung.com/global/samsung-electronics-announces-third-quarter-2026-results", "value": "1株4601ウォン（総額約30兆ウォン）"}], "sources": [{"title": "Samsung Electronics 2026年第3四半期決算説明会資料（公式IR、2026年10月29日）", "url": "https://images.samsung.com/is/content/samsung/assets/global/ir/docs/2026_3Q_conference_eng.pdf"}, {"title": "Samsung Electronics Announces Third Quar 粗損失755万5000ドルと純損失5923万ドルを計上しました。ソフトウェアサービス売上は顧客契約の終了で前四半期の93万3000ドルから25万3000ドルへ減り、台数を増やす費用が収益より先に膨らむ段階です。"}, "shopify": {"date": "2月中旬", "deck": null, "focus": "Q4売上ガイダンス（30%台前半の成長）の達成とGMV、FCFマージン", "logo": "../assets/logos/shopify.svg", "name": "Shopify", "next": "次は第4四半期の売上成長が会社見通しの30%台前半に届くかと、GMVの伸び、フリーキャッシュフローマージンの水準を見ます。", "numbers": [{"label": "売上（2026年7-9月期）", "note": "為替一定ベースでも32%増です。純利益は4億6200万ドルで、前年同期の2億6400万ドルから増えました。営業利益は5億6800万ドルです。", "source": "https://www.sec.gov/Archives/edgar/data/1594805/000159480526000067/exhibit991pressreleaseq320.htm", "value": "37億4200万ドル（前年同期比32%増）"}, {"label": "GMV（2026年7-9月期）", "note": "会社発表では1190億ドル規模と示しました。月次経常収益は2億3000万ドルです。GMVの伸びが加盟店ソリューション売上の土台になります。", "source": "https://www.sec.gov/Archives/edgar/data/1594805/000159480526000067/exhibit991pressreleaseq320.htm", "value": "1191億4500万ドル（前年同期比29.5%増）"}, {"label": "加盟店ソリューション売上（2026年7-9月期）", "note": "売上全体の78%を占めます。定期課金ソリューション売上は8億3600万ドルで20%増えました。決済の浸透が売上単価を押し上げます。", "source": "https://www.sec.gov/Archives/edgar/data/1594805/000159480526000067/exhibit991pressreleaseq320.htm", "value": "29億600万ドル（前年同期比35%増）"}, {"label": "粗利益（2026年7-9月期）", "note": "粗利率は47.6%で、前年同期の48.9%から下がりました。売上の32%増に対して粗利益の伸びが28%にとどまる点が第4四半期見通しにも表れます。", "source": "https://www.sec.gov/Archives/edgar/data/1594805/000159480526000067/exhibit991pressreleaseq320.htm", "value": "17億8100万ドル（前年同期比28%増）"}, {"label": "フリーキャッシュフロー（2026年7-9月期）", "note": "前年同期の5億700万ドルとマージン18%から増えました。第4四半期は売上成長を30%台前半、粗利益成長を20%台後半、フリーキャッシュフローマージンを前年同期並みとする見通しを会社は示しました。", "source": "https://www.sec.gov/Archives/edgar/data/1594805/000159480526000067/exhibit991pressreleaseq320.htm", "value": "8億1600万ドル（マージン22%）"}], "sources": [{"title": "Shopify 2026年第3四半期決算発表（SEC Form 8-K Exhibit 99.1、2026年11月3日）", "url": "https://www.sec.gov/Archives/edgar/data/1594805/000159480526000067/exhibit991pressreleaseq320.htm"}], "status": "見込み", "strengths": ["加盟店ソリューション売上が35%増の29億600万ドルまで伸び、GMV 1191億4500万ドルを売上へ変える力が強まりました。", "営業利益は5億6800万ドルと前年同期の3億4300万ドルから増え、フ weakness": "営業利益と純利益の差が大きい点に注意が必要です。純利益は営業外費用32兆6000億ウォンの計上で前四半期比58%減の39兆7756億ウォンにとどまりました。加えて今回の数値は監査前の速報値で、確定過程で変わる可能性があります。"}, "sofi": {"date": "1月29日", "deck": "deck-s.html", "focus": "手数料型収益の比率と技術基盤の口座数、貸し倒れ率と預金の伸び", "logo": "../assets/logo-s.svg", "name": "SoFi", "next": "次は通期見通しの調整後純売上50億4,000万ドルへの進捗と、手数料型収益の比率、技術基盤部門の口座数、貸し倒れ率と預金の伸びを見ます。", "numbers": [{"label": "純売上（2026年7-9月期、GAAP）", "note": "調整後純売上は13億7,100万ドルです。四半期で初めて14億ドルに届く規模になりました。", "source": "https://www.sec.gov/Archives/edgar/data/1818874/000181887426000065/a2026q3earningsrelease.htm", "value": "13億8,510万ドル（前年同期比44%増）"}, {"label": "会員数とプロダクト数（2026年9月末）", "note": "四半期で会員120万人、プロダクト220万件を純増させました。1人あたりプロダクト数は1.56件まで上がっています。", "source": "https://www.sec.gov/Archives/edgar/data/1818874/000181887426000065/a2026q3earningsrelease.htm", "value": "会員1,710万人（前年同期比35%増）、プロダクト2,670万件（同44%増）"}, {"label": "手数料型収益（2026年7-9月期）", "note": "金利に左右されにくい収益の比率が4割を超えました。収益の質を見るうえで僕が最も重視する数字です。", "source": "https://www.sec.gov/Archives/edgar/data/1818874/000181887426000065/a2026q3earningsrelease.htm", "value": "5億7,100万ドル（調整後純売上の42%）"}, {"label": "貸出実行額と預金（2026年7-9月期）", "note": "実行額は過去最高で、うち38億ドルは第三者向けのローンプラットフォーム経由です。預金の積み上がりが調達コストを支えます。", "source": "https://www.sec.gov/Archives/edgar/data/1818874/000181887426000065/a2026q3earningsrelease.htm", "value": "貸出実行額169億ドル、預金残高513億ドル"}, {"label": "純利益（2026年7-9月期）", "note": "前年同期の1億3,940万ドルから73%増えました。成長投資と黒字の両立が続いています。", "source": "https://www.sec.gov/Archives/edgar/data/1818874/000181887426000065/a2026q3earningsrelease.htm", "value": "2億4,100万ドル（希薄化後EPS 0.18ドル）"}], "sources": [{"title": "SoFi 2026年7-9月期決算リリース（SEC Form 8-K Exhibit 99.1、2026年10月27日）", "url": "https://www.sec.gov/Archives/edgar/data/1818874/000181887426000065/a2026q3earningsrelease.htm"}], "status": "見込み", "strengths": ["手数料型収益が調整後純売上の42%まで上がりました。貸出の金利収益だけに頼る構成から移りつつあります。", "会員1,710万人とプロダクト2,670万件が同時に過去最高です。新規会員の51%相当を既存会員の追加利用が占め、獲得効率も上がっています。"], "summary": "僕はSoFiを、借りる、貯める、使う、投資するを1つのアプリにまとめたデジタル金融の会社として見ています。銀行免許を持ち、預金で貸出原資を調達しながら、手数料型の収益を積み上げる構成へ移しています。2026年7-9月期は会員数とプロダクト数が過去最高を更新しました。", "weakness": "弱点は技術基盤（テクノロジープラットフォーム）部門です。売上は8,700万ドルと前年同期比24%減りました。大型顧客の移行が理由で、その顧客を除けば18%増と会社は説明しますが、外部向け基盤事業の顧客集中は数字に残っています。"}, "softbank-g": {"date": "2月中旬", "deck": null, "focus": "OpenAIなど投資先の評価損益の振れと、NAV・LTVの水準、財務費用の増減", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAMAAAAoLQ9TAAAABlBMVEX///+3u76+O9ITAAAAFUlEQVQYlWNgoApgRAJECgyQoQQAACdQAEkD2jHLAAAAAElFTkSuQmCC", "name": "ソフトバンクG", "next": "次は投資損益の振れと12月末時点のNAVとLTVの水準、財務費用の増減、OpenAIの評価額に変更が出るかを見ます。", "numbers": [{"label": "売上（2026年4-9月期）", "note": "ソフトバンク事業とAIコンピューティング事業が増収を担いました。税引前損益は4387億円の損失で、前年同期の3兆6864億円の利益から反転しました。", "source": "https://group.softbank/media/Project/sbg/sbg/pdf/ir/financials/financial_reports/financial-report_q2fy2026_01_ja.pdf", "value": "4兆2350億円（前年同期比13.3%増）"}, {"label": "投資利益（2026年4-9月期）", "note": "持株会社投資事業が1兆783億円、ビジョン・ファンド事業が7056億円です。Intel株式の投資利益1兆628億円が全体の62%を占めます。前年同期の3兆9267億円からは半分以下になりました。", "source": "https://group.softbank/media/Project/sbg/sbg/pdf/ir/financials/financial_reports/financial-report_q2fy2026_01_ja.pdf", "value": "1兆7258億円（前年同期比56.0%減）"}, {"label": "親会社の所有者に帰属する純損益（2026年4-9月期）", "note": "前年同期は2兆9241億円の利益でした。販売管理費2兆3688億円と財務費用7907億円とデリバティブ関連損失4333億円が投資利益を上回りました。", "source": "https://group.softbank/media/Project/sbg/sbg/pdf/ir/financials/financial_reports/financial-report_q2fy2026_01_ja.pdf", "value": "7680億円の損失"}, {"label": "OpenAIへの累計投資額と公正価値（2026年9月末）", "note": "評価額は前期末から変動しませんでした。2026年10月に残り100億ドルの追加出資を終え、累計投資額は646億ドル、持分比率は約13%になりました。", "source": "https://group.softbank/media/Project/sbg/sbg/pdf/ir/financials/financial_reports/financial-report_q2fy2026_01_ja.pdf", "value": "累計投資額546億ドル、公正価値996億ドル、累計投資利益450億ドル"}, {"label": "発電関連設備の損失（2026年4-9月期）", "note": "米国AIデータセンター向け発電関連設備の調達計画を変更した計上です。返金不能の前渡金に係る損失4570億円と契約変更に伴う損失1402億円で構成します。設備への支払累計は94億8000万ドルです。", "source": "https://group.softbank/media/Project/sbg/sbg/pdf/ir/financials/financial_reports/financial-report_q2fy2026_01_ja.pdf", "value": "5972億円"}], "sources": [{"title": "ソフトバンクグループ 2027年3月期第2四半期（中間期）決算短信（2026年11月10日）", "url": "https://group.softbank/media/Project/sbg/sbg/pdf/ir/financials/financial_reports/financial-report_q2fy2026_01_ja.pdf"}], "status": "見込み", "strengths": ["Intel株式で1兆628億円の投資利益を計上し、持株会社投資事業の投資利益1兆783億円を支えました。", "OpenAIの公正価値は996億ドルで累計投資利益450億ドルを保ち、300億ドルの追加出資を2026年10月に完了しました。DigitalBridgeの買収も9月30日に31億ドルで完了しました。"], "summary": "ソフトバンクグループはArmとソフトバンク株式会社とOpenAI等への投資を束ねる投資会社です。2026年4-9月期は投資利益が1兆7258億円残る一方、財務費用と発電関連設備の損失が上回り、親会社の所有者に帰属する純損益は7680億円の損失になりました。僕は投資利益の中身と費用の増加を分けて見ています。", "weakness": "弱点は費用と損失が投資利益を上回る構造です。財務費用は7907億円と前年同期の3400億円から2倍超に増え、発電関連設備で5972億円の損失を計上しました。投資利益1兆7258億円の62%をIntel株式1銘柄が占め、単一銘柄の株価で損益が大きく動きます。"}, "stryker": {"date": "1月下旬", "deck": null, "focus": "下方修正後の通期調整後EPS見通し（14.80〜14.90ドル）と2027年ガイダンス", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAMAAAD04JH5AAAAKlBMVEX8tBX8tBX7sxT8tBX8tBUAAAD/txVzUgnsqBO6hA/YmhInHANKNQaZbQxQpr1qAAAABHRSTlPB4KKF1WOWnQAABjtJREFUeJzFm9mi3CAIhk/bCSYu7/+6NWYREEk0Y45X7Szhyy8gkDk///4MXfbqAz9/PyPXYq4+MRIAPmHy8HsAMJtpclefGgeQ7P8mgPXTbwKAddMrADUfWzb70zQYAGyYJYawmx+sAMDip6DZnyaR71sAn2U1EbgJ2PxvOADsN+oWbmN+BWCLc5HgFQCw5jTiLLECbwCQfZ4MNfOKAsjROcErCpC7XEOh9p4d5wNVguyeIwHObH8sHAoIYGQeWAgAvtdXFPjsifBcKBjfAmCh4E+5XwPAliYUjOjlIk9/FYD4+0pQcg1WAGYaCvvJiADMMoPG8Lgi4sGYXiS6uKAxPK4JQQoF6pyTM7FuqjA8rwmldEA9Iy0f5o/E8NQJVycvg1EAWHWQtuJZTWi9ixrwUJhBBFjhjOUyPAFIDhglgA89lwz3AboVlOHBYQSp9jezcDIqAHwr+o/j4zZXL+DB6AW7VKRl3nuafgWOuzSbGlcm+fJhSVvRCYBzcIr8doLNHToByKYbIIrQ5Zz48vld2wmArR11gBz8dtEcwvcCEKfbykF+Mu4AcaPn4Cs6xJTR64TYmJ93AuleY16MCDZI762ddS8AlQAEXTLARmcNZwif/ihgEuyvwVISnGVa1GEx6P29o+wGsNjKUXcJwUhapk/eCme31/oTEekNTxNFMLK+FWBjOAvY/lSMb1auyAWA9M24FbmX7FeARF2WgBNIRSnA5/lhVJVA61qF9aQeECJxXUrP+AAAhIkgkSB7u9a1dgNE3y03k4iNzdBQcGpvcg8gZZiFd9ok5vZ8nF5nweg1glsAEJKohl2ItkVIAmBVqVeGBDcAzuJr8gvzBCIBmRLJPWMXALkYFYFKYAkBL5S7AdjN+IXU9WIySl+7GwpXALzipiIQM9Tbxa61A0A44h32BCwBm1rTk7G2CRcAwgFPRAB8KruZfJcEo5nLi98AqHU4WQRQJECPLUJ1QKAAgNbiHecp rce": "https://www.sec.gov/Archives/edgar/data/310764/000031076426000059/sykex991earningsq32026.htm", "value": "7億5300万ドル"}, {"label": "自社株買い（2026年第3四半期）", "note": "取締役会は2026年10月に自社株買いの枠を30億ドル追加しました。年初からの営業キャッシュフローは33億ドルでした。", "source": "https://www.sec.gov/Archives/edgar/data/310764/000031076426000059/sykex991earningsq32026.htm", "value": "10億ドル"}, {"label": "会社見通し（2026年通期）", "note": "従来の成長率見通し8.3%から9.3%とEPS見通し14.95ドルから15.10ドルから引き下げました。股関節と膝の手術の鈍さと末梢血管事業の供給制約が理由です。", "source": "https://www.sec.gov/Archives/edgar/data/310764/000031076426000059/sykex991earningsq32026.htm", "value": "オーガニック売上成長率6.5%から7.0%、調整後EPS 14.80ドルから14.90ドル"}], "sources": [{"title": "Stryker Reports Third Quarter 2026 Operating Results（2026年10月29日、SEC Exhibit 99.1）", "url": "https://www.sec.gov/Archives/edgar/data/310764/000031076426000059/sykex991earningsq32026.htm"}], "status": "見込み", "strengths": ["MedSurgと神経技術の売上が36億6400万ドルまで増え、内視鏡が13.9%増と伸びを作りました", "調整後営業利益率が26.2%まで上がり、調整後EPSが10.3%増えました", "第3四半期に10億ドルの自社株買いを実行し、枠を30億ドル追加しました"], "summary": "Strykerは整形外科インプラントと手術機器と神経技術製品を作る会社です。2026年第3四半期の売上は65億2000万ドルで前年同期から7.7%増えました。僕は会社が通期見通しを下げた理由を見ます。股関節と膝の手術の伸びが鈍り、整形外科が会社の想定を下回りました。", "weakness": "整形外科の鈍さと見通しの引き下げです。膝の売上は1.1%増にとどまり、股関節は1.0%減りました。会社はサイバーセキュリティ事案とSAP導入の混乱で商用実行に支障が出たと説明し、通期のオーガニック成長率見通しを8.3%から9.3%の範囲から6.5%から7.0%へ下げました。GAAP純利益も減損2億9300万ドルで12.3%減りました。"}, "symbotic": {"date": "11月23日", "deck": null, "focus": "見通しの売上高7.6億〜7.8億ドルと調整後EBITDAに届くか。2027年度見通しとWalmart向け展開を見る", "logo": "data:image/jpeg;base64,/9j/4gIcSUNDX1BST0ZJTEUAAQEAAAIMbGNtcwIQAABtbnRyUkdCIFhZWiAH3AABABkAAwApADlhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAApkZXNjAAAA/AAAAF5jcHJ0AAABXAAAAAt3dHB0AAABaAAAABRia3B0AAABfAAAABRyWFlaAAABkAAAABRnWFlaAAABpAAAABRiWFlaAAABuAAAABRyVFJDAAABzAAAAEBnVFJDAAABzAAAAEBiVFJDAAABzAAAAEBkZXNjAAAAAAAAAANjMgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB0ZXh0AAAAAE 半期売上は4億1150万ドルへ伸び、データライセンスの累計受注は5億5000万ドルを超えました。僕は診断の数量成長がデータ売上へつながる循環を見ます。", "weakness": "GAAP基準の黒字には届いていません。第3四半期の純損失1490万ドルには有価証券の未実現益4280万ドルの押し上げが含まれ、株式報酬等の費用も5080万ドル残ります。遺伝性検査の売上成長は3%にとどまり、成長ががん検査とデータライセンスへ偏っています。Personalis買収の完了には2026年11月30日の同社株主総会の承認が残ります。"}, "teradyne": {"date": "1月27日", "deck": null, "focus": "第4四半期の売上ガイダンス12.5億〜13.5億ドルの達成と、AI半導体テスト需要の持続", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAMAAABg3Am1AAAAb1BMVEUgQ4chQof///8gQokfQoYhQon//v8gQYYgQYggQ4X///0eRIWRocNYcqUhQYpYcafH0OGRocU9WpYtT49XcaLIz+FJZ5tXcarg5vKdrMksT5Pz8vj+//pmfK3V3OxJZp52ibRmfqrk5vODlbusts+2tkR6AAADJ0lEQVRIie1Ua3rbOAwEBIAERIqyHGeTNm7ibn3/M+5Aaezsdg/QH+Un2qKIATB4Ef1Zv8USdXJn4o8l7EJkpiHixNWJgthEiTQBRtSMVW4aTHERQ6kSxLWaKxuH7OLYwRbDVG/yrOYAOSvjByI4Kw2XDxEfjYd+chI+AsWqlWHG6rsyf//T9MDhkN1dcg5nKDWuOwuGtDt9OFFJB2jajbTXJCTQDH8jMiLJd987CPzlr+W2jvqwrMuaz3oUPuJveVKOJJPhI6kI6aHM08/VaZ3nqeDtPHXRnjfz/PzlKxC+I2AhARDZ92Yr5PMppav1lC/nMr0cSUVbJeEwPcyJwMU097ZO0zt67uRb2gK8nA8IBMJAIDwQah0Q6UholRNET0hUNTHqkD2dvr1C41tVg/+IXOZWFTc9qIquULo4cyBzCsAMtx9KmbbG8J9gBg8LQe/mYcQLSC/slMnhDe6gcOorwmEoi0ycC5iYQ29Hkponh1UoLNx8wwHlRM9QNyQzEsZ7nQW49UE0YCGJlmnZXYIFqu0yncv3rFmnoW00EleQ3mBBk0PGcnpSE+7paX+Ehr+hmkD6tqZ3l6osewJLWbOkN5AGvMwvp6gSrv8GEOKgKzL7YzktX9UCYc28l/L6hh7x4fYLgAmk50WRUdjzjnh2YK7ojdGUfrVAnqWxQpVGiPdzKXIt55cHrjUqivC/gGZPeDvpUJRBlQ7/6a1M5YcHM3rlfzgsIPmE7AejOBKg9Fqm51Sgn3r/xiEQpfna+9b7RQXFN7NeEOUV9XBv7DtAP8IKO4+KxJWz+MNLma5NLRv0DkC1NhRTrD9b4zwdXLIf0DBXfDqGNWs3+TgcDheXkHh7PDzigP3F9IID5sARx288MBhuAKgRU8uxNNAeki2M6wGm7ogZsXq43C3gO6oQDYHhiIlUa8UAwXiSaCZNuCF+GKN3DngTTIQslpy2sg8IKMdclWqNMVuaowtvAKgbnj2FkeUROEIF+m4YAT+UB0z7J9JIsaZPAdOoelygfzQG8ocicXRCSA2/Awa+VKjxffxWjIYKxTCVw2I3x1YDA+PP+i3WPya/IYz2YnwoAAAAAElFTkSuQmCC", "name": "Teradyne", "next": "次に見る数字は第4四半期売上が見通し12億5000万ドルから13億5000万ドルへ届くかと、メモリテスト売上の水準です。2027年に四半期売上が連続で伸びるかも確認します。", "numbers": [{"label": "売上（2026年第3四半期）", "note": "前年同期7億6900万ドルから70%増えました。GAAP純利益は3億4240万ドルで1株あたり2.17ドル、非GAAP純利益は3億5990万ドルで1株あたり2.29ドルです。非GAAP粗利率は59.1%でした。", "source" 日", "deck": "deck-t.html", "focus": "自動車の売上と営業利益率の低下が止まるか、蓄電池の出荷とFSD有料利用", "logo": "../assets/new-tesla-logo.svg", "name": "Tesla", "next": "次は自動車の売上と営業利益率の低下が止まるか、蓄電池の出荷（7-9月期は13.7GWh）とFSD有料利用の伸び、2026年の設備投資見通し約200億ドルの使い方を見ます。", "numbers": [{"label": "売上（2026年7-9月期）", "note": "自動車売上は205億6,000万ドルで3%減りました。台数と単価の両面で自動車が伸びていない点が全体を止めています。", "source": "https://ir.tesla.com/_flysystem/s3/sec/000162828026066738/tsla-20261021-gen.pdf", "value": "280億4,600万ドル（前年同期比0.2%減）"}, {"label": "納車台数（2026年7-9月期）", "note": "生産台数は464,391台で4%増えました。在庫は11日分まで圧縮され、受注残は4年ぶりの高水準と会社は説明しています。", "source": "https://ir.tesla.com/_flysystem/s3/sec/000162828026066738/tsla-20261021-gen.pdf", "value": "486,532台（前年同期比2%減）"}, {"label": "営業利益（2026年7-9月期）", "note": "営業費用が39%増え、利益を圧迫しました。売上280億ドルに対して営業利益は7億ドル台まで細っています。", "source": "https://ir.tesla.com/_flysystem/s3/sec/000162828026066738/tsla-20261021-gen.pdf", "value": "7億1,800万ドル（前年同期比56%減、営業利益率2.6%）"}, {"label": "FSD有料利用とサービス売上（2026年7-9月期）", "note": "自動車本体が伸びない中で、ソフトウェアとサービスが収益の受け皿になっています。", "source": "https://ir.tesla.com/_flysystem/s3/sec/000162828026066738/tsla-20261021-gen.pdf", "value": "FSDアクティブ利用174万人（前年同期比67%増）、サービス売上46億500万ドル（同33%増）"}, {"label": "フリーキャッシュフロー（2026年7-9月期）", "note": "営業キャッシュフロー62億6,000万ドルから設備投資47億3,000万ドルを引いた水準です。現金と投資は454億5,000万ドルまで積み上がりました。", "source": "https://ir.tesla.com/_flysystem/s3/sec/000162828026066738/tsla-20261021-gen.pdf", "value": "15億3,100万ドル"}], "sources": [{"title": "Tesla 2026年7-9月期アップデート（SEC Form 8-K Exhibit 99.1、2026年10月21日）", "url": "https://ir.tesla.com/_flysystem/s3/sec/000162828026066738/tsla-20261021-gen.pdf"}], "status": "見込み", "strengths": ["サービス売上が前年同期比33%増の46億500万ドルで、粗利益は過去最高の7億3,400万ドルです。台数が伸びない局面でも稼ぐ部門を持っています。", "FSDのアクティブ利用が174万人と67%増えました。規制クレジット売上は1億1,300万ドルまで減り、クレジット頼みの度合いも下がっています。"], "summary": "僕はTeslaを、電気自動車の販売を土台に、エネルギー、サービス、自動運転へ収益源を広げる会社として見ています。2026年7-9月期は売上が前年同期とほぼ同水準で、納車台数は微減でした。一方でサービス売上が33%増え、FSDの有料利用は174万人まで伸びています。", "weakness": "弱点は自動車の利益率です。営業利益は7億1,800万ドルと前年同期から56%減り、営業利益率2.6%まで下がりま rs": [{"label": "総予約額（2026年7-9月期）", "note": "利用回数は40億6100万回で16%増え、月次利用者は2億1500万人で14%増えました。配車が295億1200万ドルで18%増、配送が285億3900万ドルで22%増、貨物が17億6800万ドルで35%増えました。", "source": "https://s23.q4cdn.com/407969754/files/doc_earnings/2026/q3/earnings-result/Uber-Q3-26-Earnings-Press-Release.pdf", "value": "598億1900万ドル（前年同期比20%増）"}, {"label": "売上（2026年7-9月期）", "note": "事業モデルの変更が売上成長を8ポイント押し下げました。配車売上は75億2000万ドルで2%減り、配送売上は54億8800万ドルで23%増えました。", "source": "https://s23.q4cdn.com/407969754/files/doc_earnings/2026/q3/earnings-result/Uber-Q3-26-Earnings-Press-Release.pdf", "value": "147億6600万ドル（前年同期比10%増）"}, {"label": "調整後EBITDA（2026年7-9月期）", "note": "総予約額に対する比率は5.0%で、前年同期の4.5%から上がりました。非GAAP営業利益は23億400万ドルで38%増え、非GAAP EPSは0.88ドルで35%増えました。", "source": "https://s23.q4cdn.com/407969754/files/doc_earnings/2026/q3/earnings-result/Uber-Q3-26-Earnings-Press-Release.pdf", "value": "29億6300万ドル（前年同期比31%増）"}, {"label": "GAAP純利益（2026年7-9月期）", "note": "保有株式の評価損4億7600万ドル（税引前）を含みます。前年同期の66億2600万ドルには税務上の評価性引当金の戻入益49億ドルが含まれ、単純比較はできません。GAAP EPSは0.25ドルです。", "source": "https://s23.q4cdn.com/407969754/files/doc_earnings/2026/q3/earnings-result/Uber-Q3-26-Earnings-Press-Release.pdf", "value": "5億1200万ドル"}, {"label": "会社見通し（2026年10-12月期の総予約額）", "note": "非GAAP EPS見通しは0.95〜0.99ドル、調整後EBITDA見通しは31億3000万〜32億3000万ドルです。年末時点で完全自動運転車両を約700台、2027年に2000台超とする計画も会社は示しました。", "source": "https://s23.q4cdn.com/407969754/files/doc_earnings/2026/q3/earnings-result/Uber-Q3-26-Earnings-Press-Release.pdf", "value": "632億5000万〜652億5000万ドル（為替一定ベースで前年同期比18〜22%増）"}], "sources": [{"title": "Uber 2026年第3四半期決算発表（2026年11月4日）", "url": "https://s23.q4cdn.com/407969754/files/doc_earnings/2026/q3/earnings-result/Uber-Q3-26-Earnings-Press-Release.pdf"}], "status": "見込み", "strengths": ["総予約額が5四半期連続で20%以上伸び、配車と配送と貨物の3部門すべてが2桁成長しました。", "調整後EBITDAは29億6300万ドルまで増え、過去12か月のフリーキャッシュフローは104億ドルと過去最高になりました。四半期のフリーキャッシュフローは25億3500万ドルです。"], "summary": "Uberは配車と料理配送と貨物を1つの基盤でつなぐ会社です。2026年7-9月期は総予約額が前年同期比20%増の598億1900万ドルまで伸び、5四半期連続で20%以上の伸びを記録しました。一方で売上は事業モデルの変更 4ドル"}], "sources": [{"title": "Uranium Energy Corp Reports Fiscal 2026 Results（2026年9月29日、SEC Form 8-K Exhibit 99.1）", "url": "https://www.sec.gov/Archives/edgar/data/1334933/000143774926031416/ex_1020503.htm"}], "status": "見込み", "strengths": ["第4四半期の生産量が8万2744ポンドまで増え、総原価が1ポンドあたり36.54ドルまで下がりました。生産の拡大と原価の低下が同時に進みました", "実現価格93.13ドルで40万ポンドを売り、無ヘッジ戦略が売上と粗利益を作りました", "流動資産7億5300万ドルを借入なしで持ち、Ludemanの建設とSweetwaterの開発を進める資金を持ちます"], "summary": "Uranium Energyはワイオミング州とテキサス州で原位置回収法のウラン鉱山を運営する会社です。2026年度は生産拠点が2鉱山へ増え、生産量は22万9294ポンドまで伸びました。僕は生産量の伸びが販売量へつながる時期を見ます。販売は在庫の保有を優先し、売上は3730万ドルにとどまりました。", "weakness": "生産量に対する販売量の小ささです。2026年度の生産量22万9294ポンドに対して販売は在庫からの40万ポンドで、売上は3730万ドルにとどまります。精製転換子会社UR&CのClass IVコスト見積りは2027年半ばまで出ず、建設費の確定が先になります。Sweetwaterの操業計画承認も2027年5月の見込みで、3つ目のハブの収益化には時間がかかります。"}, "usa-rare-earth": {"date": "4月5日", "deck": null, "focus": "Serra VerdeのTREO販売（第4四半期に325トン以上を見込む）と磁石の初回販売、量産体制の進み具合", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAMAAAD04JH5AAAAflBMVEUKFij///8AECQAAB0GEyYAABgAABoACSDs7e4ABh8ADSKMkZm2ub7S1NcWITL6+vvz9PXg4eN5f4jY2tykqK6GjJSqrrQqNENvdX5QV2Oan6ZGTVnGyc0iLDsADybAw8c2P00AABFhaHJZYGo9RlMAAAsOHTEBGC0AAAAaJzq5OXymAAAId0lEQVR4nO1ZiXKkOBIFQRUCiUtIQgeHLNF46/9/cBOqXPa4yzPunhk7doMXHVEEGL3M1MtDdBQdOHDgwIEDBw4cOHDgwIEDBw4c+J9Hhr6XH+k++07+zOLWFd9owJOMY47Sb+PPdRzHOCTfxV/0JRgQD8k3hSDNTbxDJN+SCujE6qsBtVm/wQI0EhzfUPPnL+dPkyF+RbumX62DRL3hj/kpWb+W/5YAN5TjKDv/lSURrfQNPw4nyAf+hQakCX+7ATJ37aaDr6vJ2UsCxnET17hP5u2SjV/Gv7Qv/B3HZDmxazKW4vyv8KVZnr1NsvR8F0CpS56c9Is9w49/ozGlUVChelPq8nsGymfS9dl0rwh49fqfl+KJNQ2W492CwnU3PrpOpcqe2F2NtS/p8z8dg8w329rm6bYNKXrZgKH3QScodHcDpIwbn799u0j+bqPKbv7yilX70ufrBnR1twhT5dnltSKVoo6b8FaI+aKIzj9Y+lNAz1d/G83r2Ub3DGjnRquhL9Co7y0JM7B1vrg3/KypIVB/oz6k0a3lY7lZ4XM07imPKWah1MmJtc09AARsbRfa3lWA3G4szX97F9In9bo+0Or8x25QTVv+XIos7/Hr05m1deMNpMZ6yvZ0TK71ql0vvylMlIf6Df2sT9lV8XM5r7S95PeO1NK282VZCx/PYvZEL9XWsHb5NH6Q02/xF6O5OdhCpmM1nW8zSElLJ2qZr3IPB44xYR2jcz0vbQtXZWcIW/Pkun1UxTz/nRCgaddfK+MhgKcsPy9Xh1vT6ol1/Ulv8akJrY3iRlDc2aFmM5GYEWETS+trADrM2G9kQv
