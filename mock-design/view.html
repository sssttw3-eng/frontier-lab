027年度通期の売上見通し21億2,500万ドルから22億2,500万ドルの下限を維持できるかです。2026年12月8日の第2四半期決算で資金手当て済み受注残の伸びとGAAP営業損益の黒字化を確認します。", "numbers": [{"label": "売上（2027年度第1四半期、2026年8月1日終了）", "note": "第1四半期として過去最高です。製品売上3億2,906万ドルとサービス売上1億5,143万ドルで構成され、買収後の事業規模が四半期売上に定着した転換点です。", "source": "https://www.sec.gov/Archives/edgar/data/1368622/000110465926106304/avav-20260909xex99d1.htm", "value": "4億8,050万ドル（前年同期比6%増）"}, {"label": "部門別売上（2027年度第1四半期）", "note": "Autonomous Systemsが売上全体の72%を占めます。無人機と徘徊型兵器の出荷が会社全体の成長を決める構造であり、単一部門への集中も同時に進んでいます。", "source": "https://www.sec.gov/Archives/edgar/data/1368622/000110465926106304/avav-20260909xex99d1.htm", "value": "Autonomous Systems 3億4,600万ドル、Space Cyber and Directed Energy 1億3,450万ドル"}, {"label": "受注と資金手当て済み受注残（2026年8月1日時点）", "note": "ブック・トゥ・ビルは1.4です。受注残は2026年4月30日時点の12億ドルから増え、通期売上見通しの下限21億2,500万ドルの71%に相当する水準まで積み上がりました。", "source": "https://www.sec.gov/Archives/edgar/data/1368622/000110465926106304/avav-20260909xex99d1.htm", "value": "受注7億ドル、資金手当て済み受注残15億ドル"}, {"label": "純損失と調整後EBITDA（2027年度第1四半期）", "note": "純損失は前年同期6,740万ドルから大幅に縮みました。買収直後の費用負担は峠を越え、残る論点はGAAP営業利益の黒字化へ移っています。", "source": "https://www.sec.gov/Archives/edgar/data/1368622/000110465926106304/avav-20260909xex99d1.htm", "value": "純損失510万ドル、調整後EBITDA 5,340万ドル"}, {"label": "会社見通し（2027年度通期）", "note": "会社は第1四半期決算で通期見通しを据え置きました。GAAP純利益の見通しは1,000万ドルから2,700万ドルで、受注残の売上化が前提です。", "source": "https://www.sec.gov/Archives/edgar/data/1368622/000110465926106304/avav-20260909xex99d1.htm", "value": "売上21億2,500万ドルから22億2,500万ドル、調整後EBITDA 3億500万ドルから3億2,500万ドル"}], "sources": [{"title": "AeroVironment Announces Fiscal 2027 First Quarter Results（2026年9月9日、SEC Form 8-K Exhibit 99.1）", "url": "https://www.sec.gov/Archives/edgar/data/1368622/000110465926106304/avav-20260909xex99d1.htm"}], "status": "確定", "strengths": ["資金手当て済み受注残は15億ドルと前年同期比37%増えました。予算措置済みの契約が積み上がる構造が米軍の調達計画を売上へ変換する確度を高めます。", "Autonomous Systems売上は3億4,600万ドルで全体の72%を占めます。Switchblade等の徘徊型兵器と無人機の実戦需要を出荷へつなげ、部門単位で規模を持ちます。", "粗利率は26%と前年同期の21%から5ポイント上がりました。製品構成の改善が売上6%増を上回る利益改善を生み、買収後の統合効果が出始めています。"], "summary": "僕はAeroVironmentを、米軍にSwitchblade等の徘徊型兵器と小型無人機を納め、BlueHalo買収で宇宙・サイバー・指向性エネルギーまで広げた防衛装備を契約単位で売る会社として見ています。2027年度第1四半期は売上4億8,050万ドルへ増え、資金手当て済み受注残は15億ドルまで積み上がりました。", "weakness": "弱点はGAAP利益の未達です。第1四半期の営業損失は1,090万ドルで、BlueHalo買収に伴う無形資産償却等の非現金費用4,340万ドルが利益を押し下げます。受注残の売上化が遅れ四半期売上が見通しのペースを下回れば、償却負担を吸収できず、通期のGAAP純利益見通し1,000万ドルから2,700万ドルの下限から外れます。"}, "alphabet": {"date": "2月3日", "deck": null, "focus": "設備投資513億5,500万ドルに対する営業キャッシュフローの拡大とGoogle Cloudの伸び、フリーキャッシュフローの回復", "logo": "../assets/logos/alphabet.svg", "name": "Alphabet", "next": "次に見る数字はフリーキャッシュフローがマイナス90億6,500万ドルから黒字へ戻るかです。2027年2月3日の2026年10-12月期決算で設備投資と営業キャッシュフローの差、Google Cloud売上の伸びとTPUシステム販売の寄与を確認します。", "numbers": [{"label": "売上（2026年7-9月期）", "note": "13四半期連続の2桁増収です。増収率自体が前四半期から加速しており、広告とCloudの両輪で規模を広げる局面が続いています。", "source": "https://www.sec.gov/Archives/edgar/data/1652044/000165204426000080/googexhibit991q32026.htm", "value": "1,275億7,700万ドル（前年同期比25%増）"}, {"label": "Google Cloud売上（2026年7-9月期）", "note": "営業利益は111億2,100万ドルで営業利益率36.2%です。Cloudは増収源であると同時に利益源へ変わり、設備投資の原資を自部門で生む構造に近づきました。", "source": "https://www.sec.gov/Archives/edgar/data/1652044/000165204426000080/googexhibit991q32026.htm", "value": "307億900万ドル（前年同期比103%増）"}, {"label": "検索売上（2026年7-9月期）", "note": "検索クエリの伸び率は5年ぶりの高さと会社は示しています。AI回答の普及が検索広告を侵食するとの見方に対し、本業の土台は増収で応えています。", "source": "https://www.sec.gov/Archives/edgar/data/1652044/000165204426000080/googexhibit991q32026.htm", "value": "633億5,000万ドル（前年同期比12%増）"}, {"label": "設備投資とフリーキャッシュフロー（2026年7-9月期）", "note": "営業キャッシュフロー422億9,000万ドルを設備投資が上回りました。投資先行が現金収支を決める局面に入り、Cloud増収の現金化速度が次の焦点です。", "source": "https://www.sec.gov/Archives/edgar/data/1652044/000165204426000080/googexhibit991q32026.htm", "value": "設備投資513億5,500万ドル、フリーキャッシュフローはマイナス90億6,500万ドル"}], "sources": [{"title": "Alphabet 2026年7-9月期決算リリース（SEC Form 8-K Exhibit 99.1、2026年10月28日）", "url": "https://www.sec.gov/Archives/edgar/data/1652044/000165204426000080/googexhibit991q32026.htm"}], "status": "見込み", "strengths": ["Google Cloudは売上307億900万ドルと前年同期比103%増え、営業利益率36.2%を出しました。増収と利益率改善が同時に進み、Cloud自体が投資原資を生む構造へ変わっています。", "検索売上は633億5,000万ドルと前年同期比12%増えました。検索クエリの伸び率が5年ぶりの高さとなり、広告の土台がCloud投資を支える現金創出を続けています。"], "summary": "僕はAlphabetを、検索とYouTubeの広告を土台に、Google Cloudと自社チップTPUでAI基盤を企業に売る会社として見ています。2026年7-9月期はCloud売上が307億900万ドルと前年同期の2倍になり、営業利益率36.2%まで上がりました。一方で設備投資513億5,500万ドルが営業キャッシュフロー422億9,000万ドルを上回りました。", "weakness": "弱点は設備投資に対する現金収支です。フリーキャッシュフローはマイナス90億6,500万ドルで2四半期連続のマイナスとなり、第3四半期の設備投資は513億5,500万ドルまで膨らみました。Cloud売上の伸びが鈍り営業キャッシュフローの拡大が止まれば、投資計画の縮小か現金残高の取り崩しかを選ぶ局面に入ります。"}, "amazon": {"date": "2月4日", "deck": null, "focus": "会社見通しの純売上2,400億から2,470億ドルと営業利益285億から335億ドルの達成、AWSの伸び", "logo": "data:image/x-icon;base64,AAABAAMAMDAAAAEAIACoJQAANgAAACAgAAABACAAqBAAAN4lAAAQEAAAAQAgAGgEAACGNgAAKAAAADAAAABgAAAAAQAgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABi/y8AY/+EAGL/xgBi//AAYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL/8ABi/8YAY/+EAGL/LwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAY/8fAGL/pABi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi/6QAWv8fAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABj/00AYv/wAGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv/wAGH/TAAAAAAAAAAAAAAAAAAAAAAAAAAAAGP/TQBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBh/0wAAAAAAAAAAAAAAAAAY/8fAGL/8ABi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wBi//8AYv//AGL//wB の維持を両立できるかが次の四半期の判定軸です。", "source": "https://www.aboutamazon.com/news/company-news/amazon-earnings-q3-2026-report", "value": "純売上2,400億から2,470億ドル、営業利益285億から335億ドル"}], "sources": [{"title": "Amazon 2026年7-9月期決算リリース（2026年10月29日）", "url": "https://www.aboutamazon.com/news/company-news/amazon-earnings-q3-2026-report"}], "status": "見込み", "strengths": ["AWSは売上459億8,400万ドルと前年同期比39%増え、営業利益率38.7%を出しました。企業向けクラウドの従量課金が規模と利益率を同時に運ぶ構造を、加速する増収が再び証明しています。", "営業利益率は13.9%と過去最高です。ECと広告の規模がAWS投資の原資を生み、投資を利益率の更新と両立させる循環が働いています。"], "summary": "僕はAmazonを、ECとPrime会員基盤の上に広告を重ね、AWSを企業へ従量課金で売る会社として見ています。2026年7-9月期はAWS売上が459億8,400万ドルと前年同期比39%増え、営業利益率は過去最高の13.9%へ上がりました。一方で過去12ヶ月のフリーキャッシュフローはマイナス424億ドルです。", "weakness": "弱点は現金収支です。過去12ヶ月のフリーキャッシュフローはマイナス424億ドルで、前年同期のプラス148億ドルから反転しました。2026年の設備投資見通し2,200億ドルに対し、AWS売上の伸びが鈍り営業キャッシュフローが縮めば、投資の減速か追加の資金調達かを選ぶ局面に入ります。"}, "amd": {"date": "2月2日", "deck": "deck-a.html", "focus": "会社見通しの売上170億ドル（±3%、金額では±5億1,000万ドル）への到達とデータセンターの伸び、Heliosの売上開示", "logo": "../assets/new-amd-logo.svg", "name": "AMD", "next": "次に見る数字は2026年10-12月期の会社見通し、売上170億ドル（±3%、金額では±5億1,000万ドル）の達成です。2027年2月2日の決算でデータセンター売上の伸びとHeliosの売上開示があるかを確認します。", "numbers": [{"label": "売上（2026年7-9月期）", "note": "会社見通しの上限を超え、四半期で過去最高です。増分の中心はデータセンターであり、成長の質は1部門の伸びで決まる構造です。", "source": "https://www.sec.gov/Archives/edgar/data/2488/000000248826000188/q32026991.htm", "value": "133億7,700万ドル（前年同期比45%増）"}, {"label": "データセンター売上（2026年7-9月期）", "note": "売上全体の64%を占めます。1年前の47%から構成が変わり、EPYCとInstinctを持つデータセンター事業が会社の本体になりました。", "source": "https://www.sec.gov/Archives/edgar/data/2488/000000248826000188/q32026991.htm", "value": "85億ドル（前年同期比97%増）"}, {"label": "非GAAP EPS（2026年7-9月期）", "note": "売上45%増に対してEPSは74%増えました。非GAAP粗利率56%まで上がり、増収を利益へ変換する効率が改善しています。", "source": "https://www.sec.gov/Archives/edgar/data/2488/000000248826000188/q32026991.htm", "value": "2.09ドル（前年同期比74%増）"}, {"label": "会社見通し（2026年10-12月期の売上）", "note": "前年同期比66%増、前四半期比27%増に相当する水準です。売上全体の伸びを会社が見込み、Heliosを含む出荷の加速が前提です。", "source": "https://www.sec.gov/Archives/edgar/data/2488/000000248826000188/q32026991.htm", "value": "170億ドル（±3%、金額では±5億1,000万ドル）"}], "sources": [{"title": "AMD 2026年7-9月期決算リリース（SEC Form 8-K Exhibit 99.1、2026年11月3日）", "url": "https://www.sec.gov/Archives/edgar/data/2488/000000248826000188/q32026991.htm"}], "status": "見込み", "strengths": ["データセンター売上は前年同期比97%増の85億ドルです。EPYCの販売が記録的水準に達し、Instinct MI450シリーズの立ち上がりが重なり、CPUとGPUの両方で顧客の増設需要を取り込んでいます。", "非GAAP粗利率は56%まで上がりました。データセンター構成比の上昇が製品構成を改善し、売上45%増をEPS74%増へ変換する利益構造を作っています。"], "summary": "僕はAMDを、サーバーCPUのEPYCとAI向けGPUのInstinctをデータセンター事業者へ売り、ラック単位のHeliosで導入単位を広げる会社として見ています。2026年7-9月期は売上133億7,700万ドルと四半期で過去最高を出し、データセンター売上が前年同期比97%増え、売上全体の64%を占めるまで会社の重心が移りました。", "weakness": "弱点はデータセンター1部門への依存です。売上全体の64%をデータセンターが占める一方、クライアントとゲーミングの合計売上は37億ドルと前年同期比8%減りました。データセンターの出荷が顧客の投資計画の後ろ倒しで鈍れば、他部門に成長を肩代わりする余力がなく、全体の増収率が急低下します。"}, "apple": {"date": "1月28日", "deck": null, "focus": "2026年10-12月期のiPhone売上とサービス売上の伸び、関税還付の剥落後の粗利率の水準", "logo": "../assets/logos/apple.svg", "name": "Apple", "next": "次は2027年1月28日の2026年10-12月期決算です。粗利率は今期47.9%から関税還付の押し上げ約1ポイントを除いた水準を下回るかを見ます。iPhone売上は今期575億8,300万ドル・前年同期比17%増、サービス売上は今期315億7,300万ドル・前年同期比10%増を基準に、年末商戦を含む四半期でも伸びが続くかを確認します。", "numbers": [{"label": "売上（2026年度第4四半期、2026年6-9月期）", "note": "9月期として過去最高です。純利益307億1,100万ドルと希薄化後EPS 2.10ドルを伴い、規模の更新が利益の更新と一致しています。", "source": "https://www.sec.gov/Archives/edgar/data/320193/000032019326000024/a8-kex991q4202609262026.htm", "value": "1,144億7,700万ドル（前年同期比12%増）"}, {"label": "iPhone売上（同四半期）", "note": "売上全体1,144億7,700万ドルの50%超を占め、9月期として過去最高を更新しました。前年同期比17%増は売上全体の前年同期比12%増を上回り、四半期の増分をiPhoneが引っ張る構造を数字が示します。", "source": "https://www.sec.gov/Archives/edgar/data/320193/000032019326000024/a8-kex991q4202609262026.htm", "value": "575億8,300万ドル（前年同期比17%増）"}, {"label": "サービス売上（同四半期）", "note": "過去最高を更新しました。端末販売の後に続く継続収益が厚くなり、端末の四半期変動から売上全体を守る層が育っています。", "source": "https://www.sec.gov/Archives/edgar/data/320193/000032019326000024/a8-kex991q4202609262026.htm", "value": "315億7,300万ドル（前年同期比10%増）"}, {"label": "粗利率（同四半期）", "note": "関税還付の押し上げ約1ポイントを含みます。押し上げ分を差し引いた46.9%前後が実力の水準に当たり、47.9%をそのまま継続可能な粗利率と読めません。", "source": "https://www.sec.gov/Archives/edgar/data/320193/000032019326000024/a8-kex991q4202609262026.htm", "value": "47.9%"}], "sources": [{"title": "Apple Reports Fourth Quarter Results（2026年11月2日、SEC Form 8-K Exhibit 99.1）", "url": "https://www.sec.gov/Archives/edgar/data/320193/000032019326000024/a8-kex991q4202609262026.htm"}], "status": "見込み", "strengths": ["iPhone売上は575億8,300万ドルと前年同期比17%増え、9月期として過去最高を更新しました。売上全体1,144億7,700万ドルの50%をiPhoneが占め、売上全体の前年同期比12%増を上回る伸びで増分を引っ張る構造が働いています。", "サービス売上は315億7,300万ドルと前年同期比10%増え、過去最高を更新しました。端末を売った後に継続課金が積み上がる構造は端末販売の波をならす収益基盤になっています。"], "summary": "僕はAppleを、iPhoneを入口に端末を売り、App StoreとiCloud等のサービスを継続課金して1人あたり売上を積み上げる会社として見ています。2026年度第4四半期はiPhone売上が575億8,300万ドルと前年同期比17%増え、サービス売上315億7,300万ドルと並んで過去最高を更新しました。", "weakness": "弱点はiPhone売上への集中です。iPhone売上575億8,300万ドルは売上全体1,144億7,700万ドルの50%超を占め、サービス売上315億7,300万ドルと合わせた上位2部門で成長が決まる構造です。iPhone売上の前年同期比17%増が鈍れば、サービス売上の前年同期比10%増だけでは売上全体の伸びを支えきれず、増分の中心が細ると同時に全体の成長も落ちます。"}, "applied-digital": {"date": "1月上旬", "deck": null, "focus": "基本賃料の伸びとPolaris Forgeの稼働拡大、調整後EBITDA", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAMAAAD04JH5AAAAJFBMVEVHcEwCAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgKduWftAAAAC3RSTlMA7j4q1wYYYMOqibaYTIsAAAFKSURBVHic7dvtjoMgEIVhkQ9tuf/7rZYCm+zEsptRan0P/Gro+DQxgI0MAzlxxmmcUg9dru/nGE3qYzfAKwAAALgCYCwps54IsL/HqSS4fK0660kAfyufTQAAAAAAAMB5Ab4uvV4F8Ncl2rpoTFybsyqAe65nSr1tgMk11AD5uwAAAAAAAAAAAN8GuLlXZls/OxAwhJKyeT0WIATAfoByw7ltwL2M0wVIN5wYaZwKoDmC71iAkM8BxEaAMyb1WQmQ67X+ILskrP3NDdcan6otXaceIeT7422O0kQUSsG2emkqXpvmVPxsvRej7qvhqQG9t2TdN6X9t+UAPvHhtD6e13EX+4MCAAAAAAAAAABgN8DycJqiBcj1GgE7vsbz/8f9a71JBQAAAAAAAEj5sUT3OeQioq51zggAAACbgE7Hfp8Hn1Prc/CZ6OQBsi2cWlkT/bcAAAAASUVORK5CYII=", "name": "Applied Digital", "next": "次に見る数字は会社見通しではなく実績の基本賃料です。2026年9-11月期決算で基本賃料6580万ドルから内装工事1億8350万ドルを上回る方向へ進むか、調整後EBITDA6440万ドルの拡大と純損失2億2100万ドルの縮小を同時に確認します。", "numbers": [{"label": "売上（2026年6-8月期）", "value": "3億4190万ドル（前年同期比322%増）", "note": "増収の大半は建設段階の内装工事で生まれました。賃料型の売上へ中身が移るかどうかで成長の質が決まります。", "source": "https://www.sec.gov/Archives/edgar/data/1144879/000114487926000057/apldq127earningsrelease.htm"}, {"label": "HPCホスティング売上（2026年6-8月期）", "value": "2億6260万ドル（基本賃料6580万ドル、内装工事1億8350万ドル）", "note": "基本賃料は部門売上の25.1%にとどまります。リース事業でありながら今期は工事事業の姿に近く、稼働棟の増加で比率が反転するかを見ます。", "source": "https://www.sec.gov/Archives/edgar/data/1144879/000114487926000057/apldq127earningsrelease.htm"}, {"label": "調整後EBITDAと純損失（2026年6-8月期）", "value": "調整後EBITDA6440万ドル、純損失2億2100万ドル", "note": "金利費用は前年同期800万ドルから7740万ドルへ膨らみました。建設資金を借入で賄う構造で、賃料が金利を上回る速度が損益の分かれ目です。", "source": "https://www.sec.gov/Archives/edgar/data/1144879/000114487926000057/apldq127earningsrelease.htm"}, {"label": "契約済み容量（2026年8月31日時点）", "value": "1.41GW（5拠点のリース合計）", "note": "Delta Forge 2の210MW、15年リースだけで基本期間52億ドルの契約です。契約容量の大きさ自体が将来の賃料の上限を決めます。", "source": "https://www.sec.gov/Archives/edgar/data/1144879/000114487926000057/apldq127earningsrelease.htm"}, {"label": "稼働容量Polaris Forge 1（2026年10月1日時点）", "value": "250MW", "note": "第2棟の第2期75MWを四半期終了後に稼働させました。会社は2026年末までにノースダコタ全体で300MWの納入を見込み、稼働容量の増加が基本賃料の増加へ直結します。", "source": "https://www.sec.gov/Archives/edgar/data/1144879/000114487926000057/apldq127earningsrelease.htm"}], "sources": [{"title": "Applied Digital Reports Fiscal First Quarter 2027 Results（2026年10月7日、SEC提出の決算リリース）", "url": "https://www.sec.gov/Archives/edgar/data/1144879/000114487926000057/apldq127earningsrelease.htm"}], "status": "見込み", "strengths": ["投資適格のハイパースケーラーと15年単位のリースを結び、1.41GW分の契約容量を確保しました。長期契約が賃料の見通しを立てやすくし、建設資金の調達を支えます。", "Polaris Forge 1で250MWを稼働させ、基本賃料6580万ドルの計上を始めました。契約を実物の稼働へ変える実行力を数字で示しました。"], "summary": "僕はApplied Digitalを、AI向け大規模データセンターを建設し、投資適格のハイパースケーラーへ15年単位のリースで貸して賃料を受け取る会社として見ています。主力はPolaris ForgeとDelta Forgeの拠点群で、2026年6-8月期は契約済み容量1.41GWまで広がりました。売上3億4190万ドルの大半を内装工事が占め、基本賃料6580万ドルはまだ小さい点が転換点です。", "weakness": "弱点は売上の中心が一時的な内装工事で、借入への依存が重い点です。HPC売上2億6260万ドルのうち内装工事は1億8350万ドルで、基本賃料6580万ドルの2.8倍に達します。金利費用7740万ドルと販売管理費が重なり純損失は2億210 ess": "弱点は費用構造に対して売上の土台が小さく、現金の減少で時間が限られる点です。第3四半期の売上510万ドルに対してGAAP営業費用は2億9430万ドルで、現金は1四半期で2億700万ドル減りました。Midnightの型式認証が遅れて機体販売と運航の開始が後ろへ移れば、四半期2億ドル規模の現金減少が続き、残高13億5360万ドルは数四半期で開発継続を制約する水準まで細ります。"}, "arista": {"date": "2月11日", "deck": null, "focus": "第4四半期の売上ガイダンス39億〜40億ドルの達成と粗利率、繰延収益", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAACjElEQVRYhe3VTahVVRgG4OfapVshGjipIzVoIsYtCBdFaoFIDYMgqKGD0tWPKEGKqCTK1UQxqaBV0MBBEOFAImdG6HiF/VizGogcHVgKUfbnvQ32ubd1/u45+yg46L6wB+vd3/q+b7/fWu9mAQu4xRgbaVeIi7Afr+I6puR0aJRUi0ZqgE3YjsVYioNCfGqURPUVCHE5vm8VLvETHpbTb3XS1VMgRHi3R3F4AHtq5avdAM+2nn7YKsRVdRIOP4IQl6qkX16wJ1RqrCu4s3hUTv8Mk7aOAgc6il9V3YKIPwr+Ebw+bNLbhooKcS3e067YZjmd1sw/a4QZrC/erdEIn2rmXwalHqxAiBP4oCP2S3xUrA/j22J9F5IQB454mBFsx4PF+ndslNPMHJPTXypvuF7ErceGQcnnH0GIK/Exxgt2p5w+74pt5gsaYRkeK9i1GuGYZu7rDf0VqOw2YaJgv8Lb87S8C+eL9TIcbflHT4z3fcOLeLKDO4uX50l4Da/hs4J7QaVit2r6+UCI9+IH3D1Pg72wA2/hEzxf8OcxKadfOzd0j6D6undGKP4djsgJtqK8gvdjqtemXmfgGTxXs/g0Yus2kNMlbOuIeUWIj3dubB9BiEtwDvcV7EkcG9DAFTmd6sg1hi+02/Q5rJprVPchnOoofgUvyenigAa6kdOMECO+xp0tdlLlK/tmw/7zgUqe97WrskVOp2sXn0Vl09PabXq1RjiumS8zewZCvF233Z7Rbrej4jC+KdYT+LDlM3MF38BDRdCf2CSn6Rsun9Pf2Kjdpp9occaEuEI1pzuKgDfltPeGi5cI8Si2FMxVTI6r/vPXWg/8iIM3tXiF3Xga9xTcvj6xC/gf4V+FyprKnnJOwgAAAABJRU5ErkJggg==", "name": "Arista", "next": "次に見る数字は会社見通しの2026年第4四半期売上39億ドルから40億ドルです。2026年第4四半期決算の発表で売上と非GAAP粗利率64.0%からの推移、繰延収益残高68億3950万ドルの増減を確認します。", "numbers": [{"label": "売上（2026年第3四半期）", "value": "36億5760万ドル（前年同期比58.5%増）", "note": "会社見通しを上回る伸びで、AIクラスタ向けスイッチ需要が成長の中心です。ネットワーク側でAI投資の受け皿になる位置を数字が示します。", "source": "https://investors.arista.com/Communications/Press-Releases-and-Events/Press-Release-Detail/2026/Arista-Networks-Inc--Reports-Third-Quarter-2026-Financial-Results/default.aspx"}, {"label": "製品売上（2026年第3四半期）", "value": "31億9000万ドル（売上全体の87.2%）", "note": "サービス売上4億6760万ドルに対して製品が大半を占めます。出荷台数の増減が四半期売上へ直結する構造で、受注の先行指標を別に見る必要があります。", "source": "https://investors.arista.com/Communications/Press-Releases-and-Events/Press-Release-Detail/2026/Arista-Networks-Inc--Reports-Third-Quarter-2026-Financial-Results/default.aspx"}, {"label": "GAAP純利益（2026年第3四半期）", "value": "15億6040万ドル（希薄化EPS 1.22ドル）", "note": "非GAAP営業利益率は49.1%です。売上58.5%増と高い利益率を両立させ、大規模出荷でも収益性を落とさない運営を示しました。", "source": "https://investors.arista.com/Communications/Press-Releases-and-Events/Press-Release-Detail/2026/Arista-Networks-Inc--Reports-Third-Quarter-2026-Financial-Results/default.aspx"}, {"label": "繰延収益残高（2026年9月末）", "value": "68億3950万ドル", "note": "売上2四半期分に近い先行受注の厚みを持ちます。一方で前四半期末から2640万ドル減り、積み上がりの勢いに変化が出た点を見ます。", "source": "https://investors.arista.com/Communications/Press-Releases-and-Events/Press-Release-Detail/2026/Arista-Networks-Inc--Reports-Third-Quarter-2026-Financial-Results/default.aspx"}, {"label": "会社見通し（2026年第4四半期売上）", "value": "39億ドルから40億ドル", "note": "第3四半期実績からさらに増収を見込む水準です。繰延収益の厚みが短期の見通しを支える構造を確認する材料になります。", "source": "https://investors.arista.com/Communications/Press-Releases-and-Events/Press-Release-Detail/2026/Arista-Networks-Inc--Reports-Third-Quarter-2026-Financial-Results/default.aspx"}], "sources": [{"title": "Arista Networks 2026年第3四半期決算発表（2026年11月3日）", "url": "https://investors.arista.com/Communications/Press-Releases-and-Events/Press-Release-Detail/2026/Arista-Networks-Inc--Reports-Third-Quarter-2026-Financial-Results/default.aspx"}], "status": "見込み", "strengths": ["AIデータセンター向け製品売上が31億9000万ドルまで拡大し、非GAAP営業利益率49.1%を保ちました。EOSを軸にスイッチを大規模クラスタへ入れ込む導入形態で大量出荷と収益性の両立を支えます。", "繰延収益残高68億3950万ドルを持ち、四半期売上の2倍近い先行受注を抱えます。顧客の導入計画が先に積み上がる構造が次の四半期の見通しを裏付けます。"], "summary": "僕はArista Networksを、データセンター向けスイッチとネットワークOSのEOSをハイパースケーラーへ売り、製品販売とサービス契約で稼ぐ会社として見ています。AIデータセンター向けが製品売上31億9000万ドルを押し上げ、2026年第3四半期の売上は前年同期比58.5%増の36億5760万ドルで上場以来最も高い伸びを記録しました。", "weakness": "弱点は粗利率への下向き圧力と先行受注の伸び鈍化です。非GAAP粗利率は前年同期65.2%から64.0%へ下がり、繰延収益残高は前四半期末から2640万ドル減りました。AI向け大型案件の単価圧力が強まり繰延収益の減少が続けば、出荷増でも利益率と見通しの両方が細り、成長の質が崩れます。"}, "arm": {"date": "2月上旬", "deck": null, "focus": "Q3ガイダンス（売上14.9億〜15.9億ドル）の達成と、AGI CPUの売上・粗利の開示", "logo": "../assets/logos/arm.svg", "name": "Arm", "next": "次に見る数字は会社見通しの2027年度第3四半期売上15億4000万ドル（上下5000万ドル）と非GAAP EPS 0.56ドル（上下0.04ドル）です。2027年度第3四半期決算でロイヤルティ売上6億7000万ドルから二桁成長へ戻るか、Arm AGI CPUの売上と粗利の初開示を確認します。", "numbers": [{"label": "売上（2027年度第2四半期）", "value": "14億4300万ドル（前年同期比27%増）", "note": "第2四半期として過去最高で、前年同期比20%超の成長が5四半期続きます。設計資産の提供側に立つ事業形態が規模の拡大を利益へ変えます。", "source": "https://www.sec.gov/Archives/edgar/data/1973239/000197323926000141/exhibit992fye27q230-sepx26.htm"}, {"label": "ライセンスその他売上（2027年度第2四半期）", "value": "7億7300万ドル（前年同期比50%増、売上全体の53.6%）", "note": "前年同期からの増収3億800万ドルの大半をこの部門が担いました。高額契約の計上時期で四半期ごとに振れる売上が成長の中心にある点を見ます。", "source": "https://www.sec.gov/Archives/edgar/data/1973239/000197323926000141/exhibit992fye27q230-sepx26.htm"}, {"label": "ロイヤルティ売上（2027年度第2四半期）", "value": "6億7000万ドル（前年同期比8%増）", "note": "データセンター向けは前年同期の2倍へ伸び、スマートフォン向けはメモリ価格上昇の影響を受けました。単価上昇の効果が出荷台数の変動を吸収する構造です。", "source": "https://www.sec.gov/Archives/edgar/data/1973239/000197323926000141/exhibit992fye27q230-sepx26.htm"}, {"label": "GAAP純利益（2027年度第2四半期）", "value": "1億3000万ドル（前年同期比45%減）", "note": "株式報酬費用の増加が利益を押し下げました。非GAAP EPSは0.52ドルへ増え、事業の収益力とGAAP利益の間に開きが広がります。", "source": "https://www.sec.gov/Archives/edgar/data/1973239/000197323926000141/exhibit992fye27q230-sepx26.htm"}, {"label": "会社見通し（2027年度第3四半期売上）", "value": "15億4000万ドル（上下5000万ドル）", "note": "ライセンスの先行指標であるACVは17億9000万ドルで前年同期比12%増です。見通しの達成は大型ライセンス契約の計上時期に左右されます。", "source": "https://www.sec.gov/Archives/edgar/data/1973239/000197323926000141/exhibit992fye27q230-sepx26.htm"}], "sources": [{"title": "Arm 2027年度第2四半期 株主レター（Form 6-K Exhibit 99.2、2026年11月4日）", "url": "https://www.sec.gov/Archives/edgar/data/1973239/000197323926000141/exhibit992fye27q230-sepx26.htm"}], "status": "見込み", "strengths": ["Armv9とCSSの採用でチップ1個あたりのロイヤルティ単価が上がり、データセンター向けロイヤルティが前年同期の2倍になりました。設計の世代交代が単価を引き上げる構造を持ちます。", "パートナーのArmベースチップ出荷は四半期で初めて100億個を超え、非GAAP営業利益率は44.2%を保ちます。出荷基盤の広さがライセンス先の交渉力を支えます。"], "summary": "僕はArmを、半導体の設計をライセンスし、出荷されたチップごとにロイヤルティを受け取る会社として見ています。Armv9とCSSの採用でチップ1個あたりの単価が上がり、2027年度第2四半期はライセンス売上が前年同期比50%増の7億7300万ドルと伸びを主導しました。データセンター向けロイヤルティは前年同期の2倍です。", "weakness": "弱点は増収の質が計上時期の振れるライセンス売上へ偏る点です。2027年度第2四半期の増収3億800万ドルの大半をライセンス売上7億7300万ドルが担い、継続収入であるロイヤルティは8%増の6億7000万ドルにとどまりました。大型ライセンス契約の締結が1四半期途切れれば売上全体の成長率が急に落ち、ロイヤルティの土台が細る前に見出しの成長が崩れます。"}, "asml": {"date": "1月27日", "deck": null, "focus": "Q4売上ガイダンス142億〜152億ユーロと粗利率57%の達成、2027年見通しと受注", "logo": "data:image/x-icon;base64,AAABAAMAMDAAAAEACACoDgAANgAAACAgAAABAAgAqAgAAN4OAAAQEAAAAQAIAGgFAACGFwAAKAAAADAAAABgAAAAAQAIAAAAAAAACQAAAAAAAAAAAAAAAQAAAAAAAJk9KwD37+0AjSURANGnnwCcQjEA+fTzALh3awD8+fkA8OHfAJMvHQChSzoA/v38ALyAdADlzcgAiBsGALBoWgCjUEAAzJ2UAJc4JgD06ugAv4V6AOfSzgCKIAwAiyAMALNtYAD37+4AwoqAAI0lEgCbQS8At3ZpAKteTwDTq6MAnkY1APv49wDGk4kAki4bALp7bwDiyMMArmNVANawqQChSzsA/v39AJUzIQDYta8ApFBBAIofCgClVEQAmTwqAPbu7ADBiX4A6dbSAIwkEACNJBAAtXFkAN2+uACoWUoA0KaeAPnz8gCcQTAAxI6EAI8pFgC3dmoAq15QAPv4+ADix8EArWJTAKBKOQDx5OEAlDIfANi0rQCjTz8Ay5yTAPPp5wD06ecAv4R5AOfRzQCKHwsA9u7tAI0kEQDq1tMAp1hIAN2+uQD48vAAjigUAN/CvADSqqIAnkU0AMaSiACRLRoA7t/cALp6bgDix8IAoEo6AP38/ACUMiAA8eTiAOTMyACwZ1oA2LSuAL6DdwCJHgkAzaCXAJg7KQCZOykAjCMPAOnV0QDQpZ0A+PLxAI8oFQDs2tcA38K9AKpdTwCQLBgAkzEeALt+cgC8fnIA5MvGAK9mWADXs6wAy5uSAJY2JADz6OYA5tDMAIoeCgDauLIAiyINAPbt7ADp1dIA+PHvAI4nEwC2dGcA3sG7AKpcTQCdRDMA7t7bAJEsGQDhxsEArGFTAK1hUwD9+/sAlDEfAK9mWQD///4AypqQAJU1IgC9gnYAvoJ2AObPygDZt7AApVJCAJg6KAD17OoAiyIOAIwiDgC0b2IAp1dIAM+knACbPy4AjicUAOvZ1gC2dGgAkCsXALh4awCsYFEAn0g3APz6+QCTMB0Au31xAOPKxQDXsqsAok09AP///wDKmpEAlTUjAPPn5QCJHQkAzZ+XAIshDACnVkYAmj4sAPfw7gDCi4AA6tjUAI0mEgC2c2YA3sC6AJ1DMgDFkIYAkCsYAO3d2gC4eGwAuXhsAKxgUgDUraYArmRVAP7+/QCVNCEA5c7JAKRRQQDMnpUA9OvpAPXr6QC/hnsA6NPPAIshDQDbu7UAz6ObAJo+LQCOJhMA69jVAN7AuwDEj4QA06ykAMeUigCSLxwA7+HeAOPJxAChTDwA/v7+AJU0IgC9gXYA2bawAJc4JQCKIAsA9evqALNtXwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaG "}], "sources": [{"title": "AST SpaceMobile Provides Business Update and Third Quarter 2026 Results（2026年11月9日、SEC Exhibit 99.1）", "url": "https://www.sec.gov/Archives/edgar/data/1780312/000119312526453758/asts-ex99_1.htm"}], "status": "見込み", "strengths": ["第3四半期売上は4232万1000ドルで前年同期比187%増え、9か月累計売上は8857万5000ドルに達しました。ゲートウェイ納入と米国政府契約の2経路で売上を作り、衛星サービスの開始前から収益の実績を積みます。", "日本で楽天と組みJ-LEO契約による10億ドルの非希薄化資金を確保し、米国宇宙軍との契約も持ちます。株式の希薄化に頼らない資金経路と政府顧客の両方を持つ点が構造的な強みです。"], "summary": "僕はAST SpaceMobileを、衛星BlueBirdから通常のスマートフォンへ直接つなぐ通信網を作り、通信事業者経由のサービス料で稼ぐ形を目指す会社として見ています。現在の売上はゲートウェイ納入と米国政府契約で作り、2026年第3四半期の売上は4232万1000ドルで前年同期比187%増です。衛星サービス自体の売上はまだ計上されていません。", "weakness": "弱点は衛星配備の遅れに対して費用と資金消費が先行する点です。軌道投入目標は2027年半ばまでに45機で、第3四半期時点で展開を終えた機体はBlueBird 13までです。営業費用2億1102万6000ドルに加え、2026年9月までの9か月累計で固定資産購入が11億5419万6000ドルに達する一方で衛星サービスの売上はゼロです。打ち上げの遅延がさらに重なれば、サービス売上が立つ前に資金消費だけが進み、増資か計画縮小を選ぶ局面が来ます。"}, "astera-labs": {"date": "2月上旬", "deck": null, "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAMAAAD04JH5AAAAKlBMVEVHcExUb49jZ2o8ebtlZ2lRcJU8ebw8ebxlZ2k8ebxlZ2k8ebxlZ2k8ebw4Op8YAAAADHRSTlMAFGVhtDfckeC+jO+Vtt7FAAADzUlEQVR4nO1bUXuDIAwcVdRW/P9/d61iVxMOggbYQ+9x+7pk510uMvbz88UXX1yBMY0bePRtO7DTZJs20DvXt6x/c0/cGjYwvRpoqIKVAOcererbaWugmQ4fzjWlwO713dRGh/27gTY6vLkPNKDA9J8NTPUbeLgDqhtht2CzZ0AIqM4AJcBVtsFRga5+JN5I/drDmBFQexYzAiorgCmwtgepBWsnASWgdhZyBVYmgCqw9hA0VIH/xoKme6L804AW7O7zsixD8RaQBbtX+SfmsWx9RoBXoBkWj7moJmEIjMsb95IPAaWgHf4amLty9RkBXoHmg4CnEMtRQBU4EQV6FNMhsqC5H+rPQykdsj1sJ2AhGMs8BGRBe6cNlLGixIJFrQgtOPMGlgJWhCkYIOBJgf5DSIUA1aF2faEF31C3InoVYhYsRIEl9fdF1AyoAd1IgItoUIGeAk0roj3MQgIWVStaNIOAAjcoTiNkQRurr6jDXAvu0LKigTOIFqQN3XUakOxhm+rYV3QoQDOIWvApusCXroMS0IMUfE0eNpcUrMhSMLiILn7wUFkopKJwEfWSZ8a4bEWxBcdYXxcgXUT3QvzJXKsvt+D+CbahXdKheBH9GDmRb+VDuoh+hj/b0i9QkGfBHYpWlC6iR6nrWRGeRiQq0P7OvijBM3lmQTrxlazIFlF2HINURk16bkGVW5BHnkoqimdQ4AlrpCI8EBStPUyH+RSgFKSLaDhtrlsRvgoJf7KsTwz5Igq4jQ/LNG70jxJiC+64tqCKTyMi/rpkxTMpyH6JC1aEe1jWjEVLkwDSFIynzHkr5i6iCGdTEYZA9qZx0oooBfmuZQDePylDswIC2HHMPCCMNvwRkRVhCMSOYxg6QJqAAG 8%の増収を見込む水準です。非GAAP EPS見通し1.62ドルから1.66ドルと合わせて、量産前提の見通しと言えます。", "source": "https://www.sec.gov/Archives/edgar/data/1736297/000173629726000044/q326exhibit991.htm"}], "strengths": ["Scorpio X-Series 320レーンスイッチが量産へ入り最大の製品群になり、売上5億8490万ドルの前年同期比154%増を主導しました。ラック単位で採用される製品を持つ点が構造的な強さです", "非GAAP営業利益率44.7%は前四半期39.1%から5.6ポイント改善し、売上拡大局面で利益率を同時に上げました。規模拡大が費用効率へ直結する段階へ入りました", "Leo 2とLeo X-SeriesとAries 7とOrionを同時に展開し、メモリ接続と光接続とラック設計まで売り場を広げました。アクセラレータ1基あたりの搭載金額を増やす設計です"], "weakness": "弱点は運転資金の膨らみです。2026年1-9月に売掛金増加2億124万5000ドルと在庫増加1億4617万3000ドルが営業キャッシュフローを押し下げ、現金創出は純利益を下回りました。特定顧客向け出荷が止まれば在庫評価が下がり、売上成長と現金化のずれが損失へ変わります。", "sources": [{"title": "Astera Labs Reports Third Quarter 2026 Financial Results（2026年11月3日、SEC Form 8-K Exhibit 99.1）", "url": "https://www.sec.gov/Archives/edgar/data/1736297/000173629726000044/q326exhibit991.htm"}]}, "aurora-innovation": {"date": "2月10日", "deck": null, "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAMAAAD04JH5AAAAGFBMVEVHcEwAau4Aau0Aau0Aau0Aau4Aau0Aau07fnJPAAAAB3RSTlMAhhk2rFvWw6AYaQAAAqZJREFUeJzt2+1ugzAMBVDyRd7/jQcULYU4iWMbe9K4+ze1+KhxXQjtsrx583zCPV63vs/3uBfwAl7A/wF4ZwyI0Rbgsi0gZVvAXtgUsBoDYrYFpGwLOKuaAfxqDIjZFuCyLSBkY8BqDCj1bQAu2wJStgVcy+kDfDQGXOvrA1K2BYTVFuDv9bUBsSqlC3BVJV1AqOurAuo6ugBfN4AuAGgAVcB9Ap3xWoB6AhxJixKgUf9TSAMANmCOXgvQaICwKAGgCVTqPw/oNoAGoNEABfgwAJ5Aa9kRfxjQaIBUHvE04EhKzsW4QvUVzwf8Bvkg4uXfaoCzXlrj5ZaIwcXp9ZYMD+BdGv+l1LsPxAM0piyUNboUgEOoAU5EZVAFfI4fBJuQAtjehnJzgAbY1qIQbAA7wdsCtoUIxoDzpMwScLSCKWAvZgzYOsEYkOtTRmVAnRfwAmYAwWGynRDDl0d8ADbHGbEl4JOAMzx5VhwcYi0evi4YvwpEwOgy/DfDhSAChpfBhQo/lAloHBR+cLVvzweML8PxAgoA3QCDJ5ABo32YKQEBAH8kQA34JRAE9DcCW2m0DQHQ2wnupfVunAbMN0D3idOAxq0AxFdTG20wCaA1QM8+B5icQNfA3TMFmJ5A14Av3xSgeysAES6gcy8IF6gLJgCsBmgeAQ+gTqDvAGuIB5An0FeANUAD8OdAnQBrwHoLISdQCbCMSEBjjk41wB4qgDmBSuqFxB1DpAH21CuJArAn0G9oe0T8CcQEwA0wNwHOkLbpJCYQB0A5CZYECDYACSA2AagAyQagAMQmEBEg8xFEB0h9BJEBghOIBJBugFmA3EcQDdDYWGE0wBxAeALNA7hXQVxAYz+B+wtRNGDwhajHATKbCRxA9etcqV/oWv/s980fzw99jIeWqG3XEAAAAABJRU5ErkJggg==", "name": "Aurora Innovation", "status": "見込み", "focus": "無人トラック200台超の運行体制（2027年2月末目標）の進捗と第4四半期の現金使用", "summary": "僕はAurora Innovationを、Aurora Driverを運送会社へDaaSとTaaSで売り、無人輸送の走行実績で課金基盤を作る会社として見ています。無人商用走行は50万マイルを超え定時配送100%を保ちます。2026年第3四半期売上300万ドルに対し営業損失2億5700万ドルで、事業は量産台数と現金の持ち時間を競う段階にあります。", "next": "会社見通し2026年通期売上900万ドルを最初に置き、2026年第4四半期決算で到達を確認します。2026年12月初めに週20台の生産ペースへ届いたか、2027年2月末までに無人トラック200台を超えるか、第4四半期現金使用が会社見込み2億5000万ドル以内に収まるかを見ます。", "numbers": [{"label": "売上（2026年第3四半期）", "value": "300万ドル（前年同期100万ドル）", "note": "9か月累計売上は600万ドルです。無人運行が始まっても売上規模は費用構造に対して小さく、台数拡大が売上へ変わる速度が企業価値を決めます。", "source": "https://ir.aurora.tech/_assets/_b43b1c20802e72db7dcf51238ac7febe/aurora/db/956/10062/shareholder_letter/26Q3_Shareholder_Letter.pdf"}, {"label": "営業損失（2026年第3四半期）", "value": "2億5700万ドル", "note": "株式報酬5400万ドルを含み、株式報酬を除く研究開発費1億6000万ドルと販売管理費3800万ドルと売上原価800万ドルで構成されます。売上300万ドルの85倍を超える損失が現在の費用先行構造を示します。", "source": "https://ir.aurora.tech/_assets/_b43b1c20802e72db7dcf51238ac7febe/aurora/db/956/10062/shareholder_letter/26Q3_Shareholder_Letter.pdf"}, {"label": "無人商用走行距離（2026年9月時点）", "value": "50万マイル超、定時配送100%", "note": "運行開始以来の累計実績です。安全性と定時性の実績が運送会社の採用判断を支え、Charger Logisticsの500台覚書につながりました。", "source": "https://ir.aurora.tech/_assets/_b43b1c20802e72db7dcf51238ac7febe/aurora/db/956/10062/shareholder_letter/26Q3_Shareholder_Letter.pdf"}, {"label": "現金使用（2026年第3四半期）", "value": "営業キャッシュ使用1億7000万ドル、設備投資3600万ドル", "note": "四半期合計2億600万ドルの現金が事業から出ました。第4四半期は会社見込み2億5000万ドルまで増える前提で、量産投資が現金消費を加速させます。", "source": "https://ir.aurora.tech/_assets/_b43b1c20802e72db7dcf51238ac7febe/aurora/db/956/10062/shareholder_letter/26Q3_Shareholder_Letter.pdf"}, {"label": "会社見通し（2026年通期売上）", "value": "900万ドル", "note": "生産ランプが従来計画から6週間遅れた点を会社が見通しへ反映しました。売上自体より、遅延を取り戻す生産ペースが次の四半期の前提になります。", "source": "https://ir.aurora.tech/_assets/_b43b1c20802e72db7dcf51238ac7febe/aurora/db/956/10062/shareholder_letter/26Q3_Shareholder_Letter.pdf"}], "strengths": ["Aurora Driverの無人商用走行50万マイル超と定時配送100%は運送会社にとっての導入リスクを下げます。実績の蓄積自体が競合に対する参入障壁になります", "Charger LogisticsはDaaS方式で500台を保有運用する覚書を結び、会社は複数年で数億ドル規模の売上可能性を示しました。2027年から2028年の納入でDallasとLaredo間路線から始めます", "Roushのラインは年間1000台超の生産能力を目標に立ち上がり、Volvoは2027年に無人トラック300台超の展開を計画します。製造側の受け皿が複数社で具体化しました"], "weakness": "弱点は現金消費に対する売上の小ささです。第3四半期売上300万ドルに対し営業損失2億5700万ドルと現金使用2億600万ドルが出て、第4四半期現金使用は会社見込み2億5000万ドルまで増えます。週20台の生産と200台体制が遅れれば売上拡大も遅れ、追加調達なしに量産投資を続ける期間が短くなります。", "sources": [{"title": "Aurora Innovation Third Quarter 2026 Shareholder Letter（2026年10月28日、SEC Form 8-K Exhibit 99.1）", "url": "https://ir.aurora.tech/_assets/_b43b1c20802e72db7dcf51238ac7febe/aurora/db/956/10062/shareholder_letter/26Q3_Shareholder_Letter.pdf"}]}, "autostore": {"date": "2月11日", "deck": null, "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAAFKklEQVRoge1ZW2xUVRRde997Z6bTlgoaITEWg2K0FeXRV6oiEyAqGCCQoog/xlfChybGD6MxtAkmJCbyZaL8iPGDOgaBkBAeMS1JndJQSqCIoBj5UCLERy2dmc7MPXv7gYSh7SVn4I5gZCXzc/ectfbKPY999iVVxX8ZfKMTuF7cMnCj4ZaNuWFZHOavu8AFxaToz+jqGi2HDJVlEc95dLbJ5TaRmJkEKNg5QfHIG+hPnQxbKnwDc1vqZDTfA9HJVzxnOsc1NS3o7ToTply4ayCRcDVnNo5LHgBEp8rIhQ0gojAlwzWQz0+B+PVBYfKlEc1PV4cpGa4B5oKC/KCwAgVwVSFUyTDJ0NMzBM/dHRj33C+QSmbDlAzXgKqyU9mhrts9NkSuu4tN5aZQ9VCubbQ+USVe5hX1zUooGXEp6XmyBf39mbClymPgX8S1TSEiCnU7vA4++zewerWT//7sA67JvQfR+QDyIPqKq5wP0df3C0p9lUSEh5vuEaNvQWUZFASmrwsuvx89uuQ0dL2EZ4CIMKtxvvjmM4hML4qIOtztsPc8Bg+eK8nArKa71ZhOFWlB8UxgOs0ev4Cj/X02NHZTqG5BpfjyGkRqx44no08Iy7O2eV+CgF4alzwAiN4rBi+jtbXChsdyDaSrAH0IwATzVB0ystiO5zJIZVGAPqnoLIy6VTY8dgaYFUDgCQtQzoqnGIrA8pqBAjhjtabsDFTzsBINAJiIVITd7VY8RVCHdwSFlOgwsjOGbXjsDKRSWceLfASm7wBc3h0IeXLd7Q6uUj4ECUdMJzm8B0RFtREZEB3jmPcJvk3mbXhKO8hmN9XDyFojWg+gQEy97MW2YqDnbIn5X0TDY7V+Nr+W1DSCiIlwjL3Kz3HkwA+2FKWfxImEi2w2jiFXsWZxGuvt9utAdHQwtu6vxG0+obY2jWTSlDK8fKVERwdj164YAODw4VGoXp/RAJTFQLopMa0iM7IGKnOgpCA6lK6o6qzu7/otbK3wDTQsrtHMn/sg5hEFov/IjJLLvVQ3YymSN/N9gIgkP7RBxTRdTh4ANKa+ScjJM2+HqoewDSxaNAkF82Rg3DcrkXgxFqZkuAZyuQiggc0yUo0ictYJUzJcAwsX/q7sngoKq+Mewt696TAlQ1/EhXkt85xsfhtEp18RID7FldEVYXfnQm/uegN9A+xVPEOeuwPMGTCn4bqdHOHl5WgtQlXL90smHW1rc8qpcW0D29ocbW/n0BJpb+drNV に自社株買い5300万ドルを実行しました。利益率が下がる局面でも現金創出力が株主還元を支えます。", "source": "https://www.autostoresystem.com/hubfs/02%20Website/Investor%20relations/2026%20Documents/Q3%202026/Q3%202026%20Report.pdf?hsLang=en"}, {"label": "会社見通し（2026年通期売上）", "value": "7億5000万ドル", "note": "第2四半期時点7億ドルから会社が引き上げた水準です。1-9月累計5億4990万ドルとの差は2億10万ドルで、第4四半期に過去最大級の四半期売上が必要になります。", "source": "https://www.autostoresystem.com/hubfs/02%20Website/Investor%20relations/2026%20Documents/Q3%202026/Q3%202026%20Quarterly%20Press%20Release.pdf?hsLang=en"}], "strengths": ["売上前年同期比38.2%増の四半期に粗利率71.3%と調整後EBITDAマージン42.3%を保ち、営業キャッシュフロー1億140万ドルを生みました。ハードウェア販売でもソフト並みの粗利率を出す収益構造が強さです", "導入実績2050システム超と68か国超の販売網は新規顧客と既存顧客の拡張受注を同時に生みます。第3四半期受注1億7760万ドルは前年同期比16.5%増で第3四半期として過去最高です", "通期売上見通しを7億ドルから7億5000万ドルへ引き上げた局面で自社株買いを進め、11月4日までに5300万ドルを返しました。現金創出と還元を両立させる資本配分です"], "weakness": "弱点は受注残への依存です。受注残5億8160万ドルは前四半期比2.4%減で、受注は前四半期比18.3%減りました。通期見通し7億5000万ドルの達成には第4四半期売上2億10万ドルが必要です。受注回復が遅れれば受注残の目減りが翌期売上の鈍化へ直結し、マージン低下と重なって利益が崩れます。", "sources": [{"title": "AutoStore Q3 2026 Report（2026年11月5日、公式IR）", "url": "https://www.autostoresystem.com/hubfs/02%20Website/Investor%20relations/2026%20Documents/Q3%202026/Q3%202026%20Report.pdf?hsLang=en"}, {"title": "AutoStore Q3 2026 Quarterly Press Release（2026年11月5日、公式IR）", "url": "https://www.autostoresystem.com/hubfs/02%20Website/Investor%20relations/2026%20Documents/Q3%202026/Q3%202026%20Quarterly%20Press%20Release.pdf?hsLang=en"}]}, "bigbear-ai": {"date": "3月上旬", "deck": null, "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAMAAAD04JH5AAAAdVBMVEX///8AN/8ALf8AJf/4+v/j6v/r8P/c4v/G0P8AHP9Nbv8oSv+Zq/+br/+zvP/W3v/K1P+9xv9beP+ouP9rh/+0wv+9yv+Ekv+Spf85Y/87W/94jv8lVP9sf/+Pn/8JQP9PZ/+KmP8hT//P2f+ls/8gRf+Dm/9pVFA/AAAEj0lEQVR4nO1b6ZKyOhA1nbC7IJsCwQCK7/+IN+ygjBdnhK6vyvPTKulDp9M7m80XX3zxxb8OH5uAiSzf5iougTOxcQkk9IgqX03pFpWAbYHJMAkEhFioBLaUGBqifOYAoS4mgYIQ8BAJKIYkECES8CkhJEf0hR5IAiLAIxCWBGCHJl+xSEkgQyMQiIqAiWYEu/IEpC9Ec0WnmgDFisiq2RDACohaUcmXRoBEQKekARKBc0uAIkXkEFoCSLl5ewAELijytc4EwEEhsIeOQKRgEMg6AqT 0183698126000088/earningsrelease-3q26.htm"}, {"label": "粗利率（2026年第3四半期）", "value": "31.2%（前年同期22.4%から8.8ポイント改善）", "note": "生成AI基盤の売上構成が上がり、人手中心の受託型からソフト中心の収益構造へ移る兆しが出ました。粗利額は1359万4000ドルです。", "source": "https://www.sec.gov/Archives/edgar/data/1836981/000183698126000088/earningsrelease-3q26.htm"}, {"label": "受注残（2026年9月30日時点）", "value": "3億3000万ドル（第2四半期末比22%増）", "note": "第2四半期以降に25件を超える新規契約を取り、契約額は2億2500万ドルを超えます。売上4358万1000ドルの7倍を超える受注残が翌期以降の売上候補になります。", "source": "https://www.sec.gov/Archives/edgar/data/1836981/000183698126000088/earningsrelease-3q26.htm"}, {"label": "純損失（2026年第3四半期）", "value": "9185万4000ドル（のれん減損7673万7000ドルを含む）", "note": "前年同期は純利益252万1000ドルでした。減損を除いても調整後EBITDAは908万ドルの損失で、本業の黒字化は売上拡大後も残る課題です。", "source": "https://www.sec.gov/Archives/edgar/data/1836981/000183698126000088/earningsrelease-3q26.htm"}, {"label": "会社見通し（2026年通期売上）", "value": "1億5000万ドルから1億6500万ドル", "note": "従来見通しの中央値から5%引き上げた水準です。9か月累計売上1億1476万5000ドルとの差は3523万5000ドルから5023万5000ドルで、第4四半期の季節性が前提に入ります。", "source": "https://www.sec.gov/Archives/edgar/data/1836981/000183698126000088/earningsrelease-3q26.htm"}], "strengths": ["生成AI基盤BigBear Generative AI Platformが増収を主導し、粗利率は前年同期22.4%から31.2%へ8.8ポイント上がりました。買収製品が収益構造そのものを変えた点が強さです", "受注残3億3000万ドルは第2四半期末比22%増で、FBIと沿岸警備隊とエネルギー省を含む25件超の新規契約と契約額2億2500万ドル超が積み上がりました", "現金7711万2000ドルと売却可能投資3億2186万3000ドルの合計3億9897万5000ドルを持ち、調整後EBITDA損失908万ドルの四半期でも投資と営業を続ける資金基盤があります"], "weakness": "弱点は受注残の資金手当てです。受注残3億3000万ドルのうち資金手当て済みは23%にとどまり、残りは連邦予算の成立とタスクオーダーの発注待ちです。予算成立が遅れれば受注残は売上へ変わらず、固定費が先行して損失が続きます。第3四半期のれん減損7673万7000ドルは過去の買収価格を売上実績が支え切れていない証拠です。", "sources": [{"title": "BigBear.ai Announces Third Quarter 2026 Results and Raises FY 2026 Revenue Guidance（2026年10月27日、SEC Form 8-K Exhibit 99.1）", "url": "https://www.sec.gov/Archives/edgar/data/1836981/000183698126000088/earningsrelease-3q26.htm"}]}, "blackrock": {"date": "1月中旬", "deck": null, "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAMAAAAoLQ9TAAAAaVBMVEUAAAD///8FBQUCAgIDAwMBAQF3d3fw8PAJCQn5+fltbW1nZ2d6enqWlpYcHBzh4eG4uLixsbHNzc1ERETb29u/v7/FxcXo6OhPT08iIiI5OTlZWVlLS0stLS0TExOsrKzS0tI7OzugoKAD5e8vAAAAmklEQVQYlU2P2xKDIBBDE8AiXlHbaqVW7f9/ZEFgpnnJTGY3ZxeAKIMEIAt4CVSm11rfbV2iuIKGZnw8Z3JQIRG4UXeQqiUXqBS8vK2GN295QsD9T7y3te5pRe4wDLIfSKTA7sNozLGGJFNw9jzCJYmignPyrRnrL46YtKLQjZzD6lX6bdtdk1UsbSJWD9P1nMRWO+eWs4v//wBt2QbpD1wsfQAAAABJRU5ErkJggg==", "name": "BlackRock", "status": "見込み", "focus": "運用資産残高15兆4883億ドルと純流入の持続、iSharesへの流入1345億ドルと基本報酬成長率", "summary": "僕はBlackRockを、iShares ETFと機関投資家向け運用で残高連動の基本報酬を取り、Aladdinをサブスクリプションで売る会社として見ています。運用資産残高は15兆4883億ドルで世界最大の水準です。2026年7-9月期純流入2055億ドルはETF1345億ドルを中心に全顧客層へ広がり、年率換算の基本報酬成長は11%へ上がりました。", "next": "2026年10-12月期決算で純流入2055億ドルの水準が続くかを見ます。iSharesへの流入1345億ドルと年率換算基本報酬成長11%の維持、調整後営業利益率47.8%とGAAP営業利益率30.0%の差を作る買収関連費用の大きさを確認します。", "numbers": [{"label": "売上（2026年7-9月期）", "value": "77億5200万ドル（前年同期比19%増）", "note": "基本報酬と証券貸付収入60億3600万ドルが売上の中心で、平均運用資産残高15兆4601億ドルの前年同期比19%増が売上増へつながる残高連動型の構造です。", "source": "https://s24.q4cdn.com/856567660/files/doc_financials/2026/Q3/BLK-3Q26-Earnings-Release.pdf"}, {"label": "運用資産残高（2026年9月末）", "value": "15兆4883億ドル（前年同期比15%増）", "note": "過去12か月の純流入は8690億ドルで、年率換算の基本報酬成長は10%です。市場変動に頼らず流入だけで残高を積む力が規模の拡大を支えます。", "source": "https://s24.q4cdn.com/856567660/files/doc_financials/2026/Q3/BLK-3Q26-Earnings-Release.pdf"}, {"label": "純流入（2026年7-9月期）", "value": "2055億ドル（長期商品1748億ドル、キャッシュ運用307億ドル）", "note": "ETFへの流入1345億ドルが全体の65%を占めます。低コストETFで残高を取り、周辺の運用とテクノロジーへ広げる入口として機能しています。", "source": "https://s24.q4cdn.com/856567660/files/doc_financials/2026/Q3/BLK-3Q26-Earnings-Release.pdf"}, {"label": "テクノロジー収入（2026年7-9月期）", "value": "5億8800万ドル（前年同期比14%増）", "note": "Aladdinと複合商品の需要が伸びを支えました。市場残高に連動しないサブスクリプション収入は運用報酬中心の売上構成に別の柱を加えます。成功報酬は6億3000万ドルです。", "source": "https://s24.q4cdn.com/856567660/files/doc_financials/2026/Q3/BLK-3Q26-Earnings-Release.pdf"}, {"label": "調整後EPS（2026年7-9月期）", "value": "15.93ドル（前年同期比38%増）、GAAP EPS 10.57ドル（同25%増）", "note": "調整後営業利益33億3000万ドルと利益率47.8%に対し、GAAP営業利益率は30.0%です。差の主因は条件付対価の公正価値変動5億6400万ドルと無形資産償却2億7600万ドルで、買収の会計処理が報告利益を押し下げます。", "source": "https://s24.q4cdn.com/856567660/files/doc_financials/2026/Q3/BLK-3Q26-Earnings-Release.pdf"}], "strengths": ["四半期純流入2055億ドルがETF1345億ドルとアクティブ660億ドル超とキャッシュ運用307億ドルへ分散し、単一商品への依存なく残高を積みました。過去12か月流入8690億ドルが基本報酬成長10%を生む規模です", "調整後営業利益率47.8%は前年同期44.6%から3.2ポイント上がり、残高拡大局面で費用を売上が上回る運営を示しました。テクノロジー収入5億8800万ドルの前年同期比14%増が利益率を下支えします", "Aladdinを中核とするテクノロジー事業は運用資産残高に連動しない収入で、Preqin連携を含む複合商品へ広がります。運用と基盤の両方を売る構造が顧客の解約コストを上げます"], "weakness": "弱点は買収を重ねるほど広がるGAAP利益と調整後利益の開きです。第3四半期は条件付対価の公正価値変動5億6400万ドルでGAAP営業利益率が30.0%まで下がり、調整後47.8%と17.8ポイント開きました。買収先の業績が想定を下回れば対価の変動と償却が毎四半期の報告利益を揺らし続け、機関投資家向けインデックスの純流出274億ドルが示す価格競争と重なれば基本報酬率も下がります。", "sources": [{"title": "BlackRock 2026年第3四半期決算発表（2026年10月14日、公式決算リリース）", "url": "https://s24.q4cdn.com/856567660/files/doc_financials/2026/Q3/BLK-3Q26-Earnings-Release.pdf"}]}, "broadcom": {"date": "12月9日", "deck": null, "logo": "../assets/logos/broadcom.svg", "name": "Broadcom", "status": "確定", "focus": "会社見通し売上348億ドルとAI半導体217億ドルの達成、非GAAP粗利率の水準", "summary": "僕はBroadcomを、大手クラウド事業者へカスタムAIアクセラレータとAIネットワーキング半導体を売り、VMwareのインフラソフトをサブスクリプションで売る会社として見ています。2026年度第3四半期AI半導体売上167億ドルは売上全体の56%を占め、前年同期比221%増で会社の重心はAI半導体へ移りました。", "next": "会社見通し2026年度第4四半期売上348億ドルとAI半導体217億ドルを最初に置き、2026年12月9日発表の決算で到達を確認します。非GAAP粗利率75.0%からの低下が会社見通しの水準で止まるか、非AI半導体42億ドルの伸びが戻るかを見ます。", "numbers": [{"label": "売上（2026年度第3四半期）", "value": "295億9100万ドル（前年同期比86%増）", "note": "四半期として過去最高で、会社見通し294億ドルを上回りました。半導体部門が全体の70%を占める構成へ変わり、成長の主語はソフトから半導体へ移りました。", "source": "https://www.sec.gov/Archives/edgar/data/1730168/000173016826000076/avgo-08022026x8kxex99.htm"}, {"label": "AI半導体売上（2026年度第3四半期）", "value": "167億ドル（前年同期比221%増、前四半期比54%増）", "note": "売上全体の56%と半導体部門売上の80%を占めます。カスタムAIアクセラレータとネットワーキングの2製品群が会社全体の成長を決める水準まで大きくなりました。", "source": "https://www.sec.gov/Archives/edgar/data/1730168/000173016826000076/avgo-08022026x8kxex99.htm"}, {"label": "半導体部門売上（2026年度第3四半期）", "value": "208億3900万ドル（前年同期比127%増、売上構成比70%）", "note": "非AI半導体は42億ドルで前年同期比5%増にとどまります。部門内の伸びはAI向けに集中し、従来型半導体の循環とは切り離された成長構造です。", "source": "https://www.sec.gov/Archives/edgar/data/1730168/000173016826000076/avgo-08022026x8kxex99.htm"}, {"label": "フリーキャッシュフロー（2026年度第3四半期）", "value": "136億6500万ドル（売上比46%）", "note": "営業キャッシュフロー141億9700万ドルから設備投資5億3200万ドルを引いた金額です。巨額の研究開発と買収を進める局面でも現金創出が成長投資を上回ります。四半期配当は1株0.65ドルです。", "source": "https://www.sec.gov/Archives/edgar/data/1730168/000173016826000076/avgo-08022026x8kxex99.htm"}, {"label": "会社見通し（2026年度第4四半期）", "value": "売上348億ドル、AI半導体217億ドル", "note": "売上は前年同期比93%増、AI半導体は同236%増を見込む水準です。非GAAP営業利益は売上比66%を会社が見通し、12月9日の決算で実績と照合します。", "source": "https://www.sec.gov/Archives/edgar/data/1730168/000173016826000076/avgo-08022026x8kxex99.htm"}], "strengths": ["カスタムAIアクセラレータとAIネットワーキングで大手クラウド事業者の採用が進み、AI半導体売上167億ドルは前年同期比221%増と前四半期比54%増を同時に記録しました。顧客の基盤モデル投資に直接組み込まれる位置が強さです", "VMware中心のインフラソフトウェア部門売上87億5200万ドルは前年同期比29%増で売上構成比30%を保ちます。半導体の循環と異なるサブスクリプション収入が会社全体の変動を抑えます", "非GAAP営業利益200億9500万ドルは前年同期比92%増で、フリーキャッシュフロー136億6500万ドルは売上比46%に達しました。成長率と現金創出を同時に上げる規模の経済が働いています"], "weakness": "弱点はAI集中と引き換えの粗利率低下です。非GAAP粗利率は前年同期78.4%から75.0%へ下がり、第4四半期会社見通しは売上比66%の非GAAP営業利益率です。大手クラウド事業者の投資計画が1四半期でも鈍ればAI半導体217億ドルの見通しが崩れ、低粗利のAI構成比上昇が利益率と成長率を同時に押し下げます。", "sources": [{"title": "Broadcom 2026年度第3四半期決算発表（SEC Form 8-K Exhibit 99.1、2026年9月2日）", "url": "https://www.sec.gov/Archives/edgar/data/1730168/000173016826000076/avgo-08022026x8kxex99.htm"}]}, "byd": {"date": "3月下旬", "deck": null, "focus": "2026年通期純利益の積み上がりと在庫2215億7751万元の圧縮、地域別収益と自動車粗利率", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAACKklEQVRYhe2TPU8UURSGnzMzy8cyq5FCmQ2FFbhIJaWVSmFhaaWFCYWxoDTEmGhhY4wWRP6Axo9GKSwxJsZWLCjUXUjsZIdEBSPMGtaZ+1rAbgBX/gDzNPeec+495z3n5kJOTk5OzkHHqmH0AiPc5QQnZw6PH5mz6dFkeaFWKg8756YCswdDG3G1U7KlMKqk0vVKsnJ1qThwyvl2B0Agc5aZKRU0JOYrSTxjkAXARbQ7kQBMIAjMDQLjZu6wmU2kTrNARwFyOm6eTXxlcFKWDSHObzcEpnYZMy7V+qKjJPFN2288Hxnp8sO1TUlXGon3si9UkqGToxsrnzueDwdGfOwTZqdX1uvvB/v7iwCZ56mQZV4zLQZBSm/qZecwe2TGk6AaRk+B4rbStiAHZvw8BGx6KryBDABf3r1qWH4t574ILzZfY0jdHp4vuXEMMmeNM5Cyuvprt8S11uZxtVSOJN0NgG4ZPe3RbwsxAKl7y59GY8TxItG0TJeBC3j2ylBs4hoYQmD2zWB6NFle2G+yWzVcJox9n0Dg18Iolez+SFKf2huvhgMzYJOVjfifPG8hKFHuatmFY5mFzWbwuxn0+hTOYnoGPA+qYaS9l1vUtpZ3laR+o3MbXgmJWqk8fGK9vrgzFIXl20K32o7Eo0kP/tZoaTUVALPQ/oZG6xMYmeA7GQ8NXEcBjjmhLECre0My5hFzO2xn0h+ggfjgkiMzUP9f7zk5OTk5B4i/DC/stEpFRAMAAAAASUVORK5CYII=", "name": "BYD", "next": "会社見通しは開示されていません。次は2027年3月下旬の2026年通期決算で、純利益が1-9月累計223億4498万元から第4四半期にどこまで積み上がるか、在庫2215億7751万元を年末に圧縮できるか、年次開示で地域別収益と自動車事業の粗利率を確認します。", "numbers": [{"label": "売上（2026年7-9月期）", "value": "2214億8825万元（前年同期比13.6%増）", "note": "1-9月累計売上5663億367万元は前年同期とほぼ横ばいであり、増収は第3四半期に集中します。通期の成長は第4四半期の販売が第3四半期の勢いを維持できるかにかかります。", "source": "https://www1.hkexnews.hk/listedco/listconews/sehk/2026/1029/2026102900816.pdf"}, {"label": "純利益（2026年7-9月期）", "value": "100億1957万元（前年同期比28.1%増）", "note": "1-9月累計純利益223億4498万元は前年同期から4.2%減っており、単四半期の増益は累計の減益を埋める途上にあります。特別項目を除いた純利益86億3045万元が実力値に近い水準です。", "source": "https://www1.hkexnews.hk/listedco/listconews/sehk/2026/1029/2026102900816.pdf"}, {"label": "営業キャッシュフロー（2026年1-9月期）", "value": "544億6957万元（前年同期比33.4%増）", "note": "利益が累計で減る局面でも現金回収は33.4%増えました。販売現場の回収が崩れていないため、在庫投資を自己資金で賄う余力が残ります。", "source": "https://www1.hkexnews.hk/listedco/listconews/sehk/2026/1029/2026102900816.pdf"}, {"label": "在庫（2026年9月30日時点）", "value": "2215億7751万元（2025年末比60.1%増）", "note": "売掛金564億7262万元も2025年末から52.6%増えました。会社は両方の増加理由に海外の自動車事業拡大を挙げており、海外展開が生産と債権を先行させる構造へ変わった点を示します。", "source": "https://www1.hkexnews.hk/listedco/listconews/sehk/2026/1029/2026102900816.pdf"}], "sources": [{"title": "BYD 2026年第3四半期報告書（2026年10月29日、香港取引所開示）", "url": "https://www1.hkexnews.hk/listedco/listconews/sehk/2026/1029/2026102900816.pdf"}], "status": "見込み", "strengths": ["電池から車両まで自社で手がける体制を持ち、電池価格と部品供給を外部市況に左右されにくい原価構造を作ります。第3四半期はこの構造で売上13.6%増と純利益28.1%増を同時に戻しました。", "営業キャッシュフローが1-9月で544億6957万元と前年同期から33.4%増え、海外展開で在庫が60.1%増える局面でも投資を現金回収で支える力を保ちます。"], "summary": "僕はBYDを、電池から車両まで自社で作り電気自動車とプラグインハイブリッド車を量産販売する会社として見ています。中国を最大市場に海外販売を広げ車両販売で稼ぐ構造です。2026年7-9月期は売上2214億8825万元で前年同期から13.6%増え純利益100億1957万元で28.1%増え、1-9月累計の減益から単四半期で増益へ戻しました。", "weakness": "弱点は海外展開に伴う運転資金の膨張です。在庫は2025年末から60.1%増えて2215億7751万元に達し売掛金も52.6%増えて564億7262万元になりました。海外販売が鈍れば在庫が滞留し値引き販売と評価損で粗利益を削り、1-9月累計で4.2%減った純利益の回復が止まります。"}, "c3ai": {"date": "12月2日", "deck": null, "focus": "第2四半期売上見通し5100万ドルから5500万ドルの達成と受注の売上化、粗利率の回復", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAMAAAD04JH5AAAAS1BMVEX///8AAAB6enpZWVnu7u44ODj4+Phra2tmZmbz8/N2dnbr6+tOTk6qqqpUVFQfHx/f39+dnZ2NjY1eXl6FhYUwMDATExOTk5NISEg9eRF1AAABAElEQVR4nO3auxqCMAxAYblYShUQ8fb+T+qgrlSS1sjHOTPDvwAlZLcjIiIiIvrLulAmL3QLAKHIUFgAKHMASgAAACwA3B/HV5W6fpAA2sO7Wt2plwASVlcAAAAQAZw6HSB+JAvNbH78CGQA/ZHM6wD6l1EDAMDmAaluw6EXHsTOiQCTi188nxJQ1QAAAFg9wE1pAO5y3cu6JQL4QpsS0AAAsHmA+W1o/SASl+pRLM78ZQQAwNoB5p9m5h+n4piSAQCgBJgPq2Pj+siwXj+uN/9hkTAAAADIAK6NlneBYZx8pOnrw5lohSPLLtmqtmgAADAHmK90mi+1EhERERH9sCe33CXcflqsigAAAABJRU5ErkJggg==", "name": "C3.ai", "next": "会社見通しは第2四半期売上が5100万ドルから5500万ドル、通期売上が2億1000万ドルから2億4000万ドルです。次は12月2日の第2四半期発表で、見通しの達成と受注22件の売上化の時期、非GAAP粗利率とGAAP粗利率32%からの戻りを確認します。", "numbers": [{"label": "売上（2027年度第1四半期）", "value": "5237万5000ドル（前年同期比25%減）", "note": "前年同期7026万1000ドルから大きく減りました。減収下で受注が前四半期から73%増えたため、焦点は受注が売上へ変わる時期へ移ります。", "source": "https://www.sec.gov/Archives/edgar/data/1577526/000157752626000119/ex991-fy27xq1earnings.htm"}, {"label": "サブスクリプション売上（2027年度第1四半期）", "value": "4916万9000ドル（売上全体の94%）", "note": "プロフェッショナルサービス売上は320万6000ドルまで縮みました。導入支援への依存が下がり、継続課金の比率が上がる収益構造へ寄った点を示します。", "source": "https://www.sec.gov/Archives/edgar/data/1577526/000157752626000119/ex991-fy27xq1earnings.htm"}, {"label": "現金残高（2027年度第1四半期末）", "value": "6億5110万ドル（前四半期から7600万ドル増）", "note": "フリーキャッシュフロー210万ドルの黒字と合わせて、減収局面でも資金調達に頼らず立て直しを進める期間を確保します。現金の厚みが交渉力と採用の持続力を支えます。", "source": "https://www.sec.gov/Archives/edgar/data/1577526/000157752626000119/ex991-fy27xq1earnings.htm"}, {"label": "非GAAP営業損失（2027年度第1四半期）", "value": "3620万ドル（前四半期から33%改善）", "note": "GAAP純損失は9281万2000ドルで1株あたり0.60ドルです。費用削減で営業損失は縮みましたが売上5237万5000ドルに対する損失幅は依然大きく、黒字化には増収の回復が要ります。", "source": "https://www.sec.gov/Archives/edgar/data/1577526/000157752626000119/ex991-fy27xq1earnings.htm"}, {"label": "会社見通し（2027年度第2四半期売上）", "value": "5100万ドルから5500万ドル（通期売上見通し2億1000万ドルから2億4000万ドル）", "note": "第2四半期見通しは第1四半期実績と同水準であり、会社は増収の再開を第3四半期以降に置きます。通期の非GAAP営業損失見通しは1億2300万ドルから1億5500万ドルです。", "source": "https://www.sec.gov/Archives/edgar/data/1577526/000157752626000119/ex991-fy27xq1earnings.htm"}], "sources": [{"title": "C3 AI Announces Fiscal First Quarter 2027 Results（2026年9月2日、SEC Form 8-K Exhibit 99.1）", "url": "https://www.sec.gov/Archives/edgar/data/1577526/000157752626000119/ex991-fy27xq1earnings.htm"}], "status": "確定", "strengths": ["受注が前四半期から73%増え契約22件を閉じました。Ford Motor CompanyとJohnson & JohnsonとHeidelberg Materialsに加え米農務省と防衛兵站局と米海兵隊が入り、民間と政府の両方で導入先が広がる構造を持ちます。", "現金6億5110万ドルを持ちフリーキャッシュフローが210万ドルの黒字へ転じました。売上2億1000万ドルから2億4000万ドルの通期見通しに対して現金が厚く、減収期に値引きで受注を買う必要が下がります。", "非GAAP営業損失が3620万ドルまで縮み前四半期から33%改善しました。費用側を締めながら受注を積む形が作れており、増収が戻れば損失の縮小が加速する構造です。"], "summary": "僕はC3.aiを、C3 AI Platformの上で業種別AIアプリケーションをサブスクリプションで大企業と米政府機関へ売る会社として見ています。顧客にはFord Motor Companyと米海兵隊が入り、売上は継続課金が中心です。2027年度第1四半期は売上5237万5000ドルで前年同期から25%減る一方、受注は前四半期から73%増え、減収と受注回復が同時に起きました。", "weakness": "弱点は大型契約の時期に売上が左右される収益構造です。売上は前年同期から25%減って5237万5000ドルにとどまりGAAP粗利率は32%まで下がりました。第3四半期以降も増収へ戻らなければ通期見通しの下限2億1000万ドルに届かず、現金6億5110万ドルを営業損失の穴埋めに食う期間が延びます。"}, "cameco": {"date": "2月12日", "deck": null, "focus": "2026年生産見通し1950万ポンドから2050万ポンドの達成と2027年ガイダンス、Key Lake再開後の原価", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPoAAAC1CAYAAAB24uKEAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAAGYktHRAD/AP8A/6C9p5MAAC20SURBVHja7Z15YFTV9cc/582EAAFFAVGEWZIIalyquFarqEUqaN2agEvdcIGAWGlrW2t/Ulvrwk9tgSTgUmtbFJK61AXrhlhxF/lpGxTIMhMiyiZuIQmZeef3R4KGMG+WNxNI4H7/S+a++967537vWd6954CBgYGBgYGBgYGBgYFB94WKGYNdB0aYBtsTvKjsBmA0WZFzmDf1SzMmhugGuxIumrkHW7L+iujZrZzXd4noD3h8ykYzOIboBrsCzp97IN7I46gc2OGX5VjRUcy/do0ZpO4LywyBAYUl4/BE341BcoCDsT1LOL801wyU0egG3ZLg5R5kw63ADUnMhTrEHsWCKSvNwBmiG3QfLd4HkX8Ao5O/SNfikdN5pPgDM4DGdDf 1億7500万カナダドルです。過去に結んだ長期契約の価格改定が進み、市況価格への連動が利益側へ効く段階に入ります。", "source": "https://www.sec.gov/Archives/edgar/data/1009001/000119312526439858/d106072dex991.htm"}, {"label": "ウラン生産原価（2026年第3四半期、Cameco持分）", "value": "1ポンドあたり57.40カナダドル（前年同期36.36カナダドルから58%増）", "note": "生産量は350万ポンドで前年同期440万ポンドから20%減りました。Key Lake製錬所の保守停止を長く取ったため固定費を少ない生産量で割る形になり、原価が跳ね上がります。", "source": "https://www.sec.gov/Archives/edgar/data/1009001/000119312526439858/d106072dex991.htm"}, {"label": "ウラン部門粗利益（2026年第3四半期）", "value": "1億1100万カナダドル（前年同期1億5800万カナダドルから30%減）", "note": "実現価格が8%上がっても原価58%増が上回り部門利益を削りました。価格上昇を利益へ変える条件は生産量の回復である点を示します。", "source": "https://www.sec.gov/Archives/edgar/data/1009001/000119312526439858/d106072dex991.htm"}, {"label": "会社見通し（2026年ウラン生産量、Cameco持分）", "value": "1950万ポンドから2050万ポンド（販売量見通し2950万ポンドから3050万ポンド）", "note": "生産見通しの上限は2150万ポンドから引き下げられました。今後5年間の契約済み引渡しは年平均2800万ポンドを超え、販売量が自社生産量を上回る構造が続きます。", "source": "https://www.sec.gov/Archives/edgar/data/1009001/000119312526439858/d106072dex991.htm"}], "sources": [{"title": "Cameco reports third quarter results（2026年10月30日、SEC Form 6-K Exhibit 99.1）", "url": "https://www.sec.gov/Archives/edgar/data/1009001/000119312526439858/d106072dex991.htm"}], "status": "確定", "strengths": ["今後5年間で年平均2800万ポンドを超える契約済み引渡しを持ちます。電力会社との長期契約が販売量の見通しを先に固めるため、スポット市況に売上が直結しない構造です。", "平均実現価格が1ポンドあたり65.78米ドルまで上がり前年同期から6%増えました（カナダドル建てでは91.76ドルで8%増）。販売量560万ポンドへ減った四半期でも売上6億1900万カナダドルを維持し、契約価格の改定が収益を下支えします。", "Westinghouse持分の調整後EBITDAが第3四半期に1億4300万カナダドルまで増え前年同期1億2400万カナダドルを上回りました。ウラン採掘と燃料加工に原子炉事業の利益が重なる二層構造を持ちます。"], "summary": "僕はCamecoを、カナダでウランを掘り転換と燃料加工まで手がけ電力会社へ長期契約で売る会社として見ています。原子力発電所向けの長期契約が売上の土台であり、Westinghouse持分49%が第二の柱です。2026年第3四半期は売上6億1900万カナダドルで前年同期から1%増え、平均実現価格65.78米ドルの上昇が販売量560万ポンドへの減少を埋めました。", "weakness": "弱点は生産がKey Lake製錬所を含む少数拠点に集中する構造です。第3四半期は保守停止で生産量が20%減って350万ポンドとなり生産原価が58%増えて1ポンドあたり57.40カナダドルまで上がりました。再開が遅れるか生産が再び止まれば契約済み引渡し年平均2800万ポンド超を外部購入で埋める場面が増え、部門粗利益は第3四半期の30%減を超える幅で縮みます。"}, "centrus": {"date": "2月9日", "deck": null, "focus": "通期売上見通し4億5000万ドル で続きます。濃縮分野の販売コミットメント54億ドルは運転マイルストーンの達成を条件に含み、確定売上と条件付き売上が混ざる内訳である点が重要です。", "source": "https://www.sec.gov/Archives/edgar/data/1065059/000162828026070229/ex991-10q2026_11x04.htm"}, {"label": "調整後純損失（2026年第3四半期）", "value": "940万ドル（GAAP純利益3160万ドル）", "note": "GAAP純利益にはワラント負債の評価益4640万ドルを含みます。粗損失は1060万ドルで前年同期の粗損失430万ドルから広がり、本業の採算は評価益を除くと赤字である点を示します。", "source": "https://www.sec.gov/Archives/edgar/data/1065059/000162828026070229/ex991-10q2026_11x04.htm"}, {"label": "現金（2026年9月30日時点）", "value": "22億3610万ドル（制限付き現金を合わせると22億6940万ドル）", "note": "通期の資本配分見通し3億5000万ドルから5億ドルに対して現金が厚く、PiketonとOak Ridgeの増設を借入に頼らず進める資金基盤になります。", "source": "https://www.sec.gov/Archives/edgar/data/1065059/000162828026070229/ex991-10q2026_11x04.htm"}, {"label": "会社見通し（2026年通期売上）", "value": "4億5000万ドルから5億ドル（維持）", "note": "第3四半期売上が26%減る局面でも会社は見通しを維持しました。達成には第4四半期に売上の集中が必要であり、引渡し時期への依存が通期数字を決めます。", "source": "https://www.sec.gov/Archives/edgar/data/1065059/000162828026070229/ex991-10q2026_11x04.htm"}], "sources": [{"title": "Centrus Reports Third Quarter 2026 Results（2026年11月4日、SEC Form 8-K Exhibit 99.1）", "url": "https://www.sec.gov/Archives/edgar/data/1065059/000162828026070229/ex991-10q2026_11x04.htm"}], "status": "見込み", "strengths": ["濃縮分野の販売コミットメントが54億ドルまで積み上がり技術ソリューション部門の受注残8億ドルと合わせて受注残70億ドルを持ちます。Piketon増設に対する需要側の裏付けが契約の形で先に固まります。", "Oak Ridgeで遠心分離機の製造を終えてPiketonへの出荷を始め、重要サプライチェーンの契約固めを年末目標より前倒しで終えました。通期資本配分見通し3億5000万ドルから5億ドルの投資を実行へ移す段階に入ります。", "現金22億3610万ドルを持ちます。売上5550万ドルの四半期規模に対して現金が大きく、増設投資と運転資金を同時に進める期間を確保します。"], "summary": "僕はCentrusを、低濃縮ウランLEUを米電力会社へ長期契約で売り高濃縮HALEUの濃縮を米エネルギー省向けに手がける会社として見ています。オハイオ州Piketonで国産濃縮能力を作る点が市場での位置を決めます。2026年第3四半期は売上5550万ドルで前年同期から26%減る一方、受注残は70億ドルに達し、現在の売上と将来の契約規模の差が広がりました。", "weakness": "弱点は受注残の大半が運転開始を条件とする構造です。販売コミットメント54億ドルはPiketonの生産能力建設と運転マイルストーン達成を前提とし、第3四半期の粗損失は1060万ドルまで広がりました。建設が遅れるかエネルギー省がHALEU運転契約の追加オプションを行使しなければ、受注残は売上へ移らないまま残り現金22億3610万ドルだけが先に減ります。"}, "circle": {"date": "2月下旬", "deck": null, "focus": "通期その他売上案内3億1000万ドルから3億3000万ドルの達成と準備金収入の戻り、期末流通量の伸び", "logo 占める一回性の計上です。本業の準備金収入が減る四半期に合計売上17%増を作った要因であり、翌期以降は同じ額を前提にできません。", "source": "https://www.sec.gov/Archives/edgar/data/1876042/000187604226000309/finalq3epr-110326.htm"}, {"label": "USDC平均流通量（2026年7-9月期）", "value": "733億ドル（前年同期比8%増）", "note": "期末流通量は739億ドルで前年同期と横ばいです。四半期平均は増えても期末時点で伸びが止まっており、準備金収入の土台である残高拡大が鈍る兆しを示します。", "source": "https://www.sec.gov/Archives/edgar/data/1876042/000187604226000309/finalq3epr-110326.htm"}, {"label": "USDCオンチェーン取引量（2026年7-9月期）", "value": "13.9兆ドル（前年同期比49%増）", "note": "流通量の伸び8%を取引量の伸び49%が大きく上回ります。USDCが保有残高としてだけでなく決済の通過量で使われる比率が上がり、手数料型収益を伸ばす余地が広がります。", "source": "https://www.sec.gov/Archives/edgar/data/1876042/000187604226000309/finalq3epr-110326.htm"}, {"label": "調整後EBITDA（2026年7-9月期）", "value": "3億1700万ドル（前年同期比85%増）", "note": "継続事業の純利益は2億2600万ドルで前年同期から5%増えました。流通コスト差引後の売上は4億5300万ドルで55%増えマージンは52%に達し、配布先へ払うコストを差し引いても利益が残る形を示します。", "source": "https://www.sec.gov/Archives/edgar/data/1876042/000187604226000309/finalq3epr-110326.htm"}], "sources": [{"title": "Circle Reports Third Quarter 2026 Results（2026年11月4日、SEC提出の決算リリース）", "url": "https://www.sec.gov/Archives/edgar/data/1876042/000187604226000309/finalq3epr-110326.htm"}], "status": "見込み", "strengths": ["USDCオンチェーン取引量が13.9兆ドルへ49%増えました。流通シェア27%に対して取引量の伸びが大きく、決済で実際に使われる位置が収益の土台になります。", "決済網CPNの年換算処理額が413億ドルへ届き、シンガポールのTazapay買収で法人向け送金の入口を増やしました。準備金収入以外の手数料収益を作る経路が具体的な処理額で伸びます。", "Binanceが1億ドルの株式投資とUSDC提携の更新を決めました。配布先の大手取引所が資本と提携の両方で関与を深めるため、流通残高の獲得競争で不利になりにくい構造です。"], "summary": "僕はCircleを、米ドル連動ステーブルコインUSDCを発行し流通残高に対する準備金運用益と決済サービスの手数料で稼ぐ会社として見ています。USDCの流通シェアは27%で、オンチェーン取引量は13.9兆ドルに達します。2026年7-9月期は売上と準備金収入の合計が8億6500万ドルで前年同期から17%増える一方、準備金収入は6億5800万ドルへ8%減り、増分をArcトークン先行販売1億8200万ドルが作りました。", "weakness": "弱点は収益が準備金の運用利回りに集中する構造です。準備金収入は売上合計の76%を占める6億5800万ドルであり、平均流通量が8%増えても利回りが61ベーシスポイント下がると8%減りました。利回りがさらに下がり期末流通量739億ドルの横ばいが続けば、Arc先行販売1億8200万ドルの一回性計上が消える翌期以降に合計売上が前年同期を割り利益率52%の水準を保てなくなります。"}, "cognex": {"date": "2月中旬", "deck": null, "focus": "通期売上見通し11億4300万ドルから11億6300万ドルの達成とRealSense買収完了、2027年見通し", " ves/edgar/data/851205/000085120526000079/a10042026-xex991xq32026ear.htm"}, {"label": "営業利益（2026年第3四半期）", "value": "1億82万2000ドル（営業利益率32.2%）", "note": "調整後EBITDAは1億1139万9000ドルで売上比35.5%です。粗利率70.8%の製品構成を保ちながら営業利益率を32.2%まで上げ、売上増がそのまま利益増へ移る構造を示します。", "source": "https://www.sec.gov/Archives/edgar/data/851205/000085120526000079/a10042026-xex991xq32026ear.htm"}, {"label": "調整後EPS（2026年第3四半期）", "value": "0.53ドル（前年同期比61%増）", "note": "9四半期連続の成長です。GAAPの純利益は8482万ドルでEPSは0.50ドルであり、調整後との差が小さく利益の質が保たれます。", "source": "https://www.sec.gov/Archives/edgar/data/851205/000085120526000079/a10042026-xex991xq32026ear.htm"}, {"label": "フリーキャッシュフロー（2026年第3四半期）", "value": "1億377万6000ドル（現金と投資8億4600万ドル、負債ゼロ）", "note": "四半期配当を0.09ドルへ増やしました。負債ゼロで現金が厚いため、RealSense買収の支払いと株主還元を借入なしで進める選択肢を持ちます。", "source": "https://www.sec.gov/Archives/edgar/data/851205/000085120526000079/a10042026-xex991xq32026ear.htm"}, {"label": "会社見通し（2026年）", "value": "第4四半期売上2億7000万ドルから2億9000万ドル、通期売上11億4300万ドルから11億6300万ドル", "note": "通期見通しを引き上げました。第4四半期見通しの中間値は第3四半期実績から11%下がる計算であり、消費者向け電子機器の季節的な出荷減を見通し自体が織り込む点を示します。", "source": "https://www.sec.gov/Archives/edgar/data/851205/000085120526000079/a10042026-xex991xq32026ear.htm"}], "sources": [{"title": "Cognex Reports Third Quarter 2026 Results（2026年11月4日、SEC Form 8-K Exhibit 99.1）", "url": "https://www.sec.gov/Archives/edgar/data/851205/000085120526000079/a10042026-xex991xq32026ear.htm"}, {"title": "Cognex to Acquire RealSense（2026年9月22日、SEC Form 8-K Exhibit 99.1）", "url": "https://www.sec.gov/Archives/edgar/data/851205/000085120526000071/exhibit991-pressrelease.htm"}], "status": "見込み", "strengths": ["粗利率70.8%と営業利益率32.2%を同時に保ち、売上3億1338万7000ドルの四半期最高記録を作りました。In-Sightを中心とするマシンビジョンの単価とソフトウェア比率が高い製品構成が数量変動下でも利益率を守ります。", "調整後EPSが0.53ドルで前年同期から61%増え9四半期連続で成長しました。単発の大型案件に頼らず複数四半期にわたり利益を積む形が続き、最終市場の広がりが数字に表れます。", "現金と投資が8億4600万ドルで負債がゼロです。RealSenseの2026年売上見込み8000万ドルから9000万ドルの事業を現金で取り込み、深度センサーを既存の検査用途へ広げる投資余力を持ちます。"], "summary": "僕はCognexを、工場と物流の顧客へIn-Sight等のマシンビジョンと画像式バーコードリーダーを売り製造ラインの検査と読み取りを自動化する会社として見ています。本体販売が中心で粗利率は70%を超えます。2026年第3四半期は売上3億1338万7000ドルで前年同期から13%増えて四半期で過去最高となり、医療ラボ自動化の提携による一時的な押し上げを除く伸びは19%に達しました。", "weakness": "弱点は最終市場の設備投資と季節性に売上が連動する構造です。第4四半期売上見通し2億7000万ドルから2億9000万ドルの中間値は第3四半期から11%下がり、消費者向け電子機器の出荷減が直撃します。主要市場の設備投資が凍結され受注の先送りが広がれば、粗利率70.8%の製品でも固定費を売上減で割る形になり営業利益率32.2%は短期間で崩れます。"}, "coherent": {"date": "2月3日", "deck": null, "focus": "Q2売上見通し25億5000万〜27億5000万ドルの達成と四半期売上30億ドルへの道筋、データセンター間光リンクの伸びを見る", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPoAAAA1CAQAAADCWz7XAAAABGdBTUEAALGPC/xhBQAAACBjSFJNAAB6JgAAgIQAAPoAAACA6AAAdTAAAOpgAAA6mAAAF3CculE8AAAAAmJLR0QA/4ePzL8AAAAHdElNRQfqCAkBNTski9eqAAAIvUlEQVR42u2ce3QU1R3HP5snj/KIQYryrpJ6SjkQA6VqQUICqQgGsCCoja321IZCKVUOVSitgm1tC5V6xHLMEYtNA41CwrGNJO0ptoIvKCDVNMVoBRNAQghJRPLa9I+d3L0zO3dmdjcls5z53j927mPuzP6+c+/9Pe6MD2dI5Wa+RBpppNKXfjRygZO8RyX72U8THi4rDGEFB+igU5naKOc+BniiujwwjkLaLOiWUyNPMNITWWxjKEX4HRLelS7yuDfiYxU+ltIYJuFdqZZbPAHGHlLYFSHhgeTnNyR4YowljKLKktJ8Pk8aN/Bzy1YVpHiijBWMpcZmHE/WWt5p0+4QqZ443Yk4XW405VzdTT1PoIKBnoDdTvoV7Ok2ygHS2U68J2I3k+7jOcbo6ippCbO3eo7r8jk87onYzfi+YU3eywByuBDGmn6GCQzjHV1ZB5meaN2KETQbKO8NQDafOCT9NOMAuJJKXfkH9PHE6068qCPqXfqLmkzD42BO+inGijOG87Gubo0nXjfieoPD9SJzpNqpNNmQXst1Uvt8Q2+NXOmJ2E0IeM5W49OVJvMCi9il5f5ODmXS2DfiFNn8W+Tu5ylDb/3I59FL/s+SGa4dfUyjaYtEESCqowFICcOz8B4AIy2tkybq6TCUXev4CoF76sMQUVJjqlj3Z5BU35uhtj13BqZjs8BpK7dLDb9Mg2KkH9f9kRWmQZpakixv4zo28CanuWjq5lkk2RpzKaKK+pAI3wnKWKZ7MCeK2vsVV00TLR4E4OEwXM3x2uNk3aqJPcyTrpgUxhVWATBbKtlu+i+WiPp0YJqjvi3+bDt365aAOhPSP+Qaqc0DysvcamE0rqfd8hYXCV3hVdtgT5arSA+kXUKVjY70TpZ2D+lxwGKFUOJ5jjtF7p/kUG9o8QFTqRa5h/iVktqvKWu2stqRC2cYr3KTTZur+DOzXLeEzqWom3raaCsBh2v6VZLeHUr7NhLYpuUOkkWFbl2bzgmR+5Hluj0LX2BaMWA2eVKumTaTNq0AbGCEg/+TRAHXciFKqXzibF10jNuYJzSkAFpotzmn1VQLKSKDM9GTPs2gdhlp30oCz2q5w2RxUYzyadSIdo+w1vI6g7lGU370+IY42sIjnFSeP1BaG5+lgNO62r7M4DF6aaP9q+yMSiYX+EyYZ5STH1LmYzSryNZyeQbSV/B0RPc2nCJyQtTDIF5jlE66PxG+0argA5tAhq2j9hnieUbLvS11H8RPecj2diebkj5WaLpL8FucnUaidnSI+0zqjzJI3MMXoyQ9kpnhfZPSavZxVnNyjY36Gh3aIpjFWn6sbNXCh1LunDg6KZfH6SxsFe1bWGZRv94B5 , "note": "前年同期比50%増で四半期の過去最高です。売却済み事業を除くプロフォーマ成長率は56%です。伸びの中心が既存事業の拡大である点を示します。", "source": "https://www.sec.gov/Archives/edgar/data/820318/000119312526447200/d176836dex991.htm"}, {"label": "データセンター・通信部門の売上（2027年度第1四半期）", "value": "19億5000万ドル", "note": "前年同期比79%増で売上全体の82%を占めます。接続距離の異なる製品群で需要を取り込む形が進んでいます。", "source": "https://www.sec.gov/Archives/edgar/data/820318/000119312526447200/d176836dex991.htm"}, {"label": "非GAAP粗利率（2027年度第1四半期）", "value": "40.6%", "note": "GAAP粗利率39.1%との差は小さく、増産局面でも製品構成が粗利率を支えています。非GAAP EPSは2.09ドルです。数量の拡大と採算の維持が同時に進んだ四半期です。", "source": "https://www.sec.gov/Archives/edgar/data/820318/000119312526447200/d176836dex991.htm"}, {"label": "設備投資（2027年度第1四半期）", "value": "7億7550万ドル", "note": "非GAAP営業利益5億5030万ドルを上回ります。需要に先行して生産能力を作る段階にあり、この投資の回収はデータセンター向け売上の持続に直接かかります。", "source": "https://www.sec.gov/Archives/edgar/data/820318/000119312526447200/d176836dex991.htm"}, {"label": "会社見通し（2027年度第2四半期売上）", "value": "25億5000万〜27億5000万ドル", "note": "経営陣は2027年度内に四半期売上30億ドルへ到達する見通しと通期プロフォーマ成長率60%超を掲げます。第2四半期が上限寄りで着地するかで、30億ドルへの距離と増産投資の正当性が測れます。", "source": "https://www.sec.gov/Archives/edgar/data/820318/000119312526447200/d176836dex991.htm"}], "sources": [{"title": "Coherent 2027年度第1四半期決算発表（SEC Form 8-K Exhibit 99.1、2026年11月4日）", "url": "https://www.sec.gov/Archives/edgar/data/820318/000119312526447200/d176836dex991.htm"}], "status": "見込み", "strengths": ["データセンター・通信部門は前年同期比79%増の19億5000万ドルまで伸びました。トランシーバから長距離リンクまで製品の幅を持つため、顧客の増設局面で複数の製品を同時に売れる構造が強みです。", "非GAAP営業利益率は23.2%まで上がり、設備投資を増やす局面でも利益率を改善しました。売上の拡大が固定費の吸収を進め、増産と採算を両立させる運営が数字に出ています。"], "summary": "僕はCoherentを、AIデータセンター同士と内部を光で結ぶ部品を売る会社として見ています。主力は光トランシーバとデータセンター間光リンクで、顧客は大規模データセンター事業者です。売上は製品販売で立ちます。2027年度第1四半期の売上は23億7000万ドルに達し、データセンター・通信部門が全体の82%を占めました。事業の重心は産業用レーザーからAI向け光部品へ移り切りました。", "weakness": "弱点は売上の集中です。2027年度第1四半期はデータセンター・通信部門が売上の82%を占め、産業部門の売上は4億1860万ドルと前年同期比14.8%減りました。設備投資は7億7550万ドルと非GAAP営業利益5億5030万ドルを上回ります。データセンター事業者が増設を遅らせれば、稼働率の低下と在庫調整が同時に進み、粗利率40.6%を支える製品構成も崩れて利益率の改善が逆回転します。"}, "coinbase": {"dat https://www.sec.gov/Archives/edgar/data/1769628/000176962826000461/coreweave3q26earningspress.htm"}, {"label": "調整後EBITDA（2026年7-9月期）", "value": "22億5600万ドル", "note": "売上比62%です。営業利益2億700万ドルとの差は減価償却と株式報酬の大きさを示します。現金創出力の高さと会計利益の薄さが同居する収益構造を測る数字です。", "source": "https://www.sec.gov/Archives/edgar/data/1769628/000176962826000461/coreweave3q26earningspress.htm"}, {"label": "純損失と純金利費用（2026年7-9月期）", "value": "純損失7億900万ドル、純金利費用8億4600万ドル", "note": "純金利費用は営業利益2億700万ドルの4.1倍です。借入で容量を先行して作る構造が売上168%増の四半期でも純損失を残します。", "source": "https://www.sec.gov/Archives/edgar/data/1769628/000176962826000461/coreweave3q26earningspress.htm"}, {"label": "稼働電力と契約済み電力（2026年9月30日時点）", "value": "稼働1.7GW超、契約済み4.6GW超", "note": "稼働電力は年初から倍増しました。契約済み電力の4割弱しか稼働しておらず、残りの転換速度が受注残1325億ドルの売上化を左右します。", "source": "https://www.sec.gov/Archives/edgar/data/1769628/000176962826000461/coreweave3q26earningspress.htm"}], "sources": [{"title": "CoreWeave Reports Strong Third Quarter 2026 Results（2026年11月10日、SEC提出の決算リリース）", "url": "https://www.sec.gov/Archives/edgar/data/1769628/000176962826000461/coreweave3q26earningspress.htm"}], "status": "見込み", "strengths": ["受注残は1325億ドルまで積み上がり、基盤モデル提供企業の上位10社のうち9社が顧客です。主要なAI開発企業を顧客に持つため、新しい容量の販売先を都度探す負担が小さい構造が拡大の速度を支えます。", "調整後EBITDAマージン62%を保ちながら売上を前年同期比168%伸ばしました。大規模調達と長期契約を組み合わせ、容量あたりの収益を落とさずに拡大できています。", "顧客の前払いと預り金で今後3か月に90億ドルの入金を見込み、契約を裏付けにした資金調達と組み合わせます。受注残が資金調達の裏付けとして機能する点が借入依存の拡大を成り立たせています。"], "summary": "僕はCoreWeaveを、GPU計算資源を長期契約で貸し出すAI専業クラウドとして見ています。顧客は基盤モデル開発企業とハイパースケーラーで、契約期間にわたり容量の使用料を取ります。2026年7-9月期の売上は36億6100万ドルと前年同期比168%増え、受注残1325億ドルが複数年の売上基盤になりました。", "weakness": "弱点は金利負担の重さです。2026年7-9月期の純金利費用は8億4600万ドルと営業利益2億700万ドルの4.1倍に達し、純損失は7億900万ドルです。通期設備投資は370億〜390億ドルの見通しで、2026年10-12月期の金利費用も10億5000万〜11億5000万ドルを見込みます。稼働への転換が遅れれば、売上化しない容量に金利だけが積み上がり、純損失と借入が同時に膨らみます。"}, "corning": {"date": "1月27日", "deck": null, "focus": "Q4見通しのコア売上52億〜53億ドルとコアEPS0.96〜1.00ドルの達成、光通信の伸びと太陽光部門の利益転換を見る", "logo": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMT03Ojo6Iys/RD89QzQ5Li0BCgoKDQwNGg8PGislHyU3Nzc3Nzc3KzcrNzc3Nys3NzcrKzcrKysrKysrNzc3NysrKysrKzcrNysrKysrKysrK//AABEIABAAEAMBIgACEQEDEQH/xAAWAAEBAQAAAAAAAAAAAAAAAAAEBgL/xAAhEAACAAYCAwEAAAAAAAAAAAABAgADBBESEzFxIUNRBf/EABQBAQAAAAAAAAAAAAAAAAAAAAX/xAAXEQADAQAAAAAAAAAAAAAAAAACESEA/9oADAMBAAIRAxEAPwBq1FOKaUNMm+tfWPnUS/685KitdpaqFUYjEAcRqbWnUqq3nEDqA3FuYdAFcEZub//Z", "name": "Corning", "next": "次に見る数字は2026年第4四半期のコア売上です。会社見通しは52億〜53億ドル、コアEPSは0.96〜1.00ドルです。光通信の伸びの持続と太陽光部門の利益転換を2027年1月27日の決算で確認します。", "numbers": [{"label": "コア売上（2026年第3四半期）", "value": "50億8100万ドル", "note": "前年同期比19%増でSpringboard計画の開始以来で最も高い伸びです。GAAP売上は48億5500万ドルでした。年率換算の売上は203億ドルに達し、2026年末に200億ドルとする従来目標を前倒しで超えました。", "source": "https://s203.q4cdn.com/212458750/files/content_files/Corning-Incorporated-Third-Quarter-2026-Earnings-Release-with-Financials-2026-10-27.pdf"}, {"label": "光通信部門の売上（2026年第3四半期）", "value": "23億7900万ドル", "note": "前年同期比44%増です。コア売上の増加8億900万ドルのうち7億2700万ドルをこの部門が作り、成長の中心が光通信へ寄る動きが鮮明になりました。", "source": "https://s203.q4cdn.com/212458750/files/content_files/Corning-Incorporated-Third-Quarter-2026-Earnings-Release-with-Financials-2026-10-27.pdf"}, {"label": "光通信部門の純利益（2026年第3四半期）", "value": "5億3200万ドル", "note": "前年同期比80%増で売上の伸びを上回ります。企業向けネットワーク売上が前年同期比84%増え、生成AI向けを含む高付加価値の接続製品へ構成が移る効果が利益に出ています。", "source": "https://s203.q4cdn.com/212458750/files/content_files/Corning-Incorporated-Third-Quarter-2026-Earnings-Release-with-Financials-2026-10-27.pdf"}, {"label": "コアEPS（2026年第3四半期）", "value": "0.91ドル", "note": "前年同期比36%増です。コア純利益は7億9500万ドル、コア営業利益率は22.7%と前年同期の19.6%から上がりました。増収が利益率の改善を伴う形になり、全社の収益性が一段上がりました。", "source": "https://s203.q4cdn.com/212458750/files/content_files/Corning-Incorporated-Third-Quarter-2026-Earnings-Release-with-Financials-2026-10-27.pdf"}, {"label": "会社見通し（2026年第4四半期コア売上）", "value": "52億〜53億ドル", "note": "コアEPSの見通しは0.96〜1.00ドルです。第3四半期に前倒しで届いた年率200億ドルの水準を、実績の四半期売上として固められるかが焦点になります。", "source": "https://s203.q4cdn.com/212458750/files/content_files/Corning-Incorporated-Third-Quarter-2026-Earnings-Release-with-Financials-2026-10-27.pdf"}], "sources": [{"title": "Corning 2026年第3四半期決算発表（2026年10月27日）", "url": "https://s203.q4cdn.com/212458750/files/content_files/Corning-Incorporated-Third-Quarter-2026-Earnings-Release-with-Financials-2026-10-27.pdf"}], "status": "見込み", "strengths": ["光通信部門の純利益は前年同期比80%増の5億3200万ドルまで伸び、企業向けネットワーク売上は84%増えました。ファイバー単体でなく接続部品まで含めて売る構成がデータセンター増設の需要を利益へ変える力になっています。", "第3四半期にVerizonとAT&Tを含む4件の長期契約を確保し、通信事業者の設備計画に組み込まれた供給位置を占めます。個別契約の金額は会社が開示していません。契約件数と相手先の具体性が供給の継続性を裏付け、四半期ごとの受注変動に売上が左右されにくい構造を作ります。", "コア営業利益率は22.7%まで上がり、売上年率換算203億ドルとSpringboard計画の目標を前倒しで達成しました。複数部門を持つ会社で、光通信の伸びが全社の利益率へ波及する形ができています。"], "summary": "僕はCorningを、光ファイバーと特殊ガラスを通信事業者とデータセンター事業者へ売る素材会社として見ています。主力の光通信はファイバーとケーブルと接続部品を長期契約で供給します。2026年第3四半期は光通信の売上が23億7900万ドルと前年同期比44%増え、コア売上全体の増加分8億900万ドルのうち7億2700万ドルを担いました。", "weakness": "弱点は成長の光通信への集中です。2026年第3四半期のコア売上の増加8億900万ドルのうち7億2700万ドルを光通信が担い、他部門の伸びは限られました。GAAP売上48億5500万ドルとコア売上50億8100万ドルの差も大きく、会社調整後の数字への依存が残ります。データセンター向け需要の伸びが鈍れば、他部門で穴を埋められず、全社の成長率と利益率が同時に下がります。"}, "crowdstrike": {"date": "12月1日", "deck": null, "focus": "純新規ARRガイダンス3.43億〜3.47億ドルの達成と、通期見通しの再上方修正があるか", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPoAAAAvCAMAAAD9wSeTAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAALZUExURQAAAP8AAPsAAP8AAPwAAPwAAP8AAP8AAPwAAPsAAP8AAPwAAP0AAP8AAP8AAPwAAP0AAPsAAPwAAP0AAPwAAP8AAPsAAPoAAP8AAP8AAP8AAPwAAPwAAP0AAPwAAP8AAPoAAPoAAP8AAP8AAP8AAPkAAPoAAP0AAPwAAPwAAPwAAPwAAPsAAPsAAP8AAPsAAP8AAP8AAPsAAP8AAPoAAPkAAP8AAPwAAPsAAPoAAPwAAPwAAPwAAPwAAPsAAP0AAPwAAPwAAPwAAP0AAPwAAPwAAP8AAP8AAPwAAPsAAPwAAPwAAPwAAPwAAPwAAPwAAPwAAPsAAP8AAP0AAPwAAPwAAPwAAPwAAPsAAPwAAP0AAPwAAPwAAPwAAPwAAP8AAPwAAPwAAP0AAPwAAPwAAPwAAPwAAPwAAPsAAPsAAPwAAPsAAP0AAP8AAPwAAP8AAP0AAPwAAPkAAP0AAP0AAP8AAPwAAP8AAP8AAPwAAPsAAPwAAPwAAPwAAP0AAP8AAPwAAPwAAPwAAPwAAPoAAP8AAPwAAP0AAPsAAPoAAPwAAPsAAPwAAPwAAPsAAPsAAP8AAP0AAPwAAP0AAPwAAPwAAPwAAPwAAP8AAPwAAPkAAPwAAPwAAPsAAPwAAPwAAPwAAPsAAPwAAPwAAP8AAPsAAPwAAPwAAP8AAP0AAP0AAPwAAPsAA  "売上（2026年5-7月期、会計第2四半期）", "value": "14億7000万ドル", "note": "前年同期から26%増えました。定期課金売上は14億ドルで27%増です。成長率は5四半期連続で上がり、新規販売の勢いが既存契約の更新基盤と重なって売上の再加速を作っています。", "source": "https://www.sec.gov/Archives/edgar/data/1535527/000153552726000029/crwd-20260826xex991.htm"}, {"label": "期末ARR（2026年7月31日時点）", "value": "58億4000万ドル", "note": "前年同期から25%増えました。今期の純新規ARR3億3280万ドルは51%増で過去最高です。解約と縮小を差し引いても契約基盤が厚くなる速度が上がり、翌四半期以降の売上の土台が広がりました。", "source": "https://www.sec.gov/Archives/edgar/data/1535527/000153552726000029/crwd-20260826xex991.htm"}, {"label": "Falcon Flex採用先の期末ARR（2026年7月31日時点）", "value": "22億9000万ドル超", "note": "前年同期から101%増え、ARR全体の4割近くを占めます。最初に広く契約し利用範囲を後から広げる売り方が追加販売の摩擦を下げる仕組みとして定着しています。", "source": "https://www.sec.gov/Archives/edgar/data/1535527/000153552726000029/crwd-20260826xex991.htm"}, {"label": "フリーキャッシュフロー（2026年5-7月期）", "value": "3億7740万ドル", "note": "売上比26%で四半期の過去最高です。営業キャッシュフローは5億3030万ドルに達しました。定期課金の前払い構造が先に現金を作り、成長投資を自社の現金で賄う形ができています。", "source": "https://www.sec.gov/Archives/edgar/data/1535527/000153552726000029/crwd-20260826xex991.htm"}, {"label": "GAAP純利益（2026年5-7月期）", "value": "530万ドル", "note": "前年同期7020万ドルの損失から黒字へ移りました。GAAP営業損失は3320万ドルで、調整後営業利益3億7160万ドルとの差は株式報酬の大きさを示します。黒字化は一歩ですが利益の厚みはまだありません。", "source": "https://www.sec.gov/Archives/edgar/data/1535527/000153552726000029/crwd-20260826xex991.htm"}], "sources": [{"title": "CrowdStrike Reports Second Quarter Fiscal Year 2027 Financial Results（2026年8月26日、SEC提出の決算リリース）", "url": "https://www.sec.gov/Archives/edgar/data/1535527/000153552726000029/crwd-20260826xex991.htm"}], "status": "確定", "strengths": ["純新規ARRは前年同期比51%増の3億3280万ドルで過去最高です。単一基盤へ製品を束ねる構成が既存顧客への追加販売を新規開拓より速く伸ばす力になっています。", "Falcon Flex採用先のARRは101%増の22億9000万ドル超まで広がり、ARR全体の4割近くを占めます。契約形態の柔軟さが大口顧客の採用を早め、利用拡大の余地を契約の中に残す構造です。", "フリーキャッシュフローは3億7740万ドルと四半期の過去最高で、営業キャッシュフローは5億3030万ドルです。定期課金の前払いが先に現金を作るため、株式報酬に頼る利益構造でも資金面の余裕を保てます。"], "summary": "僕はCrowdStrikeを、単一基盤Falconへセキュリティ製品を束ねて売る会社として見ています。顧客は大企業と政府機関で、利用範囲に応じて課金するFalcon Flexが契約の中心へ移っています。2026年5-7月期の純新規ARRは3億3280万ドル /edgar/data/59478/000005947826000104/q326lillysalesandearningsp.htm"}], "status": "見込み", "strengths": ["マンジャロとゼップバウンドは同一成分チルゼパチドで糖尿病と肥満症の2適応を持ち、2製品合計160億7500万ドルまで伸びました。1つの生産基盤で2市場を取る構造が数量拡大の速度を支えます。", "中国の国民償還医薬品リスト収載でマンジャロの米国外売上が93%増え57億ドルに達しました。償還入りは価格を下げる代わりに処方量の天井を外し、米国外が次の成長源になる道を開きます。", "粗利率は83.9%まで上がりました。生産コスト改善と製品構成が実現価格15%低下を吸収し、値下げしながら利益率を上げる運営が数量モデルの持続性を裏付けます。"], "summary": "僕はEli Lillyを、糖尿病と肥満症の治療薬を保険償還経由で継続処方させ、数量で稼ぐ会社として見ています。主力マンジャロとゼップバウンドは2026年7-9月期に合計160億7500万ドルと売上全体の66%を占め、実現価格15%低下を数量53%増が上回る構造が続きます。製薬大手の中で成長率の中心に立ち、2製品の数量が全社の業績を決める構成です。", "weakness": "弱点は売上全体の66%をマンジャロとゼップバウンドの2製品に依存する集中です。実現価格は全体で15%下がり米国外では29%下がりました。競合薬の供給拡大や償還条件の変更で数量の伸びが価格低下を下回れば、増収率と粗利率83.9%が同時に崩れます。"}, "fabrinet": {"date": "2月1日", "deck": null, "focus": "第2四半期売上見通し16億〜16億5000万ドルの達成と、粗利率11.8%からの改善、データセンター向け売上の持続", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAASwAAAB4CAYAAABIFc8gAAAf2ElEQVR4nO2df4wd13XfP9+H7WKxWLAEsSVYllFYlVAVVXFUV1FtVXW52ldry7UNR3VT10lru41rq+a2aQVDMNzUMAzXEAK3QFZC/SOO7bRInaaxVcPLrISllzVUwxEUg3FlQhFkgjEIliDYLbHdEovF4p3+ce/M3Jk3834sl/vW9PkQjztv3n3nnpk398y55565FxzHcRzHcRzHcRzHcRzHcRzHcRzHcRzHcRzHcRzHcRzHcRzHcRzHcRzHcRzHcRzHcRzHcRzHcRzHcRzHcRzHcRzHcRzHcRzHcRzHcRzHcRzHcRzHcRzHcRzHcRzHcRzHcRzHcRzHcRzHcRzHcRzHcRzHcZx9jUatQB3zCzMAY4ZNCU0C48AY0IovgE7y2sZsG2kbYwNxc2lxdRSqO45zGxkbtQJV5hdmDoA9BHoDpp9D3IfZEUMHJaYslhNsAtvATWDdpDVh60ifw3gufravOLUwMy6YAsv3GUKA5Vt0zLh55pnVrVHp6Tj7lX1jsOZPn2whPWjwhNCjwFGJMTCQSq5g2LaJuDUFHBaWffL1/ek3goyHEB80mMKCmUJR71x9bkj8B+ClEap62wjes02BDnV/WpwEjA6ytaXFczf3Uj9nf7MvDNb8wswY2DvAPolxD9KYWfQ4JMwMJX+huLTTcmG/XRPad95VwI6B5jCmg7rCMm9LED2vK6Cvj0rD241BS+htBp/OPE1Fg20qYhQm2xR6CvjGyJR19h37wmBh9gjSosHRcO1GAxU/DtvB0yo6U+ouBxuC9X0bv4pGNXOosjepIYb0szuP2P2dEjqehlANC0YrM2LSTYPJUejo7F9GbrDmF2YmgI+CHRXCjLzxZt28LL4T/sZPasoBG6DNURzHIGSGKYta5Q02M8jxmHQHW6xw1OXjzW88iScN+3REyKml3X6sBToKPGBmY5IuABdXVpZ3tbfT6l/ktvMW4E1F47WS91H8H7sOPcqBrROC8PuSvDtribEi6dZm7+/glpp13JVvxZtSZqwwcnvu/FjQbs+Ngd4GPGVmByXGwZ4AfmW36xqphzW/MDNmxj9ATKVGqdKeszcd4JrBmuAmRkcCM1oSLWAMdAH ）", "value": "14億7450万ドル（前年同期比50.7%増）", "note": "四半期として過去最高で会社見通しの上限を超えました。受託製造で需要を読む立場の会社が上限超えを出す状態は顧客側の発注が計画より前倒しで積み上がっている証拠です。", "source": "https://www.sec.gov/Archives/edgar/data/1408710/000140871026000034/fn-20261102xex991q127.htm"}, {"label": "データセンター向け売上（2027年度第1四半期）", "value": "7億7713万ドル（前年同期比77.6%増、売上全体の52.7%）", "note": "光トランシーバとデータセンター相互接続製品が伸び、部門構成の首位が固まりました。通信インフラ向け4億4392万ドルを大きく上回り、成長とリスクの両方がデータセンター投資の持続に結び付く構成です。", "source": "https://www.sec.gov/Archives/edgar/data/1408710/000140871026000041/fn-20260925.htm"}, {"label": "GAAP粗利率（2027年度第1四半期）", "value": "11.8%（前年同期11.9%）", "note": "売上50.7%増でも粗利率は横ばいで、粗利益1億7380万ドルにとどまります。増収が利益率改善に変換できない点に受託製造の上限があり、規模の拡大と収益性の改善は別問題です。", "source": "https://www.sec.gov/Archives/edgar/data/1408710/000140871026000034/fn-20261102xex991q127.htm"}, {"label": "GAAP純利益（2027年度第1四半期）", "value": "1億350万ドル（希薄化EPS 2.86ドル）", "note": "売上50.7%増に対して純利益の伸びは8%にとどまります。非GAAP純利益1億5740万ドルとの差は株式報酬等の費用であり、増産局面で人件費側のコストが先に膨らむ構造を示します。", "source": "https://www.sec.gov/Archives/edgar/data/1408710/000140871026000034/fn-20261102xex991q127.htm"}, {"label": "会社見通し（2027年度第2四半期売上）", "value": "16億〜16億5000万ドル", "note": "第1四半期実績14億7450万ドルから一段の増収を会社自身が置きました。非GAAP EPS見通しは4.77〜4.92ドルです。見通し達成が続けば発注の前倒しでなく需要の定着と読めます。", "source": "https://www.sec.gov/Archives/edgar/data/1408710/000140871026000034/fn-20261102xex991q127.htm"}], "sources": [{"title": "Fabrinet 2027年度第1四半期決算リリース（Form 8-K Exhibit 99.1、2026年11月2日）", "url": "https://www.sec.gov/Archives/edgar/data/1408710/000140871026000034/fn-20261102xex991q127.htm"}, {"title": "Fabrinet Form 10-Q（2027年度第1四半期、2026年11月3日提出）", "url": "https://www.sec.gov/Archives/edgar/data/1408710/000140871026000041/fn-20260925.htm"}], "status": "見込み", "strengths": ["データセンター向け売上が77.6%増の7億7713万ドルまで伸び、通信インフラと自動車・産業を含む3部門すべてが増収です。光トランシーバの増産対応は顧客の切替コストを高め、受注が特定顧客の設備計画に深く組み込まれるほど次の発注も同社へ向かいます。", "設備投資を四半期1億5870万ドルと前年同期4527万ドルの3.5倍へ増やし、生産能力の増強を発注確定前に進めています。能力不足で受注を逃すリスクを先に潰す投資姿勢が急増局面で選ばれる受託先の条件になります。"], "summary": "僕はFabrinetを、光通信機器メーカーから設計と製造を受 万円に対して下期に1240億円超を積む計画です。純利益予想は2283億円です。下期計画は受注の売上変換を前提にしており、受注の持続がそのまま計画の成否を決めます。", "source": "https://www.fanuc.co.jp/ja/ir/announce/pdf/2026/financialresult202609.pdf"}], "sources": [{"title": "ファナック 2027年3月期第2四半期決算短信（2026年10月23日）", "url": "https://www.fanuc.co.jp/ja/ir/announce/pdf/2026/financialresult202609.pdf"}, {"title": "ファナック 2027年3月期第2四半期決算説明会資料（2026年10月23日）", "url": "https://www.fanuc.co.jp/ja/ir/announce/pdf/2026/reference202609.pdf"}], "status": "見込み", "strengths": ["FA受注が130.1%増の1122億円と過去最高水準に達し、ロボットとロボマシンを含む3部門の受注がそろって前年同期を上回りました。CNCの導入先では制御装置の切替コストが高く、一度採用された工場ほど次の設備更新でも同社製品が選ばれる構造が受注の持続を支えます。", "営業キャッシュフロー1558億5800万円と自己資本比率88.7%を持ちます。無借金に近い財務は需要変動局面でも研究開発と供給体制を削らずに済む余力であり、工作機械の市況が反転した局面で競合との差になります。", "サービス売上が762億1400万円と全体の16%を占めます。納入した機械の保守契約は景気に左右されにくい継続収益で、設備投資が止まる局面でも売上と利益の下限を作ります。"], "summary": "僕はファナックを、工作機械用CNCと産業用ロボットを世界の工場へ売り、保守サービスで継続収益を積む会社として見ています。FAとロボットとロボマシンの3部門を持ち、2026年7-9月期はFA受注が前年同期比130.1%増と過去最高水準まで跳ね、受注主導で利益が先行する局面に入りました。3部門の受注が同時に立つ局面は設備投資サイクルの山に限られます。", "weakness": "弱点は受注の伸びが中国中心のAIデータセンターと半導体と電気自動車向け設備投資に寄る点です。7-9月期受注は49.0%増えた一方で売上は14.9%増にとどまります。前倒しされた設備投資が一巡し受注が反転すれば、受注残の薄い分だけ売上と営業利益率26.0%が受注より遅れて急落します。"}, "furukawa": {"date": "2月上旬", "deck": null, "focus": "光関連2部門の下期進捗と、通期営業利益予想1360億円へ下期783億8200万円を積む達成度", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQAAAAEACAYAAABccqhmAAAABGdBTUEAALGPC/xhBQAACklpQ0NQc1JHQiBJRUM2MTk2Ni0yLjEAAEiJnVN3WJP3Fj7f92UPVkLY8LGXbIEAIiOsCMgQWaIQkgBhhBASQMWFiApWFBURnEhVxILVCkidiOKgKLhnQYqIWotVXDjuH9yntX167+3t+9f7vOec5/zOec8PgBESJpHmomoAOVKFPDrYH49PSMTJvYACFUjgBCAQ5svCZwXFAADwA3l4fnSwP/wBr28AAgBw1S4kEsfh/4O6UCZXACCRAOAiEucLAZBSAMguVMgUAMgYALBTs2QKAJQAAGx5fEIiAKoNAOz0ST4FANipk9wXANiiHKkIAI0BAJkoRyQCQLsAYFWBUiwCwMIAoKxAIi4EwK4BgFm2MkcCgL0FAHaOWJAPQGAAgJlCLMwAIDgCAEMeE80DIEwDoDDSv+CpX3CFuEgBAMDLlc2XS9IzFLiV0Bp38vDg4iHiwmyxQmEXKRBmCeQinJebIxNI5wNMzgwAABr50cH+OD+Q5+bk4eZm52zv9MWi/mvwbyI+IfHf/ryMAgQAEE7P79pf5eXWA3DHAbB1v2upWwDaVgBo3/ldM9sJoFoK0Hr5i3k4/EAenqFQyDwdHAoLC+0lYqG9MOOLPv8z4W/gi372/EAe/tt68ABx
