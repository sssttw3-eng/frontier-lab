<style>
:root{--ink:#17242f;--sub:#5a7185;--faint:#8ba3b8;--line:#dfe8ef;--blue:#0a4d8c;--blue2:#2f7fc4;--sky:#e8f3fb;--gold:#d4a24a;--navy:#0d2236;--paper:#f7fafc;--r:14px;--shadow:0 10px 30px rgba(13,34,54,.08)}
.num,.stat .v,.calrow .cwhen,.kpi b{font-variant-numeric:tabular-nums}

:root{--ink:#17242f;--sub:#5a7185;--line:#dfe8ef;--blue:#0a4d8c;--gold:#d4a24a;--navy:#0d2236;--paper:#f7fafc}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Zen Kaku Gothic New',sans-serif;color:var(--ink);background:#fff;line-height:1.8;-webkit-font-smoothing:antialiased}
a{color:var(--blue)}
.wrap{max-width:860px;margin:0 auto;padding:0 28px}
header.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .in{display:flex;align-items:center;gap:12px;padding:14px 28px;max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.14em;font-size:16px;color:var(--ink);text-decoration:none}
.brand .mk{width:24px;height:24px;color:var(--blue)} .brand .mk svg{width:100%;height:100%;display:block}
header.top nav{margin-left:auto;display:flex;gap:24px;font-size:13px;color:var(--sub);font-weight:700}
header.top nav a{color:var(--sub);text-decoration:none}
.cohead{display:flex;align-items:center;gap:18px;margin:42px 0 4px}
.clogo{width:64px;height:64px;border-radius:14px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:9px;overflow:hidden;flex:none;background:#fff}
.clogo img{max-width:100%;max-height:100%}
.clogo .mono{font-family:'Inter',sans-serif;font-weight:800;font-size:26px;color:#5b7a94}
h1{font-family:'Shippori Mincho',serif;font-size:31px;font-weight:700;color:var(--navy);line-height:1.4}
.dchip{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:3px 13px;margin-top:6px}
.dchip.ok{background:#e8f3fb;color:var(--blue);border:1px solid var(--line)}
.dchip.est{background:#fdf6e3;color:#7a5b12;border:1px solid var(--gold)}
h2.sec{font-family:'Shippori Mincho',serif;font-size:20px;font-weight:700;color:var(--navy);margin:40px 0 8px;padding-top:26px;border-top:1px solid var(--line)}
p.body{font-size:14.5px;line-height:1.95;color:#33506b}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:20px 22px;font-size:13.5px;color:var(--sub);line-height:1.9}
.numgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.numcard{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:#fff}
.numcard .nl{font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.04em}
.numcard .nv{font-family:'Inter',sans-serif;font-size:19px;font-weight:800;color:var(--navy);line-height:1.5;margin:4px 0 4px;font-variant-numeric:tabular-nums}
.numcard .nn{font-size:13px;line-height:1.85;color:#33506b}
.numcard .ns{font-size:12px;margin-top:6px}
ul.slist{list-style:none;margin-top:4px}
ul.slist li{font-size:14.5px;line-height:1.95;color:#33506b;padding:10px 0 10px 18px;border-bottom:1px solid var(--line);position:relative}
ul.slist li:before{content:'';position:absolute;left:0;top:20px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.weakbox{background:#fdf6e3;border:1px solid var(--gold);border-radius:12px;padding:16px 20px;font-size:14.5px;line-height:1.95;color:#33506b}
ul.srclist{list-style:none;margin-top:4px}
ul.srclist li{font-size:13.5px;line-height:1.9;padding:6px 0;border-bottom:1px solid var(--line)}
@media(max-width:620px){.numgrid{grid-template-columns:1fr}}
.lockwrap{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lockdummy{filter:blur(6px);padding:20px 22px;font-size:14px;line-height:2.1;color:#33506b;user-select:none}
.lockchip{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(255,255,255,.35)}
.lockchip .lb{display:inline-flex;align-items:center;gap:7px;background:rgba(13,34,54,.9);color:#fff;font-weight:800;font-size:12.5px;border-radius:999px;padding:6px 15px}
.btn{display:inline-block;background:var(--blue);color:#fff;font-weight:800;font-size:13.5px;padding:11px 24px;border-radius:999px;text-decoration:none}
footer.site{border-top:1px solid var(--line);padding:24px 0 38px;margin-top:60px}
footer.site .in{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.14em;font-size:13px;color:var(--sub)}
footer.site .mk{width:18px;height:18px;color:var(--blue)} footer.site .mk svg{width:100%;height:100%;display:block}
@media(max-width:620px){header.top nav{display:none}}

<script>
var DATA = {"abb": {"date": "1月28日", "deck": null, "focus": "通期の比較売上成長（10%台前半）とEBITAマージン改善の見通しの達成、データセンター向け電化需要", "logo": "https://www.google.com/s2/favicons?domain=abb.com&sz=128", "name": "ABB", "status": "見込み"}, "aerovironment": {"date": "12月8日", "deck": null, "focus": "徘徊型兵器と無人機の出荷ペース、受注残の積み上がりと通期見通しの維持を見る", "logo": "https://commons.wikimedia.org/wiki/Special:FilePath/AeroVironment_Logo.png?width=200", "name": "AeroVironment", "status": "確定"}, "alphabet": {"date": "2月3日", "deck": null, "focus": "Google Cloudの伸びが続くかと、2027年の設備投資の規模", "logo": "https://cdn.simpleicons.org/google/33566e", "name": "Alphabet", "status": "見込み", "next": "次はGoogle Cloudの伸びが続くかと、TPUシステム販売の寄与の大きさ、2027年の設備投資の規模を見ます。", "numbers": [{"label": "売上（2026年7-9月期）", "note": "13四半期連続の2桁増収です。年換算で5,000億ドル規模の売上になりました。", "source": "https://www.sec.gov/Archives/edgar/data/1652044/000165204426000080/googexhibit991q32026.htm", "value": "1,275億7,700万ドル（前年同期比25%増）"}, {"label": "Google Cloud売上（2026年7-9月期）", "note": "営業利益は111億2,100万ドルで営業利益率36.2%まで上がりました。TPUシステムの販売も売上に寄与したと会社は説明しています。", "source": "https://www.sec.gov/Archives/edgar/data/1652044/000165204426000080/googexhibit991q32026.htm", "value": "307億900万ドル（前年同期比103%増）"}, {"label": "Google Cloud受注残（2026年9月末）", "note": "うち55%強を今後24ヶ月で売上に変える見込みと会社は示しています。契約の積み上がりがCloudの伸びを裏付けます。", "source": "https://www.sec.gov/Archives/edgar/data/1652044/000165204426000080/googexhibit991q32026.htm", "value": "5,610億ドル"}, {"label": "設備投資とフリーキャッシュフロー（2026年7-9月期）", "note": "営業キャッシュフロー422億9,000万ドルを設備投資が上回りました。通期の設備投資見通しは1,950億〜2,050億ドルで据え置いています。", "source": "https://www.sec.gov/Archives/edgar/data/1652044/000165204426000080/googexhibit991q32026.htm", "value": "設備投資513億6,000万ドル、フリーキャッシュフローはマイナス90億7,000万ドル"}], "sources": [{"title": "Alphabet 2026年7-9月期決算リリース（SEC Form 8-K Exhibit 99.1、2026年10月28日）", "url": "https://www.sec.gov/Archives/edgar/data/1652044/000165204426000080/googexhibit991q32026.htm"}], "strengths": ["Google Cloudが103%増の307億900万ドルで、営業利益率も36.2%まで上がりました。規模の拡大と利益率の改善が同時に進んでいます。", "検索売上が633億5,000万ドルと12%増え、検索クエリの伸び率は5年ぶりの高さと会社は示しています。本業の広告がCloud投資の原資を生んでいます。"], "summary": "僕はAlphabetを、検索と YouTube の広告を土台に、Google Cloudと自社チップのTPUでAI基盤を売る会社として見ています。2026年7-9月期はCloud売上が前年同期の2倍になり、受注残は5,610億ドルまで膨らみました。一方で設備投資が営業キャッシュフローを上回り、現金収支はマイナスです。", "weakness": "弱点は現金収支です。フリーキャッシュフローはマイナス90億7,000万ドルで2四半期連続のマイナスになりました。純利益も262億ドルと25%減りました。株式投資の評価損87億ドルが主因で、本業の営業利益405億8,000万ドル（30%増）とは分けて見る必要があります。"}, "amazon": {"date": "2月4日", "deck": null, "focus": "会社見通しの売上2,400億〜2,470億ドルと営業利益、AWSの伸び", "logo": "https://cdn.simpleicons.org/amazon/33566e", "name": "Amazon", "status": "見込み", "next": "次は会社見通しの純売上2,400億〜2,470億ドルと営業利益の達成、AWSの伸びが39%前後で続くかを見ます。", "numbers": [{"label": "純売上（2026年7-9月期）", "note": "為替の影響を除くと13%増です。営業利益は281億ドルまで増えました。", "source": "https://www.aboutamazon.com/news/company-news/amazon-earnings-q3-2026-report", "value": "2,019億4,400万ドル（前年同期比12%増）"}, {"label": "AWS売上（2026年7-9月期）", "note": "約5年ぶりの高い伸びで、年換算売上は1,840億ドル規模です。営業利益178億ドルは会社全体の63%を占めます。", "source": "https://www.aboutamazon.com/news/company-news/amazon-earnings-q3-2026-report", "value": "459億8,400万ドル（前年同期比39%増）"}, {"label": "営業利益率（2026年7-9月期）", "note": "会社が過去最高と示した水準です。小売の効率化とAWSの利益拡大が重なりました。", "source": "https://www.aboutamazon.com/news/company-news/amazon-earnings-q3-2026-report", "value": "13.9%（営業利益281億ドル）"}, {"label": "フリーキャッシュフロー（過去12ヶ月）", "note": "前年同期は148億ドルの流入でした。AI向けの設備投資の増加が現金収支を反転させています。", "source": "https://www.aboutamazon.com/news/company-news/amazon-earnings-q3-2026-report", "value": "マイナス424億ドル"}, {"label": "会社見通し（2026年10-12月期）", "note": "2026年の設備投資は約2,200億ドルを見込んでいます。投資の大きさと見通しの達成をセットで見ます。", "source": "https://www.aboutamazon.com/news/company-news/amazon-earnings-q3-2026-report", "value": "純売上2,400億〜2,470億ドル、営業利益285億〜335億ドル"}], "sources": [{"title": "Amazon 2026年7-9月期決算リリース（2026年10月29日）", "url": "https://www.aboutamazon.com/news/company-news/amazon-earnings-q3-2026-report"}], "strengths": ["AWSが39%増の459億8,400万ドルです。前四半期の37%増から加速し、営業利益率も38.7%まで上がりました。", "営業利益率13.9%は過去最高です。売上2,019億ドルの規模で利益率を更新しています。"], "summary": "僕はAmazonを、小売と広告の規模を土台に、AWSの利益でAI投資を賄う会社として見ています。2026年7-9月期はAWS売上が39%増と約5年ぶりの伸びになり、営業利益率は過去最高の13.9%を記録しました。一方で過去12ヶ月のフリーキャッシュフローは424億ドルの流出です。", "weakness": "弱点は現金収支です。過去12ヶ月のフリーキャッシュフローはマイナス424億ドルで、前年同期のプラス148億ドルから大きく反転しました。2026年の設備投資見込み約2,200億ドルが、AWSの利益で賄える範囲を超えています。"}, "amd": {"date": "2月2日", "deck": "deck-a.html", "focus": "会社見通しの売上約170億ドルへの到達とデータセンターの伸び、Heliosの売上開示", "logo": "../assets/new-amd-logo.svg", "name": "AMD", "status": "見込み", "next": "次は会社見通しの売上約170億ドルへの到達とデータセンターの伸び、Heliosの売上開示があるかを見ます。", "numbers": [{"label": "売上（2026年7-9月期）", "note": "会社見通しの上限を超え、四半期で過去最高です。増分の中心はデータセンターです。", "source": "https://www.sec.gov/Archives/edgar/data/2488/000000248826000188/q32026991.htm", "value": "133億7,700万ドル（前年同期比45%増）"}, {"label": "データセンター売上（2026年7-9月期）", "note": "全体の64%を占めます。1年前の47%から構成が大きく変わり、会社の重心がデータセンターへ移りました。", "source": "https://www.sec.gov/Archives/edgar/data/2488/000000248826000188/q32026991.htm", "value": "85億ドル（前年同期比97%増）"}, {"label": "非GAAP EPS（2026年7-9月期）", "note": "売上45%増に対してEPSは74%増です。粗利率はGAAPで54%、非GAAPで56%まで上がりました。", "source": "https://www.sec.gov/Archives/edgar/data/2488/000000248826000188/q32026991.htm", "value": "2.09ドル（前年同期比74%増）"}, {"label": "会社見通し（2026年10-12月期の売上）", "note": "前年同期比で約66%増の水準です。データセンターの前四半期比50%増を会社が見込んでいます。", "source": "https://www.sec.gov/Archives/edgar/data/2488/000000248826000188/q32026991.htm", "value": "約170億ドル（±3%）"}], "sources": [{"title": "AMD 2026年7-9月期決算リリース（SEC Form 8-K Exhibit 99.1、2026年11月3日）", "url": "https://www.sec.gov/Archives/edgar/data/2488/000000248826000188/q32026991.htm"}], "strengths": ["データセンター売上が前年同期比97%増の85億ドルです。EPYCの記録的な販売とInstinct MI450シリーズの立ち上がりが重なりました。", "非GAAP EPSが74%増の2.09ドルです。売上の伸びを上回る速さで利益が伸びています。"], "summary": "僕はAMDを、サーバーCPUのEPYCとAI向けGPUのInstinctを軸に、データセンターでNVIDIAを追う会社として見ています。2026年7-9月期はデータセンター売上が前年同期のほぼ2倍になり、四半期として過去最高の売上と利益を出しました。ラック単位のHeliosの出荷が次の焦点です。", "weakness": "弱点はクライアントとゲーミングの鈍さです。両部門の合計売上は37億ドルと前年同期比8%減り、クライアント単体は29億ドルで7%増にとどまります。全体の成長がデータセンター1部門への依存を強めています。"}, "apple": {"date": "1月28日", "deck": null, "focus": "年末商戦のiPhone販売とサービス売上の伸び、メモリ高騰のもとでの粗利率を見る", "logo": "https://cdn.simpleicons.org/apple/33566e", "name": "Apple", "status": "見込み", "next": "次は年末商戦のiPhone販売とサービス売上の伸び、メモリ高騰のもとで粗利率45〜46%の見通しを守れるかを見ます。", "numbers": [{"label": "売上（2026年度第4四半期、2026年6-9月期）", "note": "9月期として過去最高です。純利益は307億ドル、希薄化後EPSは2.10ドルでした。", "source": "https://www.apple.com/newsroom/2026/11/apple-reports-fourth-quarter-results/", "value": "1,144億7,700万ドル（前年同期比12%増）"}, {"label": "iPhone売上（同四半期）", "note": "全体の50%を占め、増分の中心です。iPhone 18 Pro系の販売期間が約9日だけでも9月期の記録を更新しました。", "source": "https://www.apple.com/newsroom/2026/11/apple-reports-fourth-quarter-results/", "value": "575億8,300万ドル（前年同期比17%増）"}, {"label": "サービス売上（同四半期）", "note": "前年同期比10%増です。端末が売れた後に続く収益が四半期で300億ドルを超える規模になりました。", "source": "https://www.apple.com/newsroom/2026/11/apple-reports-fourth-quarter-results/", "value": "315億7,000万ドル（過去最高）"}, {"label": "粗利率（同四半期）", "note": "関税還付が約1ポイント押し上げました。還付を除いた実力と、次期見通しの45〜46%との差を見ます。", "source": "https://www.apple.com/newsroom/2026/11/apple-reports-fourth-quarter-results/", "value": "47.9%"}, {"label": "会社見通し（2026年10-12月期）", "note": "メモリ価格の上昇と供給制約を理由に、粗利率の低下を会社が見込んでいます。年末商戦の需要と利益率の両立が焦点です。", "source": "https://www.apple.com/newsroom/2026/11/apple-reports-fourth-quarter-results/", "value": "売上は前年同期比7〜10%増、粗利率45〜46%"}], "sources": [{"title": "Apple 2026年度第4四半期決算リリース（Apple Newsroom、2026年11月2日）", "url": "https://www.apple.com/newsroom/2026/11/apple-reports-fourth-quarter-results/"}], "strengths": ["iPhone売上が575億8,300万ドルと17%増え、9月期の記録を更新しました。高価格帯のPro系が増分を作っています。", "サービス売上が315億7,000万ドルで過去最高です。Mac売上も107億9,000万ドルと24%増えました。"], "summary": "僕はAppleを、iPhoneを入口に、Macとサービスで1人あたりの売上を積み上げる会社として見ています。2026年度第4四半期（2026年6-9月期）はiPhone売上が9月期として過去最高となり、サービス売上も過去最高を更新しました。通期売上は4,788億ドルです。", "weakness": "弱点は粗利率の先行きです。次期の粗利率見通しは45〜46%で、この四半期の47.9%から下がります。メモリ価格の上昇が主因で、関税還付の押し上げも一時的です。iPadとウェアラブルの売上はこの四半期も減りました。"}, "applied-digital": {"date": "1月上旬", "deck": null, "focus": "HPCホスティング売上の  "IonQ", "status": "見込み", "next": "次は通期売上見通し5億500万〜5億1,500万ドルへの到達と、プラットフォーム売上の伸び、残存履行義務が売上に変わる速さ、調整後EBITDAの損失幅を見ます。", "numbers": [{"label": "売上（2026年7-9月期）", "note": "6四半期連続で過去最高を更新しました。ただし約半分は買収したSkyWaterの売上です。", "source": "https://investors.ionq.com/news/news-details/2026/IonQ-Announces-Record-3Q26-Revenues-and-Raises-FY2026-Guidance-to-505---515-Million-as-Backlog-Grows-to-1-2-Billion/", "value": "1億7,380万ドル（前年同期比336%増）"}, {"label": "部門別売上（2026年7-9月期）", "note": "量子本体の伸びと買収寄与を分けて見る必要があります。プラットフォーム単体の127%増が本体の実力です。", "source": "https://investors.ionq.com/news/news-details/2026/IonQ-Announces-Record-3Q26-Revenues-and-Raises-FY2026-Guidance-to-505---515-Million-as-Backlog-Grows-to-1-2-Billion/", "value": "IonQプラットフォーム9,030万ドル（前年同期比127%増）、SkyWaterファウンドリ8,350万ドル"}, {"label": "残存履行義務（2026年9月末）", "note": "契約済みで売上に変わる前の金額です。前四半期のプラットフォーム分4億8,500万ドルから大きく積み上がりました。", "source": "https://investors.ionq.com/news/news-details/2026/IonQ-Announces-Record-3Q26-Revenues-and-Raises-FY2026-Guidance-to-505---515-Million-as-Backlog-Grows-to-1-2-Billion/", "value": "12億ドル"}, {"label": "調整後EBITDA（2026年7-9月期）", "note": "売上の77%に相当する損失です。GAAP純利益5億6,400万ドルはワラント評価益8億9,600万ドルの非現金要因で、営業の実力とは分けて見ます。", "source": "https://investors.ionq.com/news/news-details/2026/IonQ-Announces-Record-3Q26-Revenues-and-Raises-FY2026-Guidance-to-505---515-Million-as-Backlog-Grows-to-1-2-Billion/", "value": "マイナス1億3,360万ドル"}, {"label": "会社見通し（2026年通期の売上）", "note": "従来の4億5,000万〜4億6,000万ドルから引き上げました。量子コンピューティング売上は前年比110%増を見込んでいます。", "source": "https://investors.ionq.com/news/news-details/2026/IonQ-Announces-Record-3Q26-Revenues-and-Raises-FY2026-Guidance-to-505---515-Million-as-Backlog-Grows-to-1-2-Billion/", "value": "5億500万〜5億1,500万ドル"}], "sources": [{"title": "IonQ 2026年7-9月期決算リリース（2026年11月5日）", "url": "https://investors.ionq.com/news/news-details/2026/IonQ-Announces-Record-3Q26-Revenues-and-Raises-FY2026-Guidance-to-505---515-Million-as-Backlog-Grows-to-1-2-Billion/"}], "strengths": ["プラットフォーム売上が前年同期比127%増の9,030万ドルです。買収分を除いても量子本体が倍増しています。", "残存履行義務が12億ドルまで積み上がり、現金と投資は9月末で17億ドル、10月の増資後はプロフォーマで37億ドルです。先行投資を続ける資金があります。"], "summary": "僕はIonQを、イオントラップ方式の量子コンピュータを中核に、製造まで自社で持つ形へ広げた会社として見ています。2026年7月に半導体ファウンドリのSkyWaterを買収し、量子プラットフォームと製造受託の2部門構成になりました。2026年7-9月期の売上は前年同期の4倍超です。", "weakness": "弱点は損失の大きさです。調整後EBITDAはマイナス1億3,360万ドルで前年同期のマイナス4,890万ドルから広がりました。売上336%増の約半分はSkyWater買収の寄与で、本体の成長と買収の寄与を混同すると実力を見誤ります。"}, "iren": {"date": "2月上旬〜中旬", "deck": null, "focus": "年率換算売上高40億ドル超の目標（1月末へ後ずれ）への進捗と、AIクラウド売上の伸びを見る", "logo": "https://www.google.com/s2/favicons?domain=iren.com&sz=128", "name": "IREN", "status": "見込み"}, "john-deere": {"date": "11月25日", "deck": null, "focus": "2027年度見通しで農業サイクルの底打ちを裏付けるか。大型農機の需要と精密農業の伸びを見る", "logo": "https://cdn.simpleicons.org/johndeere/33566e", "name": "John Deere", "status": "確定"}, "kawasaki-hi": {"date": "2月上旬", "deck": null, "focus": "航空宇宙の下期の利益と防衛関連の売上、通期の事業利益予想1,850億円への進捗", "logo": "https://www.google.com/s2/favicons?domain=global.kawasaki.com&sz=128", "name": "川崎重工", "status": "見込み"}, "kratos": {"date": "2月下旬", "deck": null, "focus": "Q4ガイダンス売上4.8億〜5.1億ドルの達成と、2027年のフリーキャッシュフロー見通し", "logo": "https://www.google.com/s2/favicons?domain=kratosdefense.com&sz=128", "name": "Kratos", "status": "見込み"}, "l3harris": {"date": "1月下旬", "deck": null, "focus": "2027年ガイダンスと受注残、ミサイル防衛・宇宙分野の売上", "logo": "https://www.google.com/s2/favicons?domain=l3harris.com&sz=128", "name": "L3Harris", "status": "見込み"}, "lumentum": {"date": "2月2日", "deck": null, "focus": "Q2見通しの売上高15.75億〜16.25億ドルに届くか。OCS/CPOの大型受注とMarvell買収の進捗を見る", "logo": "https://commons.wikimedia.org/wiki/Special:FilePath/Lumentum_logo_dark_2015.svg?width=200", "name": "Lumentum", "status": "見込み"}, "marvell": {"date": "12月1日", "deck": null, "focus": "売上高31.5億ドル（レンジ±2%）への着地とQ4見通し。Lumentum買収の収益寄与の説明を見る", "logo": "https://commons.wikimedia.org/wiki/Special:FilePath/Marvell_Logo.svg?width=200", "name": "Marvell", "status": "確定"}, "mastercard": {"date": "1月下旬", "deck": null, "focus": "通期の純売上成長（為替中立ベース）の達成とクロスボーダー取扱高の伸び", "logo": "https://cdn.simpleicons.org/mastercard/33566e", "name": "Mastercard", "status": "見込み"}, "medtronic": {"date": "11月24日", "deck": null, "focus": "通期調整後EPSガイダンス（5.94〜6.00ドル）の維持と売上成長の内訳", "logo": "https://www.google.com/s2/favicons?domain=medtronic.com&sz=128", "name": "Medtronic", "status": "確定"}, "meta": {"date": "1月27日", "deck": null, "focus": "会社見通しの売上730億〜760億ドルへの到達と、2027年の設備投資計画", "logo": "https://cdn.simpleicons.org/meta/33566e", "name": "Meta", "status": "見込み", "next": "次は会社見通しの売上730億〜760億ドルへの到達と、2027年の設備投資計画、法務費用の追加計上の有無を見ます。", "numbers": [{"label": "売上（2026年7-9月期）", "note": "広告売上は630億6,100万ドルで26%増です。広告表示回数が10%増え、平均単価も14%上がりました。", "source": "https://www.sec.gov/Archives/edgar/data/1326801/000162828026066700/meta-09302026xexhibit991.htm", "value": "646億100万ドル（前年同期比26%増）"}, {"label": "デイリーアクティブ人数（2026年7-9月期平均）", "note": "利用者数の伸びは3%でも、広告の表示と単価で売上は26%増えました。収益化の効率が数字を作っています。", "source": "https://www.sec.gov/Archives/edgar/data/1326801/000162828026066700/meta-09302026xexhibit991.htm", "value": "36億4,000万人（前年同期比3%増）"}, {"label": "営業利益（2026年7-9月期）", "note": "州司法長官との合意に伴う98億9,000万ドルの費用計上が主因です。この費用を除くと営業利益は228億8,000万ドルと会社は示しています。", "source": "https://www.sec.gov/Archives/edgar/data/1326801/000162828026066700/meta-09302026xexhibit991.htm", "value": "129億8,800万ドル（前年同期比37%減）"}, {"label": "設備投資（2026年7-9月期）", "note": "売上の54%に相当します。フリーキャッシュフローはマイナス21億2,000万ドルになりました。通期見通しは1,350億〜1,450億ドルです。", "source": "https://www.sec.gov/Archives/edgar/data/1326801/000162828026066700/meta-09302026xexhibit991.htm", "value": "349億1,000万ドル（ファイナンスリース元本込み）"}, {"label": "会社見通し（2026年10-12月期の売上）", "note": "為替は約1%の売上下押しを前提にしています。次期の広告の伸びと費用の水準をこの範囲と照らして見ます。", "source": "https://www.sec.gov/Archives/edgar/data/1326801/000162828026066700/meta-09302026xexhibit991.htm", "value": "730億〜760億ドル"}], "sources": [{"title": "Meta 2026年7-9月期決算リリース（SEC Form 8-K Exhibit 99.1、2026年10月21日）", "url": "https://www.sec.gov/Archives/edgar/data/1326801/000162828026066700/meta-09302026xexhibit991.htm"}], "strengths": ["広告売上が630億6,100万ドルと26%増えました。表示回数10%増と平均単価14%増の両方が寄与しています。", "Reality Labsを除くFamily of Apps売上が641億5,800万ドルと全体の99%を占め、広告基盤の稼ぐ力が投資原資を生んでいます。"], "summary": "僕はMetaを、FacebookとInstagramとWhatsAppの広告で稼ぎ、その利益をAI基盤とReality Labsへ投じる会社として見ています。2026年7-9月期は広告売上が26%増えました。一方で州司法長官との合意に伴う98億9,000万ドルの費用計上と、四半期349億ドルの設備投資が利益と現金収支を圧迫しました。", "weakness": "弱点は法務費用と投資負担の重さです。州司法長官との合意は支払総額が最大約185億9,000万ドルに及び、この四半期だけで98億9,000万ドルを計上しました。営業利益率は40%から20%へ下がり、残りの負担が今後の四半期にも残ります。"}, "micron": {"date": "12月16日", "deck": null, "focus": "会社見通しの売上615億ドルと粗利率86%台、HBMの売上", "logo": "https://cdn.simpleicons.org/micron/33566e", "name": "Micron", "status": "見込み"}, "microsoft": {"date": "1月27日", "deck": null, "focus": "Azureの伸びが会社見通しの49〜50%に届くかと、設備投資の規模", "logo": "https://cdn.simpleicons.org/microsoft/33566e", "name": "Microsoft", "status": "見込み", "next": "次はAzureの伸びが会社見通しの49〜50%（為替一定ベース）に届くかと、遅れた容量の引き渡し、設備投資の規模を見ます。", "numbers": [{"label": "売上（2027年度第1四半期、2026年7-9月期）", "note": "営業利益は459億ドルで21%増えました。増分の約7割をAzureが作っています。", "source": "https://www.sec.gov/Archives/edgar/data/789019/000119312526436122/msft-ex99_1.htm", "value": "922億7,900万ドル（前年同期比19%増）"}, {"label": "Azure売上（同四半期）", "note": "初めて金額で開示されました。会社見通しの44〜45%増を上回り、需要が供給を上回る状態が続いています。", "source": "https://www.sec.gov/Archives/edgar/data/789019/000119312526436122/msft-ex99_1.htm", "value": "331億6,500万ドル（前年同期比48%増）"}, {"label": "Microsoft Cloud売上（同四半期）", "note": "Azureに Microsoft 365のクラウド等を加えた広い単位です。会社全体の7割近い売上がクラウド側にあります。", "source": "https://www.sec.gov/Archives/edgar/data/789019/000119312526436122/msft-ex99_1.htm", "value": "639億ドル（前年同期比30%増）"}, {"label": "商業受注残（2026年9月末）", "note": "契約済みで売上に変わる前の金額です。OpenAIとの商業契約が100億ドルの売上をこの四半期に生んだ点も10-Qで開示されました。", "source": "https://www.sec.gov/Archives/edgar/data/789019/000119312526436122/msft-ex99_1.htm", "value": "6,770億ドル（前年同期比73%増）"}, {"label": "設備投資（同四半期、ファイナンスリース込み）", "note": "会社が見込んだ500億ドル超を下回りました。第三者からの容量引き渡しの遅れが理由で、需要の弱さによる減速とは分けて見ます。", "source": "https://www.sec.gov/Archives/edgar/data/789019/000119312526436122/msft-ex99_1.htm", "value": "452億ドル"}], "sources": [{"title": "Microsoft 2027年度第1四半期決算リリース（SEC Form 8-K Exhibit 99.1、2026年10月28日）", "url": "https://www.sec.gov/Archives/edgar/data/789019/000119312526436122/msft-ex99_1.htm"}], "strengths": ["Azureが48%増の331億6,500万ドルです。前四半期の43%増から加速し、会社見通しも上回りました。", "商業受注残が6,770億ドルと73%増えました。将来の売上の見通しが契約の形で積み上がっています。"], "summary": "僕はMicrosoftを、Azureを中心とするクラウドとMicrosoft 365の基盤に、AIの計算とエージェントを重ねる会社として見ています。2027年度第1四半期（2026年7-9月期）はAzureの売上額を初めて開示し、前年同期比48%増を示しました。受注残は6,770億ドルまで積み上がっています。", "weakness": "弱点は供給の遅れです。設備投資は452億ドルと見込みの500億ドル超に届かず、第三者のGPU容量の引き渡しが2027年1-6月へずれました。需要があっても容量を用意できなければ売上に変えられません。"}, "mp-materials": {"date": "2月下旬", "deck": null, "focus": "GM向け磁石の商業出荷の立ち上がりと、NdPr生産量・販売量の伸び", "logo": "https://www.google.com/s2/favicons?domain=mpmaterials.com&sz=128", "name": "MP Materials", "status": "見込み"}, "nabtesco": {"date": "2月12日", "deck": null, "focus": "通期の営業利益予想326億円の達成と、過去ピーク水準の受注高が続くか、精密減速機の伸び", "logo": "https://www.google.com/s2/favicons?domain=nabtesco.com&sz=128", "name": "ナブテスコ", "status": "見込み"}, "nebius": {"date": "2月11日", "deck": null, "focus": "2027年の売上見通し120億〜130億ドルの前提と、年換算売上70億ドルの目標", "logo": "https://www.google.com/s2/favicons?domain=nebius.com&sz=128", "name": "Nebius", "status": "見込み"}, "nu-holdings": {"date": "2月下旬", "deck": null, "focus": "90日超延滞率（第3四半期7.3%）の推移と、純利益の伸び、効率性比率の改善", "logo": "https://www.google.com/s2/favicons?domain=nu.com.br&sz=128", "name": "Nu Holdings", "status": "見込み"}, "nvidia": {"date": "11月17日", "deck": "deck-n.html", "focus": "会社見通しの売上1,080億ドルとの差と粗利率74%前後、代表交代後の体制", "logo": "../assets/logo-n.svg", "name": "NVIDIA", "status": "確定", "next": "次は2026年11月17日発表の2027年度第3四半期決算で、会社見通しの売上1,080億ドルとの差と粗利率74%前後の維持、Vera Rubin世代の出荷寄与を見ます。", "numbers": [{"label": "売上（2027年度第2四半期、2026年4-7月）", "note": "1四半期で1,000億ドルに迫る規模です。AI向け計算需要が売上のほぼ全てを決めています。", "source": "https://investor.nvidia.com/news/press-release-details/2026/NVIDIA-Announces-Financial-Results-for-Second-Quarter-Fiscal-2027/default.aspx", "value": "962億2,100万ドル（前年同期比106%増）"}, {"label": "データセンター売上（同四半期）", "note": "全体の92.5%を占めます。会社の実態はデータセンター事業そのものと言える構成です。", "source": "https://investor.nvidia.com/news/press-release-details/2026/NVIDIA-Announces-Financial-Results-for-Second-Quarter-Fiscal-2027/default.aspx", "value": "890億ドル（前年同期比117%増）"}, {"label": "粗利率（同四半期）", "note": "売上を倍増させても粗利率75%を維持しています。供給側の価格決定力が数字に出ています。", "source": "https://investor.nvidia.com/news/press-release-details/2026/NVIDIA-Announces-Financial-Results-for-Second-Quarter-Fiscal-2027/default.aspx", "value": "75.0%（GAAPと非GAAPで同水準）"}, {"label": "会社見通し（2027年度第3四半期の売上）", "note": "中国向けデータセンター計算売上をゼロと置いた前提の見通しです。前提の置き方まで含めて次期の判定材料にします。", "source": "https://investor.nvidia.com/news/press-release-details/2026/NVIDIA-Announces-Financial-Results-for-Second-Quarter-Fiscal-2027/default.aspx", "value": "1,080億ドル（±2%）"}], "sources": [{"title": "NVIDIA 2027年度第2四半期決算リリース（2026年8月26日）", "url": "https://investor.nvidia.com/news/press-release-details/2026/NVIDIA-Announces-Financial-Results-for-Second-Quarter-Fiscal-2027/default.aspx"}], "strengths": ["データセンター売上が前年同期比117%増の890億ドルです。大規模クラウド事業者に加え、企業や各国政府向けの需要も伸びています。", "粗利率75.0%を維持しています。Blackwell世代への移行期でも利益率が崩れていません。"], "summary": "僕はNVIDIAを、AI計算の基盤をGPUとネットワークとソフトウェアで一体供給する会社として見ています。売上の9割超をデータセンターが占め、Blackwell世代の出荷が成長を引っ張っています。2027年度第2四半期（2026年7月26日終了）は売上が前年同期から倍増しました。", "weakness": "弱点は顧客と用途の集中です。売上の92.5%がデータセンターで、大規模クラウド事業者の設備投資が一服すれば売上全体が直撃を受けます。中国向け売上をゼロと置く前提も、地政学で数字が振れる構造を示しています。"}, "oklo": {"date": "3月16日", "deck": null, "focus": "2027年の支出見通しと、Aurora初号機（2028〜29年稼働目標）の建設進捗、現金31億ドルの持続性を見る", "logo": "https://commons.wikimedia.org/wiki/Special:FilePath/Oklo_Inc_logo.png?width=200", "name": "Oklo", "status": "見込み"}, "oracle": {"date": "12月14日", "deck": null, "focus": "クラウドの受注残（RPO）の伸びと、データセンター投資の規模", "logo": "https://cdn.simpleicons.org/oracle/33566e", "name": "Oracle", "status": "確定"}, "ouster": {"date": "3月25日", "deck": null, "focus": "第4四半期の売上ガイダンス6,100万〜6,400万ドルの達成と、Rev8の量産と黒字化への道筋", "logo": "https://www.google.com/s2/favicons?domain=ouster.com&sz=128", "name": "Ouster", "status": "見込み"}, "palantir": {"date": "2月1日", "deck": "j7.html", "focus": "政府向けの伸びと主権AIまわりの受注、米国外の伸び、米民間の1社あたり売上", "logo": "../assets/logo-p.svg", "name": "Palantir", "status": "見込み", "next": "次は2026年10-12月期の売上26億4,900万〜26億5,300万ドルという会社見通しの達成と、米国商業の契約額の伸び、米国外売上の拡大を見ます。政府向けの伸びと主権AIまわりの受注、米民間の1社あたり売上も引き続き確認します。", "numbers": [{"label": "売上（2026年7-9月期）", "note": "四半期で初めて20億ドルを超えました。成長の中心は米国です。", "source": "https://www.sec.gov/Archives/edgar/data/1321655/000132165526000045/a2026q3ex991pressrelease.htm", "value": "23億1,341万ドル（前年同期比96%増）"}, {"label": "米国商業売上（2026年7-9月期）", "note": "米国政府売上9億5,300万ドルを初めて上回りました。民間の拡大が政府依存の構図を変えています。", "source": "https://www.sec.gov/Archives/edgar/data/1321655/000132165526000045/a2026q3ex991pressrelease.htm", "value": "9億8,400万ドル（前年同期比148%増）"}, {"label": "GAAP営業利益（2026年7-9月期）", "note": "売上をほぼ倍増させながら47%の営業利益率を出しています。規模と利益率を同時に伸ばした点が数字の核です。", "source": "https://www.sec.gov/Archives/edgar/data/1321655/000132165526000045/a2026q3ex991pressrelease.htm", "value": "10億8,500万ドル（営業利益率47%）"}, {"label": "会社見通し（2026年10-12月期の売上）", "note": "通期見通しも85億3,000万〜85億3,400万ドルへ引き上げました。次期も高い成長率を会社自身が前提にしています。", "source": "https://www.sec.gov/Archives/edgar/data/1321655/000132165526000045/a2026q3ex991pressrelease.htm", "value": "26億4,900万〜26億5,300万ドル"}], "sources": [{"title": "Palantir 2026年7-9月期決算リリース（SEC Form 8-K Exhibit 99.1、2026年11月2日）", "url": "https://www.sec.gov/Archives/edgar/data/1321655/000132165526000045/a2026q3ex991pressrelease.htm"}], "strengths": ["米国商業売上が前年同期比148%増の9億8,400万ドルとなり、米国政府売上を初めて上回りました。売上の柱が政府から民間へ広がっています。", "GAAP営業利益率47%、調整後では62%です。売上96%増と高い利益率が同時に成立しています。"], "summary": "僕はPalantirを、政府機関と大企業の業務データをつなぎ、現場の意思決定に使う基盤を売る会社として見ています。主力はGothamとFoundryで、その上にAI基盤のAIPを重ね、米国政府と米国民間を中心に売上を伸ばしています。2026年7-9月期は四半期売上が初めて20億ドルを超え、米国商業売上が初めて米国政府売上を上回りました。", "weakness": "弱点は米国への集中です。米国売上が全体の84%を占め、米国外の売上は3億7,600万ドルにとどまります。米国商業の新規契約額の伸びが鈍れば、全体の成長率を支える柱が細ります。"}, "palo-alto": {"date": "11月18日", "deck" me": "Serve Robotics", "status": "見込み"}, "shopify": {"date": "2月中旬", "deck": null, "focus": "Q4売上ガイダンス（30%台前半の成長）の達成とGMV、FCFマージン", "logo": "https://cdn.simpleicons.org/shopify/33566e", "name": "Shopify", "status": "見込み"}, "sk-hynix": {"date": "1月下旬", "deck": null, "focus": "HBM4が出荷・売上でHBM3Eを上回るかと、2027年の設備投資計画の規模", "logo": "https://cdn.simpleicons.org/skhynix/33566e", "name": "SK hynix", "status": "見込み"}, "sofi": {"date": "1月29日", "deck": "deck-s.html", "focus": "手数料型収益の比率と技術基盤の口座数、貸し倒れ率と預金の伸び", "logo": "../assets/logo-s.svg", "name": "SoFi", "status": "見込み", "next": "次は通期見通しの調整後純売上50億4,000万ドルへの進捗と、手数料型収益の比率、技術基盤部門の口座数、貸し倒れ率と預金の伸びを見ます。", "numbers": [{"label": "純売上（2026年7-9月期、GAAP）", "note": "調整後純売上は13億7,100万ドルです。四半期で初めて14億ドルに届く規模になりました。", "source": "https://www.sec.gov/Archives/edgar/data/1818874/000181887426000065/a2026q3earningsrelease.htm", "value": "13億8,510万ドル（前年同期比44%増）"}, {"label": "会員数とプロダクト数（2026年9月末）", "note": "四半期で会員120万人、プロダクト220万件を純増させました。1人あたりプロダクト数は1.56件まで上がっています。", "source": "https://www.sec.gov/Archives/edgar/data/1818874/000181887426000065/a2026q3earningsrelease.htm", "value": "会員1,710万人（前年同期比35%増）、プロダクト2,670万件（同44%増）"}, {"label": "手数料型収益（2026年7-9月期）", "note": "金利に左右されにくい収益の比率が4割を超えました。収益の質を見るうえで僕が最も重視する数字です。", "source": "https://www.sec.gov/Archives/edgar/data/1818874/000181887426000065/a2026q3earningsrelease.htm", "value": "5億7,100万ドル（調整後純売上の42%）"}, {"label": "貸出実行額と預金（2026年7-9月期）", "note": "実行額は過去最高で、うち38億ドルは第三者向けのローンプラットフォーム経由です。預金の積み上がりが調達コストを支えます。", "source": "https://www.sec.gov/Archives/edgar/data/1818874/000181887426000065/a2026q3earningsrelease.htm", "value": "貸出実行額169億ドル、預金残高513億ドル"}, {"label": "純利益（2026年7-9月期）", "note": "前年同期の1億3,940万ドルから73%増えました。成長投資と黒字の両立が続いています。", "source": "https://www.sec.gov/Archives/edgar/data/1818874/000181887426000065/a2026q3earningsrelease.htm", "value": "2億4,100万ドル（希薄化後EPS 0.18ドル）"}], "sources": [{"title": "SoFi 2026年7-9月期決算リリース（SEC Form 8-K Exhibit 99.1、2026年10月27日）", "url": "https://www.sec.gov/Archives/edgar/data/1818874/000181887426000065/a2026q3earningsrelease.htm"}], "strengths": ["手数料型収益が調整後純売上の42%まで上がりました。貸出の金利収益だけに頼る構成から移りつつあります。", "会員1,710万人とプロダクト2,670万件が同時に過去最高です。新規会員の51%相当を既存会員の追加利用が占め、獲得効率も上がっています。"], "summary": "僕はSoFiを、借りる、貯める、使う、投資するを1つのアプリにまとめたデジタル金融の会社として見ています。銀行免許を持ち、預金で貸出原資を調達しながら、手数料型の収益を積み上げる構成へ移しています。2026年7-9月期は会員数とプロダクト数が過去最高を更新しました。", "weakness": "弱点は技術基盤（テクノロジープラットフォーム）部門です。売上は8,700万ドルと前年同期比24%減りました。大型顧客の移行が理由で、その顧客を除けば18%増と会社は説明しますが、外部向け基盤事業の顧客集中は数字に残っています。"}, "softbank-g": {"date": "2月中旬", "deck": null, "focus": "OpenAIなど投資先の評価損益の振れと、NAV・LTVの水準、財務費用の増減", "logo": "https://www.google.com/s2/favicons?domain=group.softbank&sz=128", "name": "ソフトバンクG", "status": "見込み"}, "stryker": {"date": "1月下旬", "deck": null, "focus": "下方修正後の通期調整後EPS見通し（14.80〜14.90ドル）と2027年ガイダンス", "logo": "https://www.google.com/s2/favicons?domain=stryker.com&sz=128", "name": "Stryker", "status": "見込み"}, "symbotic": {"date": "11月23日", "deck": null, "focus": "見通しの売上高7.6億〜7.8億ドルと調整後EBITDAに届くか。2027年度見通しとWalmart向け展開を見る", "logo": "https://commons.wikimedia.org/wiki/Special:FilePath/SymboticLogo.jpg?width=200", "name": "Symbotic", "status": "確定"}, "tempus-ai": {"date": "2月下旬", "deck": null, "focus": "通期売上ガイダンス（約16億ドル）の達成と2027年見通し、データ＆アプリの伸び", "logo": "https://www.google.com/s2/favicons?domain=tempus.com&sz=128", "name": "Tempus AI", "status": "見込み"}, "teradyne": {"date": "1月27日", "deck": null, "focus": "第4四半期の売上ガイダンス12.5億〜13.5億ドルの達成と、AI半導体テスト需要の持続", "logo": "https://www.google.com/s2/favicons?domain=teradyne.com&sz=128", "name": "Teradyne", "status": "見込み"}, "tesla": {"date": "1月27日", "deck": "deck-t.html", "focus": "自動車の売上と営業利益率の低下が止まるか、蓄電池の出荷とFSD有料利用", "logo": "../assets/new-tesla-logo.svg", "name": "Tesla", "status": "見込み", "next": "次は自動車の売上と営業利益率の低下が止まるか、蓄電池の出荷（7-9月期は13.7GWh）とFSD有料利用の伸び、2026年の設備投資見通し約200億ドルの使い方を見ます。", "numbers": [{"label": "売上（2026年7-9月期）", "note": "自動車売上は205億6,000万ドルで3%減りました。台数と単価の両面で自動車が伸びていない点が全体を止めています。", "source": "https://ir.tesla.com/_flysystem/s3/sec/000162828026066738/tsla-20261021-gen.pdf", "value": "280億4,600万ドル（前年同期比0.2%減）"}, {"label": "納車台数（2026年7-9月期）", "note": "生産台数は464,391台で4%増えました。在庫は11日分まで圧縮され、受注残は4年ぶりの高水準と会社は説明しています。", "source": "https://ir.tesla.com/_flysystem/s3/sec/000162828026066738/tsla-20261021-gen.pdf", "value": "486,532台（前年同期比2%減）"}, {"label": "営業利益（2026年7-9月期）", "note": "営業費用が39%増え、利益を圧迫しました。売上280億ドルに対して営業利益は7億ドル台まで細っています。", "source": "https://ir.tesla.com/_flysystem/s3/sec/000162828026066738/tsla-20261021-gen.pdf", "value": "7億1,800万ドル（前年同期比56%減、営業利益率2.6%）"}, {"label": "FSD有料利用とサービス売上（2026年7-9月期）", "note": "自動車本体が伸びない中で、ソフトウェアとサービスが収益の受け皿になっています。", "source": "https://ir.tesla.com/_flysystem/s3/sec/000162828026066738/tsla-20261021-gen.pdf", "value": "FSDアクティブ利用174万人（前年同期比67%増）、サービス売上46億500万ドル（同33%増）"}, {"label": "フリーキャッシュフロー（2026年7-9月期）", "note": "営業キャッシュフロー62億6,000万ドルから設備投資47億3,000万ドルを引いた水準です。現金と投資は454億5,000万ドルまで積み上がりました。", "source": "https://ir.tesla.com/_flysystem/s3/sec/000162828026066738/tsla-20261021-gen.pdf", "value": "15億3,100万ドル"}], "sources": [{"title": "Tesla 2026年7-9月期アップデート（SEC Form 8-K Exhibit 99.1、2026年10月21日）", "url": "https://ir.tesla.com/_flysystem/s3/sec/000162828026066738/tsla-20261021-gen.pdf"}], "strengths": ["サービス売上が前年同期比33%増の46億500万ドルで、粗利益は過去最高の7億3,400万ドルです。台数が伸びない局面でも稼ぐ部門を持っています。", "FSDのアクティブ利用が174万人と67%増えました。規制クレジット売上は1億1,300万ドルまで減り、クレジット頼みの度合いも下がっています。"], "summary": "僕はTeslaを、電気自動車の販売を土台に、エネルギー、サービス、自動運転へ収益源を広げる会社として見ています。2026年7-9月期は売上が前年同期とほぼ同水準で、納車台数は微減でした。一方でサービス売上が33%増え、FSDの有料利用は174万人まで伸びています。", "weakness": "弱点は自動車の利益率です。営業利益は7億1,800万ドルと前年同期から56%減り、営業利益率2.6%まで下がりました。クレジットを除く自動車粗利率は18.1%まで戻しましたが、AIと研究開発への支出増が利益を相殺しています。"}, "trimble": {"date": "2月上旬", "deck": null, "focus": "ARR成長率（Q3に約10%へ下方修正）の着地と2027年見通し、AECOの伸び", "logo": "https://www.google.com/s2/favicons?domain=trimble.com&sz=128", "name": "Trimble", "status": "見込み"}, "tsmc": {"date": "1月14日", "deck": null, "focus": "会社見通しの売上523億〜543億ドルと粗利率65〜67%、2027年の設備投資", "logo": "https://cdn.simpleicons.org/tsmc/33566e", "name": "TSMC", "status": "確定", "next": "次は会社見通しの売上523億〜543億ドルと粗利率65〜67%の達成、2nmの売上比率、2027年の設備投資の規模を見ます。", "numbers": [{"label": "売上（2026年7-9月期）", "note": "会社見通しの446億〜458億ドルを上回りました。純利益は新台湾ドル7,630億6,000万ドルで68.7%増です。", "source": "https://investor.tsmc.com/english/encrypt/files/encrypt_file/qr/phase4_reports/2026-10/cb1c588cc3b2009f97afa57a6d7c146ae1e27808/3Q26%20EarningsRelease_WoG.pdf", "value": "467億2,000万ドル（前年同期比41.2%増、新台湾ドルで1兆4,942億4,000万ドル）"}, {"label": "粗利率と営業利益率（2026年7-9月期）", "note": "2nm量産の初期費用で粗利率は前四半期から1.3ポイント下がりました。量産初期の負担と水準の高さを両方見ます。", "source": "https://investor.tsmc.com/english/encrypt/files/encrypt_file/qr/phase4_reports/2026-10/cb1c588cc3b2009f97afa57a6d7c146ae1e27808/3Q26%20EarningsRelease_WoG.pdf", "value": "粗利率66.4%、営業利益率58.7%"}, {"label": "工程別と用途別の構成（2026年7-9月期）", "note": "2nmはウェハ売上の8%まで上がりました。AI向けのHPCが会社の重心です。", "source": "https://investor.tsmc.com/english/encrypt/files/encrypt_file/qr/phase4_reports/2026-10/cb1c588cc3b2009f97afa57a6d7c146ae1e27808/3Q26%20EarningsRelease_WoG.pdf", "value": "7nm以下がウェハ売上の79%、HPCが売上の68%"}, {"label": "会社見通し（2026年10-12月期）", "note": "通期の売上成長見通しは米ドルで約44%へ引き上げました。2026年の設備投資は600億〜640億ドルの計画を維持しています。", "source": "https://investor.tsmc.com/english/encrypt/files/encrypt_file/qr/phase4_reports/2026-10/cb1c588cc3b2009f97afa57a6d7c146ae1e27808/3Q26%20EarningsRelease_WoG.pdf", "value": "売上523億〜543億ドル、粗利率65〜67%"}], "sources": [{"title": "TSMC 2026年7-9月期決算リリース（2026年10月15日）", "url": "https://investor.tsmc.com/english/encrypt/files/encrypt_file/qr/phase4_reports/2026-10/cb1c588cc3b2009f97afa57a6d7c146ae1e27808/3Q26%20EarningsRelease_WoG.pdf"}], "strengths": ["売上が467億2,000万ドルと会社見通しの上限を超えました。先端工程の需要が供給能力を上回る状態が続いています。", "粗利率66.4%と営業利益率58.7%です。2nm量産の初期負担を受けても6割超の粗利率を保っています。"], "summary": "僕はTSMCを、先端半導体の製造を一手に引き受けるファウンドリとして見ています。NVIDIAやAMDのAIチップは同社の先端工程と先端パッケージを通ります。2026年7-9月期は2nmの量産が売上に入り始め、HPCが売上の68%を占めました。", "weakness": "弱点は2nm量産初期の利益率負担です。粗利率は前四半期から1.3ポイント下がり、会社は量産初期の希薄化を理由に挙げています。海外工場の立ち上げも利益率の下押し要因として会社が繰り返し示しています。"}, "uber": {"date": "2
