jp/disc/58010/140120261106567992.pdf"}], "status": "見込み", "strengths": ["光ソリューション営業利益が7億円から236億円へ増え、情報コンポーネント151億6800万円と合わせた光関連2部門で全社営業利益の67%を作ります。データセンター向け光部品は認定と量産実績が参入障壁になり、需要局面で認定済み供給先に発注が集中する構造が利益の跳ね方を説明します。", "通期予想を売上1兆5700億円と営業利益1360億円へ引き上げました。上期時点で下期に783億8200万円の営業利益を積む計画を置ける状態は受注と単価の両方に裏付けがある局面に限られます。", "営業キャッシュフロー286億9200万円を確保し自己資本比率は39.7%まで上がりました。光への投資を進めながら財務の厚みを増やし、次の設備投資を借入依存にしすぎない形を保ちます。"], "summary": "僕は古河電工を、光ファイバーと光部品を通信事業者とデータセンター事業者へ売り、電線と自動車部品で売上の土台を持つ会社として見ています。2026年4-9月期は光ソリューション営業利益が前年同期7億円から236億円へ跳ね、光関連2部門が全社利益の中心へ躍り出た転換期です。2部門合計の営業利益387億6800万円は全社営業利益の67%に達します。", "weakness": "弱点は営業利益の67%を光関連2部門に依存する集中です。純利益587億8100万円には政策保有株式売却による投資有価証券売却益227億7700万円も含まれます。データセンター向け光部品の需要が一服し単価が下がれば、光2部門の利益387億6800万円が縮み、下期計画783億8200万円と通期予想1360億円が同時に崩れます。"}, "galaxy-digital": {"date": "3月下旬", "deck": null, "focus": "データセンター部門の調整後EBITDAの拡大と、デジタル資産部門の黒字転換", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAACpklEQVRoge3ZO4hUVxjA8d8cF42LKEGMwfiIGi00wvpA7UQbjUpAfISAYNJaiWBrYxOwELtACgliEUih2KjYChauig/iC5KYqIXiZgk+4mPX4htfk9nduTOzc2bAP5zq3AP/757vnHvOd0saZxw+x1IswwLMwMf4CIN4ioe4jSs4hwv4E8+b4FCYEqbje/yKP8qSgzW2J7iFI/gWn7ZSfjb24je8KCA9VHuGi9iDz0ZTfCJ2lsUHmiBe2V6WA9mB7mbLL8JR8baaLV4tvQ5jXjPEE77G9RaIV7YLWDOSYGmEvi34AVPFFLeSMWKX2o2TQz00VAAJX4npfCTeSA5KmCTW3OkiAzfhPOaOglRRlojFvbrWAT24iTuYM0pSRejBP+KFfjHSw5NwTKTMX9ongIfC6WeMf7czVTy8A+tb41UX27B5qM553t8u23EGBsU5atrrzndn4DvMb6VZnSwRM4G3AczG1iw6xSlhOz7hbQDr1LDC24hFWEUE0I0Nhv8qtxtjsRFjksj7xXl96mIlZiasUM6nDmM6ehKWoyuzTD10Y1nCwtwmDfBlElPRqcxKonrQqUxOovTRqXQnnbX/V1JK4qLeqfyX8G9uiwboT7iX26IB7iTcyG3RANcSeuWrOjTCc/QmnEV/Zpl6uK8cwGVcyyxTD5dwM+GBgkWjNuEEHr++kR0XgXQKt0UAb66UF3Eqm05xjoni25sAnuEn9OUyKsBdHBL10vfKKmfwSw6jghwSGVOV+biqfQtbZ9XwG+obcT76W/sE0Cf2/bW1DOjCPvyuPQJYLPJ+lypH/2qX+RfYLxb2OHHhqSwCt4oB8afmIH5U5cgz3GVmJg5gSrWBLSKJf9C7RQr9j+HKKQMi/3Kn0QSRFVXJlRpN40MAufkQQG5eAaqj4XpY9lh+AAAAAElFTkSuQmCC", "name": "Galaxy Digital", "next": "次に見る数字はデータセンター部門の調整後EBITDAです。第3四半期の6900万ドルを基準に、2四半期連続で増えるかを判定水準にします。デジタル資産部門の調整後EBITDAがマイナス900万ドルから黒字へ戻るか、Helios第1期フェーズ2の建設進捗、手元流動性49億ドルの維持を、2027年3月下旬の2026年10-12月期決算で確認します。", "numbers": [{"label": "純利益（2026年7-9月期）", "value": "3億2300万ドル（希薄化EPS 0.66ドル）", "note": "前四半期8500万ドルの損失から黒字へ移り、前年同期は5億500万ドルでした。調整後EPSは0.83ドルです。黒字転換の主因は自社保有資産の評価であり、本業の稼ぎと分けて読む必要があります。", "source": "https://www.sec.gov/Archives/edgar/data/1859392/000185939226000108/glxy-20260930xpressrelease.htm"}, {"label": "調整後EBITDA（2026年7-9月期）", "value": "4億5500万ドル（調整後粗利益5億6900万ドル）", "note": "内訳は財務と自社保有分3億9500万ドル、データセンター6900万ドル、デジタル資産900万ドルのマイナスです。利益の87%が評価連動部門から出る構成であり、安定収益の割合はまだ1割強にとどまります。", "source": "https://www.sec.gov/Archives/edgar/data/1859392/000185939226000108/glxy-20260930xpressrelease.htm"}, {"label": "データセンター部門（2026年7-9月期）", "value": "調整後粗利益7900万ドル、調整後EBITDA6900万ドル", "note": "Helios第1期133MWをCoreWeaveへ全量納入した後の初の通期四半期で、前四半期の粗利益2000万ドルとEBITDA1100万ドルから跳ねました。賃料型収益が四半期単位で積み上がる形が初めて確認できる数字です。", "source": "https://www.sec.gov/Archives/edgar/data/1859392/000185939226000108/glxy-20260930xpressrelease.htm"}, {"label": "運用資産とステーキング資産の合計（2026年9月30日時点）", "value": "104億ドル（前四半期末比46%増）", "note": "資産運用とステーキングの残高拡大は手数料収入の母数を広げます。デジタル資産の取引量も市場全体の現物取引が減る中で前四半期比12%増え、顧客基盤の厚みが市況耐性を作り始めています。", "source": "https://www.sec.gov/Archives/edgar/data/1859392/000185939226000108/glxy-20260930xpressrelease.htm"}, {"label": "手元流動性と株主資本（2026年9月30日時点）", "value": "手元流動性49億ドル、株主資本30億ドル", "note": "手元流動性は前四半期末25億ドルから増えました。Helios第1期フェーズ2の建設資金として35億ドルの債券発行を終えており、建設期の資金繰りを先に固定した点が次の賃料拡大の前提です。", "source": "https://www.sec.gov/Archives/edgar/data/1859392/000185939226000108/glxy-20260930xpressrelease.htm"}], "sources": [{"title": "Galaxy Announces Third Quarter 2026 Financial Results（2026年10月27日、SEC提出の決算リリース）", "url": "https://www.sec.gov/Archives/edgar/data/1859392/000185939226000108/glxy-20260930xpressrelease.htm"}], "status": "見込み", "strengths": ["Helios第1期133MWをCoreWeaveへ全量貸し切り、データセンター部門の調整後EBITDAが前四半期1100万ドルから6900万ドルへ伸びました。長期契約の賃料は暗号資産価格と連動せず、評価で振れる利益構造に固定収益の柱を1本足します。", "運用資産とステーキング資産の合計が104億ドルへ46%増え、平均融資残高も増えました。取引と運用と融資の3事業が同じ顧客基盤を共有する構造は市況が弱い部門を強い部門の顧客で補う形を作ります。", "手元流動性49億ドルと株主資本30億ドルを確保し、Helios第1期フェーズ2向けに35億ドルの債券発行を終えました。建設資金を調達済みの状態は電力容量の確保競争で先行する条件です。"], "summary": "僕はGalaxy Digitalを、暗号資産の取引と資産運用と融資で手数料と金利を稼ぎ、テキサス州Helios拠点をAI事業者へ貸して賃料を取る会社として見ています。2026年7-9月期はHelios第1期133MWをCoreWeaveへ全量貸しした賃料の初の通期四半期分が入り、データセンター部門の調整後EBITDAが前四半期1100万ドルから6900万ドルへ伸びました。", "weakness": "弱点は調整後EBITDAの87%を財務と自社保有分に依存する利益構造です。同部門は前四半期に粗利益4200万ドルのマイナスを出しました。暗号資産価格が下落へ反転すれば同部門の評価益が消え、本業のデジタル資産部門が2四半期連続マイナスの現状では全体の黒字を支える部門がなくなります。"}, "globalfoundries": {"date": "2月10日", "deck": null, "focus": "第4四半期見通し売上20億ドルと非IFRS粗利率31.5%の達成、通信インフラとデータセンター向けの伸び", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAMAAAD04JH5AAAAh1BMVEX/////YBL/UgD/6+L/8Of/cTf/6OL/VwD/WwD/vKn/0Lr/4dT/bij/mHL/+vf/g0j/p4T/5tr/vJz/q4r/tZb/nHP/x7H/8+3/djT/wa3/ZxT/aR3/oX3/jGP/ilr/18j/lmn/kmL/fT3/wqX/fET/r4j/qoH/glX/0MD/dkL/i1T/uJ7/spl4oF09AAADMUlEQVR4nO2a23aqMBBAo2CTgkWQm4pVvLWe6v9/30GrcskAxjOE8zD7pa41XZlNTEImkTGCIAiCIAiCIIjncZ74F5Bb6B9Se+t3300nBpjTnvvLTWpePkfbiczWzVJ7h2kQvZre8kcDzrkYAgKGu0qyEB9dBd6HQoZ/ZAJhdIg21ivZ41PWvhhckAXs7fAWuwnwgYzIBKLdPFraqXp6x9rnbVYFPHcg7rEWgdN0fv4wV+qPv89TSALeohBrETA2O+MQTlXzr2ei2FJZIBDFYIsAsw67L181/zQp5S8LBOVYmwCLbXAONREOKy0VBYJKqlYBdSKppYKAJSoxfAG7mqIo4EkxdAEvaRBwVlIQW8BJ5fy5QCQHsQWO1QFYFHC23QvMgA54CFiAHbJABDX0EPgG7HAFYijFQ8AcATFcATuB8t8FgCGILVBd5koCzhKK4goAozwXiCed94ABzcFcYAbFUAWgaZYLGOAAQRWYwkPgJvAGRtv2hEocmgXA/vkVMCwIWzE/C+Ex+IQAEvAypFFAftlqFuj9K3h9EMY2hPJutGYlfkJgvhjLJEvlhehlAXAhUl8HTFwB7JeRDoFT3wLrvgWMfcOWTIdAzUTUKMDAd75OgV19XaBHIB7XlmZ6BLLitGcBqDjSK8C++haIw2prmgWY81MZiLoFssk4AI7pdAqw46LYYg8CzPQLZ0V9CGSl+lJw0adAtiYFM36tsbRtyWTsqfu52i/MNgGkTSmIExu/NZ6GbXkzGgoTEvgPBBzwoMGKtQkw4KSlcR0Qf1CmWk7DWTEs8I2bn1XfxK0C6jdyzWxUBUJkAbAyaRDgB2QBY6EmMEQeg/CBcL2AmGELgBV6vQA/YecHrwzqBRLlw9B2UoXCRKT4+Zkpd0G9QNyBADtLo6BOgCtfiz+FJx1V1QiISScdANxMwAJi7HWTX74+hQV4BzPgTiRaSzMxmHeX/1KaiWYBITp8/gv2D28S4KvOvv87jp+fFlUFeHJGfwUAmKt7cVgSyHZoYeePf8ML9ol4/JTrbXj5PPp0daW/YNrHwE+31wXHmISuH3k6Or+KU/pDEARBEARBEASBxF/mWT6YrQ13jQAAAABJRU5ErkJggg==", "name": "GlobalFoundries", "next": "次は会社見通し売上20億ドル±2500万ドルと非IFRS粗利率31.5%±1ポイントの達成を最初に確認します。通信インフラとデータセンター向け売上の伸び、2027年の設備投資計画、米政府への追加株式発行に伴う費用の開示を2027年2月10日の第4四半期決算で見ます。", "numbers": [{"label": "売上（2026年第3四半期）", "value": "18億9900万ドル（前年同期比13%増）", "note": "前四半期比でも6%増え、ウエハ出荷量は300ミリ換算で64万7000枚です。通信インフラとデータセンター向けの伸びがスマートモバイルの減少を上回り、需要の中心が端末からインフラへ移る構成変化が進んでいます。", "source": "https://www.sec.gov/Archives/edgar/data/1709048/000170904826000259/globalfoundries3q2026earni.htm"}, {"label": "粗利率（2026年第3四半期）", "value": "非IFRS粗利率31.4%、IFRS粗利率30.1%", "note": "非IFRS粗利率は過去最高で前年同期から5.4ポイント上がりました。製品構成の改善が主因であり、値上げでなく高付加価値品の比率上昇で利益率を作る形は持続性の読み方が変わります。", "source": "https://www.sec.gov/Archives/edgar/data/1709048/000170904826000259/globalfoundries3q2026earni.htm"}, {"label": "IFRS純損失（2026年第3四半期）", "value": "2億7000万ドル", "note": "米政府への990万株発行に伴う営業外費用4億4100万ドルの非現金費用が主因です。非IFRS純利益は2億9800万ドル、調整後EBITDAは6億4700万ドルであり、本業の稼ぎと資本政策のコストを分けて読む四半期です。", "source": "https://www.sec.gov/Archives/edgar/data/1709048/000170904826000259/globalfoundries3q2026earni.htm"}, {"label": "現金と有価証券（2026年9月30日時点）", "value": "32億ドル", "note": "営業キャッシュフロー3億4100万ドル、非IFRS調整後フリーキャッシュフロー1億3600万ドルです。設備投資を続けながら現金を維持する水準であり、米国工場拡張の自己資金の裏付けになります。", "source": "https://www.sec.gov/Archives/edgar/data/1709048/000170904826000259/globalfoundries3q2026earni.htm"}, {"label": "会社見通し（2026年第4四半期）", "value": "売上20億ドル±2500万ドル、非IFRS粗利率31.5%±1ポイント", "note": "非IFRS EPS見通しは0.59ドル±0.05ドルです。第3四半期実績から売上と粗利率の両方を一段上げる前提を会社が置き、構成改善が一過性でないかを次期実績で判定できます。", "source": "https://www.sec.gov/Archives/edgar/data/1709048/000170904826000259/globalfoundries3q2026earni.htm"}], "sources": [{"title": "GlobalFoundries Reports Third Quarter 2026 Financial Results（2026年11月4日、SEC Form 6-K Exhibit 99.1）", "url": "https://www.sec.gov/Archives/edgar/data/1709048/000170904826000259/globalfoundries3q2026earni.htm"}], "status": "見込み", "strengths": ["非IFRS粗利率が31.4%と過去最高まで上がりました。通信インフラとデータセンター向けの高付加価値品の比率上昇が主因で、成熟プロセスのファウンドリでも製品構成の設計で利益率を作れる点を示します。", "TSMCと20億ドルの複数年製造契約を結び、Malta工場でCoWoS向けシリコンインターポーザの米国内供給を担います。先端パッケージの国内供給網に入る契約は単発受注と違い、複数年の数量を先に固定する構造的な受注です。", "米日イニシアチブでMalta敷地の新ファブ2棟の技術提供と運営を担い、最大210億ドルの資金枠を持つ計画に参加します。政府資金を建設費に充てる形は自己資金の負担を抑えたまま米国内の生産能力を増やす道です。"], "summary": "僕はGlobalFoundriesを、半導体メーカーから設計済みウエハの製造を受託し、長期契約の数量で稼ぐファウンドリとして見ています。成熟プロセスに軸足を置き、2026年第3四半期は非IFRS粗利率が31.4%と過去最高まで上がり、数量回復が利益率改善へ直結する局面に入りました。売上18億9900万ドル規模で、数量回復の初期局面にあります。", "weakness": "弱点は売上の土台であるスマートモバイル向けの縮小と、政府資本への依存が利益計算を曇らせる点です。営業キャッシュフローは前年同期5億9500万ドルから3億4100万ドルへ減りました。インフラ向けの伸びが端末の減少を埋め切れず稼働率が落ちれば、固定費の重いファウンドリでは粗利率31.4%が短期間で崩れます。"}, "harmonic-drive": {"date": "2月10日", "deck": null, "focus": "上方修正した通期予想（売上780億円・営業利益102億円）への進捗と、受注の勢いが続くか", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAM0lEQVQ4jWNgGGjAyLjg+H9sEv8TLBlRFOJQx0SpCwbeAKL8iQ6Qw2fgvUB5GIymg0EAADPFEOT9DwTfAAAAAElFTkSuQmCC", "name": "ハーモニック・ドライブ", "next": "次に見る数字は会社見通しの売上780億円と営業利益102億円への到達です。2026年10-12月期の受注高が増え続けるか、中国セグメントの売上が22億4500万円から戻るか、下期の営業利益59億9500万円へ届く進捗かを、2027年2月の第3四半期決算で確認します。", "numbers": [{"label": "受注高（2026年4-9月期）", "value": "503億8600万円（前年同期比70.7%増）", "note": "売上361億2400万円を142億6200万円上回り、受注残高は364億6800万円へ77.6%増えました。受注が売上に先行する部品事業で、下期以降の稼働を先に確保する形へ変わった四半期です。", "source": "https://www2.jpx.co.jp/disc/63240/140120261106567186.pdf"}, {"label": "売上（2026年4-9月期）", "value": "361億2400万円（前年同期比29.8%増）", "note": "減速装置が276億3600万円で26.2%増え、メカトロニクス製品が84億8700万円で43.0%増えました。半導体製造装置向けと産業用ロボット向けの両方から増収し、単一用途への依存が薄れています。", "source": "https://www2.jpx.co.jp/disc/63240/140120261106567186.pdf"}, {"label": "営業利益（2026年4-9月期）", "value": "42億500万円（前年同期比803.5%増）", "note": "営業利益率は前年同期の1.7%から11.6%へ上がりました。工場稼働率の上昇が製造原価率を押し下げ、増収が利益へ直結する固定費構造を確認できます。", "source": "https://www2.jpx.co.jp/disc/63240/140120261106567186.pdf"}, {"label": "日本セグメント（2026年4-9月期）", "value": "売上172億600万円、営業利益47億2100万円", "note": "日本の営業利益が連結営業利益42億500万円を上回り、全社費用を引く前の稼ぎを日本が作る構造です。北米は売上71億3900万円で営業利益5億300万円の黒字へ転じました。", "source": "https://www2.jpx.co.jp/disc/63240/140120261106567186.pdf"}, {"label": "通期予想（会社見通し、2026年11月11日修正）", "value": "売上780億円、営業利益102億円", "note": "従来予想の売上745億円と営業利益85億円から引き上げました。上期の営業利益の進捗は41.2%で、下期に59億9500万円を積む前提です。年間配当予想は20円から28円へ増えました。", "source": "https://www2.jpx.co.jp/disc/63240/140120261106567176.pdf"}], "sources": [{"title": "ハーモニック・ドライブ・システムズ 2027年3月期第2四半期（中間期）決算短信〔日本基準〕（連結）（2026年11月11日、JPX TDnet開示）", "url": "https://www2.jpx.co.jp/disc/63240/140120261106567186.pdf"}, {"title": "ハーモニック・ドライブ・システムズ 通期業績予想の修正並びに配当予想の修正に関するお知らせ（2026年11月11日、JPX TDnet開示）", "url": "https://www2.jpx.co.jp/disc/63240/140120261106567176.pdf"}], "status": "見込み", "strengths": ["受注残高が364億6800万円へ77.6%増え、2026年4-9月期の売上361億2400万円と同規模の仕事をすでに抱えます。受注が売上に先行する事業で、次の2四半期の稼働を読みやすくします。", "減速装置で世界首位級の地位を持ち、産業用ロボットと半導体製造装置と手術支援ロボットへ用途が広がります。北米で手術支援ロボット向けの受注が増えた通り、顧客の設備投資が一分野で止まっても別の用途が受注を支えます。", "日本セグメントの営業利益が47億2100万円まで伸び、北米も5億300万円の黒字へ転じました。稼働率が上がると製造原価率が下がる構造で、増収局面では利益の伸びが売上を大きく上回ります。"], "summary": "僕はハーモニック・ドライブ・システムズを、波動歯車装置の精密減速機を産業用ロボットと半導体製造装置のメーカーへ部品として売る会社として見ています。減速装置が売上の76.5%を占める専業メーカーで、2026年4-9月期は受注が70.7%増えて503億8600万円に達し、営業利益率が11.6%まで戻りました。", "weakness": "弱点は売上の源泉が顧客の設備投資に集中する点です。中国セグメントは売上が22億4500万円で1.4%減り、営業利益は2億2000万円で25.0%減りました。通期営業利益予想102億円に対する上期の進捗は41.2%で、下期に59億9500万円が必要です。半導体とロボットの設備投資が減速し、受注の取り消しや納期の後ろ倒しが広がれば、下期の稼働率が下がり、11.6%まで戻した営業利益率が再び一桁へ崩れます。"}, "honeywell": {"date": "1月下旬", "deck": null, "focus": "通期見通し（売上200億〜201億ドル）への到達と、分離後初の2027年通期ガイダンス", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPoAAAAtCAMAAACwCYaYAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAALcUExURQAAAN4eNN4fNN4eNN8eM+McOd8eNL8AQN4dNd4fNN4eM94eNd4eNN4eNN4eNN4eNd8dM9gnO9sbN98dMt4eM94eNN8cM9UrK94hMd8eNN0eM90dNN4eNN4eNN4eNN8eNd0bNv8AAN4cNN8eNd8fNN0eM94fNN4eNN8fNd8dNeMcOd8gNd8fNN4eNN4eNN4eNN4hNt0eNN4eNdskN94fNd4eNN8dNN0cN98dNN4fNN4eNd4fNNkaM94eNN0eNN0fNN0eM98gMN0fNNskJOEeLd0eM94fNN4eNN4fNNweNN4dNd4eNN4eNN4eNN4eNP8AAN0fNd4eNN4eNN0dNdwfNd4eNN0fM+AfM94eNN0eNN4eNd4dM94eNN4eNNUVK94eNN0dM94eNNwaNeIdMd0eNN4eNOAfNt4eNN8eNN4eNN0dM94eNN8eNd0dNd4eNN8gQN0dNt0dNN4eNd4fNN4eNN4eNN4eNOAfNN4e 期）", "value": "10億6200万ドル、部門利益率21.3%", "note": "部門利益は前年同期から23%増え、部門利益率は17.6%から370ベーシスポイント上がりました。分離に伴う残存コストの削減と価格施策が売上1%増を利益23%増へ変えました。", "source": "https://www.sec.gov/Archives/edgar/data/773840/000077384026000141/exhibit99-q32026earningsre.htm"}, {"label": "部門別売上（2026年第3四半期）", "value": "ビル自動化20億2000万ドル、プロセス自動化と技術18億5900万ドル、産業自動化11億1500万ドル", "note": "オーガニック成長率はビル自動化8%、プロセス自動化と技術8%、産業自動化4%で、3部門すべてが伸びました。プロセス自動化ではLNGと石油化学のプロジェクト売上が14%増え、製油所向けの保守需要が続きます。", "source": "https://www.sec.gov/Archives/edgar/data/773840/000077384026000141/exhibit99-q32026earningsre.htm"}, {"label": "フリーキャッシュフロー（2026年第3四半期）", "value": "6億8800万ドル（前年同期比15%増）", "note": "営業キャッシュフローは6億700万ドルで前年同期から74%減りました。前年同期にはResideo契約終了に伴う一時決済が含まれます。一時要因を除いたフリーキャッシュフローは増え、利益の改善が現金へつながる形を保ちます。", "source": "https://www.sec.gov/Archives/edgar/data/773840/000077384026000141/exhibit99-q32026earningsre.htm"}, {"label": "会社見通し（2026年通期）", "value": "売上200億ドルから201億ドル、調整後EPS 8.40ドルから8.45ドル", "note": "オーガニック成長率の見通しは4%から5%で、第4四半期は5%から6%を見込みます。部門利益率は20.5%と従来見通しの上限へ届く前提で、フリーキャッシュフロー見通しは21億ドルへ引き上げました。", "source": "https://www.sec.gov/Archives/edgar/data/773840/000077384026000141/exhibit99-q32026earningsre.htm"}], "sources": [{"title": "Honeywell Technologies Reports Third Quarter Results, Raises Full-Year 2026 Outlook（2026年10月22日）", "url": "https://www.honeywell.com/us/en/news/press-releases/2026/10/honeywell-technologies-reports-third-quarter-results-raises-full-year-2026-outlook"}, {"title": "Honeywell Technologies 2026年第3四半期決算資料（SEC Exhibit 99）", "url": "https://www.sec.gov/Archives/edgar/data/773840/000077384026000141/exhibit99-q32026earningsre.htm"}], "status": "見込み", "strengths": ["ビル自動化の部門利益率は27.0%に達し、火災報知とセキュリティのビル製品が11%増えました。設置済みの機器へ保守と更新の需要が積み上がる事業で、利益率を守りやすい構造です。", "プロセス自動化と技術は売上が18億5900万ドルで16%増え、LNGと石油化学のプロジェクトに製油所向けのアフターマーケット需要が重なります。設備を納めた後の保守売上が次の売上を作ります。", "分離に伴う残存コストを削り、部門利益率は21.3%まで上がりました。売上49億9400万ドルに対して部門利益10億6200万ドルを出す体制が独立初四半期で数字になりました。"], "summary": "僕はHoneywellを、ビル自動化とプロセス自動化と産業自動化の機器と制御システムと保守サービスを、工場とビルの運営者へ売る会社として見ています。航空宇宙事業を分離した自動化専業で、2026年第3四半期の売上は49億9400万ドルとなり、部門利益率は21.3%まで上がり、独立会社としての収益力を示しました。", "weakness": "弱点は報告売上の伸びが事業売却に左右される収益構造です。産業自動化の売上は売却影響で23%減の11億1500万ドルとなり、全体の報告成長率は1%にとどまりました。営業キャッシュフローは6億700万ドルで、部門利益10億6200万ドルの現金化がまだ追いついていません。売却した事業の穴をオーガニック成長で埋め切れず、残存コストの削減効果が一巡すれば、利益率21.3%を支える材料が価格施策だけになり、需要が減速した時に利益が先に崩れます。"}, "hyundai": {"date": "1月28日", "deck": null, "focus": "通期見通し（卸売400万台・営業利益率5.5〜6.5%）への到達と生産正常化", "logo": "../assets/logos/hyundai.svg", "name": "Hyundai", "next": "次に見る数字は会社見通しの通期卸売400万台と営業利益率5.5%から6.5%への到達です。2026年10-12月期の卸売台数が韓国生産の正常化で戻るか、ハイブリッド車の構成比18.2%を保てるか、営業利益率が第3四半期の5.9%からどう動くかを、2027年1月下旬の決算で確認します。", "numbers": [{"label": "営業利益（2026年7-9月期）", "value": "2兆6770億ウォン（前年同期比5.5%増）", "note": "売上は45兆1100億ウォンで3.4%減り、台数が減る四半期に利益が増えました。為替とコスト削減とハイブリッド中心の販売構成の改善が台数減を上回り、1台あたりの稼ぎが上がる構造を示します。", "source": "https://www.hyundai.com/worldwide/en/newsroom/detail/0000001298"}, {"label": "卸売台数（2026年7-9月期）", "value": "92万710台（前年同期比11.3%減）", "note": "韓国は13万1468台で27.2%減り、韓国以外は78万9242台で8.0%減りました。落ち込みの中心は韓国のストライキと稼働日数の減少で、需要より供給側の問題が大きい四半期です。", "source": "https://www.hyundai.com/worldwide/en/newsroom/detail/0000001298"}, {"label": "ハイブリッド車販売（2026年7-9月期）", "value": "16万7414台（前年同期比3.8%増、販売構成比18.2%）", "note": "電気自動車は6万9117台で9.2%減りました。電動車全体の構成比は26.7%に達し、内訳の主役が電気自動車からハイブリッド車へ移る形で、単価の高い車種構成を保ちます。", "source": "https://www.hyundai.com/worldwide/en/newsroom/detail/0000001298"}, {"label": "純利益（2026年7-9月期）", "value": "1兆9320億ウォン（前年同期比24.2%減）", "note": "営業利益が増える一方で純利益は減りました。経常利益も12.6%減り、本業の改善と最終利益が連動しない形で、営業外の要因が利益を押し下げています。", "source": "https://www.hyundai.com/worldwide/en/company/ir/notices/view-0000000382-en-10-1-"}, {"label": "通期ガイダンス（会社見通し、2026年10月29日修正）", "value": "卸売目標400万台、営業利益率5.5%から6.5%", "note": "従来の卸売目標416万台と営業利益率6.3%から7.3%を引き下げました。売上高成長率の目標1.0%から2.0%は据え置き、自動車部門の投資計画を17兆8000億ウォンから16兆ウォンへ減らします。", "source": "https://www.hyundai.com/worldwide/en/newsroom/detail/0000001298"}], "sources": [{"title": "Hyundai Motor 2026年第3四半期業績発表（2026年10月29日、公式ニュースルーム）", "url": "https://www.hyundai.com/worldwide/en/newsroom/detail/0000001298"}, {"title": "Hyundai Motor IR開示（2026年10月29日、通期ガイダンス修正）", "url": "https://www.hyundai.com/worldwide/en/company/ir/notices/view-0000000382-en-10-1-"}], "status": "見込み", "strengths": ["ハイブリッド車が16万7414台売れて構成比18.2%まで上がり、電気自動車の販売が9.2%減る局面でも販売構成を高単価側へ寄せました。台数が減る四半期に営業利益を増やせた主因です。", "韓国以外の販売が78万9242台と全体の85.7%を占めます。韓国生産が止まっても海外の販売網が売上を作る構造で、米国ではハイブリッド車の販売が堅調でした。", "四半期配当を1株2500ウォンに維持し、新型TUCSONと新型ELANTRAの投入を計画します。台数が減る局面でも株主還元と新車投入を止めない資金配分です。"], "summary": "僕はHyundaiを、内燃機関車とハイブリッド車と電気自動車の全ラインアップを世界で売る自動車メーカーとして見ています。販売の中心は韓国以外の市場で、全体の85.7%を占めます。2026年7-9月期は卸売台数が11.3%減る中でもハイブリッド車の構成比が18.2%へ上がり、営業利益を5.5%増やしました。", "weakness": "弱点は韓国生産への集中です。韓国の卸売台数は13万1468台で27.2%減り、ストライキと稼働日数の減少が全体の台数減11.3%の中心になりました。会社は通期の営業利益率見通しを6.3%から7.3%から、5.5%から6.5%へ下げています。生産正常化が遅れて固定費の負担が残り、原材料価格の上昇が重なれば、ハイブリッド車の構成改善だけでは吸収できず、通期の利益率は見通しの下限5.5%を割り込みます。"}, "ibm": {"date": "1月27日", "deck": null, "focus": "2027年の見通しを会社がどう示すか。ソフトウェアの伸びとフリーキャッシュフローの持続を見る", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPoAAABeCAMAAAA9v/n3AAAABGdBTUEAALGPC/xhBQAAACBjSFJNAAB6JgAAgIQAAPoAAACA6AAAdTAAAOpgAAA6mAAAF3CculE8AAACc1BMVEUAAAAgb8Meb8Afb8EfccEfcMEfccAfcMEgcMIba7wfcMEeb8EfcMAfb8AfcMEfcMIeccEndsQfb8EzZswfcMEfcMEgcMIkbcIfcMEeb8MfcMEfccEAgL8fccAgcMEhb8QfcMEggL8fcMEfcMEdb8EdbMQecMIecMEccb0gc78eb8Efb8IcccYgccEeb8AfcMEfccEfbMEebsMgcMEhccIfccAfccEfcMAecMEfcMEAAP8fcMEdcb8db8Afb8Afb8Efb8EfcMEXdLkfcMEAgP8dbb0dccAfb8EgcL8fcMAfcMIecMEgcMEfcMEgcL8jdMUfcMIhb8IfcMEAVaogcL8fcMIgcMAfcMEfcMEfcMAfcMEkbcggb8IfcMIgccAfcMEfb8IgcMErgNUfcMEfcsEgccIfcMEfcMIfb8EaZswkbbYgcb8jcsEdbr8ecb8cccEgcL8eccQac78fcMEeb78fccEgcMEcccYfb8IecMEeb8IgcMIfcMIgcMEfcMEfcMIfcMAecMEgcMEfcMEecMAfcMEicsMfcMEfb8EfcMIhccEgccIgccIfb8IgccIib8QebcIecMAfcMIfcsAVar8fcMEecMEfcMIfb8EfcMEfccAeccEfcMEhb7weccEfccEfb8Eeb8AfcMAfcMEeacMid7sfcMEccb8fcMIeccAfbsEeb8AecMAeccMeb8AfcMEgcMIgccIfb8IecMEgcMAfcMEfcMEfcMIgccEbbb8fcMEecMIhb8EfcMAfccAfcMEgccIfccEfcMEfcMEfcMEfcMEecMEfcMEfcMEhc70fcMEfcMEfccEebsIfcMAfcMH///+KwSbqAAA wv9O0Oox4/U/Afx66Hrd/X/4atd+g33cxod60ybw6OP8e/ee01/+FCXt4uBQx3NjXjkP8a7Nqn7mP1OlDuSaTRynzX64+ir8O1vLV/nb+B3cUeVCeviJCAAAAJXRFWHRkYXRlOmNyZWF0ZQAyMDI2LTA3LTIxVDIxOjAxOjQ5KzAwOjAwjO+LUAAAACV0RVh0ZGF0ZTptb2RpZnkAMjAyNi0wNy0yMVQyMTowMTo0OSswMDowMP2yM+wAAAAASUVORK5CYII=", "name": "IBM", "next": "次に見る数字は会社見通しの通期為替一定ベース売上成長4%から5%と、フリーキャッシュフロー前年比10億ドル超の増加への到達です。2027年1月下旬の通期決算で示す2027年の売上とフリーキャッシュフローの見通し、ソフトウェア売上の伸び、自動化とIBM Zの減少が止まるかを確認します。", "numbers": [{"label": "売上（2026年7-9月期）", "value": "171億300万ドル（前年同期比5%増、為替一定ベース6%増）", "note": "営業ベースのEPSは2.95ドルで前年同期比11%増えました。増収の中心はソフトウェアで、会社は通期の為替一定ベース売上成長4%から5%を据え置きます。", "source": "https://www.sec.gov/Archives/edgar/data/51143/000005114326000093/ibm-20261021xex991.htm"}, {"label": "ソフトウェア売上（2026年7-9月期）", "value": "78億400万ドル（前年同期比8%増、為替一定ベース9%増）", "note": "Red Hatを含むハイブリッドクラウドが11%増え、データが19%増え、トランザクション処理が9%増えました。四半期の増収7億7200万ドルのうち5億9500万ドルをソフトウェアが担い、売上の45.6%を占める部門が成長を決める構造です。", "source": "https://www.sec.gov/Archives/edgar/data/51143/000005114326000093/ibm-20261021xex991.htm"}, {"label": "コンサルティング売上とインフラ売上（2026年7-9月期）", "value": "コンサルティング53億3500万ドル（前年同期比横ばい）、インフラ37億700万ドル（同4%増）", "note": "インフラでは分散インフラが31%増える一方でIBM Zは20%減りました。コンサルティングの伸びは為替一定ベースで2%にとどまり、ソフトウェアの導入需要を取り込む速度がまだ遅い状態です。", "source": "https://www.sec.gov/Archives/edgar/data/51143/000005114326000093/ibm-20261021xex991.htm"}, {"label": "フリーキャッシュフロー（2026年1-9月累計）", "value": "78億ドル（前年同期比6億ドル増）", "note": "第3四半期単独で30億ドルを生み、前年同期から7億ドル増えました。会社は通期フリーキャッシュフローの見通しを前年比10億ドル超の増加へ引き上げ、買収を続けながら現金を増やす前提を置きます。", "source": "https://www.sec.gov/Archives/edgar/data/51143/000005114326000093/ibm-20261021xex991.htm"}, {"label": "債務（2026年9月末）", "value": "債務総額638億ドル、現金等111億ドル", "note": "2026年に入り買収へ114億ドルを投じ、債務は年初から26億ドル増えました。買収で買った成長と自力の成長を分けて読む必要がある資本構成です。", "source": "https://www.sec.gov/Archives/edgar/data/51143/000005114326000093/ibm-20261021xex991.htm"}], "sources": [{"title": "IBM 2026年第3四半期決算発表（SEC Form 8-K Exhibit 99.1、2026年10月21日）", "url": "https://www.sec.gov/Archives/edgar/data/51143/000005114326000093/ibm-20261021xex991.htm"}], "status": "見込み", "strengths": ["ソフトウェア売上が78億400万ドルまで伸び、Red Hatの11%増とデータの19%増が四半期の増収7億7200万ドルの77%を作りました。大企業の基幹システムに入るソフトウェアは乗り換えコストが高く、継続売上の土台になります。", "第3四半期のフリーキャッシュフローは30億ドルと前年同期から7億ドル増え、1-9月累計で78億ドルに達しました。買収支出114億ドルを続けながら現金を生む力が配当と追加投資の原資になります。", "トランザクション処理が9%増え、分散インフラが31%増えました。メインフレーム周辺の既存顧客基盤に新しい需要が重なり、既存事業が現金を作り続ける構造です。"], "summary": "僕はIBMを、Red Hatのハイブリッドクラウド基盤とデータとトランザクション処理のソフトウェアを大企業へ継続課金で売り、導入をコンサルティングが支える会社として見ています。ソフトウェアが売上の45.6%を占め、2026年7-9月期はソフトウェア売上が78億400万ドルへ8%増え、四半期の増収の大半をソフトウェアが作りました。", "weakness": "弱点は成長の内訳が買収と一部の部門に寄る点です。自動化売上は3%減り、IBM Zは20%減りました。GAAP粗利率は56.8%で前年同期から0.5ポイント下がり、買収支出114億ドルに対して債務は638億ドルまで増えています。買収した事業の伸びが鈍り、自力成長の弱い部門の落ち込みを埋められなくなれば、フリーキャッシュフローの増加分が利払いと統合費用へ消え、通期の売上成長4%から5%の前提が崩れます。"}, "innoviz": {"date": "2月下旬〜3月上旬", "deck": null, "focus": "下方修正後の通期売上見通し（4,400万〜4,600万ドル）と防衛向けPercizの売上", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAMAAAD04JH5AAAAUVBMVEVHcEwAABgAAxkAABcAARgAussASVkAABgAABgAAxkAABgAfo8Au8sAusoAusoAZncAusoAusoAABgAusoAAAwAvc0AqboAS1sAFysALj8AlqaDrMNoAAAAEnRSTlMANGwbkKUL68+vTv4i5cL+c0vTrfe5AAAGt0lEQVR4nMVb2aKiMAy9UGRVUFnl/z90yqJCc5IWRCePM1xySE7SJI1/f3vkVJbl5ZLnp+vtdj7vesVnMgCYRePQMH4NYgFghpGfbufwPwIYQZyuPzMEBDBiuP3GDByAQX6CQQKg+fB9CCIALfm32WADMED4qhXsADSE238GMNDxPwMoL1/zgyOA7/nBGUBZfscIGwCUp29E5BYA5eULbjjVkzgiuB6nOVTK89I009L3TdOUpROMY9ygUj9I4ii63+/VIPd792iLrG9KO4b8UwTKC5JRtSEax4Ci15b4IgKVBjHVvQRRPYq+ke2wn4rKj8GnExBdm8kQLrtsEHqJXfsTw127QoCwxwaps/oJQ1f0ghU228ALNqmfITQ8gm1MVP5m9SOER8b7YQsCTyK+iODe8kY4uaoPg53qRwgda4TaMSur5AP9AwSeCU4I0r3mfyNoewaBSyjsY5+BoOt3E/EI/Vq6jLGBxQkf0W8lVcbYQM6Ih+kfgwHTQCoTj9M/ZATGC7wTQv9A/awNav5YcuVfNYsdAY7GnNGf2vVHcRIEfpFlRdG2j86OAWck7ARlyz9x4HtqYNBYFZdN02etBUOFDwaYDCz5Nw68F3uffYF+d6Mx3CUMhTMPxQBIfLV4dNGYaEv0RSchgKEAMrInfb2/Dt1VZzQ4o+CNUD2gE4gJBAJEvvmw2ZrVddOyEKoW+YCYgM8AiUesRXvDusx4P8BYNEzgcREYBSBxouZUG4FBUD2QCYxA4CIgSql6tjsuOCdAHq7SIWcArJ9tzxkEmIfL+jBkDBBT94sA6oxBAJPBwgdMDma+XxpQMDbokAkWNMQGYPXzAOqygEysCgAgf9GbyUEk/B0sUJcwFiAL3qcyTsIJq1+cETU 期から効く設計です。", "source": "https://www.sec.gov/Archives/edgar/data/1835654/000117891326005172/exhibit_99-1.htm"}, {"label": "会社目標（2026年通期）", "value": "売上4400万ドルから4600万ドル、Perciz売上比率6%から7%", "note": "新規プログラム獲得2件から3件と、新規NRE支払い計画2000万ドルから3000万ドルを併せて掲げます。第3四半期の売上減を受けて引き下げた水準で、防衛向けの比率はまだ一桁にとどまります。", "source": "https://www.sec.gov/Archives/edgar/data/1835654/000117891326005172/exhibit_99-1.htm"}, {"label": "流動性（2026年9月30日時点）", "value": "5440万ドル", "note": "現金と現金同等物と短期預金と有価証券と短期制限付き現金の合計です。会社は人員削減で資金の持続期間が2028年まで延びる設計を示しました。四半期の営業費用1970万ドルと比べると、売上を戻すまでの時間は限られます。", "source": "https://www.sec.gov/Archives/edgar/data/1835654/000117891326005172/exhibit_99-1.htm"}], "sources": [{"title": "Innoviz Reports Third Quarter 2026 Results（2026年11月11日、SEC Form 6-K Exhibit 99.1）", "url": "https://www.sec.gov/Archives/edgar/data/1835654/000117891326005172/exhibit_99-1.htm"}], "status": "見込み", "strengths": ["Percizの初期受注の出荷を始め、イスラエル国防研究開発局MAFATがLiDARの成熟度と性能を評価しました。防衛向けは自動車向けより販売単価が一桁高く、販売サイクルが短い市場です。", "VWとDaimler Truckの自動車プログラムが進行し、LOXOのレベル4配送プラットフォーム向け開発も続きます。量産開始前のプログラムを複数抱え、NRE収入の源泉を維持します。", "人員を20%削減して年間1750万ドルの費用削減を見込み、資金の持続期間を2028年まで延ばす設計へ切り替えました。売上1210万ドルに対して営業費用1970万ドルという逆転を、固定費側から直す動きです。"], "summary": "僕はInnovizを、車載LiDARを自動車メーカーへ部品として売り、開発契約のNRE収入を量産までのつなぎにする会社として見ています。防衛と国土安全保障向けのPercizを第二の柱に育てる途上で、2026年第3四半期はNRE計上の遅れで売上が1210万ドルへ減り、通期目標の引き下げを迫られました。", "weakness": "弱点は量産前のNRE収入への依存です。第3四半期は顧客のプログラム時期の変更でNRE計上が遅れ、売上が1210万ドルへ減りました。流動性は5440万ドルで、四半期の営業費用は1970万ドルに達します。2027年に遅れたNREの回収がさらにずれ、Percizの量産受注が2027年前半に確定しなければ、費用削減だけでは資金の減少を止められず、増資か事業の縮小を選ぶ局面に入ります。"}, "intel": {"date": "1月28日", "deck": null, "focus": "Q4見通しの売上高150億〜160億ドルへの着地と、18Aとファウンドリの進捗、2027年見通しを見る", "logo": "../assets/logos/intel.svg", "name": "Intel", "next": "次に見る数字は会社見通しの第4四半期売上150億ドルから160億ドルと、非GAAP粗利率38.0%への到達です。ファウンドリ営業損失が18億5300万ドルから縮むか、Intel 18Aと14Aの外部顧客獲得の開示、2027年見通しの水準を、2027年1月下旬の決算で確認します。", "numbers": [{"label": "売上（2026年7-9月期）", "value": "165億1300万ドル（前年同期比21%増）", "note": "売上と粗利率とEPSの全項目で会社見通しを上回りました。営業利益は25億2200万ドルです。データセンター売上の伸びが15年ぶりの高さとなり、全体の増収を決めました。", "source": "https://www.sec.gov/Archives/edgar/data/50863/000005086326000188/q326earningsrelease.htm"}, {"label": "データセンター・AI売上（2026年7-9月期）", "value": "73億1800万ドル（前年同期比78%増）", "note": "部門営業利益は30億3900万ドルです。Xeonの供給をどこまで広げられるかが次の四半期の売上を決め、供給が成長の上限になる局面です。", "source": "https://www.sec.gov/Archives/edgar/data/50863/000005086326000188/q326earningsrelease.htm"}, {"label": "クライアント・フィジカルAI売上（2026年7-9月期）", "value": "80億9700万ドル（前年同期比5%減）", "note": "部門営業利益は22億8500万ドルです。メモリ不足とPC市場の減速が売上を抑え、会社はPCの減速が2027年前半まで続く見方を示しました。最大部門の縮小をサーバー向けの拡大が上回る構図です。", "source": "https://www.sec.gov/Archives/edgar/data/50863/000005086326000188/q326earningsrelease.htm"}, {"label": "ファウンドリ売上と営業損失（2026年7-9月期）", "value": "売上66億9700万ドル（前年同期比58%増）、営業損失18億5300万ドル", "note": "売上にはグループ内取引を含みます。営業損失は前年同期の23億2100万ドルから縮みました。それでも製品事業の営業利益53億2400万ドルの35%を製造事業が消す計算です。", "source": "https://www.sec.gov/Archives/edgar/data/50863/000005086326000188/q326earningsrelease.htm"}, {"label": "会社見通し（2026年10-12月期）", "value": "売上150億ドルから160億ドル、非GAAP EPS 0.25ドル", "note": "非GAAP粗利率の見通しは38.0%で、第3四半期の44.1%から6.1ポイント下がります。第3四半期の上振れの後に会社自身が置いた落差で、供給と製品構成の前提を確認する数字です。", "source": "https://www.sec.gov/Archives/edgar/data/50863/000005086326000188/q326earningsrelease.htm"}], "sources": [{"title": "Intel 2026年第3四半期決算発表（SEC Form 8-K Exhibit 99.1、2026年10月29日）", "url": "https://www.sec.gov/Archives/edgar/data/50863/000005086326000188/q326earningsrelease.htm"}], "status": "見込み", "strengths": ["データセンター・AI部門の営業利益が30億3900万ドルに達し、製品事業全体の営業利益53億2400万ドルを支えました。Xeonへの需要が供給を上回り、数量と価格の両方で有利な局面です。", "非GAAP粗利率は44.1%まで上がり、前年同期の40.0%から4.1ポイント改善しました。営業キャッシュフローは51億ドルを生み、製造投資を続けながら現金を残します。", "Intel 14Aの設計キット0.9版を2026年10月に公開し、Oracleとの複数年協業ではXeon基盤のクラウド拡大を決めました。製造と製品の両方で、次の顧客接点を先に作る動きです。"], "summary": "僕はIntelを、PC向けとサーバー向けのCPUを売り、半導体製造を外部顧客へ開くファウンドリ事業を持つ会社として見ています。製品事業の利益で製造事業の損失を埋める構造で、2026年7-9月期はデータセンター・AI売上が78%増の73億1800万ドルへ伸び、伸びの中心がPCからサーバーへ移りました。", "weakness": "弱点はファウンドリ部門の損失が固定化する構造です。ファウンドリは四半期で18億5300万ドルの営業損失を出し、売上の大半はグループ内取引です。外部顧客の量産獲得が進まなければ、減価償却と稼働費用が残り、製品事業の営業利益53億2400万ドルを毎四半期食い続けます。第4四半期の非GAAP粗利率見通し38.0%が示す通り、サーバー向けの伸びが鈍れば全体の利益率はすぐに崩れます。"}, "intuitive-machines": {"date": "3月下旬", "deck": null, "focus": "通期売上9億2000万ドルから9億5000万ドルの着地と受注残19億ドルの売上転換、IM-3とAltus-1の打上げ日程", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAMAAAD04JH5AAAAYFBMVEUBWaMAWaP///8AV6IAVKAAUp/6/P0AUJ4ATZ3z9/qzzeO/1efj7fUAXKXW5PDL3eyJsdNDgLeoxt+fwNx8qc84fbfs8/iSuNcUY6gfba4AR5pfl8Uud7RJiL1pnMdTj8GITyi7AAAErUlEQVR4nO2af5OjIAyGVQSVX6Kiwhb1+3/Lg7a7t+1qb6AHNzdj/NcZXx+SkASyPPu3z7+3k8BJ4CRwEjgJnAROAieB/5BAXla1s6qqYAmSE8gAUGPnbDRaKwYASEogB4BthDtr8Sy30UnI3/ElP72AabPMxc0QaiZO5kWVIBmBSq095sU3Q9RJqMN9wUtvXhqMih/WipGFeoKflXptdwQU07BY54hPANRi2vu+XQh+UTA+AfAx73/fGl9ZGZ/ACwEF34L8wI9ALZpDAUXfBeVFTx94IaDpWUBW9CVwvARFQZcQN/D0gRffL1Bv/CPBk8BKCMHt0TrQLWBT8NOrtNZs4wcL0Qy6jErg9j4cyYEA1HbQm4GfXrf7V4cCCnTxjgN/y6tudz+4mlTeW4LvmuUvBQyjb23wlwmQDcYnABeOjhRwWUUnkEEjcDvtC5hE7ZsMvQlkNhmYC9kX0AwJCOQZhAbvC0B9/CjIXDboDgQUfR6fQPZSQO2bC8MJcDwLMT8W6UW7aD8GoQRI0crF9mZmkQ9ZYeovys8LAgkQvn7UsCxhXV4eQhJhDZMQoLKuSyeAyUcB3FTRCVzDkM5rN47dOjxVB9TUsQncE9HU4r5/yokT5XSsIxOA+jgVt0JOXUwCrtywBUlztBnhixMQkQDImMqPK6Ji7tbIBNgmxECPvl+IUVInIBqBUtne6EVzIsxNQDQCpZpfNGe2JjQzj+oDfxKwdoSYKiIB+FpAc9nooGFMAvqVANRuollZzN3wDwKIwLzzrIl8fWAl7WFziiiahOesyNMA0924Pym7Kih4xzyLQj8Cbij7ojcsptl3duxvoDKHqRD1SxW/Ks5YJ8iuhKk3XtVQGIEst4z13rwOkS7yjOj2ADVucq8zamZd+fP0VwzN3PK9gmSSnkkwjIBrzw9CIGReHKD4MAzpolL4wLEAbgKmxUEEDpaA264sAQF3aiGsSYGfPJH47YOhBNyo7pputXgUgHoQcmLgrznPGWPKbM8Jmc6l95w0iIBdgnkeCH8+veEy+nmBe0BZGzztjcnaS8j5oa+BXKltvx4gWwoCpdpmQvcF2GIsPgGoBD0YU+Ix6OjQUzFUP4+Nmqn5FJCEwPNG2A5tk5TA9L05bGi/3feGNARcXf6VARCi+KLVhSb0AReGI0bu7gAngxwVAMs9KtMQsIFYK0kIHsS6GZ1XcMR3r8S+PVEQAadZmaUzWgF3i4Vt/VcYdikyYXa9RlKCm5Wq+12cJCPgPMHdW7Hf1/LbkJAsSXzgt0GwPOzIJCEB+4B8fBxTJyWQgxIy+VSQkC0dAVsTZapvngUkigIrmo3LspAfAlIRAEANnPPnea0TkIYAyNReZ5CUAN4ZEyUksC/AFaWJCGT7BJLlASvg53wC8VUH3SYLJDChBwYNHZY8oC8KJiAw+X5g2RCpQeD90hDN1guVkZ9pADV41VnI+ocSsHEIPsxnIUJ72dnfD95Yg3SD+9B64lishlVl+M3aMNG5lrShtipdF1W+ebc4SLW72nq90ut+PfTf3yNgbFXKnDO8fT09TDWsKov+vTvVbxD4q/b+P5wETgIngZPASeAkcBL4zwn8AgGIUzOfPiE/AAAAAElFTkSuQmCC", "name": "Intuitive Machines", "next": "次に見る数字は会社見通しの通期売上9億2000万ドルから9億5000万ドルへの着地です。2026年第4四半期決算で第4四半期売上と調整後EBITDA黒字の継続と受注残19億ドルからの増減を確認します。IM-3とAltus-1の2027年3月から4月の打上げ予定に変更がないかも合わせて見ます。", "numbers": [{"label": "売上（2026年第3四半期）", "value": "2億6900万ドル", "note": "衛星製造と月面輸送と月面データサービスと地上通信網の実行が売上を作り、四半期で過去最高になりました。単発の月面ミッションに業績が連動する形から、量産と運用で稼ぐ形へ移る転換点です。", "source": "https://www.sec.gov/Archives/edgar/data/1844452/000162828026073106/lunr-20260930xexx991.htm"}, {"label": "粗利益（2026年第3四半期）", "value": "6900万ドル、粗利率26%", "note": "衛星製造の構成比上昇と数量増に加え、プログラム調整の一時的なプラス要因が粗利益を押し上げました。調整後EBITDA825万5000ドルも黒字で、売上拡大を利益と現金へ変える力が出始めています。", "source": "https://www.sec.gov/Archives/edgar/data/1844452/000162828026073106/lunr-20260930xexx991.htm"}, {"label": "受注残（2026年9月30日時点）", "value": "19億ドル（2025年末から17億ドル増）", "note": "民生と商業と国家安全保障へ顧客が広がり、受注残は2025年末から17億ドル増えました。第3四半期の新規受注とGoonhilly買収で引き継いだ受注残は合計4億5000万ドルで、将来売上の厚みを作ります。", "source": "https://www.sec.gov/Archives/edgar/data/1844452/000162828026073106/lunr-20260930xexx991.htm"}, {"label": "現金収支と純損失（2026年第3四半期）", "value": "営業キャッシュフロー6600万ドル、フリーキャッシュフロー3300万ドル、純損失335万4000ドル", "note": "設備投資3300万ドルを差し引いてもフリーキャッシュフローは黒字で、四半期で過去最高になりました。純損失335万4000ドルは残ります。現金収支は先に黒字へ転じました。", "source": "https://www.sec.gov/Archives/edgar/data/1844452/000162828026073106/lunr-20260930xexx991.htm"}, {"label": "会社見通し（2026年通期、会社見通し）", "value": "売上9億2000万ドルから9億5000万ドル、調整後EBITDA黒字", "note": "会社は通期売上9億2000万ドルから9億5000万ドルと調整後EBITDA黒字を見込みます。第4四半期に受注残を計画どおり売上へ変える実行力が通期着地を決めます。", "source": "https://www.sec.gov/Archives/edgar/data/1844452/000162828026073106/lunr-20260930xexx991.htm"}], "sources": [{"title": "Intuitive Machines Reports Third Quarter 2026 Financial Results（2026年11月12日、SEC Form 8-K Exhibit 99.1）", "url": "https://www.sec.gov/Archives/edgar/data/1844452/000162828026073106/lunr-20260930xexx991.htm"}, {"title": "Intuitive Machines Form 10-Q（2026年9月30日期、2026年11月12日提出）", "url": "https://www.sec.gov/Archives/edgar/data/1844452/000162828026073512/lunr-20260930.htm"}], "status": "見込み", "strengths": ["衛星製造を中心に月面輸送と月面データサービスと地上通信網まで実行範囲を持ち、2026年第3四半期に売上2億6900万ドルと営業キャッシュフロー6600万ドルの黒字を同時に作りました。1つのミッションの成否に業績が連動する構造を脱しつつあります。", "NASAの次期月面輸送契約CLPS 2でベンダー選定を受けました。契約枠は100億ドルに50億ドルのオプションを加えたIDIQ契約で、月面輸送の発注入口を長期で確保し、Altus衛星群と地上網へ展開する土台を持ちます。", "受注残19億ドルの顧客は民生と商業と国家安全保障へ分散し、第3四半期だけで新規受注と買収で引き継いだ分を合わせて4億5000万ドルを積みました。単一顧客の予算変動で受注が細るリスクを下げます。"], "summary": "僕はIntuitive Machinesを、衛星製造と月面輸送と月面データサービスと地上通信網をNASAと防衛と民間の顧客へ契約で売る宇宙インフラ会社として見ています。売上を作る中心は月面着陸船単体から衛星量産へ移りました。2026年第3四半期に売上2億6900万ドルと過去最高を記録し、受注残19億ドルを抱える段階へ進みました。", "weakness": "弱点は粗利率の実力値が見えない点です。2026年第3四半期の粗利率26%にはプログラム調整の一時的なプラス要因が含まれ、会社は一時要因を除いた粗利率を分けて示していません。衛星製造の数量が増えても一時要因が剥げて粗利率が20%台前半へ下がれば、売上9億2000万ドルから9億5000万ドルの規模でも調整後EBITDA黒字を維持する余地は細ります。"}, "intuitive-surgical": {"date": "1月21日", "deck": null, "focus": "2026年通期の手術件数伸び14%から15%と非GAAP粗利率68.7%から69.3%、da Vinci 5の設置台数を見る", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPoAAABkCAYAAACvgC0OAAAABGdBTUEAALGPC/xhBQAAACBjSFJNAAB6JgAAgIQAAPoAAACA6AAAdTAAAOpgAAA6mAAAF3CculE8AAAABmJLR0QA/wD/AP+gvaeTAAAAB3RJTUUH6gcXCTcQhoSqrQAAE8xJREFUeNrtnXt0VNW9xz+/fSbJAAJFq1jBqvUJXh+1tmqv1mevvbpahSpdrWvpsr1K1QKZCORFksMkJDMEZnj4uLEvb6t9hNZK66O1trV1iVbF6xtqBbXiA73yUMhzzv7dP2YSBkxIognJJPuzVtaaydnnzH599++3f2efswXHiEIbGdUEU03AWPHYFJ7By65Whj/iqmBksKORg72AKMK3gDFZh14GasPf4HYR1NWUE7ojR2n9Gcdbwx+ASXtJdmfYcJXMIHA1NvwwrgqGuau+mrHWcE8PIge4okWpcjXmhO7IQVqamQ0c3rtRgXk7f84hrtac0B25xzf7kDbswTRXZU7ojlxy2xvxgOP6dI5wvKs5J3RHLnEgQl8DrkrIVZwTuiOHkHNJAa/2Tee85GrOCd2Ra2IX7upD8sBYVrtac0J35BjtrdQDW3qZ/IfhK/inqzUndEeOMfZK3kG4DNjRQ9KHw4ZCV2NO6I4cZdQ3+IuxnI7w5y4O70SpCRsukBk0u9oaplM4VwUji+ZGjtCALwjsJ4ZNBaN5WL5Kk6sZh8PhcDgcDofD4XA4HA6Hw+FwOBwOh8PhcDgcDofDMWyQRYuWTbQhPQtARd+tnF/01/78geq65DkWORCxLVUlRb/bW9qFscQlqMkX1U2VZZFH++P3o7GlJ4mYo/tyTtik7p83b97O/vh9vy55uCCfB/BM8PqC4hsf6778yy5EGQeQT/6DpaXXbx2IRq+OJy/r+Bw0b7/L933bX9f24ysmi7Vn9OUcLy/1+IK5c1/rtzz4DaO9UU0XAViluaokcm9/1p9flzhKMJ8FEGRjZ DBH3tHbAAAAJXRFWHRkYXRlOm1vZGlmeQAyMDI2LTA3LTIzVDA5OjU1OjE1KzAwOjAwNoNpZwAAAABJRU5ErkJggg==", "name": "Intuitive Surgical", "next": "次に見る数字は会社見通しの2026年通期da Vinci手術件数伸び14%から15%と非GAAP粗利率68.7%から69.3%です。2027年1月21日の第4四半期決算で手術件数の伸びが範囲の中央付近へ着地するかと、da Vinci 5の設置台数と器具売上の伸びを確認します。", "numbers": [{"label": "売上（2026年第3四半期）", "value": "30億4870万ドル（前年同期比22%増）", "note": "前年同期25億510万ドルから増えました。手術件数の伸びと設置台数の拡大とリース収益の増加が売上を作り、規模の拡大が収益基盤の拡大へ直結する構造を示しました。", "source": "https://www.sec.gov/Archives/edgar/data/1035267/000103526726000067/q326ex-991earningsrelease.htm"}, {"label": "器具とアクセサリー売上（2026年第3四半期）", "value": "17億9740万ドル（前年同期比18%増）", "note": "da Vinci手術件数14%増とIon手術件数31%増が器具売上を作りました。売上全体の59%を占める消耗品収益で、設置台数が増えるほど手術件数に連動して積み上がります。", "source": "https://www.sec.gov/Archives/edgar/data/1035267/000103526726000067/q326ex-991earningsrelease.htm"}, {"label": "設置台数と累計台数（2026年第3四半期）", "value": "da Vinci設置546台（前年同期比28%増）、うちda Vinci 5が315台、累計1万2094台（前年同期比12%増）", "note": "da Vinci 5が設置全体の58%を占め、病院の更新需要を新機種で取り込む移行が進みました。Ionは56台を設置し、累計1152台で前年同期比21%増えました。", "source": "https://www.sec.gov/Archives/edgar/data/1035267/000103526726000067/q326ex-991earningsrelease.htm"}, {"label": "非GAAP純利益（2026年第3四半期）", "value": "10億5450万ドル、1株当たり3.00ドル（1株当たり前年同期比25%増）", "note": "GAAP純利益5億2300万ドルには独占禁止法訴訟の和解費用4億5000万ドルが税引前で含まれます。和解費用を除く非GAAPの伸びは手術件数増が器具売上とリース収益を通じて利益へ直結する構造を示します。", "source": "https://www.sec.gov/Archives/edgar/data/1035267/000103526726000067/q326ex-991earningsrelease.htm"}, {"label": "現金と自社株買い（2026年第3四半期）", "value": "現金と投資68億ドル、自社株買い780万株で29億4000万ドル", "note": "現金と投資は四半期で18億3000万ドル減りました。自社株買い29億4000万ドルと設備投資へ現金を使いながら68億ドルを残し、一過性費用を吸収しても投資を続ける財務の厚みを示します。", "source": "https://www.sec.gov/Archives/edgar/data/1035267/000103526726000067/q326ex-991earningsrelease.htm"}], "sources": [{"title": "Intuitive Announces Third Quarter Earnings（2026年10月20日、SEC Form 8-K Exhibit 99.1）", "url": "https://www.sec.gov/Archives/edgar/data/1035267/000103526726000067/q326ex-991earningsrelease.htm"}], "status": "見込み", "strengths": ["da Vinci累計1万2094台とIon累計1152台の設置基盤を持ち、手術件数が増えるたびに器具とアクセサリー売上17億9740万ドルが積み上がります。機械を売って終わらず、使うほど収益が増える構造が強みです。", "da Vinci 5の設置315台は四半期設置546台の58%に達し、病院が新機種へ移行する動きを取り込んでいます。da Vinci手術件数14%増とIon手術件数31%増が同時に進み、複数プラットフォームで成長を作ります。", "非GAAP純利益10億5450万ドルと1株当たり3.00ドルを記録し、現金と投資68億ドルを抱えます。和解費用4億5000万ドルの一過性費用を計上した四半期でも自社株買い29億4000万ドルを実行する財務基盤を持ちます。"], "summary": "僕はIntuitive Surgicalを、手術支援ロボットda Vinciと内視鏡システムIonを病院へ設置し、手術ごとに使う器具とアクセサリーで稼ぎ続ける会社として見ています。設置累計1万2094台が器具売上の土台です。2026年第3四半期はda Vinci 5が設置546台のうち315台を占め、新機種への移行が進みました。", "weakness": "弱点は収益が手術件数の伸びに集中する点です。器具とアクセサリー売上17億9740万ドルは売上全体の59%を占め、da Vinci手術件数14%増に連動します。病院の設備投資が鈍り設置546台のペースが落ち、手術件数の伸びが1桁台へ下がれば、器具売上の伸びとリース収益の積み上がりが同時に細り、非GAAP粗利率68.7%から69.3%の会社見通しを守る余地も狭まります。"}, "ionq": {"date": "2月24日", "deck": "deck-i.html", "focus": "通期売上見通し5億500万ドルから5億1500万ドルへの到達と、残存履行義務の売上転換、調整後EBITDAの損失幅", "logo": "../assets/logo-i.svg", "name": "IonQ", "next": "次に見る数字は会社見通しの2026年通期売上5億500万ドルから5億1500万ドルへの到達です。2027年2月24日の通期決算でプラットフォーム売上の伸びと残存履行義務12億ドルの増減と調整後EBITDAの損失幅を確認します。", "numbers": [{"label": "売上（2026年7-9月期）", "value": "1億7380万ドル（前年同期比336%増）", "note": "6四半期連続で過去最高を更新しました。量子コンピュータ本体の納入に加え、買収したSkyWaterの製造受託が売上を押し上げ、事業の形が研究開発中心から納入と製造で稼ぐ形へ移りました。", "source": "https://investors.ionq.com/news/news-details/2026/IonQ-Announces-Record-3Q26-Revenues-and-Raises-FY2026-Guidance-to-505---515-Million-as-Backlog-Grows-to-1-2-Billion/"}, {"label": "部門別売上（2026年7-9月期）", "value": "IonQプラットフォーム9030万ドル（前年同期比127%増）、SkyWaterファウンドリ8350万ドル", "note": "買収寄与を除いたプラットフォーム単体で127%増え、本体の需要が伸びています。SkyWater8350万ドルは全体の48%を占め、売上構成が量子本体と製造受託の2本柱へ変わりました。", "source": "https://investors.ionq.com/news/news-details/2026/IonQ-Announces-Record-3Q26-Revenues-and-Raises-FY2026-Guidance-to-505---515-Million-as-Backlog-Grows-to-1-2-Billion/"}, {"label": "残存履行義務（2026年9月末）", "value": "12億ドル", "note": "契約済みで売上に変わる前の金額が前四半期から倍増しました。プラットフォーム部門の新規契約額の3分の2を量子コンピューティングが占め、Superion 256への需要が積み上がりを主導します。", "source": "https://investors.ionq.com/news/news-details/2026/IonQ-Announces-Record-3Q26-Revenues-and-Raises-FY2026-Guidance-to-505---515-Million-as-Backlog-Grows-to-1-2-Billion/"}, {"label": "調整後EBITDA（2026年7-9月期）", "value": "マイナス1億3360万ドル", "note": "損失は売上の77%に相当します。GAAP純利益5億6400万ドルはワラント評価の非現金要因を含み、営業の実力は調整後EBITDAの赤字で見る必要があります。規模拡大と赤字拡大が同時に進む段階です。", "source": "https://investors.ionq.com/news/news-details/2026/IonQ-Announces-Record-3Q26-Revenues-and-Raises-FY2026-Guidance-to-505---515-Million-as-Backlog-Grows-to-1-2-Billion/"}, {"label": "会社見通し（2026年通期の売上、会社見通し）", "value": "5億500万ドルから5億1500万ドル", "note": "会社は通期売上見通しを引き上げ、量子コンピューティング売上は前年比110%増を見込みます。第4四半期に残存履行義務12億ドルを売上へ変える速度が通期見通しへの到達と来期の成長率を決めます。", "source": "https://investors.ionq.com/news/news-details/2026/IonQ-Announces-Record-3Q26-Revenues-and-Raises-FY2026-Guidance-to-505---515-Million-as-Backlog-Grows-to-1-2-Billion/"}], "sources": [{"title": "IonQ 2026年7-9月期決算リリース（2026年11月5日）", "url": "https://investors.ionq.com/news/news-details/2026/IonQ-Announces-Record-3Q26-Revenues-and-Raises-FY2026-Guidance-to-505---515-Million-as-Backlog-Grows-to-1-2-Billion/"}], "status": "見込み", "strengths": ["プラットフォーム売上9030万ドルは前年同期比127%増で、買収に頼らず量子本体が倍増しました。TempoとSuperion 256の納入が売上を作り、製品世代の更新が需要へ直結します。", "残存履行義務12億ドルを抱え、DARPAのQuantum Benchmarking Initiativeでイオントラップ勢として唯一Stage Cへ進みました。プログラム価値は最大3億ドルで、公的需要の入口を押さえています。", "SkyWaterのファウンドリ売上8350万ドルを持ち、量子チップ製造を自社で握ります。D-Waveと複数年契約を延長し、Qolabを新規顧客に加え、他社向け製造でも稼ぐ構造を作りました。現金と投資は9月末で17億ドル、10月の増資後プロフォーマで37億ドルです。"], "summary": "僕はIonQを、イオントラップ方式の量子コンピュータを政府機関と研究機関と企業へ販売し、クラウド利用と保守でも課金する会社として見ています。2026年7月にSkyWaterを買収し、製造受託まで自社で持ちました。2026年7-9月期の売上は1億7380万ドルで前年同期比336%増え、転換点を迎えました。", "weakness": "弱点は赤字を増資で埋める資金構造です。調整後EBITDAはマイナス1億3360万ドルで、現金と投資37億ドルは10月に20億ドルの増資を実行して作った水準です。残存履行義務12億ドルには予算措置が未確定の契約分も含まれます。受注の売上転換が遅れれば、追加増資による希薄化と研究開発の絞り込みが同時に進み、成長の前提が崩れます。"}, "iren": {"date": "2月上旬〜中旬", "deck": null, "focus": "年換算売上40億ドル超の目標への進捗と、AIクラウド売上の伸び、残り設備投資の調達状況を見る", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAJkAAABQCAMAAAA9ZSf0AAAAkFBMVEVx2oD///8LNE9WsHQkXVtdundQpXA9h2cZTFYmYVw5gWZNoG9z2 ": "203億ドル（前四半期比22%増）", "note": "受注残の3分の2は投資適格の取引先との契約です。将来売上の相手が大手企業中心で固まり、契約単価も3年契約で11%、5年契約で12%上がりました。需要の量と質が同時に改善しています。", "source": "https://www.sec.gov/Archives/edgar/data/1878848/000187884826000065/irenreportsq1-fy27result.htm"}, {"label": "調整後EBITDAと純損失（2026年7-9月期）", "value": "調整後EBITDA6600万ドル、純損失2億6300万ドル", "note": "調整後EBITDAは前四半期1900万ドルから増え、AIクラウドの粗利が固定費を吸収し始めました。純損失は前四半期6億8400万ドルから縮み、稼働拡大が進むほど損失が縮む形が見えます。", "source": "https://www.sec.gov/Archives/edgar/data/1878848/000187884826000065/irenreportsq1-fy27result.htm"}, {"label": "設備投資計画（2027会計年度の残り）", "value": "残り設備投資150億ドル、うち90億ドルは現金と確定した資金枠と顧客前払いで手当て済み", "note": "残り設備投資150億ドルの内訳は手当て済みの90億ドルと将来の容量目標向けの調達目標60億ドルです。年換算売上40億ドル超のプログラムに必要な残り設備投資は90億ドルで賄う形で、会社は同プログラムを契約済みで資金手当て済みとしています。", "source": "https://www.sec.gov/Archives/edgar/data/1878848/000187884826000065/irenreportsq1-fy27result.htm"}], "sources": [{"title": "IREN Reports Q1 FY27 Results（2026年11月5日、SEC提出の決算リリース）", "url": "https://www.sec.gov/Archives/edgar/data/1878848/000187884826000065/irenreportsq1-fy27result.htm"}], "status": "見込み", "strengths": ["AIクラウド売上が前四半期7100万ドルから2億ドルへ増え、部門粗利率86%を維持しました。サービスとリースの両方で課金し、Horizon 1でMicrosoft向け稼働を実証しました。", "土地3万エーカー超と確保済み電力5GW超を持ち、データセンターとGPUとソフトウェアを一体で提供します。供給制約が強い市場で、電力の確保自体が参入障壁として働きます。", "契約単価が3年契約で11%、5年契約で12%上がり、四半期後に結んだ5年契約では顧客がGPU設備投資の90%を前払いしました。顧客の前払いが自社の資金負担を軽くする契約を作れています。"], "summary": "僕はIRENを、土地と電力とデータセンターを自社で持ち、GPU計算資源をMicrosoftと大手AI企業へ契約で売るAIクラウド会社として見ています。ビットコインマイニングは副次的な事業へ後退しました。2026年7-9月期はAIクラウド売上2億ドルが全体の88%を占め、事業の主役が入れ替わりました。", "weakness": "弱点は設備投資の資金調達への依存です。2027会計年度の残り設備投資150億ドルのうち90億ドルは現金と確定した資金枠と顧客前払いで手当て済みで、残る60億ドルは将来の容量目標向けの調達目標として市場環境に左右されます。年換算売上40億ドル超の目標自体は契約済みで資金手当て済みですが、時期は顧客の設計変更と供給業者の時期で2026年末から2027年1月へ移り、2月末まで延びる可能性を会社が示しました。将来容量向けの調達が滞れば次の建設が遅れて受注残203億ドルの売上転換が遅れ、設計変更や供給遅れが重なれば稼働目標の時期もさらに崩れます。"}, "john-deere": {"date": "11月25日", "deck": null, "focus": "2027年度見通しで農業サイクルの底打ちを裏付けるか。通期純利益47億5000万ドルから50億ドルへの着地と大型農機需要を見る", "logo": "../assets/logos/john-deere.svg", "name": "John Deere", "next": "次に見る数字は会社見通しの2026会計年度通期純利益47億5000万ドルから50億ドルへの着地です。2026年11月25日の第4四半期決算で通期実績と2027年度の部門別見通しを確認し、大型農機の受注が底打ちを示すかと生産と精密農業の売上見通しを見ます。", "numbers": [{"label": "売上と純利益（2026会計年度第3四半期、8月2日終了）", "value": "売上と収益126億800万ドル（前年同期比5%増）、純利益13億7900万ドル（前年同期比7%増）", "note": "機械の売上109億9900万ドルが6%増え、全体を支えました。純利益は1株当たり5.10ドルです。農業の底入れ局面でも増益を保ち、部門構成の分散が利益を守りました。", "source": "https://www.sec.gov/Archives/edgar/data/315189/000110465926098904/de-20260820xex99d1.htm"}, {"label": "生産と精密農業の売上（2026会計年度第3四半期）", "value": "39億9800万ドル（前年同期比6%減）、営業利益5億2700万ドル", "note": "主力部門の減収が続き、営業利益率は13.2%です。出荷台数の減少が利益を押し下げました。会社は通期の部門売上を10%減と見込み、底打ちの確認には受注の回復が要ります。", "source": "https://www.sec.gov/Archives/edgar/data/315189/000110465926098904/de-20260820xex99d1.htm"}, {"label": "建設と林業の売上（2026会計年度第3四半期）", "value": "36億1800万ドル（前年同期比18%増）、営業利益4億3600万ドル（前年同期比84%増）", "note": "営業利益率は前年同期7.7%から12.1%へ上がりました。出荷増と価格実現が利益を作り、農業部門の減収を補う柱として建設が機能しました。", "source": "https://www.sec.gov/Archives/edgar/data/315189/000110465926098904/de-20260820xex99d1.htm"}, {"label": "小型農業と芝生の売上（2026会計年度第3四半期）", "value": "33億8300万ドル（前年同期比12%増）、営業利益6億2200万ドル（前年同期比28%増）", "note": "営業利益率は18.4%で全部門で最も高い水準です。大型農機より単価が低い領域で台数と価格が伸び、農業部門の中でも収益源が分散する形を示しました。", "source": "https://www.sec.gov/Archives/edgar/data/315189/000110465926098904/de-20260820xex99d1.htm"}, {"label": "会社見通し（2026会計年度通期純利益、会社見通し）", "value": "47億5000万ドルから50億ドル", "note": "会社は見通しの下限を引き上げ、2026年を農業機械の下降局面の底と説明しました。第3四半期の利益には関税還付1億1000万ドルが含まれ、還付を除く実力と受注動向を分けて見る必要があります。", "source": "https://www.sec.gov/Archives/edgar/data/315189/000110465926098904/de-20260820xex99d1.htm"}], "sources": [{"title": "Deere Reports Third Quarter Net Income of $1.379 Billion（2026年8月20日、SEC Exhibit 99.1）", "url": "https://www.sec.gov/Archives/edgar/data/315189/000110465926098904/de-20260820xex99d1.htm"}], "status": "確定", "strengths": ["建設と林業の営業利益が84%増の4億3600万ドルに達し、営業利益率12.1%まで改善しました。農業が沈む局面で建設が利益を作る2本柱の構造が機能しています。", "小型農業と芝生は営業利益率18.4%と全部門で最高水準を保ち、売上12%増と営業利益28%増を同時に作りました。大型農機のサイクルに業績全体が連動しない収益構成を持ちます。", "金融サービスが購入資金を担い、販売店網と精密農業技術で農家の買い替えを支えます。第3四半期の金融サービス純利益は2億1900万ドルで7%増え、機械販売と金融が一体で顧客を囲い込む形を作ります。"], "summary": "僕はJohn Deereを、大型農機と精密農業技術を農家へ販売店網経由で売り、金融サービスで購入資金まで担う会社として見ています。建設機械が農業の落ち込みを補う構図になりました。2026会計年度第3四半期は生産と精密農業が6%減る一方で、建設と林業が18%増え、全体売上は5%増を保ちました。純利益は13億7900万ドルで前年同期比7%増えました。", "weakness": "弱点は主力の大型農機が農業サイクルに連動する点です。生産と精密農業の売上39億9800万ドルは全体の32%を占め、米国とカナダの大型農機市場は2026年度に15%から20%減る見通しです。穀物価格と農家所得が戻らず販売店の在庫調整が長引けば、出荷台数の減少が精密農業の搭載拡大を上回り、通期純利益見通し47億5000万ドルから50億ドルの下限が崩れます。"}, "kawasaki-hi": {"date": "2月上旬", "deck": null, "focus": "通期事業利益予想1850億円への進捗と、営業キャッシュフローの黒字回復、航空宇宙と防衛の納入時期", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAMAAAD04JH5AAAAb1BMVEX////mABL3sLXmAA3oIyz+9vfkAADmAAjqQkr93+H/+/z3qrD4ub795ObuXmf5vsL+8fPoHSjsUFj6yc38z9P96uzwcXj82NvrLj33pKvzkpjsQ1DoABzqJTbzgIjtV2Hyh43rO0XuZ27yeIH0mZ4KUUmNAAACV0lEQVR4nO2Y3babIBBGVXRQoyIa4080apL3f8aa9qzTroYA50hWe/Hte4Y9OMKA5wEAAAAAAAAAAAAAAAAA/wvpIdAjIkOEUhgi/MEhfRoeUahFVolBIArOUh/jN+NzNhExLRSbBDyvjg1BPoNNKgFfC7cQ8IKQ6aN8QBfVJ3Ag0FTcZn4m6+exTgTK2WoF6FS+SaCNbQT4JBRjXQikd2khwPxFsQBOBMRqtQBFqxrsQECcreaPFRXoRCDrbH4BClUF4ECguZEhwgNG6/FFgH0CTdaRxfpzf34ZZYdAmmeFb5E+Z+vSvMzhuwJpXveFtEifUXgSzzvwLoG0abPh2vkW0/Nt+ux1+l8XiPJj1i/XamJkrH3Gidal1k5vIbDWeZK0bS2yw7CcimqdpM+5KXdGRLw7BbmpnTEK+GPXddMUjttqfmCcfSOsbv2x0Xz6L6zAsWyavD3WIuiHy2k+d3I0LsEY34LEmLydwN9F+Cj/yxyHm4RuGBFbb1miOn52CvykbIOl6EZtIW41yLuLyA3f4dsbUZqL+3Uy7MOcZNG3WoU9W/HmMJyZPgCjsborz2EHAo/h7aHSFsMvhf51Lew+jtNkCA0xGJfFOw6jTwWxmjaT7ThWtyOumtLKuDeRVFzLnAl4wnwz4aHawI2AdzX3BbQqmzJHAnebxmRW/Y6OBAabxpAPiuPBjUA0WwhsB5silhuBfrS7HN7fJBBMltfzSnU93/tAkTbLaPlAwbnqgWLnE02ZzdL6iUYhsPuRqhSmCPpHKgAAAAAAAAAAAAAAAADgX/EDp1woln47Y9gAAAAASUVORK5CYII=", "name": "川崎重工", "next": "次に見る数字は会社見通しの通期事業利益1850億円への到達です。2027年2月上旬の第3四半期決算で事業利益の進捗と営業キャッシュフローの改善を確認し、通期決算で営業キャッシュフローがプラスへ戻るかを見ます。", "numbers": [{"label": "受注高（2026年4-9月期）", "value": "1兆412億円（前年同期比2.5%増）", "note": "前年同期の受注高は1兆154億円でした。上期の売上収益1兆844億1900万円と同規模の受注を積み、下期以降に納入と検収を経て売上へ変わる仕事量を先に確保しています。", "source": "https://www.khi.co.jp/ir/pdf/sta_261110-1j.pdf"}, {"label": "売上収益（2026年4-9月期）", "value": "1兆844億1900万円（前年同期比8.8%増）", "note": "親会社の所有者に帰属する中間利益は309億2200万円で40.0%増えました。売上の伸びに対して利益が大きく伸び、部門構成と採算改善が利益率を押し上げる形になりました。", "source": "https://www.khi.co.jp/ir/pdf/sta_261110-1j.pdf"}, {"label": "事業利益（2026年4-9月期）", "value": "738億6600万円（前年同期比106.8%増）", "note": "売上収益に対する事業利益率は6.8%で、前年同期3.6%から上がりました。エネルギーソリューション&マリンと精密機械・ロボットとパワースポーツ&エンジンの伸びが利益を作りました。", "source": "https://www.khi.co.jp/ir/pdf/sta_261110-1j.pdf"}, {"label": "営業キャッシュフロー（2026年4-9月期）", "value": "マイナス880億7600万円", "note": "事業利益738億6600万円を計上しながら営業活動は支出超過です。棚卸資産が1067億3200万円増え、契約資産が452億200万円増えた運転資金の吸収が現金化を遅らせます。", "source": "https://www.khi.co.jp/ir/pdf/sta_261110-1j.pdf"}, {"label": "通期予想（2026年11月10日発表、会社見通し）", "value": "売上収益2兆5600億円、事業利益1850億円", "note": "事業利益の通期予想1850億円に対して上期実績は738億6600万円で、進捗率は40%です。下期に利益が偏る計画で、納入時期が通期着地を決めます。純利益の予想は1180億円です。", "source": "https://www.khi.co.jp/ir/pdf/sta_261110-1j.pdf"}], "sources": [{"title": "川崎重工業 2027年3月期第2四半期決算短信（2026年11月10日）", "url": "https://www.khi.co.jp/ir/pdf/sta_261110-1j.pdf"}], "status": "見込み", "strengths": ["エネルギーソリューション&マリンは事業利益305億9600万円、精密機械・ロボットは事業利益208億9800万円を出し、2部門で514億9400万円と全体の70%を占めます。利益源が複数部門に分かれ、1部門の変動で全体が決まる構造を避けています。", "事業利益が前年同期比106.8%増の738億6600万円に達し、事業利益率は前年同期3.6%から6.8%へ上がりました。精密機械・ロボットの事業利益が42億6700万円から208億9800万円へ増え、エネルギーソリューション&マリンも199億4800万円から305億9600万円へ増えた点が利益率改善を決めました。", "通期の事業利益予想1850億円の土台は上期の受注と部門採算にあります。受注高は前年同期比2.5%増の1兆412億円で、精密機械・ロボットとエネルギーソリューション&マリンの2部門が事業利益514億9400万円を出しました。見通しの裏付けが単一部門の想定でなく複数部門の実績に乗る構造です。"], "summary": "僕は川崎重工を、防衛省と鉄道事業者とエネルギー事業者へ受注生産で重工業製品を売り、精密機械とロボットと二輪で民間需要も取る会社として見ています。利益を作る中心はエネルギーと精密機械・ロボットです。2026年4-9月期は事業利益738億6600万円が前年同期比106.8%増え、利益の伸びが売上を上回りました。", "weakness": "弱点は利益と現金収支がずれる運転資金の重さです。上期は事業利益738億6600万円に対して営業キャッシュフローが880億7600万円の支出超過で、棚卸資産と契約資産の増加が現金を吸収しました。下期の納入と検収が遅れて棚卸資産がさらに積み上がれば、通期事業利益予想1850億円へ届いても営業キャッシュフローはプラスへ戻らず、資金調達への依存が強まります。"}, "kratos": {"date": "2月下旬", "deck": null, "focus": "第4四半期売上見通し4億8000万〜5億1000万ドルの達成と2027年売上見通し21億〜22億ドル、フリーキャッシュフローの -strong-third-quarter-results", "value": "13億ドル（前年同期比195%増）"}, {"label": "会社見通し（2026年通期）", "note": "会社は売上見通しの下限を232億ドルから235億ドルへ上げ、フリーキャッシュフロー見通し30億ドルを維持しました。受注残の積み上げを見通しの引き上げに結び付けた形です。", "source": "https://www.l3harris.com/newsroom/press-release/2026/10/l3harris-delivers-record-backlog-and-strong-third-quarter-results", "value": "売上235億〜237億ドル、GAAP EPS 12.25〜12.35ドル"}], "sources": [{"title": "L3Harris Delivers Record Backlog and Strong Third-Quarter Results（2026年10月29日、公式発表）", "url": "https://www.l3harris.com/newsroom/press-release/2026/10/l3harris-delivers-record-backlog-and-strong-third-quarter-results"}, {"title": "L3Harris Q3 2026 Earnings Release Exhibit 99.1（公式発表の全文PDF）", "url": "https://s205.q4cdn.com/565046976/files/doc_news/L3Harris-Delivers-Record-Backlog-and-Strong-Third-Quarter-Results-2026.pdf"}], "status": "見込み", "strengths": ["THAAD向け63億ドルとPAC-3 MSE向け47億ドルの7年契約を取り、Missile Solutionsのブック・トゥ・ビルは11.8まで上がりました。ミサイル推進装置は代替先が少なく、長期契約が生産投資の回収期間を読みやすくします。", "受注残532億ドルは2026年通期売上見通し235億〜237億ドルの2倍を超えます。宇宙と通信とミサイルの3部門に受注が分散するため、1部門の契約遅延で全体の売上が止まる構造にはなっていません。", "フリーキャッシュフローは前年同期比195%増の13億ドルで、営業利益率は13.0%と前年同期から2.0ポイント上がりました。受注を増やしながら利益率と現金を同時に改善した点が大手防衛企業としての強さです。"], "summary": "僕はL3Harrisを、米軍向けにミサイル推進装置と宇宙センサーと軍用通信を長期契約で納め、受注残を売上に変えて稼ぐ会社として見ています。第3四半期は受注193億ドルで受注残が過去最高の532億ドルまで積み上がり、売上は60億6000万ドルへ伸び、利益率も上がりました。ミサイル防衛向け推進装置の大型契約が受注を押し上げた四半期です。", "weakness": "弱点は受注残の質です。第3四半期受注193億ドルのうちTHAAD向け63億ドルとPAC-3 MSE向け47億ドルの合計110億ドルは未確定契約で、金額と条件が確定していません。確定が遅れるか金額が下がれば受注残532億ドルが売上と利益に変わる時期が後ろへずれ、総債務110億ドルを抱えたまま生産能力への先行投資だけが残ります。"}, "lumentum": {"date": "2月2日", "deck": null, "focus": "2027年度第2四半期見通し売上15億7500万〜16億2500万ドルの達成とMarvell買収の承認・規制審査の進捗", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPoAAAAxCAYAAADzw7RKAAAAIGNIUk0AAHomAACAhAAA+gAAAIDoAAB1MAAA6mAAADqYAAAXcJy6UTwAAAAGYktHRAD/AP8A/6C9p5MAAA/cSURBVHja7Z17dFTVvce/vz1nkgkEEEEttS1FvUtbUZfmXiSShHNmYiIVJNrEB1bb+rhqhVUtF62vOl68Wr2+X9VaW9vSxJJowayKCZOZQwhFLbS6qIvrtZeL4LW8AiSEZCY5Z//uHznJnEAeM5MJZuL+rjVr5Zw5Z5/9+H32/v322bN 。単価と粗利を取りやすい構成へ移る動きを示します。", "source": "https://www.sec.gov/Archives/edgar/data/1633978/000162828026068655/lite_ex991xq1fy27.htm", "value": "5億840万ドル（前年同期比228.8%増、売上構成比40.3%）"}, {"label": "非GAAP営業利益率（2027年度第1四半期）", "note": "前年同期から23.6ポイント上がり、増収が利益率を押し上げる構造を確認しました。GAAP営業利益率28.5%との差は調整項目の大きさを示し、利益の質を読む際の基準になります。", "source": "https://www.sec.gov/Archives/edgar/data/1633978/000162828026068655/lite_ex991xq1fy27.htm", "value": "42.3%（前年同期18.7%）"}, {"label": "NPO/CPO購入コミットメント（2027年度第1四半期に獲得）", "note": "第1四半期売上12億6260万ドルの4倍近いコミットメントで、将来の売上候補を先に積みました。売上への換算時期は開示されておらず、金額をそのまま将来売上と読むことはできません。", "source": "https://www.sec.gov/Archives/edgar/data/1633978/000162828026068655/lite_ex991xq1fy27.htm", "value": "50億ドル超（2件目の大口設計採用に付帯）"}, {"label": "会社見通し（2027年度第2四半期）", "note": "第1四半期から3億1240万〜3億6240万ドルの増収を会社が置き、非GAAP営業利益率45.0〜46.0%を併せて示しました。数量と利益率を同時に上げる前提の見通しです。", "source": "https://www.sec.gov/Archives/edgar/data/1633978/000162828026068655/lite_ex991xq1fy27.htm", "value": "売上15億7500万〜16億2500万ドル、非GAAP EPS 5.90〜6.20ドル"}], "sources": [{"title": "Lumentum 2027年度第1四半期決算発表（SEC Form 8-K Exhibit 99.1、2026年11月2日）", "url": "https://www.sec.gov/Archives/edgar/data/1633978/000162828026068655/lite_ex991xq1fy27.htm"}, {"title": "MarvellとLumentumの統合発表（共同プレスリリース、2026年11月2日）", "url": "https://investor.marvell.com/news-events/press-releases/detail/1040/marvell-and-lumentum-to-combine-creating-a-category-leader-in-ai-connectivity"}], "status": "見込み", "strengths": ["ポンプレーザーとOCSが伸びを担い、Systems売上は前年同期比228.8%増の5億840万ドルになりました。光接続はデータセンターの増設ごとに数量が必要になる製品で、採用が決まれば次の増設でも指名を受けやすい構造を持ちます。", "NPO/CPOで2件目の大口採用を決め、50億ドル超の購入コミットメントを積みました。設計段階で採用される製品は競合が価格だけで後から入り込む余地が小さく、採用自体が参入の壁になります。", "非GAAP営業利益率42.3%まで上げながら現金と短期投資20億ドルを保ちました。増産投資を借入に頼らず進める余力が需要の変動に対する耐久力になります。"], "summary": "僕はLumentumを、AIデータセンター事業者向けにポンプレーザーと光サーキットスイッチOCSを部品とシステムで売り、採用後の数量で稼ぐ会社として見ています。2027年度第1四半期売上は12億6260万ドルと過去最高になり、Marvellによる買収合意が評価の前提を変えました。光接続の需要が業績を決める段階に入った会社です。", "weakness": "弱点は買収完了までの不確実さです。対価はLumentum株1株にMarvell株4.5株を割り当てる固定比率で、受け取る : "https://investor.marvell.com/sec-filings/all-sec-filings/content/0001835632-26-000022/0001835632-26-000022.pdf", "value": "27億3900万ドル（前年同期比37%増）"}, {"label": "データセンター売上（2027年度第2四半期）", "note": "売上全体の79%を1部門が占めるまで比率が上がり、Marvellの実態がデータセンター専業に近づきました。通信その他部門の5億6780万ドルとの差が集中の度合いを示します。", "source": "https://investor.marvell.com/sec-filings/all-sec-filings/content/0001835632-26-000022/0001835632-26-000022.pdf", "value": "21億7150万ドル（前年同期比46%増、売上構成比79%）"}, {"label": "非GAAP粗利率（2027年度第2四半期）", "note": "第3四半期の非GAAP粗利率見通しは57.5〜58.5%で、第2四半期から下がる前提を会社が置きました。増収局面でもカスタム案件の比率上昇が粗利率を下げる構造を示す数字です。", "source": "https://investor.marvell.com/sec-filings/all-sec-filings/content/0001835632-26-000022/0001835632-26-000022.pdf", "value": "58.9%（GAAP粗利率53.1%）"}, {"label": "会社見通し（2027年度第3四半期売上、2026年11月2日更新）", "note": "2026年11月2日の統合発表で、会社は第3四半期の予備売上が従来見通しと整合し、レンジを±5%から±2%へ狭めたと公表しました。中央値を維持したまま幅を狭めた点は四半期の着地に対する会社の確度を示します。", "source": "https://investor.marvell.com/news-events/press-releases/detail/1040/marvell-and-lumentum-to-combine-creating-a-category-leader-in-ai-connectivity", "value": "31億5000万ドル（±2%）"}, {"label": "Lumentum買収の対価（2026年11月2日発表）", "note": "電気接続のMarvellと光部品のLumentumを1社に集める買収で、完了は2028年上半期の予定です。完了後は既存のMarvell株主の持分が67%まで下がるため、買収の成否と希薄化を分けて読む必要があります。", "source": "https://investor.marvell.com/news-events/press-releases/detail/1040/marvell-and-lumentum-to-combine-creating-a-category-leader-in-ai-connectivity", "value": "企業価値1150億ドル（Lumentum株1株にMarvell株4.5株、全株式交換）"}], "sources": [{"title": "Marvell 2027年度第2四半期決算発表（Form 8-K Exhibit 99.1、2026年8月27日）", "url": "https://investor.marvell.com/sec-filings/all-sec-filings/content/0001835632-26-000022/0001835632-26-000022.pdf"}, {"title": "MarvellとLumentumの統合発表（共同プレスリリース、2026年11月2日）", "url": "https://investor.marvell.com/news-events/press-releases/detail/1040/marvell-and-lumentum-to-combine-creating-a-category-leader-in-ai-connectivity"}], "status": "確定", "strengths": ["データセンター売上は前年同期比46%増の21億7150万ドルまで伸び、カスタムXPUと光DSPの両方を持つ点が効いています。チップ設計と光接続を同じ顧客に売れるため、1件の採用が複数製品の売上に広がる構造です。", "第2四半期売上は会社見通しの中央値を3900万ドル上回りました。2026年11月2日には第3四半期の予備売上が見通しと整合すると公表し、見通しレンジを±5%から±2%へ狭めました。実績の上振れとレンジの縮小は四半期単位の実行の確度を裏付けます。"], "summary": "僕はMarvellを、クラウド事業者向けにカスタムAIチップと光接続用DSPを設計して売り、データセンター投資から稼ぐ会社として見ています。2027年度第2四半期はデータセンター売上が21億7150万ドルと全体の79%に達し、Lumentum買収で光部品まで取り込む判断を示しました。データセンター集中が進んだ転換点の四半期です。", "weakness": "弱点はデータセンターへの集中です。売上の79%をデータセンター部門が占め、第3四半期の非GAAP粗利率見通し57.5〜58.5%は第2四半期の58.9%から下がります。クラウド事業者の投資が鈍れば売上と粗利率が同時に下がり、全株式交換のLumentum買収で既存株主の持分が67%まで下がる希薄化だけが残ります。"}, "mastercard": {"date": "1月下旬", "deck": null, "focus": "2026年第4四半期の純売上成長とクロスボーダー取扱高、還元増加率18%と純売上増加率の差", "logo": "../assets/logos/mastercard.svg", "name": "Mastercard", "next": "次に見る数字は2026年第4四半期決算で純売上の前年同期比成長が第3四半期実績の14%を維持するかです。クロスボーダー取扱高の伸び11%と、還元とインセンティブの増加率18%が純売上の増加率を上回り続けるかを確認します。", "numbers": [{"label": "純売上（2026年7-9月期）", "note": "為替の影響を除いても14%増え、伸びの本体が取扱高と取引件数の増加であることを示します。純利益46億ドル（18%増）より売上の伸びが判定の起点になります。", "source": "https://investor.mastercard.com/files/content_files/3Q26-Mastercard-Earnings-Release.pdf", "value": "98億700万ドル（前年同期比14%増、為替中立ベース14%増）"}, {"label": "総取扱高（2026年7-9月期）", "note": "購買取扱高は9%増え、発行済みカードはMastercardとMaestro合計で38億枚に達しました。取扱高7%増が単価の高いクロスボーダー取引11%増と合わさり、純売上14%増を作る構造です。", "source": "https://investor.mastercard.com/files/content_files/3Q26-Mastercard-Earnings-Release.pdf", "value": "3.0兆ドル（現地通貨ベースで前年同期比7%増）"}, {"label": "決済ネットワーク売上（2026年7-9月期）", "note": "顧客への還元とインセンティブが18%増えた後の純額で11%伸びました。還元の増加を差し引いても2桁成長を保つ点がネットワーク本体の強さを示します。", "source": "https://investor.mastercard.com/files/content_files/3Q26-Mastercard-Earnings-Release.pdf", "value": "57億5000万ドル（前年同期比11%増）"}, {"label": "付加価値サービス売上（2026年7-9月期）", "note": "決済ネットワーク売上の11%増を8ポイント上回り、純売上の4割を超えました。売上の中心が決済処理からデータとセキュリティを使うサービスへ移る転換を示す数字です。", "source": "https://investor.mastercard.com/files/content_files/3Q26-Mastercard-Earnings-Release.pdf", "value": "40億6000万ドル（前年同期比19%増、純売上構成比41%）"}, {"label": "営業利益（2026年7-9月期）", "note": "調整後営業利益率は60.5%まで上がりました。営業費用が11%増える中でも利益率が上がるのは固定費の重いネットワークに取扱高が積み上がる構造の表れです。", "source": "https://investor.mastercard.com/files/content_files/3Q26-Mastercard-Earnings-Release.pdf", "value": "59億ドル（前年同期比16%増、GAAP営業利益率59.8%）"}], "sources": [{"title": "Mastercard 2026年第3四半期決算発表（2026年10月29日）", "url": "https://investor.mastercard.com/files/content_files/3Q26-Mastercard-Earnings-Release.pdf"}], "status": "見込み", "strengths": ["付加価値サービス売上は19%増の40億6000万ドルで純売上の41%を占め、決済ネットワークの11%増より速く伸びました。決済データを使うセキュリティや分析は取扱高の単価競争から離れて料金を取れるため、ネットワークの規模がサービス売上の土台になります。", "発行済みカード38億枚と総取扱高3.0兆ドルが加盟店網を支え、GAAP営業利益率59.8%を生みます。新規のネットワークが発行枚数と加盟店網を同時に作る必要があるため、規模そのものが参入の壁になります。", "四半期に自社株買い30億ドルと配当7億6300万ドルを実行し、希薄化EPSは5.28ドルと22%増えました。高い利益率を現金に変えて株主に返す循環が続いています。"], "summary": "僕はMastercardを、銀行と加盟店をつなぐ決済ネットワークの利用料とセキュリティなど付加価値サービスの料金で稼ぐ会社として見ています。2026年7-9月期は付加価値サービス売上が40億6000万ドルと19%増え、決済ネットワーク本体の伸びを上回りました。取扱高の伸び以上にサービスで稼ぐ構図が強まった四半期です。", "weakness": "弱点は顧客還元の上昇です。決済ネットワークの還元とインセンティブは前年同期比18%増え、純売上の14%増を上回りました。大型の発行銀行との契約更新のたびに還元率が上がる構造であり、総取扱高の伸びが7%から鈍れば還元の増加が売上を上回り続け、営業利益率59.8%が下がり始めます。"}, "medtronic": {"date": "11月24日", "deck": null, "focus": "2027会計年度通期見通し（オーガニック成長7.25〜7.75%、EPS 5.94〜6.00ドル）の維持と第2四半期の実質成長", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAAGeUlEQVRoge1aS3MUVRT+7u15JFZmpjOTEMqCsgp5lSGZvNViJ7iyBFEg4mPlWquAv2FYWm7UlWWBZaFIuaHQ6MJMSEgCMW5MxAcQQjIPZoaEZKb7uJj0pPv27cdkApZVntV033POPd89z+4e4D9ObCuV7d79WziXUxOapiS4pjfqih4CAK7xNV3hK4qipVU1l56d3bO6VXvWDSAWW+zl4IMM9BIB3QC4h4jGgEkCvtdB5x88aJ2oZ/9NAqCgqmbeYURnAByoxwAA08RwLpdLfA6wUq3CNQOIx9JvEGgIwDO1yroT3SLGzuRyLV/XIuUbQFPTvW3BQPBTEL1Su3E1EOFSmULvFQrRJT/svgA0RzIHwfQLYHi6Put8021G7EQmn0h5MXolHJqbF18F1688QeMBYAcxGlbVpde9GF09oKqLRxixrwAEtsy02qgMnY5lC62XnRgcATRHMgfB9SsAGh+Laf5pmenscKaQGJEtSgE0Nc23Bnlw6gmHjRvdLuuhblliS0MjGAh9BiKp8R993IT9+xXpLvPzOt4+VXC15MKXUbS0yh3/y7SGD94vypZ2BNjaJwCOigs2APFY+ji5lMr+vgCe3S0HkEwC8ThDJkPS9dZtHIdfDjqpRjDokpIMR1R16Wgu1/KN+bZQhShIoA+dtQDRqPMmjAE9vc75/sLz7rUgFnOv6ozYOYAsJ2ABEFcz78Kjw7oBAID+fucT7h9wB+ClG6Bdqpo+Zb5jAUBEp93Ew2GGcIMXAGcj3cABQCTCwD06EyM6a76ussdii33wGMwiE が最大部門にあるため、全体の成長率を1部門が決める構成になっています。", "source": "https://filecache.investorroom.com/mr5ir_medtronic/918/FY27Q1-Press%20Release-FINAL.pdf", "value": "39億2700万ドル（オーガニック18.9%増）"}, {"label": "非GAAP営業利益（2027会計年度第1四半期）", "note": "GAAP営業利益17億6400万ドル（売上比18.1%）との差は調整項目の大きさを示します。非GAAP営業利益率は前年同期から0.1ポイントの上昇にとどまり、増収ほど利益率が伸びていない点も読み取れます。", "source": "https://filecache.investorroom.com/mr5ir_medtronic/918/FY27Q1-Press%20Release-FINAL.pdf", "value": "23億1600万ドル（売上比23.7%）"}, {"label": "糖尿病部門売上（2027会計年度第1四半期）", "note": "4部門で最も小さい部門が2桁成長しました。脳神経部門26億7800万ドル（オーガニック9.3%増）と外科部門22億7900万ドル（同10.2%増）も伸び、全部門が9%超の成長となった四半期です。", "source": "https://filecache.investorroom.com/mr5ir_medtronic/918/FY27Q1-Press%20Release-FINAL.pdf", "value": "8億4300万ドル（オーガニック14.9%増）"}, {"label": "会社見通し（2027会計年度通期）", "note": "会社は成長率見通しを従来の6.75〜7.25%から0.50ポイント上げ、EPS見通しの下限を5.90ドルから5.94ドルへ上げました。追加週の効果が消える四半期でも同じ成長を出せるかが前提になります。", "source": "https://filecache.investorroom.com/mr5ir_medtronic/918/FY27Q1-Press%20Release-FINAL.pdf", "value": "オーガニック売上成長率7.25〜7.75%、非GAAP EPS 5.94〜6.00ドル"}], "sources": [{"title": "Medtronic Reports First Quarter Fiscal 2027 Results（2026年9月1日）", "url": "https://filecache.investorroom.com/mr5ir_medtronic/918/FY27Q1-Press%20Release-FINAL.pdf"}], "status": "確定", "strengths": ["心血管部門はオーガニックで18.9%増の39億2700万ドルとなり、心臓アブレーションは88%増えました。Afferaマッピング・アブレーションシステムとSphere-9カテーテルなど新製品を既存の病院販路で売れる構造が最大部門の中に新しい成長源を作ります。", "4部門すべてがオーガニックで9%以上伸び、脳神経26億7800万ドル、外科22億7900万ドル、糖尿病8億4300万ドルがそれぞれ増えました。1部門の不振を他部門で補える幅がMedtronicの規模の強さです。", "第1四半期時点で通期のオーガニック成長率見通しを7.25〜7.75%へ引き上げ、非GAAP EPS見通しを5.94〜6.00ドルに置きました。四半期の実績を会社自身が見通しの引き上げで裏付けた形です。"], "summary": "僕はMedtronicを、病院向けに循環器機器と外科機器と糖尿病機器を売り、機器の設置後に消耗品と更新需要で稼ぐ会社として見ています。2027会計年度第1四半期は心血管部門売上が39億2700万ドルとオーガニックで18.9%増え、売上97億5600万ドルを押し上げました。全部門が伸びた一方で成長の中心は心血管部門に寄りました。", "weakness": "弱点は成長が心血管部門への依存に寄る点です。心血管部門は売上97億5600万ドルの40%を占め、アブレーションの88%成長が全体を押し上げました。第1四半期の13.7%成長には追加週の5億7000万ドルが含まれ、通期見通しは7.25〜7.75%にとどまります。アブレーションの比較が厳しくなる年度後半に同部門の成長が通期見通しの水準まで落ちれば、他部門の9〜10%成長では全体の減速を補えなくなります。"}, "meta": {"date": "1月27日", "deck": null, "focus": "会社見通しの売上730億から760億ドルへの到達と、法務費用の追加計上、2027年の設備投資計画", "logo": "../assets/logos/meta.svg", "name": "Meta", "next": "次は会社見通しの売上730億から760億ドルを置き、2026年10-12月期決算（2027年1月27日）で到達の有無と、法務費用の追加計上の有無、2027年の設備投資計画の規模を確認します。", "numbers": [{"label": "売上（2026年7-9月期）", "value": "646億100万ドル（前年同期比26%増）", "note": "広告売上が630億6100万ドルと全体の98%を占めます。表示回数と単価が同時に伸び、利用者数の伸び以上に売上を押し上げる収益化の段階に入りました。", "source": "https://www.sec.gov/Archives/edgar/data/1326801/000162828026066700/meta-09302026xexhibit991.htm"}, {"label": "デイリーアクティブ人数（2026年9月平均）", "value": "36億4000万人（前年同期比3%増）", "note": "利用者数の伸びは3%にとどまります。売上26%増との差は1人当たりの広告収益を引き上げる運用とAI活用の効果を示します。", "source": "https://www.sec.gov/Archives/edgar/data/1326801/000162828026066700/meta-09302026xexhibit991.htm"}, {"label": "営業利益（2026年7-9月期）", "value": "129億8800万ドル（前年同期比37%減）", "note": "州司法長官との合意に伴う費用98億9000万ドルを除くと営業利益は228億8000万ドルです。営業利益率は前年同期40%から20%へ下がり、法務費用が本業の利益率を直接削る形になりました。", "source": "https://www.sec.gov/Archives/edgar/data/1326801/000162828026066700/meta-09302026xexhibit991.htm"}, {"label": "設備投資（2026年7-9月期、ファイナンスリース元本込み）", "value": "349億1000万ドル", "note": "営業キャッシュフロー327億9000万ドルを上回り、フリーキャッシュフローはマイナス21億2000万ドルになりました。通期の設備投資見通しは1350億から1450億ドルで、投資が現金収支を決める局面です。", "source": "https://www.sec.gov/Archives/edgar/data/1326801/000162828026066700/meta-09302026xexhibit991.htm"}, {"label": "会社見通し（2026年10-12月期の売上）", "value": "730億から760億ドル", "note": "為替が売上成長率を1%押し下げる前提を含みます。通期費用の見通しは1750億から1790億ドルへ上がり、次期は売上の到達と費用の膨張を同時に測る四半期になります。", "source": "https://www.sec.gov/Archives/edgar/data/1326801/000162828026066700/meta-09302026xexhibit991.htm"}], "sources": [{"title": "Meta 2026年7-9月期決算リリース（SEC Form 8-K Exhibit 99.1、2026年10月21日）", "url": "https://www.sec.gov/Archives/edgar/data/1326801/000162828026066700/meta-09302026xexhibit991.htm"}], "status": "見込み", "strengths": ["広告売上が630億6100万ドルと26%増え、表示回数10%増と平均単価14%増が同時に寄与しました。量と価格の両方で伸ばせる広告基盤がAI投資の原資を四半期ごとに生みます。", "Family of Apps部門の売上が641億5800万ドルと全体の99%を占めます。単一の収益基盤に集中する分だけ効率が高く、現金と有価証券824億5000万ドルが法務費用と設備投資の支払いを吸収する厚みを持ちます。"], "summary": "僕はMetaを、FacebookとInstagramとWhatsAppの広告で稼ぎ、利益をAI基盤とReality Labsへ投じる会社として見ています。2026年7-9月期は広告表示回数10%増と平均単価14%増で売上が646億100万ドルへ26%伸び、利用者36億4000万人の土台を収益化する効率が売上を作る構図が強まりました。", "weakness": "弱点は若年層を巡る法務負担とAI設備投資が広告事業の利益と現金を同時に削る構造です。州司法長官との合意は支払総額が最大185億9000万ドルに達し、第3四半期だけで98億9000万ドルを計上して営業利益率を40%から20%へ下げました。設備投資も四半期349億1000万ドルまで膨らみフリーキャッシュフローはマイナス21億2000万ドルです。今後の裁判で追加計上が重なり広告の伸びが鈍れば、利益率と現金収支が同時に悪化し、投資計画そのものを絞る判断に迫られます。"}, "micron": {"date": "12月16日", "deck": null, "focus": "会社見通しの売上615億ドルと粗利率86%台への到達、HBMを含むクラウドメモリ部門の売上", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAGXRFWHRTb2Z0d2FyZQBBZG9iZSBJbWFnZVJlYWR5ccllPAAAAylpVFh0WE1MOmNvbS5hZG9iZS54bXAAAAAAADw/eHBhY2tldCBiZWdpbj0i77u/IiBpZD0iVzVNME1wQ2VoaUh6cmVTek5UY3prYzlkIj8+IDx4OnhtcG1ldGEgeG1sbnM6eD0iYWRvYmU6bnM6bWV0YS8iIHg6eG1wdGs9IkFkb2JlIFhNUCBDb3JlIDkuMS1jMDAyIDc5LmE2YTYzOTY4YSwgMjAyNC8wMy8wNi0xMTo1MjowNSAgICAgICAgIj4gPHJkZjpSREYgeG1sbnM6cmRmPSJodHRwOi8vd3d3LnczLm9yZy8xOTk5LzAyLzIyLXJkZi1zeW50YXgtbnMjIj4gPHJkZjpEZXNjcmlwdGlvbiByZGY6YWJvdXQ9IiIgeG1sbnM6eG1wPSJodHRwOi8vbnMuYWRvYmUuY29tL3hhcC8xLjAvIiB4bWxuczp4bXBNTT0iaHR0cDovL25zLmFkb2JlLmNvbS94YXAvMS4wL21tLyIgeG1sbnM6c3RSZWY9Imh0dHA6Ly9ucy5hZG9iZS5jb20veGFwLzEuMC9zVHlwZS9SZXNvdXJjZVJlZiMiIHhtcDpDcmVhdG9yVG9vbD0iQWRvYmUgUGhvdG9zaG9wIDI1LjEyIChNYWNpbnRvc2gpIiB4bXBNTTpJbnN0YW5jZUlEPSJ4bXAuaWlkOkUxNDU4MzgzNzgyRjExRUY5RkRBOTJEQ0RGM0U3NEZBIiB4bXBNTTpEb2N1bWVudElEPSJ4bXAuZGlkOkUxNDU4Mzg0NzgyRjExRUY5RkRBOTJEQ0RGM0U3NEZBIj4gPHhtcE1NOkRlcml2ZWRGcm9tIHN0UmVmOmluc3RhbmNlSUQ9InhtcC5paWQ6RTE0NTgzODE3ODJGMTFFRjlGREE5MkRDREYzRTc0RkEiIHN0UmVmOmRvY3VtZW50SUQ9InhtcC5kaWQ6RTE0NTgzODI3ODJGMTFFRjlGREE5MkRDREYzRTc0RkEiLz4gPC9yZGY6RGVzY3JpcHRpb24+IDwvcmRmOlJERj4gPC94OnhtcG1ldGE+IDw/eHBhY2tldCBlbmQ9InIiPz6eyQ8rAAAA90lEQVR42uxXiw3CIBAtxgHYwI7iCB2hTqAb2BEYwREYATfADXADNqhHQhtyATk/hBi55KUfHncPcrwENs9zVzM2XeVoApqA6gI6dwwpgDgBtJuCYAAT4o4AleC6Mb5yCYV5ojCGBPT+mePqRQRFgCIkfAc6KwBin1jp4McEwD4pIgJebBeHnACBJl 換する力が強い状態です。売上の81%に達する現金創出が次の投資局面でも財務の自由度を保ちます。"], "summary": "僕はMicronを、DRAMとNANDとAI向けHBMをデータセンター顧客へ供給し、メモリ価格の局面で利益が大きく振れる会社として見ています。2026年度第4四半期は売上が542億2900万ドルへ膨らみ粗利率は86.8%まで上がり、価格上昇が利益の大半を作る局面に入りました。HBMの供給先はAIデータセンターが中心です。", "weakness": "弱点は利益がメモリ価格へ集中する構造です。粗利率86.8%は前年同期44.7%から価格上昇で跳ねた水準で、裏側に数量の裏付けが薄い局面です。DRAMとNANDの需給が緩み価格が下がれば、売上615億ドルの会社見通しと86%台の粗利率が同時に崩れ、固定費の重い工場負担が利益を急速に削ります。"}, "microsoft": {"date": "1月27日", "deck": null, "focus": "Azure売上の伸びと商業受注残の積み増し、設備投資の規模", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPoAAAA2CAYAAADuxoTyAAAABGdBTUEAALGPC/xhBQAAACBjSFJNAAB6JgAAgIQAAPoAAACA6AAAdTAAAOpgAAA6mAAAF3CculE8AAAABmJLR0QA/wD/AP+gvaeTAAAAB3RJTUUH6ggPCiEbGHWQCgAAEMVJREFUeNrtXXuYFNWV/51b3cO0mR5AQfFBCOrnY018YdbXJjKJKPEzPpDZiK8oRqKss0xX1TziGlMhJOB0Vc+YSTQgiYmiUUaUyO5n5LW6mhWTrAiGXWVZEyW7ojAIXTxmprvr7B9Tg01xu6d7pntwkvv7a+beqlun773nWefcouQ1JzLKDAKmR5e/s8yyIPgiZMr9PAamzb0Mz0JBQQEAINQUKCgoRldQUFCMrqCgoBhdQUFBMbqCgoJidAUFBcXoCgoKhSKkpkBB4ZOHxsbG4zzP+wqAScx8DBGx53ndADZv3bp1XkdHR0YxuoLCMMXs2bOrIpHI/ZlM5hsAKvramRlEBAA444wz4h0dHfsUow8SsVjsPCKamOeSDYlEYnMpnqXr+gUAxsv6iCjjOM4zwXbTNCd6ntdKRJMBJAEs9Tzv262trfvV6g1f1NfXH6tp2gsAPqdM9yEAEd1JRLfnueRfAFw52OdYllXhuu6zAMbluKQLQCS7oa6urpqZ12QJopEADCHEkQBmqtUbnrAsq9J13eXlYHJABeMGiqmxWOz4wQ6yZ8+ea/IwuRThcHgKAJm1cbNlWUeopRmeSCaTswH8bY7uHQBeBfAuAC/fOE1NTSOVRi8dNCK6FcD3BzMIM99ZtGQWYgSztA4p1N3dHQGwTy3PcDQiyZC07wdwU7b7ZprmxE2bNnVnWXgjKisrL/E87yoAV2YymSUA7lWMXrqVuQ3ADwAMqPqvvr7+dACTi72vu7t7VUVFxU4ARwa6Xpk/f36nWpnhB8MwzgVwnEQR3J9IJA6K0di2/ce+v3VdX0xEf+95XlSZ7uXDSaZp1gzYJNC0bwKgYu9rb2/fTkRfA7AtS+i8pGnaDLUkwxan5LD4nu9H2VwGIFrIAxSjD870HlDwy/elvz7Q59q2vToajY4HcLqmacfbtj25paXlz2pFhi3GyBo9z3u3VA9Qpnvh6ARwVKBtWnNz8+gFCxZ8VMxAyWTyeiIaVcD4+YRFGsBbaln+ItxATRZ3CYfDe0r1DKXRC8cT6H3dlY1IT0/PDQNY2GAQbieA59QUlx+zZs0K/zX+bqXRCzfTO4loGYAbA0x7O4AfFzpOLBY7D8DnA2MvIaJQEWNMJaKgb7Y5kUhsKNAaCO3du/d8Zp7CzKcw81FEdBQzdwkhtnmetwHAqurq6t9aluUFnn0JER0dGHJrIpFY1zd2Mpm8GsAkABOIaB8RPWfb9opc9JimORHApcx8IYCjsyybTgAfMPPLoVBo9UDcE13XLxBC3MLMFwM4CcCnDMMAEW1n5g3M/KIQYrVt268VM 89019/000119312526436122/msft-ex99_1.htm"}], "sources": [{"title": "Microsoft 2027年度第1四半期決算リリース（SEC Form 8-K Exhibit 99.1、2026年10月28日）", "url": "https://www.sec.gov/Archives/edgar/data/789019/000119312526436122/msft-ex99_1.htm"}], "status": "見込み", "strengths": ["Azure売上が331億6500万ドルと48%増え、製品別売上表で金額を確認できる水準まで開示が進みました。成長の中心が金額で検証できる点が受注残6770億ドルと併せて先行指標の信頼度を上げます。", "Microsoft 365クラウドの売上が277億7800万ドルと企業向けサブスクリプションの土台を保ちます。従量課金のAzureと契約更新型の365が重なり、景気の波に対して売上の残り方が分かれる構造を持ちます。"], "summary": "僕はMicrosoftを、Azureの従量課金とMicrosoft 365のサブスクリプションで企業顧客から稼ぎ、AIの計算基盤へ再投資する会社として見ています。2027年度第1四半期（2026年7-9月期）はAzure売上が331億6500万ドルへ48%伸び、商業受注残は6770億ドルまで積み上がりました。", "weakness": "弱点は成長がAzureへ集中し、支える投資が資本集約型へ振れる構造です。有形固定資産の取得は四半期393億6700万ドルと営業キャッシュフローの68%に達し、固定資産残高は3468億4400万ドルまで膨らみました。Azureの伸びが鈍り容量の稼働が下がれば、減価償却と維持費用が残り、営業利益率50%の水準を下から削ります。"}, "mp-materials": {"date": "2月下旬", "deck": null, "focus": "GM向け磁石の商業出荷の立ち上がりと、NdPr生産量・販売量の伸び", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAASSklEQVR4nO1baZRW1ZXd+7z3jVUFMoqkQIYCxIooYuw2po3amthJGxMVjTGtxtjgmIgDihH4nOISohiNIjhE0aiBdDptu2ISjWBMojEBUYMCFoMJIlIgFFX1je/e3T++AoqhqKKoqFmdvdZbtdarO5yz37nnnHvu/YB/4P83+FEL0BrKZAz5h7rnfLyC8SBWgLOEXJRMI4+SGphZne/qOT8WBCjTp7Kp2HsQw9JoUp+Wt4NI9iEQCGgm9BcIL4cBF3zQ1LCk3/feb+6quT9SApSprWxEfpQJp1D2BYCfANQtHjAIgxbRBBQiDyfkBKyhYW4IPZ7I1L3ZFTJ8JATMzyA82moOKUU8jcBpHhiSChkHgMgDkqCdhAyNMANyJeUp/C6ivl+1rvsvOHthaV9k+dAJyH5n6ABZcDKobwI4JBVjzHkg8gIJBCTI7YIJgPOAU5mSuJX/n49UB/hp6U2cw7vrCp2V50MjQBmEjW74UUZcZNDnEyF7epUVD0gEBhSd4IXNADYCykIAaN0EHZAMGfceKHkhNCIeENmS/6szZaqQeIyZJcXOyPWhENA4qaYPQjvTqPGB8ZMxK5u6ESCBQqQigZWSlor8PYDFMY81xVBUhJrQeLwXTiAxMh7QSl4wAImYIVv0qwyanLS6J5iB31vZ9okATahOIVmZBiLbnIhKa1GRrd3pS2zJHDTcXDSe5LnJkL18y+JuUTwvYLlRv6HHT5KB3gLclp3DnSaOqMondJg3fwHELydCdiu58pIJjShE/k9mvDKVefs3HwoB2alDBsoFo0gc7In+BEOCWS+/HgEXVxy8fD7PgMtlRhzvnZ8A4sRUjAnntyleAvAGYM+ImFvBcCUzS5ram7cxM7SvORtHYnw8ZHXJlZePk+A854aB+04ys6Lub0aAMggLfthxnjrPi8cR6AYgBsAAhADqQcxizM92RTvSjJNCYExo5f75SADwlohnCXs0zcY3mVmb3SsZptZ0y4nnSrgqEeP , "value": "Materials部門1億3353万9000ドル（前年同期比322%増）、Magnetics部門1862万3000ドル（前年同期比15%減）", "note": "収益は原料と分離を担うMaterials部門へ集中し、磁石を担うMagnetics部門は立ち上げ段階にとどまります。一貫生産の形は整い始めましたが利益の出所はまだ上流側です。", "source": "https://www.sec.gov/Archives/edgar/data/1801368/000180136826000056/mpmcq32026er.htm"}, {"label": "調整後EBITDA（2026年第3四半期）", "value": "4113万8000ドル", "note": "前年同期1257万ドルの損失から黒字へ転じました。Materials部門の調整後EBITDA4782万8000ドルが全体を支え、下流のMagnetics部門は534万8000ドルにとどまります。", "source": "https://www.sec.gov/Archives/edgar/data/1801368/000180136826000056/mpmcq32026er.htm"}, {"label": "SEG+販売（2026年第3四半期）", "value": "3160万ドル", "note": "米国の航空宇宙・防衛顧客への販売で、四半期売上の21%を占めます。176%増の内側に単発性の強い販売が混ざり、伸びの持続性を分けて読む必要があります。", "source": "https://www.sec.gov/Archives/edgar/data/1801368/000180136826000056/mpmcq32026er.htm"}], "sources": [{"title": "MP Materials Reports Third Quarter 2026 Results（2026年11月5日、SEC Form 8-K Exhibit 99.1）", "url": "https://www.sec.gov/Archives/edgar/data/1801368/000180136826000056/mpmcq32026er.htm"}], "status": "見込み", "strengths": ["NdPr販売量が1020トンと94%増え、NdPr酸化物と金属の売上が1億96万1000ドルまで拡大しました。Mountain Passの分離能力を販売量と売上へ変える工程が回り始め、上流の規模が収益へ直結します。", "GM向け磁石の認定を完了し、第4四半期から販売可能な納品と売上計上が始まります。原料の販売先を自社の磁石事業と自動車メーカーへ広げる出口が契約の形で確定しました。", "Materials部門の調整後EBITDAが4782万8000ドルまで改善し、連結の調整後EBITDAも4113万8000ドルの黒字へ転じました。上流の収益力が下流の立ち上げ費用を賄う構造が数字で見えます。"], "summary": "僕はMP Materialsを、Mountain Pass鉱山でレアアースを掘り、NdPrの分離から磁石製造まで一貫して自動車と防衛の顧客へ売る会社として見ています。2026年第3四半期はNdPr販売量が1020トンへ94%増えて売上が1億4765万5000ドルへ176%伸び、GM向け磁石の売上計上が第4四半期に始まる転換点に入りました。", "weakness": "弱点は売上の質が単発性の強い販売へ寄る構造です。第3四半期売上の21%に当たる3160万ドルはSEG+の防衛顧客向け販売で、価格保護契約の収入810万9000ドルも通常の製品売上と性質が異なります。SEG+が剥落し、GM向け磁石の売上が第4四半期に立たなければ、176%増の成長率と調整後EBITDAの黒字が同時に細り、純損失2071万ドルの赤字基調へ戻ります。"}, "nabtesco": {"date": "2月12日", "deck": null, "focus": "通期の営業利益予想326億円の達成と、受注高2893億円の水準が続くか、精密減速機の伸び", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAMAAAD04JH5AAAAElBMVEUAMEkAhswAh80Ah80Ah80Ah83nad5PAAAABXRSTlMBO7l93ulUbVYAAAN4SURBVHicvZvRdoMwDEMLdP//yzst7KxbkK0bbPxKSG/VV ）", "value": "売上697億8000万円、営業利益74億2500万円（営業利益は前年同期比90.6%増）", "note": "精密減速機が中国と韓国の自動車メーカー向け産業用ロボットと一般産業向けで伸び、受注は729億4900万円と23.6%増えました。全体の利益増を単一の主力製品が作る構図です。", "source": "https://www2.jpx.co.jp/disc/62680/140120261113578060.pdf"}, {"label": "通期予想（2026年11月13日時点で据え置き）", "value": "売上3440億円、営業利益326億円", "note": "純利益の予想は241億円です。9月までの進捗率は営業利益で71.6%、純利益で70.4%にとどまり、第4四半期の積み上げ幅が計画達成を決めます。", "source": "https://www2.jpx.co.jp/disc/62680/140120261113578060.pdf"}], "sources": [{"title": "ナブテスコ 2026年12月期第3四半期決算短信〔IFRS〕（連結）（2026年11月13日、JPX TDnet開示）", "url": "https://www2.jpx.co.jp/disc/62680/140120261113578060.pdf"}], "status": "見込み", "strengths": ["精密減速機が伸びてコンポーネントソリューションの営業利益が90.6%増え、全体の営業利益率を9.3%まで押し上げました。主力製品の受注729億4900万円が利益の出所として明確です。", "受注が2893億円に達し、トランスポートソリューションでも航空機器と舶用機器と鉄道の保守需要で営業利益が33.5%増えました。設備投資向けと保守向けの二つの需要が受注を支えます。", "油圧機器事業の株式70%を2026年1月にComer Industriesへ譲渡し、事業の絞り込みを進めました。資本を精密減速機側へ寄せる配分の判断が実行段階に入りました。"], "summary": "僕はナブテスコを、産業用ロボットの関節向け精密減速機を設備投資需要へ売り、鉄道と航空と舶用の機器と保守でも稼ぐ会社として見ています。2026年1-9月期は受注が2893億円に達し、営業利益は233億5200万円へ50.9%増えて、精密減速機の受注が全体を引く構図が鮮明になりました。鉄道車両向け機器の保守需要も売上の下支えになりました。", "weakness": "弱点は利益が精密減速機の設備投資需要へ集中し、通期計画の達成が第4四半期へ寄る構造です。9月までの純利益は169億5600万円と通期予想241億円に対する進捗が70.4%にとどまり、第4四半期に71億4400万円を積む必要があります。中国と韓国のロボット向け受注が鈍れば、受注が売上へ変わる前に計画の下方修正へ向かい、利益率9.3%の改善も止まります。"}, "nebius": {"date": "2月11日", "deck": null, "focus": "AIクラウド売上の伸びと営業黒字の維持、一過性収益を除いた売上の規模", "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAMAAAD04JH5AAAAnFBMVEXa/zMFK0Lh/zIAH0IAI0JHZz9rizxrij3d/zMAJ0IAKUIAJEIAJkIAIkK22zYAIEImRkFDXz/K8DQAHUIAGEMAG0IAAEMAEkMAFkPP9DTG6zUAD0NHaj664DUdP0FXeD17nTudwTiMrzoACUNukTuz1TcAMUEBNUEXQkCBozowUEB4mDxefT0TOUGnyzeTtDlUcj45WUBggzwlSkD/o7eWAAAEN0lEQVR4nO2aa3eqOhCGk4A6RBAvoEhFwaq7aJXW/v//dtzHqhMuVo2ha6+V91uXkDydCXNJQoiWlpaWlpaWlpaWlpbW7QJgRwH8zvxhMvnz+uK/TZKI1I8AkK5HDqeUW473ZxOxuufvz3ybnsSN6fxHG4Ag6fknHsWyvfinV8IOUiRJwJo+FcX55roX2GbaPWs6k3MZJH+9nyMYXvcCa/nWWUZDDmD87uTnp9TqXrUraxmXZ005AIi2BQMcZMyuvfRUgCTgvAQh2F0xwfMADgEwHZorLxjYOQBncmXYJwEA9KNdFkeHAByl6 26126238/nbis-ex99d1.htm"}, {"label": "継続事業の純損失（2026年7-9月期）", "value": "3750万ドル", "note": "営業黒字でも金利費用1億1250万ドルが利益を食い、純損失が残りました。事業の黒字化と財務負担の解消に時間差があり、資金調達の条件が利益の残り方を左右します。", "source": "https://www.sec.gov/Archives/edgar/data/1513845/000110465926126238/nbis-ex99d1.htm"}, {"label": "減価償却費（2026年7-9月期）", "value": "3億5470万ドル", "note": "売上の36%に達します。サーバーとデータセンターへ先行投資する費用構造が数字に表れ、容量を先に用意して後から売上を回収する順序が固定化しました。", "source": "https://www.sec.gov/Archives/edgar/data/1513845/000110465926126238/nbis-ex99d1.htm"}], "sources": [{"title": "Nebius 2026年7-9月期 Form 6-K Exhibit 99.1（SEC提出書類、2026年11月12日）", "url": "https://www.sec.gov/Archives/edgar/data/1513845/000110465926126238/nbis-ex99d1.htm"}], "status": "見込み", "strengths": ["AIクラウド売上が9億7380万ドルと643%増え、売上全体の99%を占める規模まで拡大しました。自社で設計するハードウェアとソフトウェアを組み合わせたフルスタック型の基盤が大規模な学習と推論の需要を取り込む受け皿になりました。", "営業利益が5040万ドルと黒字へ転じ、前年同期の営業損失1億3020万ドルから1億8060万ドル改善しました。売上規模が固定費を吸収する段階に入り、拡大と収益化が同時に進み始めました。", "従量課金のオンデマンド型と予約容量の固定契約を併せて持ちます。短期の利用と長期の容量確保を同じ基盤で受ける売り方が大口顧客の継続利用を契約の形で押さえる構造を作ります。"], "summary": "僕はNebiusを、自社設計のGPUクラウドを従量課金と予約容量の契約でAI開発企業へ売る会社として見ています。2026年7-9月期はAIクラウド売上が9億7380万ドルへ643%増えて全体の99%を占めるまでになり、売上は9億8080万ドルへ571%伸びる転換点を作りました。自動運転のAvrideと教育のTripleTenも抱えますが業績はAIクラウドで決まります。", "weakness": "弱点は売上が単一事業へ集中し、設備と金利の固定負担が重い構造です。売上の99%をAIクラウドが占め、減価償却費3億5470万ドルと金利費用1億1250万ドルの合計は四半期の営業利益5040万ドルを大きく上回ります。容量の稼働が遅れて売上の伸びが鈍れば、固定費と金利が残り、営業黒字が再び赤字へ崩れます。"}, "nu-holdings": {"date": "2月下旬", "deck": null, "logo": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5OjcBCgoKDQwNGg8PGjclHyU3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3N//AABEIAIAAgAMBEQACEQEDEQH/xAAcAAEAAgIDAQAAAAAAAAAAAAAABQcBCAIDBgT/xAA1EAABAwMBBQYDCAMBAAAAAAABAAIDBAURBgcSITE2QVFxdJGxYXKBExQiIyYyoeEzQlIW/8QAGgEBAAIDAQAAAAAAAAAAAAAAAAUGAQIEA//EACgRAAIBAwIGAgIDAAAAAAAAAAABAgMEEQUzEiExNEFxE1EiMiMkYf/aAAwDAQACEQMRAD8ApCNjnva1jS5xOAB2raMXJ4RlJvkj0dBZImRk1YEjnD9uSN30KsVtpEEs1HkkqNksZqEsxjWZ3Ghuee %増）", "note": "ブラジル386億ドルとメキシコ53億ドルとコロンビア35億ドルで構成します。預金コストはインターバンクレートの87%まで下がり前年同期の89%から改善しました。低コストの預金が貸出拡大を支える構造です。", "source": "https://nu.com/en/newsroom/company/nu-holdings-ltd-reports-third-quarter-2026-financial-results"}, {"label": "90日超延滞率（2026年7-9月期）", "value": "7.3%（第2四半期の6.9%から上昇）", "note": "15-90日延滞率は4.9%へ上がり90日超延滞への貸倒引当カバー率は234%です。リスク調整後の純金利マージンは12.1%と第2四半期の12.4%から下がりました。貸出成長の質が問われる転換点です。", "source": "https://nu.com/en/newsroom/company/nu-holdings-ltd-reports-third-quarter-2026-financial-results"}], "strengths": ["顧客数1億4300万人と利用率83.6%を持ちブラジルの利用率は86.3%まで上がりました。支店を持たないデジタル銀行が主要口座の地位を得ると預金と決済と貸出が同じ顧客基盤から積み上がり獲得コストを抑えたまま収益を増やせます。", "効率性比率は19.3%まで下がり会社は通期見通しを19.0%から19.5%へ引き下げました。預金コストもインターバンクレートの87%まで下がりました。低い運営コストと調達コストが金利競争と信用コストの変動を吸収する構造的な強さです。"], "weakness": "弱点は貸出拡大と延滞上昇が同時に進む信用コストです。90日超延滞率は7.3%と第2四半期の6.9%から上がり15-90日延滞率も4.9%まで上がりました。延滞率がさらに上がり続けると貸倒引当の積み増しが純金利収入39億ドルを食いリスク調整後の純金利マージン12.1%と純利益10億9160万ドルの伸びが同時に崩れます。", "next": "次は会社見通しの効率性比率19.0%から19.5%を基準に2027年2月下旬発表予定の2026年10-12月期決算で90日超延滞率が7.3%から下がるかと貸出残高416億ドルに対する引当の積み増しと純利益10億9160万ドルからの伸びを確認します。", "focus": "効率性比率19.0%から19.5%の会社見通しと90日超延滞率7.3%からの推移、純利益の伸び", "sources": [{"title": "Nu Holdings 2026年第3四半期決算発表（2026年11月12日）", "url": "https://nu.com/en/newsroom/company/nu-holdings-ltd-reports-third-quarter-2026-financial-results"}]}, "nvidia": {"date": "11月17日", "deck": "deck-n.html", "logo": "../assets/logo-n.svg", "name": "NVIDIA", "status": "確定", "summary": "僕はNVIDIAを、大規模言語モデルの学習と推論を行うクラウド事業者と各国政府と企業へGPUとネットワークとCUDAソフトウェアを一体で売る会社として見ています。2027年度第2四半期はデータセンター売上890億ドルが全体の92.5%を占め売上962億2100万ドルへ前年同期比106%増え四半期として過去最高を記録しました。", "numbers": [{"label": "売上（2027年度第2四半期、2026年4-7月）", "value": "962億2100万ドル（前年同期比106%増）", "note": "売上が1四半期で前年同期の2倍を超えました。成長の中心は汎用半導体ではなくAI計算基盤への集中投資で会社全体の業績がデータセンター需要で決まる構造が強まりました。", "source": "https://investor.nvidia.com/news/press-release-details/2026/NVIDIA-Announces-Financial-Results-for-Second-Quarter-Fiscal-2027/default.aspx"}, {"label": "データセンター売上（同四半期）", "value": "890億ドル（前年同期比117%増 84億9900万ドル、フリーキャッシュフロー53億9600万ドルのマイナス", "note": "営業キャッシュフローは前年同期比184%増と第1四半期として過去最高でしたが設備投資が上回りました。投資先行の収支へ転じた転換点です。", "source": "https://www.sec.gov/Archives/edgar/data/1341439/000119312526387905/orcl-ex99_1.htm"}], "strengths": ["クラウド基盤売上が121%増え全体売上193億4500万ドルを30%成長まで押し上げました。データベースの顧客基盤へOCIを接続する形は既存顧客の移行先を自社基盤へ寄せる構造を作ります。", "RPOは前年同期から2090億ドル増えて6640億ドルに達し今期に300億ドル超のAIクラウド契約を新たに結びました。契約済み需要の厚さは容量投資の根拠になり競合が短期で再現しにくい受注の先行指標です。", "他社クラウド上で動くマルチクラウド型データベースという入口を持ちます。顧客が既存環境の中でデータベースを使い続けられる形は乗り換えコストを下げ、基盤契約へつなげる経路として機能する構造です。"], "weakness": "弱点は設備投資が営業キャッシュフローを上回る投資先行の収支構造です。2026年6-8月期は設備投資284億9900万ドルでフリーキャッシュフローが53億9600万ドルのマイナスとなりました。容量納入が遅れたりAI契約の利用開始がずれればRPO6640億ドルが売上へ変わらず投資回収と通期売上見通し900億ドル以上への到達が同時に崩れます。", "next": "次は履行義務残高RPO6640億ドルとクラウド売上116億700万ドルを基準に2026年12月14日発表予定の2026年9-11月期決算でクラウド基盤売上の伸びが3桁を保つかとRPOの増分と設備投資284億9900万ドルに対する営業キャッシュフローの比率を確認します。", "focus": "履行義務残高RPO6640億ドルからの増分とクラウド基盤売上の3桁成長の維持、設備投資に対する営業キャッシュフロー", "sources": [{"title": "Oracle Announces Q1 Results Driven by Triple Digit Growth in Cloud Infrastructure Revenues（2026年9月10日、決算リリース、SEC提出Exhibit 99.1）", "url": "https://www.sec.gov/Archives/edgar/data/1341439/000119312526387905/orcl-ex99_1.htm"}]}, "ouster": {"date": "3月25日", "deck": null, "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAMAAAD04JH5AAAAPFBMVEVHcEwXFxcXFxf///8XFxcXFxcXFxcXFxcXFxcXFxcBAQEQEBDk5OQpKSlNTU319fXGxsZwcHCurq6SkpI4bsC4AAAACnRSTlMAOP//2xu/llvv6Iid8wAABTNJREFUeJzFW9eWhSAMVNeOYOH//3UTsBuw4c087bmuZAzJEFoUPUAWx2VR5GlaVUlSVWmaF0UZx9mTtu4bL8Ey2D2iAh7ltySyuKBtr2l8RgI+/cz4lxyyIr1m3SItglLIyvyOdYu8DGb/ifmAFMpbvt8ifU8hfvj1sxfid/avBr4bVfHCfPnavKHwuB+KEOYRz5wQvwi+PdIHkVCGM4+43Q3B3D/hXjdkL5OPQn5DnL+wf4dBFiT7jqguhmLI8N/iWjJ8Z/8ag6/8b1GdxsE38bfgNBI/tg8M/PaD688RXkUKrL80PKoc/8J+krhT4cMEXCNlDAALRxj8JAAs6DD4VIG2qFg7AEF0QvxDB5AD4+cSuMVBEH8YgRb7OPyRBCxImR2wc8HXgzCFnNkBWxcwOGDjgox6XotwtgTZ1lIcUSIoe1mHsl9DY8TPsxxmRA4K2TR9HcILoq77ppFES+nkAioEgcDfXxPAC/D12BJFYA5DqgcMAXhRv/ICfL3uTDskgbEPyJnASODvr9XqaTzWQunWtkITGGcJZCU4EwAKg35AQdSiH9qpDZrA /000162828026069487/exhibit991-9302026.htm"}, {"label": "粗利率と純損失（2026年第3四半期）", "value": "GAAP粗利率43%、純損失1416万ドル", "note": "純損失は前年同期2173万ドルから縮み非GAAP粗利率は47%で調整後EBITDA損失は339万ドルまで縮みました。黒字へ近づく一方で粗利率の水準自体は下がりました。", "source": "https://www.sec.gov/Archives/edgar/data/1816581/000162828026069487/exhibit991-9302026.htm"}, {"label": "現金等（2026年9月30日時点）", "value": "4億2100万ドル", "note": "現金と現金同等物と制限付き現金と短期投資の合計で7月の普通株発行による純手取り1億9185万ドルを含みます。資金調達で作った手元資金が赤字継続期間を支える構造です。", "source": "https://www.sec.gov/Archives/edgar/data/1816581/000162828026069487/exhibit991-9302026.htm"}, {"label": "会社見通し（2026年第4四半期）", "value": "売上6100万ドルから6400万ドル", "note": "会社は第4四半期の売上見通しだけを示し利益見通しは出しませんでした。9か月累計売上は1億6253万ドルです。売上成長と利益改善を別々に判定する必要がある形です。", "source": "https://www.sec.gov/Archives/edgar/data/1816581/000162828026069487/exhibit991-9302026.htm"}], "strengths": ["製品売上が5603万ドルへ42%増え製品売上の成長が15四半期連続へ続きました。LiDARとカメラとAIコンピュートを束ねて売る形は顧客ごとの採用範囲を広げ単一センサーの価格競争から距離を取る構造を作ります。", "出荷が2万7000台超まで増えStereolabsのカメラが数量成長の新しい柱になりました。買収で得たカメラの顧客基盤へLiDARとコンピュートを売る経路が加わり製品群の相互販売が可能になりました。", "調整後EBITDA損失が339万ドルまで縮み現金等4億2100万ドルを持ちます。売上5933万ドルへの拡大と損失縮小が同時に進む点は固定費を売上成長で吸収する段階へ近づいたことを示します。"], "weakness": "弱点は粗利率の低下と出荷構成の偏りです。GAAP粗利率は43%で第2四半期の49%から6ポイント下がり第2四半期には関税還付の一時要因が粗利率を10ポイント押し上げた経緯があります。出荷の大半がカメラのままLiDARのRev8が伸びなければ単価と粗利率が下がり純損失1416万ドルの解消と黒字化が同時に崩れます。", "next": "次は会社見通しの売上6100万ドルから6400万ドルを基準に2027年3月25日発表予定の第4四半期決算で見通しへの到達とGAAP粗利率が43%から戻るかとRev8の納品台数とLiDAR出荷比率を確認します。", "focus": "第4四半期の会社見通し売上6100万ドルから6400万ドルの達成とGAAP粗利率43%からの回復、Rev8の量産", "sources": [{"title": "Ouster Announces Results for Third Quarter 2026（2026年11月3日、SEC Form 8-K Exhibit 99.1）", "url": "https://www.sec.gov/Archives/edgar/data/1816581/000162828026069487/exhibit991-9302026.htm"}]}, "palantir": {"date": "2月1日", "deck": "j7.html", "focus": "政府向けの伸びと主権AIまわりの受注、米国外の伸び、米民間の1社あたり売上", "logo": "../assets/logo-p.svg", "name": "Palantir", "next": "次は2026年10-12月期の売上26億4,900万〜26億5,300万ドルという会社見通しの達成と、米国商業の契約額の伸び、米国外売上の拡大を見ます。政府向けの伸びと主権AIまわりの受注、米民間の1社あたり売上も引き続き確認します。", "numbers": [{"label": "売上（2026年7-9月期）", "note": "四半期で初めて20億ドルを超えました。成長の中心は米国です。", "source": "https://www.sec.gov/Archives/edgar/data/1321655/000132165526000045/a2026q3ex991pressrelease.htm", "value": "23億1,341万ドル（前年同期比96%増）"}, {"label": "米国商業売上（2026年7-9月期）", "note": "米国政府売上9億5,300万ドルを初めて上回りました。民間の拡大が政府依存の構図を変えています。", "source": "https://www.sec.gov/Archives/edgar/data/1321655/000132165526000045/a2026q3ex991pressrelease.htm", "value": "9億8,400万ドル（前年同期比148%増）"}, {"label": "GAAP営業利益（2026年7-9月期）", "note": "売上をほぼ倍増させながら47%の営業利益率を出しています。規模と利益率を同時に伸ばした点が数字の核です。", "source": "https://www.sec.gov/Archives/edgar/data/1321655/000132165526000045/a2026q3ex991pressrelease.htm", "value": "10億8,500万ドル（営業利益率47%）"}, {"label": "会社見通し（2026年10-12月期の売上）", "note": "通期見通しも85億3,000万〜85億3,400万ドルへ引き上げました。次期も高い成長率を会社自身が前提にしています。", "source": "https://www.sec.gov/Archives/edgar/data/1321655/000132165526000045/a2026q3ex991pressrelease.htm", "value": "26億4,900万〜26億5,300万ドル"}], "sources": [{"title": "Palantir 2026年7-9月期決算リリース（SEC Form 8-K Exhibit 99.1、2026年11月2日）", "url": "https://www.sec.gov/Archives/edgar/data/1321655/000132165526000045/a2026q3ex991pressrelease.htm"}], "status": "見込み", "strengths": ["米国商業売上が前年同期比148%増の9億8,400万ドルとなり、米国政府売上を初めて上回りました。売上の柱が政府から民間へ広がっています。", "GAAP営業利益率47%、調整後では62%です。売上96%増と高い利益率が同時に成立しています。"], "summary": "僕はPalantirを、政府機関と大企業の業務データをつなぎ、現場の意思決定に使う基盤を売る会社として見ています。主力はGothamとFoundryで、その上にAI基盤のAIPを重ね、米国政府と米国民間を中心に売上を伸ばしています。2026年7-9月期は四半期売上が初めて20億ドルを超え、米国商業売上が初めて米国政府売上を上回りました。", "weakness": "弱点は米国への集中です。米国売上が全体の84%を占め、米国外の売上は3億7,600万ドルにとどまります。米国商業の新規契約額の伸びが鈍れば、全体の成長率を支える柱が細ります。"}, "palo-alto": {"date": "11月18日", "deck": null, "logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAMAAABEpIrGAAABUFBMVEX////6WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC36WC3
