<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Shippori+Mincho:wght@600;700&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Zen Kaku Gothic New',sans-serif;-webkit-font-smoothing:antialiased}
.mincho{font-family:'Shippori Mincho',serif}
header{display:flex;align-items:center;gap:11px;padding:16px 34px;font-weight:900;letter-spacing:.16em;font-size:14px}
header svg{width:24px;height:24px}
.kick{font-size:11px;letter-spacing:.34em;font-weight:900}
.lead{font-size:15px;line-height:2.05;font-weight:500;max-width:640px}
.stats{display:flex;gap:44px;flex-wrap:wrap}
.stat .l{font-size:10.5px;letter-spacing:.14em;font-weight:700;opacity:.65}
.stat .v{font-family:'Inter',sans-serif;font-size:22px;font-weight:800}
.stat .v small{font-size:12px;font-weight:700}
.btn{display:inline-block;border-radius:11px;padding:12px 26px;font-weight:900;font-size:14px;text-decoration:none}

<div style="background:#081c30;color:#e8f1f8;position:relative;overflow:hidden">
<div style="position:absolute;inset:0;background-image:linear-gradient(rgba(120,180,230,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(120,180,230,.09) 1px,transparent 1px);background-size:46px 46px"></div>
<header style="color:#fff;position:relative"><svg viewBox="0 0 40 40"><path d="M20 2 L38 20 L20 38 L2 20 Z" fill="none" stroke="#57a8e8" stroke-width="3"/><path d="M20 11.5 L28.5 20 L20 28.5 L11.5 20 Z" fill="#57a8e8"/></svg>FRONTIER <span style="color:#57a8e8">LAB</span><span style="margin-left:auto;font-family:'Inter',sans-serif;font-size:11.5px;letter-spacing:.14em;color:#8fc6ef">NEXT EARNINGS ─ NVDA 11/17</span></header>
<div style="max-width:1120px;margin:0 auto;padding:84px 32px 92px;position:relative">
<div class="kick" style="color:#57a8e8">MEMBER COMMUNITY ─ 知の最前線</div>
<h1 class="mincho" style="font-size:clamp(38px,5.4vw,60px);line-height:1.48;letter-spacing:.05em;margin-top:24px">未来に好奇心を。<br><span style="color:#7db9ec">知性で楽観を。</span></h1>
<p class="lead" style="color:#c3d7e8;margin-top:24px">未来への好奇心と、知性ある楽観で、世界の知の最前線を読み解く。論点を先に置き、決算で答え合わせする検証の記録が、ここに積み上がる。</p>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(120,180,230,.25);border:1px solid rgba(120,180,230,.25);margin-top:48px">
<div style="background:#0a2440;padding:18px 22px"><div class="stat"><div class="l" style="color:#8fc6ef">次の決算</div><div class="v">11/17 <small>NVIDIA</small></div></div></div>
<div style="background:#0a2440;padding:18px 22px"><div class="stat"><div class="l" style="color:#8fc6ef">深く追う企業 ／ マップ</div><div class="v">6 <small>社 ／ </small>50<small>社</small></div></div></div>
<div style="background:#0a2440;padding:18px 22px"><div class="stat"><div class="l" style="color:#8fc6ef">今週の論点</div><div class="v" style="font-size:17px;padding-top:5px">AIバブルは、本物か</div></div></div>
</div></div></div></body></html>
