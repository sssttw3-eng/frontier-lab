<div style="max-width:1120px;margin:0 auto;padding:88px 32px 90px">
<div class="kick" style="color:#0a6fc4">MEMBER COMMUNITY ─ 企業理解</div>
<h1 class="mincho" style="font-size:clamp(38px,5.6vw,62px);line-height:1.45;color:#0b2a44;letter-spacing:.05em;margin-top:24px">未来に好奇心を。<br>知性で楽観を。</h1>
<p class="lead" style="color:#1a2f42;margin-top:26px">未来への好奇心と、知性ある楽観で、世界の知の最前線を読み解く。各社について「今の論点」を先に置き、決算が出たら数字で答え合わせする。ワクワクは、裏付けのある数字から作る。</p>
